name: ERA5 Stratosphäre Tagesdaten

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_era5_stratosphere.py"
      - "scripts/update_era5_stratosphere_stage2.py"
      - "era5_stratosphere.js"
      - ".github/workflows/update-era5-stratosphere.yml"
  # Four scheduled starts/day; GitHub may delay cron jobs.
  # Existing concurrency lock keeps CDS requests sequential, not parallel.
  schedule:
    - cron: "45 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: era5-stratosphere-daily
  cancel-in-progress: false

jobs:
  daily-and-history:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            tests
            era5_stratosphere
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install data analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cdsapi>=0.7.7" numpy xarray netCDF4 h5netcdf pandas
      - name: Verify daily diagnostic algorithms and strict reference completion
        run: |
          python scripts/update_era5_stratosphere.py --self-test
          python -m unittest discover -s tests -p test_era5_stratosphere_reference.py -v
      - name: Configure Copernicus Climate Data Store
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CDSAPI_KEY:-}"
          cat > "$HOME/.cdsapirc" <<EOF
          url: https://cds.climate.copernicus.eu/api
          key: ${CDSAPI_KEY}
          EOF
          chmod 600 "$HOME/.cdsapirc"
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: .era5_stratosphere_cache
          key: era5-strato-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            era5-strato-v1-${{ runner.os }}-
      - name: Fetch stage-1 ERA5 60N winds and historical chunk
        id: stage1
        continue-on-error: true
        run: python scripts/update_era5_stratosphere.py --current --backfill-one --backfill-chunks 10
      - name: Verify stage-2 polar-cap calculations
        run: python scripts/update_era5_stratosphere_stage2.py --self-test
      - name: Fetch current polar-cap diagnostics and priority SSW temperatures
        run: |
          python scripts/update_era5_stratosphere_stage2.py \
            --current --priority-backfill --priority-chunks 6 \
            --climatology-backfill --climatology-chunks 10
      - name: Validate published data
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          path=Path("era5_stratosphere/index.json")
          payload=json.loads(path.read_text())
          assert payload["schema_version"]==1 and payload["ready"]
          assert payload["series"]
          days=[row["date"] for row in payload["series"]]
          assert days == sorted(set(days))
          assert all(date.fromisoformat(day).year>=1940 for day in days)
          assert any("u60_10" in row for row in payload["series"])
          assert any(all(k in row for k in ("tcap_10","tcap_50","tcap_100","zcap_10")) for row in payload["series"]), "Stage 2 produced no real polar-cap values"
          levels=("tcap_10","tcap_30","tcap_50","tcap_100")
          priority=(("2009-09-01","2010-05-31"),("2017-09-01","2018-05-31"),("2018-09-01","2019-05-31"))
          for start,end in priority:
            sub=[row for row in payload["series"] if start<=row["date"]<=end]
            counts={name:sum(isinstance(r.get(name),(float,int)) for r in sub) for name in levels}
            print("Priority SSW temperature coverage",start,end,counts)
          assert all(k in payload["metrics"] for k in levels), "Four temperature diagnostics missing"
          assert 0<=payload["reference_years_completed"]<=30
          assert 0<=payload["reference_wind_years_completed"]<=30
          assert 0<=payload["reference_temperature_calendar_days_complete"]<=366
          assert 0<=payload["reference_wind_calendar_days_complete"]<=366
          assert payload["reference_temperature_calendar_days_complete"] == len(
            set.intersection(*(set(payload["reference"].get(k,{})) for k in levels)))
          assert payload["reference_wind_calendar_days_complete"] == len(
            set.intersection(*(set(payload["reference"].get(f"u60_{level}",{}))
                               for level in (10,30,50,100))))
          print("Validated real ERA5 daily diagnostics:",len(days),"days",days[-1])
          status_file=Path("era5_stratosphere/backfill_status.json")
          assert status_file.exists(), "Backfill progress report missing"
          status=json.loads(status_file.read_text())
          assert status.get("schema_version")==1
          for season in ("2009","2017","2018"):
            result=status["priority_seasons"][season]
            assert 0<=result["all_four_days"]<=result["days_total"]
          print("Priority ERA5 status validated:",status["last_run"])
          PY
      - name: Add run diagnostics to GitHub summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          target=os.environ.get("GITHUB_STEP_SUMMARY")
          status_file=Path("era5_stratosphere/backfill_status.json")
          lines=["### ERA5 Stratosphäre · CDS-Datenlauf",
                 "- Status Stufe 1 (60°N Wind): ${{ steps.stage1.outcome }}"]
          if status_file.exists():
            data=json.loads(status_file.read_text())
            for year,entry in data["priority_seasons"].items():
              lines.append(f"- SSW {year}/{int(year)+1}: "
                f"{entry['all_four_days']}/{entry['days_total']} Tage (4 Temperaturhöhen)")
            ref=data["reference_1991_2020"]
            lines.append(f"- 1991–2020: {ref['years_complete_four_temperatures']}/30 Temperaturjahre vollständig")
            lines.append(f"- Referenztage Temperatur: {ref['complete_temperature_calendar_days']}/366 (alle 30 Jahre)")
            lines.append(f"- Referenztage Zonalwind: {ref['complete_wind_calendar_days']}/366 (alle 30 Jahre)")
            lines.append(f"- Historische Windjahre: {ref['years_complete_four_winds']}/30")
            lines.append(f"- Letzter Lauf: {data['last_run']}")
          else:
            lines.append("- Noch kein Backfill-Bericht erzeugt.")
          if target:
            with open(target,"a",encoding="utf-8") as handle: handle.write("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - name: Publish stratosphere data without changing existing ERA5 maps
        shell: bash
        run: |
          set -euo pipefail
          cp -a era5_stratosphere /tmp/era5_stratosphere_publish
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf era5_stratosphere
            cp -a /tmp/era5_stratosphere_publish era5_stratosphere
            git add era5_stratosphere/
            if git diff --cached --quiet; then
              echo "ERA5 stratosphere has no new daily data"
              exit 0
            fi
            git commit -m "Publish verified ERA5 stratosphere daily values"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race detected, retry ${attempt}/3"
          done
          echo "Could not publish after three retries"
          exit 1
