name: Stratosphäre Höhenanomalien · Tests
on:
  pull_request:
    paths:
      - scripts/strato_height_data.py
      - scripts/build_pages_site.sh
      - stratosphere_height.js
      - stratosphere_height.css
      - tests/test_strato_height*
      - .github/workflows/*strato-height*.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts
            tests
            stratosphere_height.js
            stratosphere_height.css
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install numpy
      - run: |
          python -m unittest discover -s tests -p test_strato_height.py -v
          node --check stratosphere_height.js
          node tests/test_strato_height.cjs
          bash -n scripts/build_pages_site.sh
      - name: Test real SVG and downloads in Chromium
        run: |
          npm install --no-save --no-package-lock d3@7.9.0 jspdf@2.5.2 svg2pdf.js@2.5.0 playwright
          npx playwright install --with-deps chromium
          node tests/test_strato_height_browser.cjs
  original-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        model: [gefs, ecmwf]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install numpy eccodes ecmwf-opendata
      - run: python scripts/strato_height_data.py --root "$RUNNER_TEMP/probe" --probe "${{ matrix.model }}"
