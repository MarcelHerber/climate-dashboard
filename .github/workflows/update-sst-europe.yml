name: SST Europa täglich aktualisieren

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-sst-europe.yml"
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sst-archive-writer
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[run-sst-daily]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}

    steps:
      - name: Hauptrepository auschecken
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-sst.txt

      - name: SST-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-sst.txt

      - name: Earthdata Secret prüfen
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EARTHDATA_TOKEN:-}" ]]; then
            echo "FEHLER: GitHub Actions Secret EARTHDATA_TOKEN fehlt."
            exit 1
          fi

      - name: SST Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .sst_cache
          key: sst-europe-v1-${{ runner.os }}-${{ hashFiles('requirements-sst.txt') }}
          restore-keys: |
            sst-europe-v1-${{ runner.os }}-

      - name: SST Archiv-Arbeitsbaum vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sst-archive
          if git ls-remote --exit-code --heads origin sst-archive >/dev/null 2>&1; then
            git fetch origin sst-archive --depth=1
            git worktree add --detach /tmp/sst-archive origin/sst-archive
          else
            git worktree add --detach /tmp/sst-archive HEAD
            git -C /tmp/sst-archive rm -rf .
          fi

      - name: Neuesten MUR-Tag und Lücken der letzten 21 Tage bauen
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/sst-backfill-failures.txt
          python - <<'PY'
          import json
          import os
          from datetime import date, timedelta
          from pathlib import Path

          from scripts.sst.build_daily import build_date
          from scripts.sst.config import REGIONS
          from scripts.sst.sources import latest_available_mur_date, mur_date_available

          archive_root = Path('/tmp/sst-archive')
          cache_root = Path('.sst_cache')
          token = os.environ['EARTHDATA_TOKEN']
          manifest_path = archive_root / 'manifest.json'

          existing = set()
          if manifest_path.exists():
              with manifest_path.open('r', encoding='utf-8') as handle:
                  manifest = json.load(handle)
              required_regions = set(REGIONS)
              for iso, entry in manifest.get('dates', {}).items():
                  regions = entry.get('regions', {}) if isinstance(entry, dict) else {}
                  if isinstance(regions, dict) and required_regions.issubset(regions):
                      existing.add(iso)

          latest = latest_available_mur_date(date.today(), lookback_days=10)
          start = latest - timedelta(days=20)
          failures = []
          built = []
          skipped = []

          current = start
          while current <= latest:
              iso = current.isoformat()
              if iso in existing:
                  skipped.append(iso)
                  current += timedelta(days=1)
                  continue

              try:
                  if not mur_date_available(current):
                      print(f"{iso}: kein MUR-Granule verfügbar; bleibt vorerst offen.", flush=True)
                      current += timedelta(days=1)
                      continue

                  print(f"{iso}: Archivlücke gefunden, wird nachgebaut.", flush=True)
                  result = build_date(
                      current,
                      archive_root,
                      cache_root,
                      token,
                  )
                  if result.already_present:
                      skipped.append(iso)
                  else:
                      built.append(iso)
                      existing.add(iso)
              except Exception as exc:
                  failures.append((iso, repr(exc)))
                  print(f"{iso}: Nachholen fehlgeschlagen: {exc!r}", flush=True)

              current += timedelta(days=1)

          print(
              f"SST Datenstand geprüft bis {latest.isoformat()} · "
              f"neu gebaut={len(built)} · bereits vorhanden={len(skipped)} · "
              f"fehlgeschlagen={len(failures)}",
              flush=True,
          )
          if built:
              print("Neu gebaut: " + ", ".join(built), flush=True)

          if failures:
              failure_path = Path('/tmp/sst-backfill-failures.txt')
              failure_path.write_text(
                  "\n".join(f"{day}: {error}" for day, error in failures) + "\n",
                  encoding='utf-8',
              )
          PY

      - name: SST Archiv als einzelnen Snapshot veröffentlichen
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/sst-archive
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "SST Archiv unverändert."
            exit 0
          fi
          TREE=$(git write-tree)
          COMMIT=$(printf '%s\n' "SST Archiv aktualisiert" | git commit-tree "$TREE")
          git push --force-with-lease origin "$COMMIT:refs/heads/sst-archive"

      - name: Nicht nachholbare SST-Lücken melden
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s /tmp/sst-backfill-failures.txt ]]; then
            echo "Folgende SST-Lücken konnten heute nicht nachgeholt werden:"
            cat /tmp/sst-backfill-failures.txt
            exit 1
          fi
          echo "Keine fehlgeschlagenen SST-Nachholversuche."
