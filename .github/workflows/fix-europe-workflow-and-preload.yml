name: Fix Europe workflow and preload stations

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-europe-workflow-and-preload
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Europa-Stationen beim Seitenstart laden
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: erwartet 1 Fundstelle, gefunden {count}')
              return text.replace(old, new, 1)

          old_url = 'const EUROPE_STATION_DATA_URL=`${EUROPE_STATION_RAW_BASE}europe_stations/index.json`;'
          new_url = 'const EUROPE_STATION_DATA_URL="europe_stations/index.json";'
          if old_url in html:
              html = html.replace(old_url, new_url, 1)
          elif new_url not in html:
              raise SystemExit('EUROPE_STATION_DATA_URL nicht gefunden.')

          old_wait = 'if(europeStationLoading)return europeStationLoading;'
          new_wait = 'if(europeStationLoading){await europeStationLoading;if(europeStationLoaded)await renderEuropeStations();return;}'
          if old_wait in html:
              html = html.replace(old_wait, new_wait, 1)
          elif new_wait not in html:
              raise SystemExit('europeStationLoading-Wartezweig nicht gefunden.')

          if 'async function preloadEuropeStationData(){' not in html:
              marker = 'async function ensureEuropeStationMap(){'
              preload = '''async function preloadEuropeStationData(){\n  if(europeStationLoaded&&europeStationData)return europeStationData;\n  if(europeStationLoading)return europeStationLoading;\n  europeStationLoading=(async()=>{\n    try{\n      const response=await fetch(`${EUROPE_STATION_DATA_URL}?v=${Date.now()}`,{cache:"no-store"});\n      if(!response.ok)throw new Error(`HTTP ${response.status}`);\n      const payload=await response.json();\n      if(![1,2,3,4,5].includes(Number(payload?.payload_version)))console.warn("Unerwartete Stations-Payload-Version",payload?.payload_version);\n      europeStationData=payload;\n      populateEuropeStationCountries();\n      initEuropeStationControls();\n      europeStationLoaded=true;\n      return payload;\n    }catch(error){\n      console.warn("Europa-Stationsdaten konnten beim Seitenstart nicht vorgeladen werden",error);\n      setEuropeStationStatus("Stationsdaten fehlen oder konnten nicht geladen werden. Bitte den Europa-Workflow prüfen.","warn");\n      throw error;\n    }finally{\n      europeStationLoading=null;\n    }\n  })();\n  return europeStationLoading;\n}\n'''
              html = replace_once(html, marker, preload + marker, 'Preload-Funktion')

          startup_anchor = '''initializeChartExportButtons();\ninitializeDashboardState();\n'''
          if 'preloadEuropeStationData().catch' not in html:
              startup_new = '''initializeChartExportButtons();\npreloadEuropeStationData().catch(()=>{});\ninitializeDashboardState();\n'''
              html = replace_once(html, startup_anchor, startup_new, 'Frontend-Startup')

          for needle in (
              'const EUROPE_STATION_DATA_URL="europe_stations/index.json";',
              'async function preloadEuropeStationData(){',
              'preloadEuropeStationData().catch',
              'if(europeStationLoading){await europeStationLoading;',
          ):
              if needle not in html:
                  raise SystemExit(f'Frontend-Marker fehlt: {needle}')

          path.write_text(html, encoding='utf-8')
          print('Europa-Stationsindex wird jetzt beim Seitenstart vorgeladen.')
          PY

      - name: Änderung prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'async function preloadEuropeStationData()' index.html
          grep -q 'const EUROPE_STATION_DATA_URL="europe_stations/index.json";' index.html
          grep -q 'preloadEuropeStationData().catch' index.html
          git diff --check
          echo 'Frontend-Prüfung OK.'

      - name: index.html committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo 'Keine Frontend-Änderung nötig.'
            exit 0
          fi

          git commit -m "Preload Europe station data on page load [skip ci]"

          PUSH_OK=false
          for ATTEMPT in 1 2 3; do
            echo "Push-Versuch ${ATTEMPT}/3 ..."
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              PUSH_OK=true
              break
            fi
            sleep $((ATTEMPT * 4))
          done
          [[ "$PUSH_OK" == "true" ]]
