name: Test SMHI Sweden station data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smhi-sweden-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: SMHI-Probe Selbsttest
        run: |
          set -euo pipefail
          python scripts/test_smhi_sweden_station_data.py --self-test

      - name: SMHI Schweden API und Archive testen
        run: |
          set -euo pipefail
          python scripts/test_smhi_sweden_station_data.py
