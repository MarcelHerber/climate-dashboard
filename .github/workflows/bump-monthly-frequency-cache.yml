name: Bump monthly frequency cache

on:
  push:
    branches:
      - feature/monthly-frequency-export
    paths:
      - .github/workflows/bump-monthly-frequency-cache.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/monthly-frequency-export
      - name: Bump cache version
        run: |
          sed -i 's/monthly_frequency.js?v=2/monthly_frequency.js?v=3/' index.html
          grep -q 'monthly_frequency.js?v=3' index.html
      - name: Commit cache version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Cache-Version der Häufigkeitsverteilung erhöhen"
          git push
