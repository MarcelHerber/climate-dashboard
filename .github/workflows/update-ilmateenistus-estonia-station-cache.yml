name: Build Estonia station cache

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Historischen Estland-Cache vollständig neu aufbauen"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ilmateenistus-estonia-station-cache
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Basisjahr bestimmen
        id: dates
        shell: bash
        run: |
          set -euo pipefail
          BASE_YEAR=$(( $(date -u +%Y) - 1 ))
          echo "base_year=${BASE_YEAR}" >> "$GITHUB_OUTPUT"

      - name: Estland-Cache wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: ilmateenistus-estonia-v1-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}
          restore-keys: |
            ilmateenistus-estonia-v1-${{ steps.dates.outputs.base_year }}-

      - name: Offline-Selbsttest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_ilmateenistus_estonia_station_cache.py --self-test

      - name: Historischen Estland-Cache bauen
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [[ "${{ inputs.force }}" == "true" ]]; then
            EXTRA_ARGS="--force"
          fi
          python scripts/update_ilmateenistus_estonia_station_cache.py \
            --cutoff-year "${{ steps.dates.outputs.base_year }}" \
            --max-runtime-minutes 155 \
            $EXTRA_ARGS

      - name: Estland-Cache sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/europe-stations
          key: ilmateenistus-estonia-v1-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}

      - name: Estland-Baseline prüfen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import pathlib

          base_year = datetime.datetime.now(datetime.UTC).year - 1
          p = pathlib.Path(
              f".cache/europe-stations/"
              f"ilmateenistus_estonia_status_through_{base_year}.json"
          )
          if not p.exists():
              raise SystemExit(f"Status fehlt: {p}")

          status = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps(status, indent=2, ensure_ascii=False))

          if not status.get("complete"):
              raise SystemExit(
                  "Estland-Baseline ist noch nicht vollständig. "
                  "Zwischenstand wurde gespeichert; Workflow mit force=false "
                  "erneut starten."
              )

          expected = int(status.get("expected_active_station_count", 0))
          actual = int(status.get("station_count", 0))
          if expected != 25 or actual != 25:
              raise SystemExit(
                  f"Estland-Stationenzahl unerwartet: expected={expected}, "
                  f"actual={actual}"
              )

          if int(status.get("rows_with_temperature", 0)) <= 0:
              raise SystemExit(
                  "Estland-Baseline enthält keine Stationstage."
              )

          baseline = pathlib.Path(status["baseline_file"])
          if not baseline.exists():
              raise SystemExit(
                  f"Finaler Estland-Baselinecache fehlt: {baseline}"
              )

          print("Estonia Baseline-Prüfung OK.")
          PY
