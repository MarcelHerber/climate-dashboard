name: Priority 1 data freshness regression tests

on:
  pull_request:
    paths:
      - "scripts/update_climate_indices.py"
      - "scripts/update_climate_indices_extra.py"
      - "scripts/build_seasonal_europe.py"
      - "scripts/build_opera_europe_radar.py"
      - "scripts/build_dwd_radar_ry.py"
      - "tests/test_climate_indices*.py"
      - ".github/workflows/update-noaa-climate-indices.yml"
      - ".github/workflows/update-seasonal-europe.yml"
      - ".github/workflows/test-priority1-data-freshness.yml"
  push:
    branches: [main]
    paths:
      - "scripts/update_climate_indices.py"
      - "scripts/update_climate_indices_extra.py"
      - "scripts/build_seasonal_europe.py"
      - "scripts/build_opera_europe_radar.py"
      - "scripts/build_dwd_radar_ry.py"
      - "tests/test_climate_indices*.py"
      - ".github/workflows/test-priority1-data-freshness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile update scripts
        run: |
          python -m py_compile scripts/update_climate_indices.py scripts/update_climate_indices_extra.py
          python -m py_compile scripts/build_seasonal_europe.py scripts/build_opera_europe_radar.py scripts/build_dwd_radar_ry.py
      - name: NOAA index regression tests
        run: |
          python -m unittest discover -s tests -p test_climate_indices.py -v
          python -m unittest discover -s tests -p test_climate_indices_extra.py -v
