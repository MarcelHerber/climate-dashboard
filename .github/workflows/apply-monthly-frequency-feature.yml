name: Apply monthly frequency feature

on:
  push:
    branches:
      - feature/monthly-frequency-distribution
    paths:
      - .github/workflows/apply-monthly-frequency-feature.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/monthly-frequency-distribution
      - name: Patch index.html
        run: python scripts/apply_monthly_frequency.py
      - name: Commit patched dashboard
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already contains the frequency module"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Häufigkeitsverteilung im Gebietsmittel einbinden"
          git push origin HEAD:feature/monthly-frequency-distribution
