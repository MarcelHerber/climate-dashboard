name: Test monthly frequency parameters

on:
  push:
    branches:
      - feature/monthly-frequency-rain-sun
    paths:
      - monthly_frequency.js
      - index.html
      - .github/workflows/test-monthly-frequency-parameters.yml
  pull_request:
    branches:
      - main
    paths:
      - monthly_frequency.js
      - index.html
      - .github/workflows/test-monthly-frequency-parameters.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check monthly_frequency.js
      - name: Test parameter helpers
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const code=fs.readFileSync('monthly_frequency.js','utf8');
          const context={globalThis:{}};
          vm.createContext(context);
          vm.runInContext(code,context);
          const api=context.globalThis.__monthlyFrequencyTestApi;
          if(!api) throw new Error('test api missing');
          if(api.median([1,3,2,4])!==2.5) throw new Error('median failed');
          const temp=api.parameterConfig('temp');
          const rain=api.parameterConfig('rain');
          const sun=api.parameterConfig('sun');
          if(temp.unit!=='°C'||temp.showNormal!==true) throw new Error('temp config failed');
          if(rain.unit!=='mm'||rain.showNormal!==false) throw new Error('rain config failed');
          if(sun.unit!=='h'||sun.showNormal!==false) throw new Error('sun config failed');
          if(api.classStep('temp',[15,22])!==0.5) throw new Error('temperature class width changed');
          if(!(api.classStep('rain',[10,250])>=5)) throw new Error('rain class width invalid');
          if(!(api.classStep('sun',[20,800])>=10)) throw new Error('sun class width invalid');
          const dist=api.buildDistribution([50,70,90],[60,80,100],'count',{step:20,showNormal:false});
          if(dist.normalA.length||dist.normalB.length) throw new Error('rain/sun must not get normal curves');
          const name=api.exportFilename('Deutschland','Sommer',{start:1881,end:1910},{start:1991,end:2020},'png','rain');
          if(!name.includes('niederschlag')) throw new Error(`parameter missing from export filename: ${name}`);
          console.log('parameter helper tests passed');
          NODE
      - name: Check parameter UI hooks
        run: |
          grep -q 'id="monthlyFrequencyParam"' monthly_frequency.js
          grep -q 'value="rain"' monthly_frequency.js
          grep -q 'value="sun"' monthly_frequency.js
          grep -q 'monthly_frequency.js?v=4' index.html
# final verification trigger
