name: Veraltete Live-Daten nachstarten

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_live_data.py'
      - '.github/workflows/recover-live-data.yml'
  workflow_run:
    workflows: ['GitHub Pages schnell veröffentlichen']
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: live-data-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_recover_live_data.py -v
      - run: python scripts/recover_live_data.py
        env:
          GH_TOKEN: ${{ github.token }}
