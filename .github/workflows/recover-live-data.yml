name: Veraltete Live-Daten nachstarten

on:
  workflow_dispatch:
  # Independent of Pages deployment; avoid the crowded top of the hour.
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/recover_live_data.py'
      - '.github/workflows/recover-live-data.yml'
  workflow_run:
    workflows: ['GitHub Pages schnell veröffentlichen', 'DWD Fast Live SYNOP aktualisieren', 'OPERA Europakomposit · DBZH & RATE', 'MTG EUMETView live data check', 'ERA5 Stratosphäre Tagesdaten']
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: live-data-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/build_data_status.py
            scripts/recover_live_data.py
            tests/test_recover_live_data.py
            .github/workflows/update-fast-live.yml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_recover_live_data.py -v
      - run: python scripts/recover_live_data.py
        env:
          GH_TOKEN: ${{ github.token }}
