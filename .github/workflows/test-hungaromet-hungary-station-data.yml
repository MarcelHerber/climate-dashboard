name: Test HungaroMet Hungary station data v2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hungaromet-hungary-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: HungaroMet Hungary Offline-Selbsttest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_hungaromet_hungary_station_data.py --self-test

      - name: HungaroMet Hungary Live-Probe
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_hungaromet_hungary_station_data.py --sample-current 12 --sample-historical 4 --workers 8
