name: ACE räumliches Kartenarchiv berechnen
on:
  workflow_dispatch:
  schedule:
    - cron: '45 12 * * *'
  push:
    paths:
      - scripts/build_ace_spatial.py
      - .github/workflows/update-ace-spatial.yml
permissions:
  contents: write
jobs:
  map-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Berechne alle ACE-Karten aus IBTrACS
        run: python scripts/build_ace_spatial.py
      - name: Commit Archiv
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ace/spatial
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update spatial ACE anomaly map archive"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
