name: ACE räumliches Kartenarchiv berechnen
on:
  workflow_dispatch:
  schedule:
    - cron: '45 12 * * *'
  push:
    paths:
      - scripts/build_ace_spatial.py
      - .github/workflows/update-ace-spatial.yml
permissions:
  contents: write
concurrency:
  group: ace-spatial-archive
  cancel-in-progress: true
jobs:
  map-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Quellcode prüfen
        run: |
          python -m py_compile scripts/build_ace_spatial.py
          node --check ace_spatial.js
      - name: Berechne alle ACE-Karten aus IBTrACS
        run: python scripts/build_ace_spatial.py
      - name: Archiv-Vollständigkeit und Gitterauflösung prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("ace/spatial")
          manifest=json.loads((p/"index.json").read_text(encoding="utf-8"))
          assert manifest["ready"] and manifest["resolution_deg"]==1
          assert manifest["kernel_sigma_deg"]==2.5
          assert len(manifest["longitudes"])==360
          assert len(manifest["latitudes"])==120
          assert manifest["years"][0]==1980 and len(manifest["years"])>=46
          assert manifest["available_metrics"]==["z","abs","pct"]
          assert manifest["percent_min_reference_ace"]==0.003
          for year in manifest["years"]:
              item=json.loads((p/f"{year}.json").read_text(encoding="utf-8"))
              assert item["ready"] and item["year"]==year
              for metric in manifest["available_metrics"]:
                  assert len(item[metric])==120
                  assert all(len(row)==360 for row in item[metric])
          print("1 degree ACE archive verified:",len(manifest["years"]),"years, 3 map parameters each.")
          PY
      - name: Commit Archiv
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ace/spatial
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update spatial ACE anomaly map archive"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
