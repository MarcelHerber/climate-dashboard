name: ERA5-Land laufende Temperatur-Rangkarten

on:
  push:
    paths:
      - "scripts/era5_running_temperature_rank.py"
      - "scripts/probe_era5_running_temperature_date.py"
      - "scripts/build_era5_running_temperature_rank_shard.py"
      - "scripts/build_era5_running_temperature_rank_maps.py"
      - "scripts/build_era5_temperature_rank_maps.py"
      - "tests/test_era5_running_temperature_rank.py"
      - ".github/workflows/update-era5-running-temperature-ranks.yml"
  schedule:
    - cron: "25 15 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      force:
        description: "Rangkarten auch bei unverändertem Datenstand neu erzeugen"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: era5-running-temperature-ranks
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.target.outputs.needed }}
      target_date: ${{ steps.target.outputs.target_date }}
      latest_date: ${{ steps.target.outputs.latest_date }}
      target_year: ${{ steps.target.outputs.target_year }}
      target_month: ${{ steps.target.outputs.target_month }}
      target_day: ${{ steps.target.outputs.target_day }}
      history_end: ${{ steps.target.outputs.history_end }}
      history_count: ${{ steps.target.outputs.history_count }}
      history_years: ${{ steps.target.outputs.history_years }}
      reference_available: ${{ steps.reference.outputs.available }}
      reference_tag: ${{ steps.reference.outputs.tag }}
      reference_asset: ${{ steps.reference.outputs.asset }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Probe-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cdsapi>=0.7.7" numpy xarray netCDF4
      - name: CDS API konfigurieren
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CDSAPI_KEY:-}"
          cat > "$HOME/.cdsapirc" <<EOF
          url: https://cds.climate.copernicus.eu/api
          key: ${CDSAPI_KEY}
          EOF
          chmod 600 "$HOME/.cdsapirc"
      - name: Temperatur-Verfügbarkeitscache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .era5_running_rank_temperature_probe
          key: era5-running-temperature-probe-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            era5-running-temperature-probe-v1-${{ runner.os }}-
      - id: probe
        name: Neuesten ERA5-Land-Temperaturtag bestimmen
        run: python scripts/probe_era5_running_temperature_date.py --github-output "$GITHUB_OUTPUT"
      - id: target
        shell: bash
        env:
          FORCE_INPUT: ${{ inputs.force || false }}
          PROBED_TARGET: ${{ steps.probe.outputs.target_date }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import date, timedelta
          from pathlib import Path

          history_start = 1950
          latest = str(os.environ['PROBED_TARGET'])
          latest_day = date.fromisoformat(latest)
          p = Path('era5_land_europe/running/temperature_ranks/index.json')
          old = json.loads(p.read_text(encoding='utf-8')).get('data_through') if p.exists() else None
          force = os.environ.get('FORCE_INPUT', 'false').lower() == 'true'

          if old:
              old_day = date.fromisoformat(old)
          else:
              old_day = None

          if old_day is not None and old_day < latest_day:
              # Immer genau den ältesten noch fehlenden Tag rechnen. Nach erfolgreichem
              # Finalize stößt der Workflow den nächsten fehlenden Tag automatisch an.
              target_day = min(old_day + timedelta(days=1), latest_day)
              needed = True
          else:
              target_day = latest_day
              needed = force or old != latest

          target = target_day.isoformat()
          year = target_day.year
          month = target_day.month
          years = list(range(history_start, year))
          if not years:
              needed = False

          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as fh:
              fh.write(f'target_date={target}\n')
              fh.write(f'latest_date={latest}\n')
              fh.write(f'target_year={year}\n')
              fh.write(f'target_month={month:02d}\n')
              fh.write(f'target_day={target_day.day:02d}\n')
              fh.write(f'history_end={year - 1}\n')
              fh.write(f'history_count={len(years)}\n')
              fh.write('history_years=' + json.dumps(years, separators=(',', ':')) + '\n')
              fh.write(f'needed={str(needed).lower()}\n')
          print(
              'Temperatur-Datenstand verfügbar:', latest,
              'zu berechnender Tag:', target,
              'bisheriger Stand:', old,
              'Historie:', f'{history_start}–{year - 1}',
              'Jahre:', len(years),
              'Build nötig:', needed,
          )
          PY

      - id: reference
        name: Veröffentlichte Historienreferenz suchen
        if: steps.target.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_MONTH: ${{ steps.target.outputs.target_month }}
          TARGET_DAY: ${{ steps.target.outputs.target_day }}
          HISTORY_END: ${{ steps.target.outputs.history_end }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="era5-rank-reference-1950-${HISTORY_END}-m${TARGET_MONTH}-v1"
          ASSET="era5-rank-reference-1950-${HISTORY_END}-${TARGET_MONTH}-${TARGET_DAY}.npz"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$ASSET"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Historische Referenz vorhanden: $TAG / $ASSET"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Noch keine veröffentlichte Referenz für ${TARGET_MONTH}-${TARGET_DAY}; Jahres-Shards bleiben als Fallback aktiv."
          fi

  shards:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true' && needs.prepare.outputs.reference_available != 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: ${{ fromJSON(needs.prepare.outputs.history_years) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cdsapi>=0.7.7" numpy xarray netCDF4 matplotlib cartopy pillow pytest
      - name: Hilfsfunktionen testen
        run: python -m pytest -q tests/test_era5_running_temperature_rank.py tests/test_era5_temperature_rank.py

      - id: daily-cache
        name: Historischen Tagescache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .era5_running_rank_daily_cache
          key: era5-running-temperature-rank-daily-v1-${{ matrix.year }}-m${{ needs.prepare.outputs.target_month }}

      - name: Alten Tagescache als Fallback laden
        if: steps.daily-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .era5_running_rank_cache
          key: era5-running-temperature-rank-v2-${{ matrix.year }}-m${{ needs.prepare.outputs.target_month }}

      - name: Historische Monatsmittel wiederherstellen
        uses: actions/cache@v4
        with:
          path: .era5_running_rank_monthly_cache
          key: era5-running-temperature-rank-monthly-v1-${{ matrix.year }}

      - id: relative-years
        name: Vorjahr bestimmen
        shell: bash
        run: echo "previous_year=$(( ${{ matrix.year }} - 1 ))" >> "$GITHUB_OUTPUT"

      - name: Vorjahres-Dezember für Winter wiederherstellen
        if: (needs.prepare.outputs.target_month == '01' || needs.prepare.outputs.target_month == '02') && matrix.year != 1950
        uses: actions/cache/restore@v4
        with:
          path: .era5_running_rank_monthly_cache
          key: era5-running-temperature-rank-monthly-v1-${{ steps.relative-years.outputs.previous_year }}

      - name: CDS API konfigurieren
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CDSAPI_KEY:-}"
          cat > "$HOME/.cdsapirc" <<EOF
          url: https://cds.climate.copernicus.eu/api
          key: ${CDSAPI_KEY}
          EOF
          chmod 600 "$HOME/.cdsapirc"

      - name: Historischen Rang-Shard bauen
        run: >-
          python scripts/build_era5_running_temperature_rank_shard.py
          --target-date "${{ needs.prepare.outputs.target_date }}"
          --start-year ${{ matrix.year }}
          --end-year ${{ matrix.year }}

      - uses: actions/upload-artifact@v4
        with:
          name: era5-running-rank-${{ matrix.year }}-${{ matrix.year }}
          path: .era5_running_rank_shards/*.npz
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  finalize:
    needs: [prepare, shards]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.needed == 'true' &&
      (needs.prepare.outputs.reference_available == 'true' || needs.shards.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cdsapi>=0.7.7" numpy xarray netCDF4 matplotlib cartopy pillow pytest
      - name: Veröffentlichte Historienreferenz laden
        if: needs.prepare.outputs.reference_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_TAG: ${{ needs.prepare.outputs.reference_tag }}
          REFERENCE_ASSET: ${{ needs.prepare.outputs.reference_asset }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .era5_running_rank_reference
          gh release download "$REFERENCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$REFERENCE_ASSET" \
            --dir .era5_running_rank_reference
          test -s ".era5_running_rank_reference/$REFERENCE_ASSET"

      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.reference_available != 'true'
        with:
          pattern: era5-running-rank-*
          path: .era5_running_rank_shards
          merge-multiple: true

      - name: Aktuelle vollständige Monatsmittel wiederherstellen
        uses: actions/cache@v4
        with:
          path: .era5_running_rank_current_cache
          key: era5-running-temperature-rank-current-v1-${{ needs.prepare.outputs.target_year }}-before-m${{ needs.prepare.outputs.target_month }}

      - name: CDS API konfigurieren
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CDSAPI_KEY:-}"
          cat > "$HOME/.cdsapirc" <<EOF
          url: https://cds.climate.copernicus.eu/api
          key: ${CDSAPI_KEY}
          EOF
          chmod 600 "$HOME/.cdsapirc"

      - name: Vor dem Rendern neuesten main-Stand übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Vier laufende Rangkarten erzeugen
        env:
          REFERENCE_AVAILABLE: ${{ needs.prepare.outputs.reference_available }}
          REFERENCE_ASSET: ${{ needs.prepare.outputs.reference_asset }}
          TARGET_DATE: ${{ needs.prepare.outputs.target_date }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REFERENCE_AVAILABLE" == "true" ]]; then
            python scripts/build_era5_running_temperature_rank_maps.py \
              --target-date "$TARGET_DATE" \
              --reference-file ".era5_running_rank_reference/$REFERENCE_ASSET"
          else
            python scripts/build_era5_running_temperature_rank_maps.py \
              --target-date "$TARGET_DATE"
          fi

      - name: Ergebnis prüfen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from era5_running_temperature_rank import products_for_month

          p = Path('era5_land_europe/running/temperature_ranks/index.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          expected_products = set(products_for_month(int('${{ needs.prepare.outputs.target_month }}')))
          history_count = int('${{ needs.prepare.outputs.history_count }}')
          assert d['ready'] is True
          assert d['data_through'] == '${{ needs.prepare.outputs.target_date }}'
          assert d['history_start'] == 1950
          assert d['history_end'] == int('${{ needs.prepare.outputs.history_end }}')
          assert d['historical_years'] == history_count
          assert d['total_rank_positions'] == history_count + 1
          assert set(d['products']) == expected_products
          for item in d['products'].values():
              assert Path(item['file']).exists(), item['file']
              assert item['comparison_years'] >= 1
              assert item['total_rank_positions'] == item['comparison_years'] + 1
          print('Rangkarten geprüft:', d['data_through'], sorted(expected_products))
          PY

      - name: Rangkarten versionieren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add era5_land_europe/running/temperature_ranks
          if git diff --cached --quiet; then
            echo "Keine neuen Temperatur-Rangkarten."
            exit 0
          fi
          git commit -m "ERA5 laufende Temperatur-Rangkarten aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main

  continue-backlog:
    needs: [prepare, finalize]
    if: >-
      always() &&
      needs.finalize.result == 'success' &&
      needs.prepare.outputs.target_date != needs.prepare.outputs.latest_date
    runs-on: ubuntu-latest
    steps:
      - name: Nächsten fehlenden ERA5-Land-Tag anstoßen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Fertig: ${{ needs.prepare.outputs.target_date }}; verfügbar bis: ${{ needs.prepare.outputs.latest_date }}"
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-era5-running-temperature-ranks.yml/dispatches \
            -d '{"ref":"main","inputs":{"force":"false"}}'
          echo "Nächster fehlender Tag wurde angestoßen."
