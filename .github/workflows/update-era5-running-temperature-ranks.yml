name: ERA5-Land laufende Temperatur-Rangkarten

on:
  push:
    paths:
      - "scripts/era5_running_temperature_rank.py"
      - "scripts/build_era5_running_temperature_rank_shard.py"
      - "scripts/build_era5_running_temperature_rank_maps.py"
      - "scripts/build_era5_temperature_rank_maps.py"
      - "tests/test_era5_running_temperature_rank.py"
      - ".github/workflows/update-era5-running-temperature-ranks.yml"
  schedule:
    - cron: "25 15 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      force:
        description: "Rangkarten auch bei unverändertem Datenstand neu erzeugen"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: era5-running-temperature-ranks
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.target.outputs.needed }}
      target_date: ${{ steps.target.outputs.target_date }}
      target_year: ${{ steps.target.outputs.target_year }}
      target_month: ${{ steps.target.outputs.target_month }}
      history_end: ${{ steps.target.outputs.history_end }}
      history_count: ${{ steps.target.outputs.history_count }}
      history_years: ${{ steps.target.outputs.history_years }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - id: target
        shell: bash
        env:
          FORCE_INPUT: ${{ inputs.force || false }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          history_start = 1950
          running = json.loads(Path('era5_land_europe/running/index.json').read_text(encoding='utf-8'))
          target = str(running['data_through'])
          year = int(target[:4])
          month = int(target[5:7])
          years = list(range(history_start, year))
          if not years:
              needed = False
          else:
              p = Path('era5_land_europe/running/temperature_ranks/index.json')
              old = json.loads(p.read_text(encoding='utf-8')).get('data_through') if p.exists() else None
              force = (
                  os.environ.get('FORCE_INPUT', 'false').lower() == 'true'
                  or os.environ.get('GITHUB_EVENT_NAME') == 'push'
              )
              needed = force or old != target

          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as fh:
              fh.write(f'target_date={target}\n')
              fh.write(f'target_year={year}\n')
              fh.write(f'target_month={month:02d}\n')
              fh.write(f'history_end={year - 1}\n')
              fh.write(f'history_count={len(years)}\n')
              fh.write('history_years=' + json.dumps(years, separators=(',', ':')) + '\n')
              fh.write(f'needed={str(needed).lower()}\n')
          print(
              'Datenstand:', target,
              'Historie:', f'{history_start}–{year - 1}',
              'Jahre:', len(years),
              'Build nötig:', needed,
          )
          PY

  shards:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: ${{ fromJSON(needs.prepare.outputs.history_years) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cdsapi>=0.7.7" numpy xarray netCDF4 matplotlib cartopy pytest
      - name: Hilfsfunktionen testen
        run: python -m pytest -q tests/test_era5_running_temperature_rank.py tests/test_era5_temperature_rank.py

      - id: daily-cache
        name: Historischen Tagescache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .era5_running_rank_daily_cache
          key: era5-running-temperature-rank-daily-v1-${{ matrix.year }}-m${{ needs.prepare.outputs.target_month }}

      - name: Alten Tagescache als Fallback laden
        if: steps.daily-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .era5_running_rank_cache
          key: era5-running-temperature-rank-v2-${{ matrix.year }}-m${{ needs.prepare.outputs.target_month }}

      - name: Historische Monatsmittel wiederherstellen
        uses: actions/cache@v4
        with:
          path: .era5_running_rank_monthly_cache
          key: era5-running-temperature-rank-monthly-v1-${{ matrix.year }}

      - name: CDS API konfigurieren
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CDSAPI_KEY:-}"
          cat > "$HOME/.cdsapirc" <<EOF
          url: https://cds.climate.copernicus.eu/api
          key: ${CDSAPI_KEY}
          EOF
          chmod 600 "$HOME/.cdsapirc"

      - name: Historischen Rang-Shard bauen
        run: >-
          python scripts/build_era5_running_temperature_rank_shard.py
          --target-date "${{ needs.prepare.outputs.target_date }}"
          --start-year ${{ matrix.year }}
          --end-year ${{ matrix.year }}

      - uses: actions/upload-artifact@v4
        with:
          name: era5-running-rank-${{ matrix.year }}-${{ matrix.year }}
          path: .era5_running_rank_shards/*.npz
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  finalize:
    needs: [prepare, shards]
    if: needs.prepare.outputs.needed == 'true' && needs.shards.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cdsapi>=0.7.7" numpy xarray netCDF4 matplotlib cartopy pytest
      - uses: actions/download-artifact@v4
        with:
          pattern: era5-running-rank-*
          path: .era5_running_rank_shards
          merge-multiple: true

      - name: Aktuelle vollständige Monatsmittel wiederherstellen
        uses: actions/cache@v4
        with:
          path: .era5_running_rank_current_cache
          key: era5-running-temperature-rank-current-v1-${{ needs.prepare.outputs.target_year }}-before-m${{ needs.prepare.outputs.target_month }}

      - name: CDS API konfigurieren
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CDSAPI_KEY:-}"
          cat > "$HOME/.cdsapirc" <<EOF
          url: https://cds.climate.copernicus.eu/api
          key: ${CDSAPI_KEY}
          EOF
          chmod 600 "$HOME/.cdsapirc"

      - name: Laufende Rangkarten erzeugen
        run: >-
          python scripts/build_era5_running_temperature_rank_maps.py
          --target-date "${{ needs.prepare.outputs.target_date }}"

      - name: Ergebnis prüfen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from era5_running_temperature_rank import products_for_month

          p = Path('era5_land_europe/running/temperature_ranks/index.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          expected_products = set(products_for_month(int('${{ needs.prepare.outputs.target_month }}')))
          history_count = int('${{ needs.prepare.outputs.history_count }}')
          assert d['ready'] is True
          assert d['data_through'] == '${{ needs.prepare.outputs.target_date }}'
          assert d['history_start'] == 1950
          assert d['history_end'] == int('${{ needs.prepare.outputs.history_end }}')
          assert d['historical_years'] == history_count
          assert d['total_rank_positions'] == history_count + 1
          assert set(d['products']) == expected_products
          for item in d['products'].values():
              assert Path(item['file']).exists(), item['file']
              assert item['comparison_years'] >= 1
              assert item['total_rank_positions'] == item['comparison_years'] + 1
          print('Rangkarten geprüft:', d['data_through'], sorted(expected_products))
          PY

      - name: Rangkarten versionieren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add era5_land_europe/running/temperature_ranks
          if git diff --cached --quiet; then
            echo "Keine neuen Temperatur-Rangkarten."
            exit 0
          fi
          git commit -m "ERA5 laufende Temperatur-Rangkarten aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main
