name: HYRAS Temperatur-Downloadkarten neu bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_hyras_tmax_maps.py"
      - "scripts/build_hyras_tmin_maps.py"
      - ".github/workflows/rebuild-hyras-temperature-download-maps.yml"

permissions:
  contents: write

concurrency:
  group: hyras-data
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Benötigte Generatoren laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            requirements-hyras.txt
            scripts/build_hyras_tmax_maps.py
            scripts/build_hyras_tmax_regions.py
            scripts/build_hyras_tmin_maps.py
            scripts/build_hyras_tmin_regions.py
            scripts/build_hyras_tmean_regions.py

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: HYRAS-Abhängigkeiten installieren
        run: pip install -r requirements-hyras.txt

      - name: Aktuellen hyras-data Stand laden
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hyras-data /tmp/hyras-tmax-work /tmp/hyras-tmin-work
          git clone --depth 1 --branch hyras-data "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/hyras-data
          mkdir -p /tmp/hyras-tmax-work /tmp/hyras-tmin-work

      - name: Tmax- und Tmin-Downloadkarten neu bauen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_hyras_tmax_maps.py --data-root /tmp/hyras-data --work /tmp/hyras-tmax-work
          python scripts/build_hyras_tmin_maps.py --data-root /tmp/hyras-data --work /tmp/hyras-tmin-work

      - name: Orientierung und Sommerkarten prüfen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          import numpy as np

          def helper(path):
              tree=ast.parse(Path(path).read_text(encoding='utf-8'))
              fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='north_up_for_display')
              ns={}
              exec(compile(ast.Module(body=[fn],type_ignores=[]),path,'exec'),ns)
              return ns['north_up_for_display']

          base=np.array([[1,2],[3,4]])
          for parameter in ('tmax','tmin'):
              fn=helper(f'scripts/build_hyras_{parameter}_maps.py')
              np.testing.assert_array_equal(fn(base,[0,1],[0,1]),np.array([[3,4],[1,2]]))
              np.testing.assert_array_equal(fn(base,[0,1],[1,0]),base)
              root=Path('/tmp/hyras-data')/parameter
              manifest=json.loads((root/'regions/map_downloads.json').read_text(encoding='utf-8'))
              summer=manifest.get('periods',{}).get('summer',{})
              for field in ('absolute','anomaly'):
                  rel=summer.get(field)
                  if not rel or not (root/rel).exists():
                      raise SystemExit(f'{parameter}: Sommer-{field}-Karte fehlt')
          print('Orientierungstest und Sommerkarten: OK')
          PY

      - name: Korrigierte Karten veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/hyras-data
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmax/download_maps tmax/regions/index.json tmax/regions/map_downloads.json
          git add tmin/download_maps tmin/regions/index.json tmin/regions/map_downloads.json
          if git diff --cached --quiet; then
            echo "Temperatur-Downloadkarten sind bereits aktuell."
            exit 0
          fi
          git commit -m "HYRAS Temperaturkarten nordorientiert aktualisieren"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:hyras-data
