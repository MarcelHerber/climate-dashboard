name: Update Estonia current year

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Estland-Current-Year-Datei verwerfen und neu aufbauen"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ilmateenistus-estonia-current-year
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Jahre bestimmen
        id: dates
        shell: bash
        run: |
          set -euo pipefail
          YEAR="$(date -u +%Y)"
          BASE_YEAR=$(( YEAR - 1 ))
          echo "year=${YEAR}" >> "$GITHUB_OUTPUT"
          echo "base_year=${BASE_YEAR}" >> "$GITHUB_OUTPUT"

      - name: Estland-Cache wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: ilmateenistus-estonia-current-v1-${{ steps.dates.outputs.year }}-${{ github.run_id }}
          restore-keys: |
            ilmateenistus-estonia-current-v1-${{ steps.dates.outputs.year }}-
            ilmateenistus-estonia-v1-${{ steps.dates.outputs.base_year }}-

      - name: Benötigte Dateien prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/update_ilmateenistus_estonia_station_cache.py
          test -f scripts/update_ilmateenistus_estonia_current.py
          test -f ".cache/europe-stations/ilmateenistus_estonia_daily_baseline_through_${{ steps.dates.outputs.base_year }}_v1.pkl.gz"

      - name: Offline-Selbsttests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_ilmateenistus_estonia_station_cache.py --self-test
          python scripts/update_ilmateenistus_estonia_current.py --self-test

      - name: Estland aktuelles Jahr laden
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [[ "${{ inputs.force }}" == "true" ]]; then
            EXTRA_ARGS="--force"
          fi
          python scripts/update_ilmateenistus_estonia_current.py \
            --year "${{ steps.dates.outputs.year }}" \
            $EXTRA_ARGS

      - name: Estland-Current-Cache sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/europe-stations
          key: ilmateenistus-estonia-current-v1-${{ steps.dates.outputs.year }}-${{ github.run_id }}

      - name: Estland Current prüfen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import pathlib

          today = datetime.datetime.now(datetime.UTC).date()
          year = today.year
          p = pathlib.Path(
              f".cache/europe-stations/"
              f"ilmateenistus_estonia_current_{year}_status.json"
          )
          if not p.exists():
              raise SystemExit(f"Status fehlt: {p}")

          status = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps(status, indent=2, ensure_ascii=False))

          if not status.get("complete"):
              raise SystemExit("Estland-Current ist unvollständig.")

          expected = int(
              status.get("expected_active_station_count", 0)
          )
          actual = int(status.get("station_count", 0))
          if expected != 25 or actual != 25:
              raise SystemExit(
                  "Estland-Current-Stationenzahl unerwartet: "
                  f"expected={expected}, actual={actual}"
              )

          if int(status.get("rows_with_temperature", 0)) <= 0:
              raise SystemExit(
                  "Estland-Current enthält keine Stationstage."
              )

          if int(status.get("raw_element_rows", 0)) <= 0:
              raise SystemExit(
                  "Estland-Current enthält keine Element-Zeilen."
              )

          last_text = status.get("data_last_date")
          if not last_text:
              raise SystemExit(
                  "Estland-Current hat kein letztes Datumsfeld."
              )
          last_date = datetime.date.fromisoformat(last_text)
          lag = (today - last_date).days
          if lag < 0 or lag > 7:
              raise SystemExit(
                  "Estland-Current Aktualität unerwartet: "
                  f"{last_date} / Lag {lag} Tage"
              )

          current_file = pathlib.Path(status["current_file"])
          if not current_file.exists():
              raise SystemExit(
                  f"Estland-Current-Cache fehlt: {current_file}"
              )

          print("Estonia Current-Year-Prüfung OK.")
          PY
