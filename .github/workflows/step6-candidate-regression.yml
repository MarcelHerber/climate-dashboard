name: Step 6 · Candidate browser regressions
on:
  push:
    branches: [perf/prefetch-live-audit-20261124]
    paths:
      - '.github/workflows/step6-candidate-regression.yml'
      - 'tests/audit_step6_candidate.py'
      - 'js/core.js'
      - 'js/gebietsmittel.js'
      - 'mobile_content.css'
      - 'mobile_navigation.js'
      - 'era5_synoptic.js'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - name: JavaScript syntax and asset regression tests
        run: |
          node --check js/core.js
          node --check js/gebietsmittel.js
          node --check mobile_navigation.js
          node --check era5_synoptic.js
          python -m unittest discover -s tests -p test_asset_versioning.py -v
      - name: Build exactly published Pages file structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          if ! bash scripts/build_pages_site.sh > reports/build.log 2>&1; then
            tail -n 160 reports/build.log
            exit 1
          fi
          tail -n 15 reports/build.log
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install real Chromium
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Check 320px, 390px and desktop with real built data
        run: python -u tests/audit_step6_candidate.py --site _site --output reports/step6
      - name: Save evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step6-accumulation-mobile-era5-regression
          path: reports/
          retention-days: 60
