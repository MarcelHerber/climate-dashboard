name: Update IMGW Poland station cache

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Historische Polen-Baseline komplett neu aufbauen"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: imgw-poland-stations
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Jahr bestimmen
        id: dates
        shell: bash
        run: |
          YEAR=$(date -u +%Y)
          BASE_YEAR=$((YEAR - 1))
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "base_year=$BASE_YEAR" >> "$GITHUB_OUTPUT"

      - name: IMGW-Polen-Cache laden
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: imgw-poland-v1-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}
          restore-keys: |
            imgw-poland-v1-${{ steps.dates.outputs.base_year }}-

      - name: Skript prüfen
        shell: bash
        run: |
          test -s scripts/update_europe_station_records.py
          test -s scripts/update_imgw_poland_station_cache.py
          python scripts/update_imgw_poland_station_cache.py --self-test
          mkdir -p .cache/europe-stations
          echo "Vorhandene Polen-Einzelcaches:"
          find .cache/europe-stations -maxdepth 2 -type f -path '*imgw_poland_resources*/*.pkl.gz' 2>/dev/null | wc -l

      - name: Polen-Historical aufbauen oder fortsetzen
        shell: bash
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          EXTRA_ARGS=""
          if [[ "$FORCE" == "true" ]]; then
            EXTRA_ARGS="--force"
          fi
          python scripts/update_imgw_poland_station_cache.py \
            --year "${{ steps.dates.outputs.year }}" \
            --cache-dir .cache/europe-stations \
            --workers 8 \
            $EXTRA_ARGS

      # Der Builder endet auch bei einzelnen fehlenden ZIPs normal, damit jeder
      # erfolgreiche Shard sicher im Actions-Cache landet.
      - name: Polen-Cache sichern
        uses: actions/cache/save@v4
        with:
          path: .cache/europe-stations
          key: imgw-poland-v1-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}

      - name: Polen-Baseline prüfen
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, gzip, json, pickle
          from pathlib import Path
          year=dt.datetime.now(dt.timezone.utc).year
          cutoff=year-1
          status=Path(f'.cache/europe-stations/imgw_poland_status_through_{cutoff}.json')
          if not status.exists():
              raise SystemExit('IMGW-Polen-Statusdatei fehlt.')
          s=json.loads(status.read_text(encoding='utf-8'))
          print(json.dumps(s,ensure_ascii=False,indent=2))
          if not s.get('complete'):
              raise SystemExit('Polen-Baseline noch unvollständig. Erfolgreiche ZIPs wurden gesichert; mit force=false erneut starten.')
          path=Path(f'.cache/europe-stations/imgw_poland_daily_baseline_through_{cutoff}_v1.pkl.gz')
          if not path.exists():
              raise SystemExit(f'IMGW-Polen-Gesamtcache fehlt: {path}')
          with gzip.open(path,'rb') as h:
              p=pickle.load(h)
          states=p.get('states',{}); stations=p.get('stations',{})
          print('Polen Stationsreihen:',len(states))
          if not states or len(states)!=len(stations):
              raise SystemExit('IMGW-Polen-Cache leer oder Stationsmetadaten unvollständig.')
          print('IMGW Poland Baseline-Prüfung OK.')
          PY
