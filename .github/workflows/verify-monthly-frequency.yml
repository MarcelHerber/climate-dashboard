name: Verify monthly frequency feature

on:
  push:
    branches:
      - feature/monthly-frequency-distribution
    paths:
      - .github/workflows/verify-monthly-frequency.yml
      - monthly_frequency.js
      - index.html
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check monthly_frequency.js
      - name: Verify dashboard hook
        run: grep -q '<script src="monthly_frequency.js?v=1"></script>' index.html
      - name: Smoke-test distribution math
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const code=fs.readFileSync('monthly_frequency.js','utf8');
          const context={globalThis:{}};
          vm.createContext(context);
          vm.runInContext(code,context);
          const api=context.globalThis.__monthlyFrequencyTestApi;
          if(!api) throw new Error('Test API missing');
          const d=api.buildDistribution([0,0.5,1],[1,1.5,2],'count');
          if(!d || d.histA.reduce((a,b)=>a+b,0)!==3 || d.histB.reduce((a,b)=>a+b,0)!==3) throw new Error('Histogram count failed');
          const p=api.buildDistribution([0,0.5,1],[1,1.5,2,2.5],'percent');
          const sumA=p.histA.reduce((a,b)=>a+b,0);
          const sumB=p.histB.reduce((a,b)=>a+b,0);
          if(Math.abs(sumA-100)>1e-9 || Math.abs(sumB-100)>1e-9) throw new Error('Histogram percent failed');
          const pct=api.empiricalPercentile([1,2,3,4],3);
          if(Math.abs(pct-62.5)>1e-9) throw new Error('Percentile failed');
          console.log('monthly frequency smoke tests passed');
          NODE
