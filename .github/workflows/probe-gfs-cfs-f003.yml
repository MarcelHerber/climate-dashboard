name: Verify genuine CFSR/CFSv2 and GFS f003 0.5 degree fields
on:
  push:
    branches: [feature/gfs-cfsr-1991-2020-europe-20261113]
    paths:
      - "scripts/probe_gfs_cfs_f003.py"
      - ".github/workflows/probe-gfs-cfs-f003.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-gribs:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy requests eccodes
      - name: Validate matching CFSR-CFSv2 and GFS native 0.5 degree f003 originals
        run: python -m scripts.probe_gfs_cfs_f003
