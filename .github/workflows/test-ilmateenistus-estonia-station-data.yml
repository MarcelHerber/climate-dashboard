name: Test Ilmateenistus Estonia station data v1.0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ilmateenistus-estonia-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Estland-Probe Selbsttest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_ilmateenistus_estonia_station_data.py --self-test

      - name: Estland Live-Daten pruefen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_ilmateenistus_estonia_station_data.py
