name: Optional lazy modules · Same-build browser and Lighthouse
on:
  push:
    branches: [perf/lazy-optional-modules-20261124]
    paths:
      - '.github/workflows/optional-lazy-audit-20261124.yml'
      - 'optional_dashboard_modules.js'
      - 'mosmix.js'
      - 'monthly_frequency.js'
      - 'station_thresholds.js'
      - 'index.html'
      - 'js/core.js'
      - 'scripts/build_pages_site.sh'
      - 'tests/audit_optional_modules_browser.py'
      - 'tests/serve_optional_lazy_ab.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and build exact Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          node --check optional_dashboard_modules.js
          node --check mosmix.js
          node --check monthly_frequency.js
          node --check js/core.js
          node --test tests/test_phase2_exports.cjs
          if ! bash scripts/build_pages_site.sh > reports/build.log 2>&1; then
            tail -n 160 reports/build.log
            exit 1
          fi
          tail -n 30 reports/build.log
          test -s _site/asset-manifest.json
      - name: Install Chromium and pinned Lighthouse
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/lighthouse" 'lighthouse@12.6.0'
      - name: Verify new on-demand modules, tabs and real data in desktop and mobile browsers
        run: python -u tests/audit_optional_modules_browser.py --site _site --output reports/optional
      - name: Compare cold-start script count and Lighthouse, 3 runs per device and variant
        shell: bash
        run: |
          set -euo pipefail
          python -u tests/serve_optional_lazy_ab.py --site _site --port 8765 > reports/server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..40}; do
            if curl --compressed -fsS 'http://127.0.0.1:8765/index.html?tab=overview&lazy=on' -o reports/lazy-on.html &&
               curl --compressed -fsS 'http://127.0.0.1:8765/index.html?tab=overview&lazy=off' -o reports/lazy-off.html; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          result={}
          with sync_playwright() as pw:
            b=pw.chromium.launch(headless=True,args=['--no-sandbox'])
            try:
              for width in (1440,390):
                result[str(width)]={}
                for name in ('off','on'):
                  ctx=b.new_context(viewport={'width':width,'height':860},is_mobile=width<600,
                      has_touch=width<600,service_workers='block')
                  page=ctx.new_page()
                  urls=[]
                  page.on('request',lambda req:urls.append(req.url)
                      if req.url.split('?')[0].endswith('.js') else None)
                  page.goto(f'http://127.0.0.1:8765/index.html?tab=overview&lazy={name}',
                      wait_until='domcontentloaded',timeout=90000)
                  page.wait_for_timeout(1700)
                  result[str(width)][name]={'script_requests':len(urls),
                    'scripts':[u.split('?')[0].split('/')[-1] for u in urls]}
                  ctx.close()
            finally:b.close()
          Path('reports/script-counts.json').write_text(json.dumps(result,indent=2))
          for width,data in result.items():
            print(width,'baseline eager',data['off']['script_requests'],
                'on-demand',data['on']['script_requests'])
            # Eager baseline also loads DWD's map navigation indirectly.
            # Require a real drop in requests; assess transfer size/TBT
            # separately instead of imposing an arbitrary two-request cutoff.
            assert data['on']['script_requests']<data['off']['script_requests'],\
                'No measurable reduction in browser JS requests'
          PY
          lh="$RUNNER_TEMP/lighthouse/node_modules/.bin/lighthouse"
          mkdir -p reports/lighthouse
          for device in mobile desktop; do
            preset=()
            if [[ "$device" == desktop ]]; then preset+=(--preset=desktop); fi
            for run in 1 2 3; do
              for variant in off on; do
                echo "Lighthouse $device $variant cold run $run"
                "$lh" "http://127.0.0.1:8765/index.html?tab=overview&lazy=$variant" \
                  "${preset[@]}" --only-categories=performance --throttling-method=simulate \
                  --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
                  --output=json --output-path="reports/lighthouse/$device-$variant-$run.json" --quiet
              done
            done
          done
          python - <<'PY'
          import json,statistics
          from pathlib import Path
          root=Path('reports/lighthouse')
          metrics=['first-contentful-paint','largest-contentful-paint','total-blocking-time',
                   'cumulative-layout-shift','speed-index','total-byte-weight']
          out={'method':'identical Pages build, gzip origin, 3 cold independent runs per device',
               'variants':{'off':'eager baseline','on':'on-demand optional modules'},'devices':{}}
          for device in ('mobile','desktop'):
            dev={}
            for variant in ('off','on'):
              runs=[]
              for i in (1,2,3):
                d=json.loads((root/f'{device}-{variant}-{i}.json').read_text())
                if d.get('runtimeError'):raise SystemExit(d['runtimeError'])
                row={'score':round(d['categories']['performance']['score']*100,1)}
                row.update({m:d['audits'][m]['numericValue'] for m in metrics if m in d['audits']})
                runs.append(row)
              dev[variant]={'runs':runs,'median':{m:round(statistics.median(r[m] for r in runs),2)
                  for m in runs[0]}}
            dev['difference_on_minus_off']={m:round(dev['on']['median'][m]-dev['off']['median'][m],2)
                 for m in dev['off']['median']}
            out['devices'][device]=dev
          Path('reports/lazy-lighthouse-summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps({d:{v:out['devices'][d][v]['median'] for v in ('off','on')}
              for d in out['devices']},indent=2))
          PY
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optional-lazy-modules-evidence
          path: reports/
          retention-days: 90
