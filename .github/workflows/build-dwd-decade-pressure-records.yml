name: DWD Luftdruck-NN Dekadenrekorde

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dwd-decade-pressure-records
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: python -m pip install requests

      - name: Luftdruck-NN-Dekadenrekorde bauen
        run: |
          set -euo pipefail
          python scripts/build_dwd_decade_pressure_records.py \
            --output data/dwd_decade_pressure_records.json \
            --max-workers 10

      - name: Datenbasis prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/dwd_decade_pressure_records.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          assert data["version"] == 5
          assert set(data["metrics"]) == {"p_high", "p_low"}
          assert data["metrics"]["p_high"]["unit"] == "hPa"
          assert data["metrics"]["p_low"]["unit"] == "hPa"
          assert data["metrics"]["p_high"]["source_column"] == "P"
          assert data["metrics"]["p_low"]["source_column"] == "P"
          assert len(data["areas"]) == 17
          assert data["areas"][0] == "Deutschland"
          assert len(data["periods"]) == 36
          assert data["valid_observations"] >= 60_000_000
          assert data["data_start"]
          assert data["data_through"]
          assert int(data["data_start"][:4]) <= 1950, data["data_start"]
          assert data["quality_filter"]["pressure_min_hpa"] == 954.4
          assert data["quality_filter"]["pressure_max_hpa"] == 1060.8
          assert data["quality_filter"]["max_station_height_m"] == 750
          assert data["quality_filter"]["allowed_qn_8"] == [1, 2, 3, 5, 7, 8, 9, 10]
          assert data["quality_filter"]["qn1_requires_synoptic_support"] is True
          assert data["quality_filter"]["candidate_depth"] == 3
          assert data["qc_stats"]["hourly_support_slots"] > 500_000
          assert data["qc_stats"]["validated_station_records"] > 10_000
          assert all(
              station.get("height") is not None
              and float(station["height"]) <= 750
              for station in data["stations"].values()
          )

          for metric in ("p_high", "p_low"):
              germany = data["leaders"][metric]["Deutschland"]
              assert all(germany[p["id"]] for p in data["periods"])
              values = [
                  float(entry[0])
                  for period in germany.values()
                  for entry in period
              ]
              assert values
              assert min(values) >= 954.4
              assert max(values) <= 1060.8
              assert all(
                  int(entry[5]) in {1, 2, 3, 5, 7, 8, 9, 10}
                  for period in germany.values()
                  for entry in period
              )

          print("DWD-Luftdruck-NN-Dekadenprüfung OK")
          print(
              "Datenzeitraum:",
              data["data_start_timestamp"],
              "bis",
              data["data_through_timestamp"],
          )
          print(
              "Gültige P-Stundenwerte nach QC:",
              f'{data["valid_observations"]:,}',
          )
          print("QC:", data["quality_filter"])
          print("QC-Statistik:", data["qc_stats"])

          high_entries = [
              period[0]
              for period in data["leaders"]["p_high"]["Deutschland"].values()
              if period
          ]
          low_entries = [
              period[0]
              for period in data["leaders"]["p_low"]["Deutschland"].values()
              if period
          ]
          alltime_high = max(high_entries, key=lambda entry: float(entry[0]))
          alltime_low = min(low_entries, key=lambda entry: float(entry[0]))
          print("Deutschland Gesamtmaximum:", alltime_high)
          print("Deutschland Gesamtminimum:", alltime_low)

          # Der bekannte deutsche Tiefdruckrekord von 1983 liegt bei 954,4 hPa.
          # Der Stundenbestand ab 1949 muss mindestens wieder in diesen Bereich reichen.
          assert float(alltime_low[0]) <= 956.0, alltime_low

          print("Gebiete:", len(data["areas"]))
          print("Dekaden:", len(data["periods"]))
          print(
              "Stations-Metadatensegmente:",
              len(data["stations"]),
          )

          for metric in ("p_high", "p_low"):
              sample = (
                  data["leaders"][metric]["Deutschland"]
                  ["month-01-d2"]
              )
              print(metric, "Januar 2. Dekade:", sample[0])
          PY

      - name: Luftdruck-Datenbasis versionieren
        run: |
          set -euo pipefail

          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dwd_decade_pressure_records.json

          if git diff --cached --quiet; then
            echo "Luftdruck-Dekadenrekorde sind unverändert."
            exit 0
          fi

          git commit -m "DWD Luftdruck-NN Dekadenrekorde aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "Luftdruck-Datenbasis nach main veröffentlicht."
          echo "Frontend wird bewusst erst im nächsten Schritt erweitert."
