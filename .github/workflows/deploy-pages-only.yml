name: GitHub Pages schnell veröffentlichen
# Frontend-Deploy-Trigger: nur Änderungen, die die veröffentlichte Website betreffen.

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
      - "tests/**"
      - "docs/**"
  # Bot commits from ERA5 archive workflows do not trigger a second push
  # workflow with GITHUB_TOKEN. Periodically publish latest committed data.
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
  # Actions-authored snow profile data commits do not fire another push run.
  # Publish the rebuilt historical year curves after that workflow succeeds.
  workflow_run:
    workflows: ["Build DWD snow-height profiles"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolated group: the old pages-fast-deploy queue is repeatedly cancelling jobs before startup.
  group: pages-dashboard-v2
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Schlanken Veröffentlichungsordner erstellen
        run: bash scripts/build_pages_site.sh

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
          name: "github-pages-${{ github.run_attempt }}"

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: "10000"
          artifact_name: "github-pages-${{ github.run_attempt }}"

      # Verify the *published* deployment, not only files in the repository.
      # Chromium exercises desktop and touch/mobile controls and real downloads.
      - name: DMI Arktis · Live-Browserprüfung (Desktop und Mobil)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          for attempt in 1 2 3; do
            if node tests/test_arctic_live_browser.cjs; then
              exit 0
            fi
            echo "Website noch nicht vollständig verfügbar (Versuch $attempt)."
            sleep 25
          done
          exit 1

      - name: DMI-Arktis · Prüfbilder sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmi-arctic-live-qa-${{ github.run_id }}
          path: artifacts/dmi-*.png
          if-no-files-found: ignore
