name: GitHub Pages schnell veröffentlichen
# Frontend-Deploy-Trigger: nur Änderungen, die die veröffentlichte Website betreffen.

on:
  pull_request:
    paths:
      - 'index.html'
      - 'vendor/**'
      - 'europe_station_basemap.js'
      - 'mosmix.js'
      - 'js/**'
      - 'scripts/build_pages_site.sh'
      - 'tools/version_assets.py'
      - 'tests/test_asset_versioning.py'
      - 'tests/dashboard_source.cjs'
      - 'tests/test_current_station_daily_ui.mjs'
      - '.github/workflows/deploy-pages-only.yml'
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
      - "tests/**"
      - "docs/**"
  # Bot commits from ERA5 archive workflows do not trigger a second push
  # workflow with GITHUB_TOKEN. Periodically publish latest committed data.
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
  # Actions-authored snow profile data commits do not fire another push run.
  # Publish the rebuilt historical year curves, and refresh MTG timestamps
  # as soon as the verified monitor has committed them to main. Bot pushes
  # made with GITHUB_TOKEN do not independently trigger the push workflow.
  workflow_run:
    workflows: ["Build DWD snow-height profiles", "Update satellite ECMWF isobars", "MTG EUMETView live data check", "DWD Boden-Frontenanalyse aktuell", "NOAA WPC aktuelle Frontanalyse (GeoJSON)", "DWD NinJo-GML Frontenquellen (WFS)", "Phase 3 · DWD-Stundenrekorde aus amtlichen Originalarchiven", "DWD Jahreswechsel · Originalmessungen", "DWD Temperaturgegensätze · Originalmessungen", "ECMWF IFS 0,1° · 1–15 Tage und ERA5-Referenz", "ECMWF IFS 0,1° · Arktis Nordpol 1–15 Tage"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  # Isolated group: the old pages-fast-deploy queue is repeatedly cancelling jobs before startup.
  group: ${{ github.event_name == 'pull_request' && format('pages-dashboard-pr-{0}', github.event.pull_request.number) || 'pages-dashboard-v2' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Hash-Versionierung auf fehlende und veraltete Assets testen
        run: python -m unittest discover -s tests -p test_asset_versioning.py -v
      - name: Produktions-Build ohne Veröffentlichung prüfen
        run: bash scripts/build_pages_site.sh
  deploy:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && ((github.event.workflow_run.name != 'DWD Jahreswechsel · Originalmessungen' && github.event.workflow_run.name != 'DWD Temperaturgegensätze · Originalmessungen' && github.event.workflow_run.name != 'ECMWF IFS 0,1° · 1–15 Tage und ERA5-Referenz' && github.event.workflow_run.name != 'ECMWF IFS 0,1° · Arktis Nordpol 1–15 Tage') || github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Artefakt-Wiederholungslogik testen
        run: node --test tests/test_pages_artifact.cjs

      - name: Schlanken Veröffentlichungsordner erstellen
        run: bash scripts/build_pages_site.sh

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website-Artefakt hochladen
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
          name: "github-pages-${{ github.run_attempt }}"

      - name: Artefakt-Verfügbarkeit prüfen (mit Wiederholungen)
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: node scripts/wait_pages_artifact.cjs

      - name: GitHub Pages veröffentlichen
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: "10000"
          timeout: 600000
          artifact_name: "github-pages-${{ github.run_attempt }}"

      # deploy-pages uses a separate artifact service; REST visibility alone
      # does not guarantee that service has caught up. Retry only once.
      - name: Artefakt nach fehlgeschlagenem Deployment erneut prüfen
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: node scripts/wait_pages_artifact.cjs

      - name: GitHub Pages erneut veröffentlichen
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: "10000"
          timeout: 600000
          artifact_name: "github-pages-${{ github.run_attempt }}"
