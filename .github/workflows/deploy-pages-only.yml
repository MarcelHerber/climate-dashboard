name: GitHub Pages schnell veröffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Schlanken Veröffentlichungsordner erstellen
        run: bash scripts/build_pages_site.sh

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: "10000"
