name: GitHub Pages schnell veröffentlichen
# Frontend-Deploy-Trigger: nur Änderungen, die die veröffentlichte Website betreffen.

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
      - "tests/**"
      - "docs/**"
  # Bot commits from ERA5 archive workflows do not trigger a second push
  # workflow with GITHUB_TOKEN. Periodically publish latest committed data.
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
  # Actions-authored snow profile data commits do not fire another push run.
  # Publish the rebuilt historical year curves, and refresh MTG timestamps
  # as soon as the verified monitor has committed them to main. Bot pushes
  # made with GITHUB_TOKEN do not independently trigger the push workflow.
  workflow_run:
    workflows: ["Build DWD snow-height profiles", "Update satellite ECMWF isobars", "MTG EUMETView live data check", "DWD Boden-Frontenanalyse aktuell", "NOAA WPC aktuelle Frontanalyse (GeoJSON)", "DWD NinJo-GML Frontenquellen (WFS)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolated group: the old pages-fast-deploy queue is repeatedly cancelling jobs before startup.
  group: pages-dashboard-v2
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Schlanken Veröffentlichungsordner erstellen
        run: bash scripts/build_pages_site.sh

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
          name: "github-pages-${{ github.run_attempt }}"

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: "10000"
          timeout: 1200000
          artifact_name: "github-pages-${{ github.run_attempt }}"
