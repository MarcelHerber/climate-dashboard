name: Test monthly individual bars

on:
  push:
    branches:
      - feature/monthly-frequency-individual-bars
    paths:
      - monthly_frequency.js
      - .github/workflows/test-monthly-individual-bars.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: node --check monthly_frequency.js
      - name: Test individual-bar preparation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const code=fs.readFileSync('monthly_frequency.js','utf8');
          const context={globalThis:{}};
          vm.createContext(context);
          vm.runInContext(code,context);
          const api=context.globalThis.__monthlyFrequencyTestApi;
          if(typeof api?.buildIndividualBars!=='function') throw new Error('buildIndividualBars missing');
          const rowsA=[{year:1900,value:10},{year:1901,value:10},{year:1902,value:11}];
          const rowsB=[{year:2000,value:10},{year:2001,value:12}];
          const count=api.buildIndividualBars(rowsA,rowsB,'count');
          if(count.pointsA.length!==3||count.pointsB.length!==2) throw new Error('individual rows lost');
          if(!count.pointsA.every(p=>p.y===1)||!count.pointsB.every(p=>p.y===1)) throw new Error('count weights wrong');
          const same=[...count.pointsA,...count.pointsB].filter(p=>p.value===10).map(p=>p.x);
          if(new Set(same).size!==3) throw new Error('duplicate temperatures overlap');
          if(Math.abs(same.reduce((a,b)=>a+b,0)/same.length-10)>1e-9) throw new Error('duplicate offsets not centered');
          const pct=api.buildIndividualBars(rowsA,rowsB,'percent');
          if(Math.abs(pct.pointsA[0].y-100/3)>1e-9) throw new Error('period A percent weight wrong');
          if(Math.abs(pct.pointsB[0].y-50)>1e-9) throw new Error('period B percent weight wrong');
          console.log('individual bar tests passed');
          NODE
