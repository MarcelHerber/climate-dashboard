name: Europa Tmax · MOSMIX + ICON-EU (privates Wolkenlabor)

on:
  workflow_dispatch:
  schedule:
    - cron: "45 4,10,16,22 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_europe_tmax_lab.py"
      - "tests/test_europe_tmax_lab.py"
      - ".github/workflows/update-europe-tmax-lab.yml"

permissions:
  contents: write

concurrency:
  group: europe-tmax-lab-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: DWD-GRIB2- und Kartenbibliotheken installieren
        run: pip install "numpy>=2,<3" "pillow>=11,<13" "scipy>=1.13,<2" "eccodes>=2,<3"
      - name: Parser und Tagesmaximum-Tests
        run: |
          python -m py_compile scripts/build_europe_tmax_lab.py
          python -m unittest discover -s tests -p test_europe_tmax_lab.py -v
      - name: Eigenständigen Testdatenbranch vorbereiten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          origin="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code origin refs/heads/europe-tmax-lab-data >/dev/null 2>&1; then
            git clone --quiet --single-branch --depth 1 --branch europe-tmax-lab-data "$origin" /tmp/europe-tmax-lab-data
          else
            mkdir -p /tmp/europe-tmax-lab-data
            git -C /tmp/europe-tmax-lab-data init -q -b europe-tmax-lab-data
            git -C /tmp/europe-tmax-lab-data remote add origin "$origin"
          fi
      - name: 5 echte DWD-Europakarten erzeugen
        run: |
          set -o pipefail
          python scripts/build_europe_tmax_lab.py --out /tmp/europe-tmax-lab-data/data/europe-tmax-lab --max-workers 2 2>&1 | tee /tmp/europe-tmax.log
      - name: Forecast- und Bildvalidierung
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime,timedelta,timezone
          from PIL import Image
          root=Path("/tmp/europe-tmax-lab-data/data/europe-tmax-lab")
          manifest=json.loads((root/"current.json").read_text(encoding="utf-8"))
          assert manifest["schema"]==1 and len(manifest["days"])==5
          assert manifest["daily_window"]=="06:00-18:00 UTC"
          cycle=datetime.strptime(manifest["icon_cycle"],"%Y%m%d%H").replace(tzinfo=timezone.utc)
          assert cycle.hour==0
          assert datetime.now(timezone.utc)-cycle<timedelta(days=4)
          assert manifest["grid"]["step"]==.125
          for i,day in enumerate(manifest["days"]):
            assert day["date"]==(cycle+timedelta(days=i)).date().isoformat()
            assert day["icon_hours"]==[24*i+6,24*i+12,24*i+18]
            assert day["coverage"]>=.80
            assert len(day["stations"])>=15
            assert len({s["station_id"] for s in day["stations"]})==len(day["stations"])
            for station in day["stations"]:
              assert -55<station["tmax_c"]<55
              assert 0<=station["distance_km"]<=100
            name=day["icon_png"]
            assert name==f"icon_tmax_{day['date']}.png"
            img=root/name
            assert img.is_file() and img.stat().st_size>1000
            with Image.open(img) as photo:
              photo.verify()
            with Image.open(img) as photo:
              assert photo.size==(manifest["grid"]["width"],manifest["grid"]["height"])
              assert photo.mode=="RGBA"
          print("PASS: fünf echte MOSMIX-/ICON-EU-Tageskarten, alle Quellen und Ausgabezeiten geprüft")
          PY
      - name: Nur vollständige Testkarten auf separatem Datenbranch veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/europe-tmax-lab-data
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/europe-tmax-lab .nojekyll
          if git diff --cached --quiet; then
            echo "Keine neuen Dateien."
            exit 0
          fi
          git commit -m "Experimentelles Europa Tmax: geprüfte MOSMIX-/ICON-EU-Prognosen"
          if git ls-remote --exit-code origin refs/heads/europe-tmax-lab-data >/dev/null 2>&1; then
            git pull --rebase origin europe-tmax-lab-data
          fi
          git push origin HEAD:refs/heads/europe-tmax-lab-data
