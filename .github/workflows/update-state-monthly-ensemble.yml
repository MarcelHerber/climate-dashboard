name: Bundesland Monats-Ensembles aktualisieren

on:
  schedule:
    - cron: "27 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/build_state_monthly_ensemble_outlook.py"
      - "tests/test_state_monthly_rollover.py"
      - ".github/workflows/update-state-monthly-ensemble.yml"

permissions:
  contents: write

concurrency:
  group: state-monthly-ensemble-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests shapely

      - name: Regressionstests
        run: python -m unittest discover -s tests -p 'test_state_monthly*.py' -v

      - name: Aktuelle HYRAS-Bundeslanddaten holen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/state-monthly-input /tmp/state-monthly-output
          mkdir -p /tmp/state-monthly-input /tmp/state-monthly-output
          git fetch origin hyras-data --depth=1

          git show origin/hyras-data:tmean/regions/index.json > /tmp/state-monthly-input/index.json
          CURRENT_FILE=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/state-monthly-input/index.json'))['current_file'])
          PY
          )
          CLIMATE_FILE=$(python - <<'PY'
          import json
          print(json.load(open('/tmp/state-monthly-input/index.json'))['climate_file'])
          PY
          )

          git show "origin/hyras-data:tmean/regions/$CURRENT_FILE" > /tmp/state-monthly-input/current.json
          git show "origin/hyras-data:tmean/regions/$CLIMATE_FILE" > /tmp/state-monthly-input/climate.json
          if git fetch origin state-monthly-ensemble --depth=1; then
            if ! git show FETCH_HEAD:temperature_member_cache.json > /tmp/state-monthly-output/temperature_member_cache.json; then
              echo 'Noch kein Temperatur-Member-Cache vorhanden.'
              rm -f /tmp/state-monthly-output/temperature_member_cache.json
            fi
          fi

          python - <<'PY'
          import json
          x=json.load(open('/tmp/state-monthly-input/current.json'))
          print('HYRAS:',x['data_through'],'· Gebiete:',len(x['regions']))
          PY

      - name: Monats-Ensembles berechnen
        run: |
          python scripts/build_state_monthly_ensemble_outlook.py \
            --current /tmp/state-monthly-input/current.json \
            --climate /tmp/state-monthly-input/climate.json \
            --cache /tmp/state-monthly-output/temperature_member_cache.json \
            --output /tmp/state-monthly-output/state_monthly_ensemble.json

      - name: Ergebnis prüfen
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_state_monthly_ensemble_outlook import validate_monthly_document
          p=Path('/tmp/state-monthly-output/state_monthly_ensemble.json')
          d=json.loads(p.read_text())
          assert d['schema_version']==2
          validate_monthly_document(d)
          available=set(d['models_order'])
          expected={'gefs','ifs','aifs','icon_eu'}
          missing=sorted(expected-available)
          if missing:
              print('WARNUNG: temporär fehlende Modelle:',', '.join(missing))
              print('Fehlerdetails:',d.get('model_errors',{}))
          print('Prüfung OK:',d['year'],d['month'],d['observation_data_through'],'· Modelle:',', '.join(d['models_order']))
          print('Dateigröße:',round(p.stat().st_size/1024,1),'KiB')
          PY

      - name: Datenbranch veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/state-monthly-output
          git init
          git checkout -b state-monthly-ensemble
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state_monthly_ensemble.json temperature_member_cache.json
          git commit -m "Bundesland Monats-Ensembles aktualisiert"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin state-monthly-ensemble

      - name: Modellaktualität melden (nach Veröffentlichung)
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.build_state_monthly_ensemble_outlook import monthly_model_health
          d=json.loads(Path('/tmp/state-monthly-output/state_monthly_ensemble.json').read_text())
          errors, warnings=monthly_model_health(
              d['regions']['Deutschland']['models'], datetime.now(timezone.utc))
          for key, reason in warnings.items():
              print(f'::warning title=Monatsensemble {key}::{reason}')
          if errors:
              for key, reason in errors.items():
                  print(f'::error title=Monatsensemble {key}::{reason}')
              raise SystemExit('Monatsensemble rot: fehlende, unvollständige oder veraltete Daten.')
          if warnings:
              print('Monatsensemble gelb: alle Modelle verfügbar, mindestens eine Laufzeit nicht verifizierbar.')
          else:
              print('Monatsensemble grün: alle vier Modelllaufzeiten sind höchstens 36 Stunden alt.')
          PY

