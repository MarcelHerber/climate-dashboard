name: ERA5-Land 0,1-Grad-Referenz parallel

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-era5-land-running-reference-0p1.yml"
      - "scripts/build_era5_land_running_reference_shard.py"
      - "scripts/era5_running_freshness_guard.py"
  schedule:
    - cron: "19 3 1 * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      month:
        description: "Referenzmonat 01-12; leer = aktueller Kalendermonat"
        required: false
        type: string
        default: ""
      seed_run_id:
        description: "Optional: vorherigen Referenzlauf als Artefakt-Quelle verwenden"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: era5-land-running-reference-0p1
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      month: ${{ steps.target.outputs.month }}
      month_key: ${{ steps.target.outputs.month_key }}
    steps:
      - uses: actions/checkout@v6
      - name: Referenzmonat bestimmen
        id: target
        shell: bash
        run: |
          set -euo pipefail
          python scripts/era5_running_freshness_guard.py reference-month \
            --month "${{ inputs.month || '' }}" \
            --github-output "$GITHUB_OUTPUT"

  reference:
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {variable: temperature, start: 1991, end: 1991}
          - {variable: temperature, start: 1992, end: 1992}
          - {variable: temperature, start: 1993, end: 1993}
          - {variable: temperature, start: 1994, end: 1994}
          - {variable: temperature, start: 1995, end: 1995}
          - {variable: temperature, start: 1996, end: 1996}
          - {variable: temperature, start: 1997, end: 1997}
          - {variable: temperature, start: 1998, end: 1998}
          - {variable: temperature, start: 1999, end: 1999}
          - {variable: temperature, start: 2000, end: 2000}
          - {variable: temperature, start: 2001, end: 2001}
          - {variable: temperature, start: 2002, end: 2002}
          - {variable: temperature, start: 2003, end: 2003}
          - {variable: temperature, start: 2004, end: 2004}
          - {variable: temperature, start: 2005, end: 2005}
          - {variable: temperature, start: 2006, end: 2006}
          - {variable: temperature, start: 2007, end: 2007}
          - {variable: temperature, start: 2008, end: 2008}
          - {variable: temperature, start: 2009, end: 2009}
          - {variable: temperature, start: 2010, end: 2010}
          - {variable: temperature, start: 2011, end: 2011}
          - {variable: temperature, start: 2012, end: 2012}
          - {variable: temperature, start: 2013, end: 2013}
          - {variable: temperature, start: 2014, end: 2014}
          - {variable: temperature, start: 2015, end: 2015}
          - {variable: temperature, start: 2016, end: 2016}
          - {variable: temperature, start: 2017, end: 2017}
          - {variable: temperature, start: 2018, end: 2018}
          - {variable: temperature, start: 2019, end: 2019}
          - {variable: temperature, start: 2020, end: 2020}
          - {variable: precipitation, start: 1991, end: 1993}
          - {variable: precipitation, start: 1994, end: 1996}
          - {variable: precipitation, start: 1997, end: 1999}
          - {variable: precipitation, start: 2000, end: 2002}
          - {variable: precipitation, start: 2003, end: 2005}
          - {variable: precipitation, start: 2006, end: 2008}
          - {variable: precipitation, start: 2009, end: 2011}
          - {variable: precipitation, start: 2012, end: 2014}
          - {variable: precipitation, start: 2015, end: 2017}
          - {variable: precipitation, start: 2018, end: 2020}
    steps:
      - uses: actions/checkout@v6

      - name: Vorhandenen Shard-Cache laden
        id: shard-cache
        uses: actions/cache/restore@v4
        with:
          path: .era5_running_cache_0p1
          key: era5-land-running-0p1-shard-v2-${{ needs.target.outputs.month_key }}-${{ matrix.variable }}-${{ matrix.start }}-${{ matrix.end }}

      - name: Vorhandenes Artefakt aus vorherigem Lauf übernehmen
        id: seed
        if: steps.shard-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_RUN_ID: ${{ github.event_name == 'push' && '34888132703' || inputs.seed_run_id }}
          ARTIFACT_NAME: era5-running-0p1-${{ needs.target.outputs.month_key }}-${{ matrix.variable }}-${{ matrix.start }}-${{ matrix.end }}
        shell: bash
        run: |
          set -euo pipefail
          echo "seed-hit=false" >> "$GITHUB_OUTPUT"
          if [[ -z "${SEED_RUN_ID:-}" ]]; then
            exit 0
          fi

          rm -rf .era5_seed
          if gh run download "$SEED_RUN_ID" \
              --repo "${{ github.repository }}" \
              --name "$ARTIFACT_NAME" \
              --dir .era5_seed; then
            mkdir -p .era5_running_cache_0p1
            if [[ -d .era5_seed/.era5_running_cache_0p1 ]]; then
              cp -a .era5_seed/.era5_running_cache_0p1/. .era5_running_cache_0p1/
            else
              cp -a .era5_seed/. .era5_running_cache_0p1/
            fi
            if find .era5_running_cache_0p1 -type f -name '*.nc' -size +0c -print -quit | grep -q .; then
              echo "seed-hit=true" >> "$GITHUB_OUTPUT"
              echo "Vorhandenes Artefakt übernommen: $ARTIFACT_NAME"
            fi
          else
            echo "Kein vorhandenes Artefakt für $ARTIFACT_NAME; Shard wird neu gebaut."
          fi

      - uses: actions/setup-python@v6
        if: steps.shard-cache.outputs.cache-hit != 'true' && steps.seed.outputs.seed-hit != 'true'
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Python-Pakete installieren
        if: steps.shard-cache.outputs.cache-hit != 'true' && steps.seed.outputs.seed-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cdsapi>=0.7.7" numpy xarray netCDF4 matplotlib cartopy

      - name: CDS API konfigurieren
        if: steps.shard-cache.outputs.cache-hit != 'true' && steps.seed.outputs.seed-hit != 'true'
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          set -euo pipefail
          test -n "${CDSAPI_KEY:-}"
          cat > "$HOME/.cdsapirc" <<EOF
          url: https://cds.climate.copernicus.eu/api
          key: ${CDSAPI_KEY}
          EOF
          chmod 600 "$HOME/.cdsapirc"

      - name: Referenz-Shard bauen
        if: steps.shard-cache.outputs.cache-hit != 'true' && steps.seed.outputs.seed-hit != 'true'
        run: |
          set -euo pipefail
          python scripts/build_era5_land_running_reference_shard.py \
            --variable "${{ matrix.variable }}" \
            --month "${{ needs.target.outputs.month }}" \
            --start-year "${{ matrix.start }}" \
            --end-year "${{ matrix.end }}"

      - name: Shard prüfen
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(find .era5_running_cache_0p1 -type f -name '*.nc' -size +0c | wc -l)
          echo "Nichtleere NetCDF-Dateien im Shard: $COUNT"
          test "$COUNT" -ge 1

      - name: Erfolgreichen Shard cachen
        if: success() && steps.shard-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .era5_running_cache_0p1
          key: era5-land-running-0p1-shard-v2-${{ needs.target.outputs.month_key }}-${{ matrix.variable }}-${{ matrix.start }}-${{ matrix.end }}

      - name: Referenz-Shard hochladen
        uses: actions/upload-artifact@v4
        with:
          name: era5-running-0p1-${{ needs.target.outputs.month_key }}-${{ matrix.variable }}-${{ matrix.start }}-${{ matrix.end }}
          path: .era5_running_cache_0p1
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  publish-reference:
    needs: [target, reference]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Alle Referenz-Shards herunterladen
        uses: actions/download-artifact@v5
        with:
          pattern: era5-running-0p1-${{ needs.target.outputs.month_key }}-*
          path: .era5_shards
          merge-multiple: true
      - name: Referenzcache validieren
        env:
          MONTH: ${{ needs.target.outputs.month }}
        run: |
          set -euo pipefail
          mkdir -p .era5_running_cache_0p1
          cp -a .era5_shards/. .era5_running_cache_0p1/
          python - <<'PY'
          from pathlib import Path
          import os
          month=os.environ['MONTH']
          root=Path('.era5_running_cache_0p1')
          temp=list(root.glob(f'reference_temp_1991_2020_{month}_full_*.nc'))
          precip=list(root.glob(f'reference_precip_1991_2020_{month}_full_*.nc'))
          print('Temperaturdateien:', len(temp))
          print('Niederschlagsdateien:', len(precip))
          assert len(temp) >= 30, len(temp)
          assert len(precip) >= 30, len(precip)
          assert all(p.stat().st_size > 0 for p in temp + precip)
          PY
      - name: Fertigen Monatscache speichern
        uses: actions/cache/save@v4
        with:
          path: .era5_running_cache_0p1
          key: era5-land-running-0p1-reference-v1-${{ needs.target.outputs.month_key }}
      - name: Laufende ERA5-Land-Daten nach Cachebau starten
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run update-era5-land-running.yml --ref main
