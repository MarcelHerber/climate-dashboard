name: Original-Synoptikkarten DWD AEMET KNMI NOAA

on:
  schedule:
    - cron: "25 1,7,13,19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_synoptic_original_charts.py"
      - "tests/test_synoptic_original_charts.py"
      - "scripts/audit_europe_synoptic_sources.py"
      - "tests/test_europe_synoptic_source_audit.py"
      - "scripts/probe_imo_atlantic.py"
      - "scripts/imo_synoptic_adapter.py"
      - "tests/test_imo_synoptic_adapter.py"
      - "tests/test_imo_atlantic_probe.py"
      - "tests/test_synoptic_panel_selection.cjs"
      - "synoptic_panel_logic.js"
      - "scripts/probe_chmi_synoptic.py"
      - "scripts/chmi_synoptic_adapter.py"
      - "scripts/dhmz_synoptic_adapter.py"
      - "tests/test_dhmz_synoptic_adapter.py"
      - "tests/test_chmi_synoptic_adapter.py"
      - "tests/test_chmi_synoptic_probe.py"
      - ".github/workflows/update-synoptic-original-charts.yml"

permissions:
  contents: write

concurrency:
  group: synoptic-original-charts
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            tests
            data/synoptic_charts
            synoptic_panel_logic.js
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image processing
        run: python -m pip install --upgrade Pillow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify UTC-exact four-panel selection logic
        run: node --test tests/test_synoptic_panel_selection.cjs
      - name: Syntax-check all synoptic scripts before workflow execution
        run: python -m py_compile scripts/update_synoptic_original_charts.py scripts/probe_imo_atlantic.py scripts/imo_synoptic_adapter.py scripts/probe_chmi_synoptic.py scripts/chmi_synoptic_adapter.py scripts/dhmz_synoptic_adapter.py
      - name: Test dated chart parsers and copyright policy
        run: python -m unittest discover -s tests -p test_synoptic_original_charts.py -v
      - name: Install narrow OCR support for printed ČHMÚ UTC dates
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
          python -m pip install pytesseract
      - name: Verify Croatian DHMZ original chart validity and stale-date rejection
        run: python -m unittest discover -s tests -p test_dhmz_synoptic_adapter.py -v
      - name: Verify ČHMÚ printed time and playback-time mismatch
        run: python -m unittest discover -s tests -p test_chmi_synoptic_adapter.py -v
      - name: Test ČHMÚ provenance and timestamp safeguards
        run: python -m unittest discover -s tests -p test_chmi_synoptic_probe.py -v
      - name: Probe official ČHMÚ source metadata without guessing chart timestamps
        run: python scripts/probe_chmi_synoptic.py
      - name: Test European source reuse and timestamp policies
        run: python -m unittest discover -s tests -p test_europe_synoptic_source_audit.py -v
      - name: Publish European source permission audit (not a live availability claim)
        run: python scripts/audit_europe_synoptic_sources.py
      - name: Test IMO source provenance, dates, and no invented chart times
        run: python -m unittest discover -s tests -p test_imo_atlantic_probe.py -v
      - name: Test Icelandic original isobar chart OCR validity and publisher provenance
        run: python -m unittest discover -s tests -p test_imo_synoptic_adapter.py -v
      - name: Probe IMO actual North Atlantic image metadata (no image copy)
        run: python scripts/probe_imo_atlantic.py
      - name: Fetch permitted DWD AEMET KNMI NOAA original images
        run: python scripts/update_synoptic_original_charts.py
      - name: Validate only genuine source charts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("data/synoptic_charts")
          index=json.loads((root/"index.json").read_text(encoding="utf-8"))
          imo=json.loads((root/"imo_probe.json").read_text(encoding="utf-8"))
          assert imo["schema_version"]==1
          assert imo["ready_for_automated_chart_ingestion"] is False
          assert imo["provider_terms"].startswith("https://en.vedur.is/")
          audit=json.loads((root/"europe_source_audit.json").read_text(encoding="utf-8"))
          assert audit["schema_version"]==1 and audit["no_live_check"]
          assert all(not p["reproduction_ready"] for p in audit["providers"])
          assert index["schema_version"]==1 and index["ready"]
          assert index["charts"]
          assert index["chart_count"]==len(index["charts"])
          assert index["time_slots"]==sorted(set(x["valid_utc"] for x in index["charts"]))
          for item in index["charts"]:
              assert item["source_id"] in ("dwd","aemet","knmi","noaa_opc","noaa_full","noaa_west","noaa_24","noaa_48","noaa_96","chmi","dhmz","imo")
              assert item["source_url"].startswith(("https://opendata.dwd.de/","https://www.aemet.es/","https://ftp.opc.ncep.noaa.gov/ncdc/","https://data-provider.chmi.cz/api/playableImages/init/synopticka-mapa","https://prognoza.hr/web_fronte_sutra12.jpg","https://cdn.knmi.nl/knmi/map/page/weer/waarschuwingen_verwachtingen/weerkaarten/","https://en.vedur.is/photos/sjo_atlant_spa/","https://www.vedur.is/photos/sjo_atlant_spa/"))
              assert item["image"].startswith("images/")
              image=root/item["image"]
              assert image.is_file() and image.stat().st_size>=18000
              b=image.read_bytes()[:12]
              assert b[:4]==b"RIFF" and b[8:12]==b"WEBP"
          assert next(x for x in index["sources"] if x["id"]=="knmi")["type"]=="auto"
          assert next(x for x in index["sources"] if x["id"]=="metoffice")["type"]=="external"
          assert next(x for x in index["sources"] if x["id"]=="noaa_opc")["type"]=="auto"
          assert next(x for x in index["sources"] if x["id"]=="noaa_full")["type"]=="auto"
          assert len(index["sources"])==len({x["id"] for x in index["sources"]})
          for product in ("noaa_west","noaa_24","noaa_48","noaa_96"):
              assert next(x for x in index["sources"] if x["id"]==product)["type"]=="auto"
          for item in index["charts"]:
              if item["source_id"] in ("noaa_24","noaa_48","noaa_96"):
                  from datetime import datetime,timedelta
                  issue=datetime.fromisoformat(item["run_utc"])
                  valid=datetime.fromisoformat(item["valid_utc"])
                  assert valid==issue+timedelta(hours=item["forecast_hours"])
          assert next(x for x in index["sources"] if x["id"]=="chmi")["type"]=="auto"
          assert all(x.get("validity_method","").startswith("Printed DD.MM.YYYY HH UTC") for x in index["charts"] if x["source_id"]=="chmi")
          assert next(x for x in index["sources"] if x["id"]=="dmi")["type"]=="external"
          assert next(x for x in index["sources"] if x["id"]=="metie")["type"]=="external"
          assert next(x for x in index["sources"] if x["id"]=="dhmz")["type"]=="auto"
          assert all(x.get("validity_method","").startswith("Printed Croatian") for x in index["charts"] if x["source_id"]=="dhmz")
          assert next(x for x in index["sources"] if x["id"]=="eccc")["type"]=="external"
          print("Original charts validated:",index["chart_count"],index["source_status"])
          PY
      - name: Publish verified chart snapshots
        shell: bash
        run: |
          set -euo pipefail
          cp -a data/synoptic_charts /tmp/synoptic-charts-publish
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data/synoptic_charts
            mkdir -p data
            cp -a /tmp/synoptic-charts-publish data/synoptic_charts
            git add -A data/synoptic_charts
            if git diff --cached --quiet; then
              echo "No changes"
              exit 0
            fi
            git commit -m "Publish timestamp-verified original synoptic surface charts"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push race retry $attempt"
          done
          exit 1
