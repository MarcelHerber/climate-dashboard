name: DWD jährliche Extremwerte Startjahre

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dwd-annual-extremes-start-years
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Regionale Startjahre dauerhaft einbauen
        run: |
          set -euo pipefail
          python scripts/patch_dwd_annual_extremes_start_years.py

      - name: Ergebnis prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(
              Path("data/dwd_annual_extremes.json")
              .read_text(encoding="utf-8")
          )

          expected = {
              "Deutschland": 1881,
              "Baden-Württemberg": 1881,
              "Bayern": 1881,
              "Berlin": 1881,
              "Brandenburg": 1887,
              "Bremen": 1890,
              "Hamburg": 1891,
              "Hessen": 1881,
              "Mecklenburg-Vorpommern": 1881,
              "Niedersachsen": 1881,
              "Nordrhein-Westfalen": 1881,
              "Rheinland-Pfalz": 1881,
              "Saarland": 1931,
              "Sachsen": 1881,
              "Sachsen-Anhalt": 1881,
              "Schleswig-Holstein": 1881,
              "Thüringen": 1881,
          }

          assert d["start_year"] == 1861
          assert d["list_min_year"] == 1881
          assert d["area_start_years"] == expected
          assert len(d["area_start_years"]) == 17

          builder = Path("scripts/build_dwd_annual_extremes.py").read_text(
              encoding="utf-8"
          )
          assert "LIST_MIN_YEAR = 1881" in builder
          assert "derive_area_start_years" in builder
          assert '"area_start_years": area_start_years' in builder

          print("Startjahr-Patch vollständig geprüft.")
          print(json.dumps(expected, ensure_ascii=False, indent=2))
          PY

      - name: Änderungen veröffentlichen
        run: |
          set -euo pipefail

          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            scripts/build_dwd_annual_extremes.py \
            data/dwd_annual_extremes.json

          if git diff --cached --quiet; then
            echo "Startjahre bereits aktuell."
            exit 0
          fi

          git commit -m "Regionale Startjahre für jährliche Extremwerte [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "Regionale Startjahre veröffentlicht."
