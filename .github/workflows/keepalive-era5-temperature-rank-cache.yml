          if [[ "$HIT" == "true" ]]; then
            echo "Cache $YEAR-12 erfolgreich abgerufen."
          else
            echo "::warning::Cache $YEAR-12 nicht gefunden; Keepalive erzeugt bewusst keine ERA5-Daten neu."
