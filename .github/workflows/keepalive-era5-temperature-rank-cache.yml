    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: ${{ fromJSON(needs.prepare.outputs.years) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: cache
        name: Dezember-Cache berühren
