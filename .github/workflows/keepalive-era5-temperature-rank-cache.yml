          path: .era5_running_rank_daily_cache
          key: era5-running-temperature-rank-daily-v1-${{ matrix.year }}-m12
          lookup-only: false
      - name: Ergebnis protokollieren
        shell: bash
        env:
          HIT: ${{ steps.cache.outputs.cache-hit }}
