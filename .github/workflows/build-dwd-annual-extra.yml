name: DWD Jahresextreme Erweiterungen

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_annual_extremes_extra.py'
      - '.github/workflows/build-dwd-annual-extra.yml'
      - 'tests/test_annual_extremes_extra.py'
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dwd-annual-extra
  cancel-in-progress: false

jobs:
  calculate:
    strategy:
      fail-fast: false
      matrix:
        family: [KL, RR, TU]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install requests
      - name: Methoden prüfen
        run: python -m unittest discover -s tests -p test_annual_extremes_extra.py -v
      - name: DWD Originalmessungen auswerten
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          python scripts/build_annual_extremes_extra.py --family "$FAMILY" --workers 6 --output "data/dwd_annual_extra_${FAMILY,,}.json"
      - name: Geprüftes Zusatzarchiv separat veröffentlichen
        env:
          FAMILY: ${{ matrix.family }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name climate-dashboard-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "data/dwd_annual_extra_${FAMILY,,}.json"
          if ! git diff --cached --quiet; then
            git commit -m "DWD Jahresextreme: $FAMILY Zusatzarchiv"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep 10
            done
          fi
          gh workflow run deploy-pages-only.yml --ref main
