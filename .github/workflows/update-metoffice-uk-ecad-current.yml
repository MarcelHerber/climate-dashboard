name: Build UK 2026 ECA&D current cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: UK-Caches wiederherstellen
        uses: actions/cache/restore@v5
        with:
          path: .cache/europe-stations
          key: metoffice-uk-ecad-current-2026-v1-${{ github.run_id }}
          restore-keys: |
            metoffice-uk-ecad-current-2026-v1-
            metoffice-uk-midas-baseline-2025-v1-

      - name: Selbsttests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_metoffice_uk_midas_station_cache.py --self-test
          python scripts/test_ecad_uk_2026.py --self-test
          python scripts/update_metoffice_uk_ecad_current.py --self-test

      - name: UK Current 2026 aus ECA&D bauen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_metoffice_uk_ecad_current.py

      - name: Status anzeigen
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "=== UK ECA&D CURRENT CACHE DATEIEN ==="
          find .cache/europe-stations -maxdepth 1 -type f \
            -name 'metoffice_uk_ecad_current_2026*' \
            -printf '%f | %s bytes\n' | sort || true

          STATUS=".cache/europe-stations/metoffice_uk_ecad_current_2026_status.json"
          if [[ -f "$STATUS" ]]; then
            echo
            echo "=== UK ECA&D CURRENT 2026 STATUS ==="
            cat "$STATUS"
          fi

      - name: UK ECA&D Current Cache speichern
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache/europe-stations
          key: metoffice-uk-ecad-current-2026-v1-${{ github.run_id }}
