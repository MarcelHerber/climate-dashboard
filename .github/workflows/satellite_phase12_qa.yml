name: Satellite Phase 1–2 QA
on:
  pull_request:
    paths:
      - "satelliten.html"
      - "satelliten.js"
      - "satelliten.css"
      - "satellite_*.js"
      - "satellite_tile_cache.js"
      - "tests/test_satellite_tile_cache.cjs"
      - "tests/test_satellite_hd.cjs"
      - "scripts/check_satellite_wms.py"
      - "scripts/audit_satellite_live_quality.py"
      - "scripts/test_satellite_published_browser.py"
      - "tests/test_satellite_live_quality.py"
      - ".github/workflows/satellite_live_quality_qa.yml"
      - "scripts/check_satellite_status_freshness.py"
      - "tests/test_satellite_wms_monitor.py"
      - ".github/workflows/check-satellite-wms.yml"
      - ".github/workflows/check-satellite-freshness.yml"
      - ".github/workflows/deploy-pages-only.yml"
      - "scripts/audit_satellite_layers.py"
      - "scripts/build_pages_site.sh"
      - "scripts/update_satellite_dwd_fronts.py"
      - "scripts/update_satellite_noaa_wpc_fronts.py"
      - "tests/test_satellite_noaa_wpc_fronts.py"
      - ".github/workflows/update-satellite-noaa-wpc-fronts.yml"
      - "data/synoptic_charts/noaa_wpc_fronts_geo.json"
      - "tests/test_satellite_dwd_fronts.py"
      - ".github/workflows/update-satellite-dwd-fronts.yml"
      - "data/synoptic_charts/dwd_fronts_satellite.json"
      - "tests/test_satellite_*.cjs"
  push:
    branches: [main]
    paths:
      - "satelliten.html"
      - "satelliten.js"
      - "satelliten.css"
      - "satellite_*.js"
      - "scripts/check_satellite_wms.py"
      - "scripts/audit_satellite_live_quality.py"
      - "scripts/test_satellite_published_browser.py"
      - "tests/test_satellite_live_quality.py"
      - ".github/workflows/satellite_live_quality_qa.yml"
      - "scripts/check_satellite_status_freshness.py"
      - "tests/test_satellite_wms_monitor.py"
      - ".github/workflows/check-satellite-wms.yml"
      - ".github/workflows/check-satellite-freshness.yml"
      - ".github/workflows/deploy-pages-only.yml"
      - "scripts/audit_satellite_layers.py"
      - "scripts/build_pages_site.sh"
      - "scripts/update_satellite_dwd_fronts.py"
      - "scripts/update_satellite_noaa_wpc_fronts.py"
      - "tests/test_satellite_noaa_wpc_fronts.py"
      - ".github/workflows/update-satellite-noaa-wpc-fronts.yml"
      - "data/synoptic_charts/noaa_wpc_fronts_geo.json"
      - "tests/test_satellite_dwd_fronts.py"
      - ".github/workflows/update-satellite-dwd-fronts.yml"
      - "data/synoptic_charts/dwd_fronts_satellite.json"
      - "tests/test_satellite_*.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  satellite-static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check satelliten.js
          node --check satellite_dwd_fronts.js
          node --check satellite_noaa_fronts.js
          node --check satellite_view_options.js
          node --check satellite_lightning.js
          node --check satellite_radar.js
          node --check satellite_isobars.js
          node --check satellite_film_export.js
      - name: Python syntax
        run: python -m py_compile scripts/check_satellite_wms.py scripts/audit_satellite_layers.py scripts/test_satellite_ui_browser.py scripts/check_satellite_status_freshness.py tests/test_satellite_wms_monitor.py scripts/audit_satellite_live_quality.py scripts/test_satellite_published_browser.py tests/test_satellite_live_quality.py
      - name: Live Pages and MTG image quality logic tests (offline)
        run: python -m unittest discover -s tests -p "test_satellite_live_quality.py" -v
      - name: MTG monitor and freshness watchdog regression tests
        run: python -m unittest discover -s tests -p "test_satellite_wms_monitor.py" -v
      - name: NOAA official high-resolution WPC frontal geometry tests
        run: python -m unittest discover -s tests -p "test_satellite_noaa_wpc_fronts.py" -v
      - name: DWD original front analysis metadata and imagery safety tests
        run: python -m unittest discover -s tests -p "test_satellite_dwd_fronts.py" -v
      - name: Satellite regression tests
        run: |
          node --test tests/test_satelliten_ui.cjs
          node --test tests/test_satellite_phase12.cjs
          node --test tests/test_satellite_tile_cache.cjs
          node --test tests/test_satellite_hd.cjs
          node --test tests/test_satellite_dwd_fronts.cjs
          node --test tests/test_satellite_noaa_fronts.cjs
          node --test tests/test_satellite_progressive.cjs
          node --test tests/test_satellite_quality_comparison.cjs
          node --test tests/test_satellite_fullhd_film.cjs
          node --test tests/test_satellite_source_alignment.cjs
          node --test tests/test_satellite_overlay.cjs
          node --test tests/test_satellite_film.cjs
          node --test tests/test_satellite_film_export.cjs
