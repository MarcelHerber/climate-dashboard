name: Satellite Phase 1–2 QA
on:
  pull_request:
    paths:
      - "satelliten.html"
      - "satelliten.js"
      - "satelliten.css"
      - "satellite_*.js"
      - "scripts/check_satellite_wms.py"
      - "scripts/audit_satellite_layers.py"
      - "scripts/build_pages_site.sh"
      - "tests/test_satellite_*.cjs"
  push:
    branches: [main]
    paths:
      - "satelliten.html"
      - "satelliten.js"
      - "satelliten.css"
      - "satellite_*.js"
      - "scripts/check_satellite_wms.py"
      - "scripts/audit_satellite_layers.py"
      - "scripts/build_pages_site.sh"
      - "tests/test_satellite_*.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  satellite-static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check satelliten.js
          node --check satellite_view_options.js
          node --check satellite_lightning.js
          node --check satellite_radar.js
          node --check satellite_isobars.js
          node --check satellite_film_export.js
      - name: Python syntax
        run: python -m py_compile scripts/check_satellite_wms.py scripts/audit_satellite_layers.py scripts/test_satellite_ui_browser.py
      - name: Satellite regression tests
        run: |
          node --test tests/test_satelliten_ui.cjs
          node --test tests/test_satellite_phase12.cjs
          node --test tests/test_satellite_overlay.cjs
          node --test tests/test_satellite_film.cjs
          node --test tests/test_satellite_film_export.cjs
