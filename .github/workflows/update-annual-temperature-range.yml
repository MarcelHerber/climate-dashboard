name: DWD Jährliche Temperaturspanne
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build_annual_temperature_range.py, .github/workflows/update-annual-temperature-range.yml]
  schedule:
    - cron: '37 4 * * *'
permissions:
  contents: write
concurrency:
  group: annual-temperature-range
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/
            data/dwd_annual_temperature_range.json
            stations_temperaturspanne.js
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: |
          python scripts/build_annual_temperature_range.py --selftest
          node --check stations_temperaturspanne.js
      - name: Build annual archive
        run: |
          args=()
          if [[ "${{ github.event_name }}" == schedule && "$(date -u +%u)" != 1 ]]; then args+=(--recent-only); fi
          python -u scripts/build_annual_temperature_range.py "${args[@]}"
      - name: Publish archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dwd_annual_temperature_range.json
          git diff --cached --quiet && exit 0
          git commit -m "data: DWD annual station temperature ranges"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
