name: Integrate Slovenia 73 stations into Europe

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-slovenia-73-into-europe
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Ausgangslage und Integrationshelfer prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/integrate_slovenia_into_europe.py
          test -s scripts/update_europe_station_records_all_sources.py
          test -s scripts/update_arso_slovenia_station_cache.py
          test -s scripts/update_arso_slovenia_current.py
          test -s scripts/update_arso_slovenia_station_metadata.py
          test -s scripts/update_ilmateenistus_estonia_station_cache.py
          test -s scripts/update_ilmateenistus_estonia_current.py

          grep -q \
            'import update_ilmateenistus_estonia_station_cache as estonia_hist' \
            scripts/update_europe_station_records_all_sources.py
          grep -q \
            '"Estland": estonia_hist.SOURCE' \
            scripts/update_europe_station_records_all_sources.py

          python scripts/integrate_slovenia_into_europe.py --self-test
          python scripts/integrate_slovenia_into_europe.py --check-only

      - name: Slowenien in Europa-Hauptskript integrieren
        shell: bash
        run: |
          set -euo pipefail
          python scripts/integrate_slovenia_into_europe.py

      - name: Integration prüfen
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile scripts/update_europe_station_records_all_sources.py
          python scripts/update_arso_slovenia_station_cache.py --self-test
          python scripts/update_arso_slovenia_current.py --self-test
          python scripts/update_arso_slovenia_station_metadata.py --self-test
          python scripts/update_europe_station_records_all_sources.py --self-test

          grep -q \
            'import update_arso_slovenia_station_cache as slovenia_hist' \
            scripts/update_europe_station_records_all_sources.py
          grep -q \
            'SLOVENIA_IGNORED_IDS = {"346"}' \
            scripts/update_europe_station_records_all_sources.py
          grep -q \
            'SLOVENIA_EXPECTED_MAP_READY = 73' \
            scripts/update_europe_station_records_all_sources.py
          grep -q \
            '"Slowenien": slovenia_hist.SOURCE' \
            scripts/update_europe_station_records_all_sources.py
          grep -q \
            'prefix="ARSO"' \
            scripts/update_europe_station_records_all_sources.py

          # Estland muss unverändert weiter enthalten sein.
          grep -q \
            'import update_ilmateenistus_estonia_station_cache as estonia_hist' \
            scripts/update_europe_station_records_all_sources.py
          grep -q \
            '"Estland": estonia_hist.SOURCE' \
            scripts/update_europe_station_records_all_sources.py
          grep -q \
            'prefix="ILMATEENISTUS"' \
            scripts/update_europe_station_records_all_sources.py

          git diff --check
          echo "Slowenien 73 Stationen + bestehende Estland-Integration geprüft."

      - name: Nur Europa-Hauptskript committen und pushen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add scripts/update_europe_station_records_all_sources.py

          echo "=== GEÄNDERTE DATEIEN ==="
          git status --short
          echo "=== DIFF STAT ==="
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "Keine Änderungen zum Committen."
            exit 0
          fi

          git commit -m \
            "Integrate 73 Slovenia ARSO stations into Europe [skip ci]"

          PUSH_OK=false
          for ATTEMPT in 1 2 3; do
            echo "Push-Versuch ${ATTEMPT}/3 ..."
            git fetch origin "${GITHUB_REF_NAME}"

            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              PUSH_OK=true
              break
            fi

            sleep $((ATTEMPT * 5))
          done

          [[ "$PUSH_OK" == "true" ]]
