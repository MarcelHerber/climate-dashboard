name: Bundesländer Stations-Temperaturarchiv
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build_bundeslaender_station_temperature.py', '.github/workflows/bundeslaender-station-temperature.yml']
  schedule:
    - cron: '50 6,12,18 * * *'
permissions:
  contents: write
concurrency:
  group: bundeslaender-station-data
  cancel-in-progress: false
jobs:
  station-temperature:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/build_bundeslaender_station_temperature.py
            tests/test_bundeslaender_station_temperature.py
            station_threshold_daily
            station_climate_days_current
            station_climate_days_index.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python tests/test_bundeslaender_station_temperature.py
      - run: python scripts/build_bundeslaender_station_temperature.py --output /tmp/station-result
      - name: Check out existing station data branch
        uses: actions/checkout@v4
        with:
          ref: bundeslaender-station-data
          path: station-publish
          fetch-depth: 1
          persist-credentials: true
      - name: Publish independent station series
        working-directory: station-publish
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          for parameter in tmin tmax tmean; do
            for direction in low high; do
              test -s "/tmp/station-result/extremes/$parameter/$direction/index.json"
            done
          done
          cp -a /tmp/station-result/. .
          git add -- tmin tmax tmean extremes
          if ! git diff --cached --quiet; then
            git commit -m "Update DWD station extrema and fixed-panel temperatures"
            git push origin HEAD:refs/heads/bundeslaender-station-data
          fi
