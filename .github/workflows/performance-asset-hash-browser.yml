name: Performance · Asset-Hash URLs im Chromium prüfen

on:
  push:
    branches: [perf/content-hash-assets-20261123]
    paths:
      - 'tools/version_assets.py'
      - 'scripts/build_pages_site.sh'
      - 'js/**'
      - 'tests/audit_asset_hash_browser.py'
      - '.github/workflows/performance-asset-hash-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Produktions-Artefakt inklusive Hash-Manifests aufbauen
        shell: bash
        run: |
          set -euo pipefail
          if ! bash scripts/build_pages_site.sh > build-log.txt 2>&1; then
            tail -n 160 build-log.txt
            exit 1
          fi
          tail -n 25 build-log.txt
          test -s _site/asset-manifest.json
      - name: Chromium mit Playwright installieren
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Gehashte URLs und Lazy-Tabs mit echtem Chromium prüfen
        run: python -u tests/audit_asset_hash_browser.py --site _site --output reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-hash-browser-smoke
          path: |
            reports/
            build-log.txt
          retention-days: 30
