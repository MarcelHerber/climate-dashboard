name: Probe ANM Romania 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Probe-Skript prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/test_anm_romania_3.py
          python scripts/test_anm_romania_3.py --self-test

      - name: ANM Rumänien N201 dekodieren
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_anm_romania_3.py
