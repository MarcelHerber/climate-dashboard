name: Performance branch · Thematic script split
on:
  push:
    branches: [perf/dashboard-loading-20261120]
    paths: ['index.html', 'js/**', 'tests/audit_dashboard_split.py', '.github/workflows/performance-dashboard-split-audit.yml']

permissions:
  contents: read
  actions: read

jobs:
  production-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Prüfe vollständigen Pages-Build ohne Deployment
        run: bash scripts/build_pages_site.sh
      - name: Prüfe Split- und Ladevarianten
        run: |
          python -m unittest discover -s tests -p test_dashboard_loading.py -v
          python -m unittest discover -s tests -p test_split_frontend_patches.py -v
          node --test tests/test_lazy_dashboard_modules.cjs
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PERF_SNAPSHOT_ROOT: ${{ github.workspace }}/snapshot
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /era5_stratosphere.js
            /js/
            /scripts/optimize_dashboard_loading.py
            /scripts/dashboard_export_libraries.js
            /scripts/performance_snapshot_proxy.py
            /tests/test_europe_hub_overview.py
            /tests/audit_europe_hub.py
            /tests/audit_dashboard_split.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: lighthouse-comparison-mobile
          run-id: '44709139707'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen
      - name: Prepare control, source layout and optimized split
        run: |
          mkdir -p snapshot reports
          cp -r frozen/snapshot/baseline snapshot/baseline
          cp -r snapshot/baseline snapshot/control
          python tests/audit_europe_hub.py --prepare snapshot/control
          python scripts/optimize_dashboard_loading.py snapshot/control --stage lazy
          cp -r snapshot/baseline snapshot/source
          python tests/audit_dashboard_split.py --prepare snapshot/source
          cp -r snapshot/source snapshot/lazy
          python scripts/optimize_dashboard_loading.py snapshot/lazy --stage lazy
          find snapshot/lazy -name '*.js' -exec node --check {} \;
          printf 'control\n' > snapshot/stage.txt
          python -m pip install 'mitmproxy==11.1.3' 'playwright==1.57.0'
      - name: Compare real browser behavior with shared live-data snapshot
        run: |
          mitmdump --listen-host 127.0.0.1 --listen-port 8089 --set connection_strategy=lazy -s scripts/performance_snapshot_proxy.py > reports/proxy.log 2>&1 &
          proxy=$!
          trap 'kill "$proxy" || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS --proxy http://127.0.0.1:8089 --insecure 'https://marcelherber.github.io/climate-dashboard/index.html' -o /dev/null; then break; fi
            sleep 1
          done
          python tests/audit_dashboard_split.py --root snapshot --output reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-dashboard-split-audit
          path: reports/
          retention-days: 90
