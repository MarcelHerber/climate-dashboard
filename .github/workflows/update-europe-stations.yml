name: Update Europe station records

on:
  workflow_dispatch:
    inputs:
      force_baseline:
        description: "GHCN + DWD + Météo-France + AEMET historische Baselines trotz Cache neu aufbauen"
        required: false
        default: false
        type: boolean
      force_dwd_baseline:
        description: "Nur DWD-Deutschland-Baseline neu aufbauen"
        required: false
        default: false
        type: boolean
      force_mf_baseline:
        description: "Nur Météo-France-Frankreich-Baseline neu aufbauen"
        required: false
        default: false
        type: boolean
      force_aemet_baseline:
        description: "Nur AEMET-Spanien-Baseline neu aufbauen"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "25 5 * * *"

permissions:
  contents: write

concurrency:
  group: update-europe-stations
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache-Schlüssel bestimmen
        id: dates
        shell: bash
        run: |
          YEAR=$(date -u +%Y)
          BASE_YEAR=$((YEAR - 1))
          YEAR_MONTH=$(date -u +%Y-%m)
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "base_year=$BASE_YEAR" >> "$GITHUB_OUTPUT"
          echo "year_month=$YEAR_MONTH" >> "$GITHUB_OUTPUT"

      - name: Stations-Cache laden
        id: station-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: europe-stations-v5r1-${{ steps.dates.outputs.base_year }}-${{ steps.dates.outputs.year_month }}-${{ github.run_id }}
          restore-keys: |
            meteofrance-stations-v3-${{ steps.dates.outputs.base_year }}-
            meteofrance-stations-v2-${{ steps.dates.outputs.base_year }}-
            dwd-stations-v1-${{ steps.dates.outputs.base_year }}-
            europe-stations-v5r1-${{ steps.dates.outputs.base_year }}-${{ steps.dates.outputs.year_month }}-
            europe-stations-v5r1-${{ steps.dates.outputs.base_year }}-
            europe-stations-v5-${{ steps.dates.outputs.base_year }}-${{ steps.dates.outputs.year_month }}
            europe-stations-v5-${{ steps.dates.outputs.base_year }}-
            europe-stations-v4-${{ steps.dates.outputs.base_year }}-${{ steps.dates.outputs.year_month }}
            europe-stations-v4-${{ steps.dates.outputs.base_year }}-
            europe-stations-v3-${{ steps.dates.outputs.base_year }}-
            ghcn-europe-baseline-v2-${{ steps.dates.outputs.base_year }}-

      - name: Versionscheck, AEMET-Secret prüfen und alte Ausgabe entfernen
        shell: bash
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: |
          if [[ -z "$AEMET_API_KEY" ]]; then
            echo "AEMET_API_KEY fehlt. Bitte als Repository-Secret unter Settings → Secrets and variables → Actions anlegen."
            exit 1
          fi
          python - <<'PY'
          import ast
          from pathlib import Path

          script = Path("scripts/update_europe_station_records.py")
          tree = ast.parse(script.read_text(encoding="utf-8"), filename=str(script))
          actual = None
          for node in tree.body:
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  for target in targets:
                      if isinstance(target, ast.Name) and target.id == "PAYLOAD_VERSION":
                          try:
                              actual = ast.literal_eval(node.value)
                          except Exception:
                              actual = None
                          break
              if actual is not None:
                  break

          expected = 5
          if actual != expected:
              raise SystemExit(
                  f"Versionsfehler: Workflow erwartet Stations-Payload V{expected}, "
                  f"Skript liefert V{actual}. Bitte alle Dateien aus index.zip gemeinsam hochladen."
              )
          print(f"Versionscheck OK: Stations-Payload V{actual}")
          PY
          rm -rf europe_stations

      - name: Europa-Stationsrekorde berechnen
        shell: bash
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          FORCE_BASELINE: ${{ github.event.inputs.force_baseline || 'false' }}
          FORCE_DWD_BASELINE: ${{ github.event.inputs.force_dwd_baseline || 'false' }}
          FORCE_MF_BASELINE: ${{ github.event.inputs.force_mf_baseline || 'false' }}
          FORCE_AEMET_BASELINE: ${{ github.event.inputs.force_aemet_baseline || 'false' }}
        run: |
          EXTRA_ARGS=""
          if [[ "$FORCE_BASELINE" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-baseline"
          fi
          if [[ "$FORCE_DWD_BASELINE" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-dwd-baseline"
          fi
          if [[ "$FORCE_MF_BASELINE" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-mf-baseline"
          fi
          if [[ "$FORCE_AEMET_BASELINE" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-aemet-baseline"
          fi
          python scripts/update_europe_station_records.py \
            --year "${{ steps.dates.outputs.year }}" \
            --output europe_stations \
            --cache-dir .cache/europe-stations \
            --dwd-workers 6 \
            --mf-workers 6 \
            $EXTRA_ARGS

      - name: Stations-Cache sichern (auch nach Datenfehlern)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/europe-stations
          key: europe-stations-v5r1-${{ steps.dates.outputs.base_year }}-${{ steps.dates.outputs.year_month }}-${{ github.run_id }}

      - name: Ergebnis prüfen
        shell: bash
        run: |
          test -s europe_stations/index.json
          test -s europe_stations/calendar/01-01.json.gz
          test -s europe_stations/calendar/12-31.json.gz
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('europe_stations/index.json').read_text(encoding='utf-8'))
          version=p.get('payload_version')
          sources={x.get('name'):x.get('stations',0) for x in p.get('sources',[])}
          print('Erzeugte Payload-Version:', version)
          print('Stationsquellen:', sources)
          print('Gesamtstationen:', p.get('station_count',0), 'Länder:', p.get('country_count',0))
          if version != 5:
              raise SystemExit(f"Falsche Payload-Version: erwartet V5, erzeugt wurde V{version}.")
          if p.get('station_count',0) <= 0:
              raise SystemExit('Keine Stationen in index.json erzeugt.')
          for source in ('DWD CDC','Météo-France','AEMET OpenData','GHCN-Daily'):
              if sources.get(source,0) <= 0:
                  raise SystemExit(f"Keine Stationen für Quelle {source} erzeugt. Quellen: {sources}")
          checks = {
              'Deutschland':'DWD CDC',
              'Frankreich':'Météo-France',
              'Spanien':'AEMET OpenData',
          }
          for country, source in checks.items():
              rows=[s for s in p.get('stations',[]) if s.get('country')==country]
              if not rows:
                  raise SystemExit(f'Keine Stationen für {country} in index.json.')
              if not all(s.get('source')==source for s in rows):
                  raise SystemExit(f'Mindestens eine Station in {country} stammt nicht aus {source}.')
          if any(s.get('source')=='GHCN-Daily' and s.get('country') in checks for s in p.get('stations',[])):
              raise SystemExit('GHCN-Doppelstationen für Deutschland, Frankreich oder Spanien gefunden.')
          print('Stations-V5 OK:', p['station_count'], 'Stationen in', p['country_count'], 'Ländern', sources)
          PY

      - name: Daten committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add europe_stations
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Europa-Stationsdaten."
            exit 0
          fi
          git commit -m "Update Europe station records V5"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
