name: Update Europe station records

on:
  workflow_dispatch:
    inputs:
      force_baseline:
        description: "ALLE historischen Baselines neu aufbauen (normal: false)"
        required: false
        default: false
        type: boolean
      force_dwd_baseline:
        description: "Nur DWD Deutschland neu aufbauen"
        required: false
        default: false
        type: boolean
      force_mf_baseline:
        description: "Nur Météo-France Frankreich neu aufbauen"
        required: false
        default: false
        type: boolean
      force_aemet_baseline:
        description: "Nur AEMET Spanien neu aufbauen"
        required: false
        default: false
        type: boolean
      force_austria_baseline:
        description: "Nur GeoSphere Österreich neu aufbauen"
        required: false
        default: false
        type: boolean
      force_poland_baseline:
        description: "Nur IMGW Polen neu aufbauen"
        required: false
        default: false
        type: boolean
      force_knmi_baseline:
        description: "Nur KNMI Niederlande neu aufbauen"
        required: false
        default: false
        type: boolean
      force_frost_baseline:
        description: "Nur MET Norway Frost neu aufbauen"
        required: false
        default: false
        type: boolean
      force_dmi_baseline:
        description: "Nur DMI Dänemark neu aufbauen"
        required: false
        default: false
        type: boolean
      force_smhi_baseline:
        description: "Nur SMHI Schweden neu aufbauen"
        required: false
        default: false
        type: boolean
      force_belgium_baseline:
        description: "Nur KMI/RMI Belgien neu aufbauen"
        required: false
        default: false
        type: boolean
      force_swiss_baseline:
        description: "Nur MeteoSwiss Schweiz neu aufbauen"
        required: false
        default: false
        type: boolean
  schedule:
    # Täglich 05:25 UTC = 07:25 MESZ / 06:25 MEZ.
    - cron: "25 5 * * *"

permissions:
  contents: write

concurrency:
  group: update-europe-stations
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache-Schlüssel bestimmen
        id: dates
        shell: bash
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          BASE_YEAR=$((YEAR - 1))
          YEAR_MONTH=$(date -u +%Y-%m)
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "base_year=$BASE_YEAR" >> "$GITHUB_OUTPUT"
          echo "year_month=$YEAR_MONTH" >> "$GITHUB_OUTPUT"

      - name: Europa-Hauptcache laden
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: europe-stations-v8-${{ steps.dates.outputs.base_year }}-${{ steps.dates.outputs.year_month }}-${{ github.run_id }}
          restore-keys: |
            europe-stations-v8-${{ steps.dates.outputs.base_year }}-${{ steps.dates.outputs.year_month }}-
            europe-stations-v8-${{ steps.dates.outputs.base_year }}-
            europe-stations-v7-${{ steps.dates.outputs.base_year }}-${{ steps.dates.outputs.year_month }}-
            europe-stations-v7-${{ steps.dates.outputs.base_year }}-
            europe-stations-v6-${{ steps.dates.outputs.base_year }}-${{ steps.dates.outputs.year_month }}-
            europe-stations-v6-${{ steps.dates.outputs.base_year }}-
            europe-stations-v5r1-${{ steps.dates.outputs.base_year }}-
            ghcn-europe-baseline-v2-${{ steps.dates.outputs.base_year }}-

      - name: Météo-France-Cache ergänzen
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: europe-merge-mf-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}
          restore-keys: |
            meteofrance-repair-v4-${{ steps.dates.outputs.base_year }}-
            meteofrance-stations-v4-${{ steps.dates.outputs.base_year }}-
            meteofrance-stations-v3-${{ steps.dates.outputs.base_year }}-
            meteofrance-stations-v2-${{ steps.dates.outputs.base_year }}-

      - name: GeoSphere-Österreich-Cache ergänzen
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: europe-merge-at-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}
          restore-keys: |
            geosphere-austria-v1-${{ steps.dates.outputs.base_year }}-

      - name: IMGW-Polen-Cache ergänzen
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: europe-merge-pl-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}
          restore-keys: |
            imgw-poland-v1-${{ steps.dates.outputs.base_year }}-

      - name: AEMET-Spanien-Cache ergänzen
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: europe-merge-es-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}
          restore-keys: |
            aemet-spain-v1-${{ steps.dates.outputs.base_year }}-

      - name: KNMI-Niederlande-Cache ergänzen
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: europe-merge-nl-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}
          restore-keys: |
            knmi-netherlands-v1-${{ steps.dates.outputs.base_year }}-

      - name: Frost-Norwegen-Cache ergänzen
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: europe-merge-no-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}
          restore-keys: |
            frost-norway-v1-${{ steps.dates.outputs.base_year }}-

      - name: DMI-Dänemark-Cache ergänzen
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: europe-merge-dk-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}
          restore-keys: |
            dmi-denmark-v1-${{ steps.dates.outputs.base_year }}-

      - name: SMHI-Schweden-Cache ergänzen
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: europe-merge-se-${{ steps.dates.outputs.year }}-${{ github.run_id }}
          restore-keys: |
            smhi-sweden-current-v1-${{ steps.dates.outputs.year }}-
            smhi-sweden-v1-${{ steps.dates.outputs.base_year }}-

      - name: KMI-RMI-Belgien-Cache ergänzen
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: europe-merge-be-${{ steps.dates.outputs.year }}-${{ github.run_id }}
          restore-keys: |
            rmi-belgium-current-v1-${{ steps.dates.outputs.year }}-
            rmi-belgium-v1-${{ steps.dates.outputs.base_year }}-

      - name: MeteoSwiss-Schweiz-Cache ergänzen
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: europe-merge-ch-${{ steps.dates.outputs.year }}-${{ github.run_id }}
          restore-keys: |
            meteoswiss-switzerland-current-v2-${{ steps.dates.outputs.year }}-
            meteoswiss-switzerland-v2-${{ steps.dates.outputs.base_year }}-

      - name: Cache-Bestand anzeigen
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Historische Gesamtcaches ==="
          find .cache/europe-stations -maxdepth 1 -type f \
            \( -name '*baseline*.pkl.gz' -o -name '*status*.json' \) \
            -printf '%f\n' 2>/dev/null | sort || true
          echo "=== Météo-France-Einzelcaches ==="
          find .cache/europe-stations -maxdepth 2 -type f \
            -path '*meteofrance_resources*/*.pkl.gz' 2>/dev/null | wc -l

      - name: Skripte, Secrets und Selbsttests prüfen
        shell: bash
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          FROST_CLIENT_ID: ${{ secrets.FROST_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$AEMET_API_KEY" ]]; then
            echo "AEMET_API_KEY fehlt."
            exit 1
          fi
          if [[ -z "$FROST_CLIENT_ID" ]]; then
            echo "FROST_CLIENT_ID fehlt."
            exit 1
          fi

          for FILE in \
            scripts/update_europe_station_records.py \
            scripts/update_europe_station_records_all_sources.py \
            scripts/update_geosphere_austria_station_cache.py \
            scripts/update_imgw_poland_station_cache.py \
            scripts/update_aemet_spain_station_cache.py \
            scripts/update_aemet_spain_current.py \
            scripts/update_knmi_netherlands_station_cache.py \
            scripts/update_knmi_netherlands_current.py \
            scripts/update_frost_norway_station_cache.py \
            scripts/update_frost_norway_current.py \
            scripts/update_dmi_denmark_station_cache.py \
            scripts/update_dmi_denmark_current.py \
            scripts/update_smhi_sweden_station_cache.py \
            scripts/update_smhi_sweden_current.py \
            scripts/update_rmi_belgium_station_cache.py \
            scripts/update_rmi_belgium_current.py \
            scripts/update_meteoswiss_switzerland_station_cache.py \
            scripts/update_meteoswiss_switzerland_current.py
          do
            test -s "$FILE"
          done

          python scripts/update_europe_station_records.py --self-test
          python scripts/update_geosphere_austria_station_cache.py --self-test
          python scripts/update_imgw_poland_station_cache.py --self-test
          python scripts/update_aemet_spain_station_cache.py --self-test
          python scripts/update_aemet_spain_current.py --self-test
          python scripts/update_knmi_netherlands_station_cache.py --self-test
          python scripts/update_knmi_netherlands_current.py --self-test
          python scripts/update_frost_norway_station_cache.py --self-test
          python scripts/update_frost_norway_current.py --self-test
          python scripts/update_dmi_denmark_station_cache.py --self-test
          python scripts/update_dmi_denmark_current.py --self-test
          python scripts/update_smhi_sweden_station_cache.py --self-test
          python scripts/update_smhi_sweden_current.py --self-test
          python scripts/update_rmi_belgium_station_cache.py --self-test
          python scripts/update_rmi_belgium_current.py --self-test
          python scripts/update_meteoswiss_switzerland_station_cache.py --self-test
          python scripts/update_meteoswiss_switzerland_current.py --self-test
          python scripts/update_europe_station_records_all_sources.py --self-test

      - name: Alle Europa-Stationsquellen aktualisieren
        shell: bash
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          FROST_CLIENT_ID: ${{ secrets.FROST_CLIENT_ID }}
          FORCE_BASELINE: ${{ github.event.inputs.force_baseline || 'false' }}
          FORCE_DWD_BASELINE: ${{ github.event.inputs.force_dwd_baseline || 'false' }}
          FORCE_MF_BASELINE: ${{ github.event.inputs.force_mf_baseline || 'false' }}
          FORCE_AEMET_BASELINE: ${{ github.event.inputs.force_aemet_baseline || 'false' }}
          FORCE_AUSTRIA_BASELINE: ${{ github.event.inputs.force_austria_baseline || 'false' }}
          FORCE_POLAND_BASELINE: ${{ github.event.inputs.force_poland_baseline || 'false' }}
          FORCE_KNMI_BASELINE: ${{ github.event.inputs.force_knmi_baseline || 'false' }}
          FORCE_FROST_BASELINE: ${{ github.event.inputs.force_frost_baseline || 'false' }}
          FORCE_DMI_BASELINE: ${{ github.event.inputs.force_dmi_baseline || 'false' }}
          FORCE_SMHI_BASELINE: ${{ github.event.inputs.force_smhi_baseline || 'false' }}
          FORCE_BELGIUM_BASELINE: ${{ github.event.inputs.force_belgium_baseline || 'false' }}
          FORCE_SWISS_BASELINE: ${{ github.event.inputs.force_swiss_baseline || 'false' }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          [[ "$FORCE_BASELINE" == "true" ]] && EXTRA_ARGS="$EXTRA_ARGS --force-baseline"
          [[ "$FORCE_DWD_BASELINE" == "true" ]] && EXTRA_ARGS="$EXTRA_ARGS --force-dwd-baseline"
          [[ "$FORCE_MF_BASELINE" == "true" ]] && EXTRA_ARGS="$EXTRA_ARGS --force-mf-baseline"
          [[ "$FORCE_AEMET_BASELINE" == "true" ]] && EXTRA_ARGS="$EXTRA_ARGS --force-aemet-baseline"
          [[ "$FORCE_AUSTRIA_BASELINE" == "true" ]] && EXTRA_ARGS="$EXTRA_ARGS --force-austria-baseline"
          [[ "$FORCE_POLAND_BASELINE" == "true" ]] && EXTRA_ARGS="$EXTRA_ARGS --force-poland-baseline"
          [[ "$FORCE_KNMI_BASELINE" == "true" ]] && EXTRA_ARGS="$EXTRA_ARGS --force-knmi-baseline"
          [[ "$FORCE_FROST_BASELINE" == "true" ]] && EXTRA_ARGS="$EXTRA_ARGS --force-frost-baseline"
          [[ "$FORCE_DMI_BASELINE" == "true" ]] && EXTRA_ARGS="$EXTRA_ARGS --force-dmi-baseline"
          [[ "$FORCE_SMHI_BASELINE" == "true" ]] && EXTRA_ARGS="$EXTRA_ARGS --force-smhi-baseline"
          [[ "$FORCE_BELGIUM_BASELINE" == "true" ]] && EXTRA_ARGS="$EXTRA_ARGS --force-belgium-baseline"
          [[ "$FORCE_SWISS_BASELINE" == "true" ]] && EXTRA_ARGS="$EXTRA_ARGS --force-swiss-baseline"

          python scripts/update_europe_station_records_all_sources.py \
            --year "${{ steps.dates.outputs.year }}" \
            --output europe_stations \
            --cache-dir .cache/europe-stations \
            --dwd-workers 6 \
            --mf-workers 6 \
            --poland-workers 8 \
            $EXTRA_ARGS

      - name: Stations-Cache sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/europe-stations
          key: europe-stations-v8-${{ steps.dates.outputs.base_year }}-${{ steps.dates.outputs.year_month }}-${{ github.run_id }}

      - name: Ergebnis vollständig prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s europe_stations/index.json
          test -s europe_stations/calendar/01-01.json.gz
          test -s europe_stations/calendar/12-31.json.gz

          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("europe_stations/index.json").read_text(encoding="utf-8"))
          rows=p.get("stations",[])
          sources={x.get("name"):x.get("stations",0) for x in p.get("sources",[])}

          print("Payload-Version:", p.get("payload_version"))
          print("Gesamtstationen:", p.get("station_count"), "Länder:", p.get("country_count"))
          print("Aktive Stationen:", p.get("active_station_count"))
          print("Quellen:", sources)

          expected={
              "Deutschland":"DWD CDC",
              "Frankreich":"Météo-France",
              "Spanien":"AEMET OpenData",
              "Österreich":"GeoSphere Austria",
              "Polen":"IMGW-PIB",
              "Niederlande":"KNMI",
              "Norwegen":"MET Norway Frost",
              "Dänemark":"DMI Open Data",
              "Schweden":"SMHI Open Data",
              "Belgien":"KMI/RMI Open Data",
              "Schweiz":"MeteoSwiss Open Data",
          }

          if p.get("payload_version") != 5:
              raise SystemExit(f"Falsche Payload-Version: {p.get('payload_version')}")

          for country, source in expected.items():
              country_rows=[x for x in rows if x.get("country")==country]
              if not country_rows:
                  raise SystemExit(f"{country} fehlt.")
              actual={x.get("source") for x in country_rows}
              if actual != {source}:
                  raise SystemExit(f"{country}: falsche/gemischte Quellen {actual}; erwartet {source}.")

          for source in (
              "DWD CDC","Météo-France","AEMET OpenData","GeoSphere Austria",
              "IMGW-PIB","KNMI","MET Norway Frost","DMI Open Data",
              "SMHI Open Data","KMI/RMI Open Data","MeteoSwiss Open Data","GHCN-Daily"
          ):
              if int(sources.get(source,0) or 0) <= 0:
                  raise SystemExit(f"Quelle {source} fehlt oder hat 0 Stationen.")

          if int(p.get("country_count",0) or 0) < 10:
              raise SystemExit("Zu wenige Länder in der Europa-Ausgabe.")
          if int(p.get("active_station_count",0) or 0) <= 0:
              raise SystemExit("Keine aktiven Stationen markiert.")
          if any("active" not in x or "last_observation" not in x for x in rows):
              raise SystemExit("active/last_observation fehlt bei mindestens einer Station.")

          forbidden={"GM","FR","SP","ES","AU","PL","NL","NO","DA","SW","BE","SZ"}
          wrong=[x for x in rows if x.get("source")=="GHCN-Daily" and x.get("country_code") in forbidden]
          if wrong:
              raise SystemExit(f"GHCN enthält national ersetzte Länder: {sorted({x.get('country_code') for x in wrong})}")

          print("Europa-Gesamtprüfung OK.")
          PY

      - name: Europa-Stationsdaten committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add europe_stations

          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Europa-Stationsdaten."
            exit 0
          fi

          git commit -m "Update Europe station records all national sources [skip ci]"

          PUSH_OK=false
          for ATTEMPT in 1 2 3; do
            echo "Push-Versuch ${ATTEMPT}/3 ..."
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              PUSH_OK=true
              break
            fi
            sleep $((ATTEMPT * 5))
          done
          [[ "$PUSH_OK" == "true" ]]
