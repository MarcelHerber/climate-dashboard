name: Update DWD snow-height current season

on:
  workflow_dispatch:
  schedule:
    - cron: "45 10 * * *"

permissions:
  contents: write

concurrency:
  group: dwd-snow-height-current
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Historischen Schneehöhen-Cache optional laden
        uses: actions/cache/restore@v5
        with:
          path: .cache/dwd-snow-height
          key: dwd-snow-height-history-through-2025-v1

      - name: Updater-Selbsttest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_dwd_snow_height_current.py --self-test

      - name: Aktuelles hydrologisches Jahr aktualisieren
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_dwd_snow_height_current.py

      - name: Aktuelle Schneehöhendaten versionieren
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            station_snow_height_current_index.json \
            station_snow_height_current

          if git diff --cached --quiet; then
            echo "Keine Änderungen an der aktuellen Schneehöhensaison."
            exit 0
          fi

          git commit -m "DWD Schneehöhen aktuell [skip ci]"

          for ATTEMPT in 1 2 3; do
            echo "Push-Versuch ${ATTEMPT}/3 ..."
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 3))
          done

          echo "FEHLER: Push nach drei Versuchen nicht möglich."
          exit 1
