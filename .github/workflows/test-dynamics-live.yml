name: ECMWF Dynamik-Studio · Live Fehlerdiagnose

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "alpenwetter-worker/src/dynamics-lab.js"
      - "tests/test_dynamics_live.mjs"
      - ".github/workflows/test-dynamics-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ALPENWETTER_PASSWORD: ${{ secrets.ALPENWETTER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Chromium installieren
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Mit echtem Passwort Cloudflare-Worker und ECMWF-Daten prüfen
        run: node tests/test_dynamics_live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamics-authenticated-live-screenshots
          path: /tmp/dynamics-live-*.png
          if-no-files-found: ignore
