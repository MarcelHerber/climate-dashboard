name: ICON-D2 Regen und Schnee (privates Wolkenlabor)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["ICON-D2 Wolkenfilm Deutschland (privates Labor)"]
    types: [completed]
  schedule:
    - cron: "15 3,9,15,21 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_icon_d2_precip_film.py"
      - ".github/workflows/update-icon-d2-precip-film.yml"

permissions:
  contents: write

concurrency:
  group: icon-d2-precip-film-data
  cancel-in-progress: false

jobs:
  rain-snow:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Meteorologische Werkzeuge installieren
        run: pip install "numpy>=2,<3" "scipy>=1.13,<2" "pillow>=11,<13" "eccodes>=2,<3"
      - name: Python syntax prüfen
        run: python -m py_compile scripts/build_icon_d2_precip_film.py
      - name: Niederschlagskodierung prüfen
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import numpy as np
          from build_icon_d2_precip_film import encode_hourly, WIDTH, HEIGHT
          source=np.zeros(WIDTH*HEIGHT, dtype=np.float32)
          source[0]=np.nan
          source[1]=0.01
          source[2]=0.2
          source[3]=30.0
          output=encode_hourly(source).ravel()
          assert output[0]==255 and output[1]==0
          assert 1 <= output[2] < output[3] == 254
          print("PASS: Fehlwerte, Trockenheit und Intensität sicher kodiert")
          PY
      - name: Vorhandenen Deutschland-Datenbranch holen
        id: checkout_data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git clone --quiet --single-branch --depth 1 --branch icon-d2-cloud-film-data "$url" /tmp/icon-d2-precip
      - name: Reale stündliche ICON-D2 Regen- und Schneefelder rechnen
        id: generate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/build_icon_d2_precip_film.py --out /tmp/icon-d2-precip/data/icon-d2-cloud-film --max-workers 4 2>&1 | tee /tmp/precip-build.log
      - name: Modellzeitpunkt und 72 Datenbilder validieren
        id: validate
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          root=Path("/tmp/icon-d2-precip/data/icon-d2-cloud-film")
          clouds=json.loads((root/"current.json").read_text())
          rain=json.loads((root/"precip.json").read_text())
          assert rain["model"]=="DWD ICON-D2"
          assert rain["cycle"]==clouds["cycle"]
          assert len(rain["frames"])==37
          assert not rain["frames"][0]["layers"]
          assert [f["hour"] for f in rain["frames"]]==list(range(37))
          assert rain["unit"]=="mm water-equivalent per 1 hour"
          for frame in rain["frames"][1:]:
              assert set(frame["layers"])=={"rain","snow"}
              for file in frame["layers"].values():
                  path=root/file
                  assert path.is_file()
                  with Image.open(path) as image:
                      image.verify()
                  with Image.open(path) as image:
                      assert image.mode=="L"
                      assert image.size==(rain["grid"]["width"],rain["grid"]["height"])
          print("72 echte stündliche Niederschlagsbilder verifiziert:",rain["cycle"])
          PY
      - name: Nur vollständige Niederschlagsdaten veröffentlichen
        id: publish
        if: steps.generate.outcome == 'success' && steps.validate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/icon-d2-precip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/icon-d2-cloud-film/precip.json data/icon-d2-cloud-film/precip/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ICON-D2: stündlicher Regen und Schnee für Wolkenlabor"
          git pull --rebase origin icon-d2-cloud-film-data
          git push origin HEAD:refs/heads/icon-d2-cloud-film-data

      - name: Niederschlagslauf mit Diagnose auf Datenbranch protokollieren
        if: always() && steps.checkout_data.outcome == 'success'
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path("/tmp/icon-d2-precip/data/icon-d2-cloud-film")
          root.mkdir(parents=True,exist_ok=True)
          log=Path("/tmp/precip-build.log")
          last_lines=log.read_text(errors="replace").splitlines()[-12:] if log.exists() else []
          cycle=""
          if (root/"current.json").exists():
              cycle=json.loads((root/"current.json").read_text()).get("cycle","")
          output={
              "run_id":os.environ.get("GITHUB_RUN_ID"),
              "run_url":"https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
              "checked_utc":datetime.now(timezone.utc).isoformat(),
              "cloud_cycle":cycle,
              "generate":os.environ.get("GENERATE_OUTCOME","unknown"),
              "validate":os.environ.get("VALIDATE_OUTCOME","unknown"),
              "publish":os.environ.get("PUBLISH_OUTCOME","unknown"),
              "build_log_tail":last_lines,
          }
          (root/"precip-status.json").write_text(json.dumps(output,ensure_ascii=False,indent=2)+"\n")
          print("Diagnosestatus:", output["cloud_cycle"],output["generate"],output["validate"],output["publish"])
          PY
          cd /tmp/icon-d2-precip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/icon-d2-cloud-film/precip-status.json
          if ! git diff --cached --quiet; then
            git commit -m "ICON-D2 Regen/Schnee: Laufdiagnose ohne Datenänderung"
            git pull --rebase origin icon-d2-cloud-film-data
            git push origin HEAD:refs/heads/icon-d2-cloud-film-data
          fi
      - name: Prüfergebnis als GitHub-Actions-Status übernehmen
        if: always()
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          test "$GENERATE_OUTCOME" = success
          test "$VALIDATE_OUTCOME" = success
          test "$PUBLISH_OUTCOME" = success
