name: DWD Radarlabor · Live Desktop und Handy

on:
  workflow_run:
    workflows:
      - "DWD Radarkomposit · automatische 5-Minuten-Bilder"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPENWETTER_PASSWORD: ${{ secrets.ALPENWETTER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Playwright Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Cloudflare-Passwort, echte DWD-Radarbilder und responsive Animation testen
        run: node tests/test_radar_live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dwd-radar-live-screenshots
          path: /tmp/radarlabor-live-*.png
          if-no-files-found: ignore
