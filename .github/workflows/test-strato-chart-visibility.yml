name: Stratosphäre · Kurven und Diagrammgröße testen

on:
  push:
    branches: [main, strato-chart-visibility-20261104, strato-labeled-exports-20261104, strato-member-export-summary-20261107, strato-three-improvements-20261108, strato-analysis-metrics-vertical-20261108]
    paths:
      - "stratosphere_chart_visibility.js"
      - "stratosphere_chart_export.js"
      - "stratosphere_joint_comparison.js"
      - "stratosphere_nasa_common.js"
      - "stratosphere_analysis_forecast.js"
      - "stratosphere_analysis_forecast.css"
      - "stratosphere_comparison_metrics.js"
      - "stratosphere_vertical_profile.js"
      - "tests/test_strato_extended_analytics.cjs"
      - "tests/test_strato_extended_browser.py"
      - "stratosphere_joint_comparison.css"
      - "stratosphere_ecmwf_ens.js"
      - "tests/test_stratosphere_joint_comparison.cjs"
      - "tests/test_strato_joint_browser.py"
      - "stratosphere_chart_visibility.css"
      - "stratosphaere.html"
      - "scripts/build_pages_site.sh"
      - "tests/test_stratosphere_chart_visibility.cjs"
      - "tests/test_strato_visibility_browser.py"
      - ".github/workflows/test-strato-chart-visibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strato-visibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: JS-Parsing und echte Linien-/Flächen-Interaktionen
        run: |
          node --check stratosphere_chart_visibility.js
          node --check stratosphere_chart_export.js
          node --check stratosphere_joint_comparison.js
          node --check stratosphere_nasa_common.js
          node --check stratosphere_analysis_forecast.js
          node --check stratosphere_comparison_metrics.js
          node --check stratosphere_vertical_profile.js
          node --test tests/test_strato_extended_analytics.cjs
          node --test tests/test_stratosphere_joint_comparison.cjs
          node --test tests/test_stratosphere_chart_visibility.cjs
      - name: Veröffentlichungsreferenzen prüfen
        run: |
          grep -Fq 'stratosphere_chart_visibility.js' stratosphaere.html
          grep -Fq 'stratosphere_chart_export.js' stratosphaere.html
          grep -Fq 'stratosphere_joint_comparison.js' stratosphaere.html
          grep -Fq 'stratosphere_nasa_common.js' stratosphaere.html
          grep -Fq 'stratosphere_analysis_forecast.js' stratosphaere.html
          grep -Fq 'stratosphere_comparison_metrics.js' stratosphaere.html
          grep -Fq 'stratosphere_vertical_profile.js' stratosphaere.html
          grep -Fq 'stratosphere_analysis_forecast.css' scripts/build_pages_site.sh
          grep -Fq 'stratosphere_joint_comparison.js' scripts/build_pages_site.sh
          grep -Fq 'stratosphere_chart_export.js' scripts/build_pages_site.sh
          grep -Fq 'stratosphere_chart_visibility.css' stratosphaere.html
          grep -Fq 'stratosphere_chart_visibility.js' scripts/build_pages_site.sh
          grep -Fq 'stratosphere_chart_visibility.css' scripts/build_pages_site.sh
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Chromium und Playwright installieren
        run: |
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Desktop, 390 px und 360 px mit echten Klicks testen
        run: |
          python -u tests/test_strato_visibility_browser.py
          python -u tests/test_strato_joint_browser.py
          python -u tests/test_strato_extended_browser.py
      - name: Screenshots bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stratosphere-chart-visibility-screenshots
          path: |
            strato-control-browser/*.png
            strato-joint-browser/*.png
            strato-extended-browser/*.png
          if-no-files-found: warn
          retention-days: 14
