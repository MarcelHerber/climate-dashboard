name: Satellite IFS grid centers · Python and official data QA
on:
  pull_request:
    paths:
      - "scripts/satellite_mslp_grid_centers.py"
      - "scripts/build_satellite_ecmwf_isobars.py"
      - "scripts/build_satellite_mslp_10min.py"
      - "tests/test_satellite_mslp_grid_centers.py"
      - "tests/test_satellite_mslp_10min.py"
      - "tests/test_satellite_ecmwf_isobars.py"
      - ".github/workflows/satellite-grid-centers-qa.yml"
  push:
    branches: [main]
    paths:
      - "scripts/satellite_mslp_grid_centers.py"
      - "scripts/build_satellite_ecmwf_isobars.py"
      - "scripts/build_satellite_mslp_10min.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grid-geometry-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pressure-field and contour libraries
        run: python -m pip install "numpy>=2,<3" "contourpy>=1.3,<2"
      - name: Python tests for true extrema, source time and 2/5 hPa parity
        run: |
          python -m unittest discover -s tests -p "test_satellite_mslp_grid_centers.py" -v
          python -m unittest discover -s tests -p "test_satellite_ecmwf_isobars.py" -v
          python -m unittest discover -s tests -p "test_satellite_mslp_10min.py" -v
  actual-ifs-grib:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Decode genuine operational ECMWF IFS 0.25 degree MSLP
        run: python -m pip install "numpy>=2,<3" "contourpy>=1.3,<2" "eccodes>=2.38,<3" "ecmwf-opendata>=0.3.21,<1"
      - name: Verify real grid extrema and same 2/5 hPa H/T without publishing
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime as dt
          import json
          import tempfile
          from pathlib import Path
          from build_satellite_ecmwf_isobars import candidate_runs,fetch_grib,decode_grib
          from build_satellite_mslp_10min import frame_from_grids
          from satellite_mslp_grid_centers import ALGORITHM,detect_pressure_centers
          valid=None
          problems=[]
          for run in candidate_runs(dt.datetime.now(dt.timezone.utc)):
              try:
                  with tempfile.TemporaryDirectory() as t:
                      source=fetch_grib(run,Path(t)/"real-ecmwf-ifs.grib2")
                      grids=decode_grib(source,run)
                  first=frame_from_grids(grids,run,0)
                  mid=frame_from_grids(grids,run,10)
                  assert first["pressure_centers_method"]==ALGORITHM
                  assert mid["pressure_centers_method"]==ALGORITHM
                  assert mid["interpolated"] is True and first["interpolated"] is False
                  # 2/5 isobar separations are deliberately generated from one
                  # unchanged MSLP field; neither changes H/T center coordinates.
                  assert first["fine_contours"] and first["contours"]
                  assert all(g["hpa"]%5==0 for g in first["contours"])
                  assert all(g["hpa"]%2==0 for g in first["fine_contours"])
                  assert first["pressure_centers"]
                  assert mid["pressure_centers"]
                  x,y,z=grids[0]
                  actual=detect_pressure_centers(x,y,z)
                  assert first["pressure_centers"]==actual
                  for c in actual:
                      j=int(round((c["lat"]-y[0])/.25))
                      i=int(round((c["lon"]-x[0])/.25))
                      assert abs(float(z[j,i])-c["pressure_hpa"]) <= .051
                  valid={"run_utc":run.isoformat(),"real_grid_dims":list(z.shape),
                         "grid_centers":len(actual),"first_three":actual[:3],
                         "10min_interpolated_centers":len(mid["pressure_centers"]),
                         "5_hpa_levels":len(first["contours"]),"2_hpa_levels":len(first["fine_contours"])}
                  break
              except Exception as e:
                  problems.append(f"{run}: {type(e).__name__} {str(e)[:170]}")
          if valid is None:
              raise SystemExit("No verified real IFS data: "+" | ".join(problems))
          print(json.dumps(valid,ensure_ascii=False,indent=2))
          PY
