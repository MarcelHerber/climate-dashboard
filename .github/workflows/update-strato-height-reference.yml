name: Stratosphäre Höhenanomalien · ERA5 Referenz
on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: Maximal number of monthly reference requests
        default: "50"
        type: string
  schedule:
    - cron: "15 0,6,12,18 * * *"
  push:
    branches: [main]
    paths:
      - scripts/strato_height_data.py
      - .github/workflows/update-strato-height-reference.yml
permissions:
  contents: write
concurrency:
  group: strato-height-reference
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATA_BRANCH: strato-height-reference-data
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "cdsapi>=0.7.7" numpy xarray netCDF4 h5netcdf
      - name: Restore reference data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if git ls-remote --exit-code origin "refs/heads/$DATA_BRANCH" >/dev/null; then
            git clone --quiet --single-branch --depth 1 --branch "$DATA_BRANCH" "$remote" "$RUNNER_TEMP/height-data"
          else
            git init -q -b "$DATA_BRANCH" "$RUNNER_TEMP/height-data"
            git -C "$RUNNER_TEMP/height-data" remote add origin "$remote"
          fi
      - name: Retrieve rolling analysis and build 1991–2020 reference
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          MAX_REQUESTS: ${{ inputs.max_requests || '50' }}
        run: |
          set -euo pipefail
          test -n "$CDSAPI_KEY"
          [[ "$MAX_REQUESTS" =~ ^[0-9]+$ ]]
          root="$RUNNER_TEMP/height-data"
          git -C "$root" config user.name "github-actions[bot]"
          git -C "$root" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() {
            touch "$root/.nojekyll"
            git -C "$root" add -A
            if ! git -C "$root" diff --cached --quiet; then
              git -C "$root" commit -m "Update ERA5 sector heights and reference"
              git -C "$root" push origin "HEAD:refs/heads/$DATA_BRANCH"
            fi
          }
          failed=0
          timeout 65m python scripts/strato_height_data.py --root "$root" --analysis || failed=1
          publish
          start=$SECONDS
          pending=$(python scripts/strato_height_data.py --root "$root" --list-reference)
          publish
          count=0
          if [[ -n "$pending" ]]; then
            while IFS= read -r month; do
              if (( count >= MAX_REQUESTS || SECONDS-start >= 13500 )); then break; fi
              if timeout 40m python scripts/strato_height_data.py --root "$root" --reference "$month"; then
                publish
              else
                failed=1
                break
              fi
              count=$((count+1))
            done <<< "$pending"
          fi
          exit "$failed"
