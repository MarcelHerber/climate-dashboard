name: DWD Dekadenrekorde Datenbasis

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dwd-decade-records
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: DWD-Dekadenrekorde bauen
        run: |
          set -euo pipefail
          python scripts/build_dwd_decade_records.py \
            --output data/dwd_decade_records.json \
            --max-workers 10

      - name: Datenbasis prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/dwd_decade_records.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          assert data["version"] == 1
          assert len(data["areas"]) == 17
          assert data["areas"][0] == "Deutschland"
          assert len(data["periods"]) == 36
          assert set(data["metrics"]) == {"txk_high", "tnk_low"}
          assert data["data_through"]
          assert data["leaders"]["txk_high"]["Deutschland"]
          assert data["leaders"]["tnk_low"]["Deutschland"]
          assert data["station_records"]["txk_high"]["Deutschland"]
          assert data["station_records"]["tnk_low"]["Deutschland"]

          sample = data["leaders"]["txk_high"]["Deutschland"]["month-08-d2"]
          print("DWD-Dekadenprüfung OK")
          print("Datenstand:", data["data_through"])
          print("Gebiete:", len(data["areas"]))
          print("Dekaden:", len(data["periods"]))
          print("Station-Metadatensegmente:", len(data["stations"]))
          print("Beispiel August 2. Dekade Tmax, Einträge:", len(sample))
          if sample:
              print("Spitzenwert:", sample[0])
          PY

      - name: Datenbasis veröffentlichen
        run: |
          set -euo pipefail
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dwd_decade_records.json
          if git diff --cached --quiet; then
            echo "Dekadenrekorde sind unverändert."
            exit 0
          fi

          git commit -m "DWD-Dekadenrekorde aktualisiert [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
