name: DWD Dekadenrekorde Datenbasis

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dwd-decade-records
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: DWD-Dekadenrekorde bauen
        run: |
          set -euo pipefail
          python scripts/build_dwd_decade_records.py \
            --output data/dwd_decade_records.json \
            --max-workers 10

      - name: Datenbasis prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/dwd_decade_records.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          expected_metrics = {"txk_high", "txk_low", "tnk_high", "tnk_low"}

          assert data["version"] == 2
          assert len(data["areas"]) == 17
          assert data["areas"][0] == "Deutschland"
          assert len(data["periods"]) == 36
          assert set(data["metrics"]) == expected_metrics
          assert data["data_through"]

          for metric in expected_metrics:
              assert data["leaders"][metric]["Deutschland"]
              assert data["station_records"][metric]["Deutschland"]

          print("DWD-Dekadenprüfung OK")
          print("Version:", data["version"])
          print("Datenstand:", data["data_through"])
          print("Gebiete:", len(data["areas"]))
          print("Dekaden:", len(data["periods"]))
          print("Parameter:", ", ".join(sorted(data["metrics"])))
          print("Station-Metadatensegmente:", len(data["stations"]))

          for metric in sorted(expected_metrics):
              sample = data["leaders"][metric]["Deutschland"]["month-08-d2"]
              print(metric, "August 2. Dekade:", len(sample), "Einträge")
              if sample:
                  print("  Spitzenwert:", sample[0])
          PY

      - name: Datenbasis veröffentlichen
        id: publish
        run: |
          set -euo pipefail
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dwd_decade_records.json
          if git diff --cached --quiet; then
            echo "Dekadenrekorde sind unverändert."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "DWD-Dekadenrekorde aktualisiert [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Schnellen Pages-Neubau starten
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run deploy-pages-only.yml --ref main
          echo "Pages-only-Workflow wurde gestartet."
