name: Import audited local browser libraries

on:
  push:
    branches: [perf/local-vendor-20261123]
    paths:
      - '.github/workflows/import-pinned-vendor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/import_vendor.py
            /vendor/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and SHA-256 verify 13 pinned assets
        run: python tools/import_vendor.py
      - name: Commit binary dependencies to performance branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- vendor
          if git diff --cached --quiet; then
            echo "All pinned files already committed."
          else
            git commit -m "perf: vendor 13 verified local browser dependencies"
            git push origin HEAD:perf/local-vendor-20261123
          fi
