name: Grosswetterlagen catalogue
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/grosswetterlagen.yml'
      - 'scripts/update_grosswetterlagen.py'
      - 'scripts/update_grosswetterlagen_historical.py'
      - 'tests/test_grosswetterlagen_historical.py'
      - 'tests/test_grosswetterlagen_browser.py'
      - 'grosswetterlagen.html'
      - 'grosswetterlagen.js'
  schedule:
    - cron: '15 7 * * 1'
permissions:
  contents: write
concurrency:
  group: grosswetterlagen-catalogue
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /grosswetterlagen.html
            /grosswetterlagen.js
            /scripts/update_grosswetterlagen*.py
            /tests/test_grosswetterlagen*
            /data/grosswetterlagen/
            /vendor/chart.js/4.4.1/dist/chart.umd.min.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test tests/test_grosswetterlagen.cjs
      - run: python scripts/update_grosswetterlagen.py
      - run: pip install PyMuPDF==1.26.7
      - run: python -m unittest discover -s tests -p test_grosswetterlagen_historical.py
      - name: Extract historical catalogue from original PIK report
        run: |
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          python scripts/update_grosswetterlagen_historical.py
      - name: Desktop and mobile browser checks with original data
        run: |
          pip install playwright
          python tests/test_grosswetterlagen_browser.py
      - name: Publish validated catalogues
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/grosswetterlagen/rea.csv data/grosswetterlagen/hb.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update validated DWD and Hess-Brezowsky catalogues"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              git fetch origin main
              git rebase origin/main
            done
          fi
