name: Grosswetterlagen catalogue
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/grosswetterlagen.yml'
      - 'scripts/update_grosswetterlagen.py'
      - 'scripts/update_grosswetterlagen_historical.py'
      - 'tests/test_grosswetterlagen_historical.py'
      - 'grosswetterlagen.js'
  schedule:
    - cron: '15 7 * * 1'
permissions:
  contents: write
concurrency:
  group: grosswetterlagen-catalogue
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test tests/test_grosswetterlagen.cjs
      - run: python scripts/update_grosswetterlagen.py
      - run: python -m unittest discover -s tests -p test_grosswetterlagen_historical.py
      - name: Extract historical catalogue from original PIK report
        run: |
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          python scripts/update_grosswetterlagen_historical.py
      - name: Publish validated catalogues
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/grosswetterlagen/rea.csv data/grosswetterlagen/hb.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update DWD GWL-REA catalogue"
            git push
          fi
