name: GFS Sieben-Tage-Europakarte · zehn Regionen prüfen
on:
  push:
    branches: [feature/gfs-europe-regions-ecmwf-probe-20261114]
    paths:
      - ".github/workflows/validate-gfs-weekly-regions.yml"
      - "gfs_weekly_europe.js"
      - "gfs_weekly_europe.html"
      - "tests/test_gfs_weekly_regions_browser.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-data-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            gfs_weekly_europe.html
            gfs_weekly_europe.js
            gfs_weekly_europe.css
            gfs_analysis_europe/weekly_f003.json
            cpc_europe
            cpc_europe.css
            mobile_navigation.js
            mobile_navigation.css
            dashboard_theme.js
            dashboard_theme.css
            tests/test_gfs_weekly_regions_browser.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Check original GFS data, all ten regions, mobile, cartography and real export buttons
        run: |
          node --check gfs_weekly_europe.js
          python tests/test_gfs_weekly_regions_browser.py
      - name: Preserve actual region screenshots, PNG and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfs-regions-browser-${{ github.run_id }}
          path: gfs_regions_browser_qa/
          retention-days: 12
          if-no-files-found: ignore
  full-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build full dashboard from actual repository without deploying or modifying main
        run: |
          bash -n scripts/build_pages_site.sh
          bash scripts/build_pages_site.sh
      - name: Confirm region selector and real CFS reference in built site
        run: |
          node --check _site/gfs_weekly_europe.js
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("_site")
          x=json.loads((root/"gfs_analysis_europe/weekly_f003.json").read_text())
          assert x["sample_count"]==28
          assert x["reference_metadata"]["source_months"]==360
          html=(root/"gfs_weekly_europe.html").read_text()
          js=(root/"gfs_weekly_europe.js").read_text()
          assert 'id="weekRegion"' in html
          assert "REGIONS=Object.freeze" in js
          assert 'href="gfs_weekly_europe.html"' in (root/"index.html").read_text()
          print("PASS: entire Pages build with genuine regional GFS +3..165h forecast",flush=True)
          PY
