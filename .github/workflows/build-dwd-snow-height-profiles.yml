name: Build DWD snow-height profiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_dwd_snow_height_profiles.py"
      - ".github/workflows/build-dwd-snow-height-profiles.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Historischen Schneehöhen-Cache laden
        uses: actions/cache/restore@v5
        with:
          path: .cache/dwd-snow-height
          key: dwd-snow-height-history-through-2025-v1
          fail-on-cache-miss: true

      - name: Profil-Selbsttest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_dwd_snow_height_profiles.py --self-test

      - name: Historische Schneehöhen-Profile erzeugen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_dwd_snow_height_profiles.py
          test -s station_snow_height_years/05792.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('station_snow_height_years/05792.json').read_text())
          assert doc['version']==1 and doc['station_id']=='05792'
          assert len(doc['month_days'])==366 and len(doc['years'])>=30
          assert all(len(row['values'])==366 for row in doc['years'])
          print('Historische Jahreskurven für die Zugspitze geprüft.')
          PY

      - name: Profile versionieren
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            station_snow_height_index.json \
            station_snow_height_profiles \
            station_snow_height_years

          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Schneehöhen-Profilen."
            exit 0
          fi

          git commit -m "DWD Schneehöhen-Profile aufgebaut [skip ci]"

          for ATTEMPT in 1 2 3; do
            echo "Push-Versuch ${ATTEMPT}/3 ..."
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 3))
          done

          echo "FEHLER: Push nach drei Versuchen nicht möglich."
          exit 1
