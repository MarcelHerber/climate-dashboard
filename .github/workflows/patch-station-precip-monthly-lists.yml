name: Patch station precipitation monthly lists

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-station-precip-monthly-lists.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add monthly station precipitation lists
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f"{label}: expected 1 anchor, found {n}")
              return text.replace(old, new, 1)

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")

          css = r'''
          /* Stationsniederschlag · Monatslisten */
          .station-precip-monthly-table tr.current-year .year-cell{background:#fff0bf;color:#251900}
          .station-precip-monthly-table tr.current-year td{border-top:2px solid #222;border-bottom:2px solid #222}
          .station-precip-monthly-table td.no-value{background:#f1f3f5;color:#999}
          .station-precip-monthly-table .annual-cell{border-left:3px solid rgba(25,25,25,.58)!important;font-weight:700}
          '''
          if "/* Stationsniederschlag · Monatslisten */" not in text:
              text = once(text, "</style>", css + "\n</style>", "style")

          html = r'''
              <div class="chart-container auto">
                <div class="anomaly-table-heading">
                  <div>
                    <h2 id="stationPrecipMonthlyTitle">Monatsniederschlag · komplette Monatslisten</h2>
                    <p id="stationPrecipMonthlySubtitle">Monatssummen der ausgewählten Station in mm.</p>
                  </div>
                </div>
                <div class="anomaly-table-wrap">
                  <table id="stationPrecipMonthlyTable" class="anomaly-table station-precip-monthly-table">
                    <thead><tr>
                      <th class="year-cell">Jahr</th>
                      <th>Jan</th><th>Feb</th><th>Mär</th><th>Apr</th><th>Mai</th><th>Jun</th>
                      <th>Jul</th><th>Aug</th><th>Sep</th><th>Okt</th><th>Nov</th><th>Dez</th>
                      <th class="annual-cell">Jahressumme</th>
                    </tr></thead>
                    <tbody id="stationPrecipMonthlyBody"></tbody>
                  </table>
                </div>
                <p id="stationPrecipMonthlyNote" class="note">Nur vollständig vorliegende Monate werden summiert. „–“ bedeutet unvollständig oder noch nicht abgeschlossen.</p>
              </div>
          '''
          if 'id="stationPrecipMonthlyTable"' not in text:
              anchor = '    <p id="stationPrecipSourceNote" class="note"></p>'
              text = once(text, anchor, html.rstrip() + "\n" + anchor, "station precip html")

          js = r'''
          function stationPrecipMonthlyFormat(value){
            return Number.isFinite(Number(value)) ? Number(value).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1}) : "–";
          }
          function stationPrecipCurrentMonthlyRow(stationId){
            if(!stationPrecipIndex) return null;
            const currentYear=Number(stationPrecipIndex.current_year), dataThrough=String(stationPrecipIndex.data_through||"");
            if(!Number.isFinite(currentYear)) return null;
            const byMonth=new Map();
            for(const payload of stationPrecipMonthCache.values()) if(Number(payload?.year)===currentYear) byMonth.set(Number(payload.month),payload);
            const months=Array(12).fill(null);
            for(let month=1;month<=12;month++){
              const values=byMonth.get(month)?.stations?.[stationId];
              if(!Array.isArray(values)) continue;
              const days=new Date(currentYear,month,0).getDate();
              const end=`${currentYear}-${String(month).padStart(2,"0")}-${String(days).padStart(2,"0")}`;
              if(!dataThrough || dataThrough<end || values.length<days) continue;
              const part=values.slice(0,days);
              if(!part.every(v=>v!==null&&v!==undefined&&Number.isFinite(Number(v)))) continue;
              months[month-1]=Math.round(part.reduce((s,v)=>s+Number(v),0)*10)/10;
            }
            if(!months.some(Number.isFinite)) return null;
            const annual=months.every(Number.isFinite)?Math.round(months.reduce((s,v)=>s+Number(v),0)*10)/10:null;
            return {year:currentYear,months,annual,current:true};
          }
          function updateStationPrecipMonthlyTable(stationId){
            const body=document.getElementById("stationPrecipMonthlyBody");
            if(!body) return;
            const station=stationPrecipIndex?.stations?.find(item=>item.id===stationId);
            const historical=Array.isArray(stationPrecipProfile?.monthly_history)?stationPrecipProfile.monthly_history.map(row=>({year:Number(row.year),months:Array.isArray(row.months)?row.months.slice(0,12):Array(12).fill(null),annual:row.annual,current:false})):[];
            const current=stationPrecipCurrentMonthlyRow(stationId), currentYear=Number(stationPrecipIndex?.current_year);
            const rows=historical.filter(r=>Number.isFinite(r.year)&&r.year!==currentYear).sort((a,b)=>b.year-a.year);
            if(current) rows.unshift(current);
            const title=document.getElementById("stationPrecipMonthlyTitle"), subtitle=document.getElementById("stationPrecipMonthlySubtitle"), note=document.getElementById("stationPrecipMonthlyNote");
            if(title) title.textContent=`Monatsniederschlag · ${station?.name||stationId}`;
            if(subtitle){
              const years=historical.map(r=>Number(r.year)).filter(Number.isFinite);
              subtitle.textContent=`Monatssummen in mm · ${years.length?Math.min(...years)+"–":""}${currentYear||""} · neuestes Jahr oben`;
            }
            if(!rows.length){
              body.innerHTML='<tr><td colspan="14" class="no-value">Noch keine Monatslisten im Stationsprofil vorhanden.</td></tr>';
              if(note) note.textContent="Die historischen Monatslisten werden beim nächsten vollständigen Neuaufbau der Niederschlagsprofile erzeugt.";
              return;
            }
            body.innerHTML=rows.map(row=>{
              const cells=Array.from({length:12},(_,i)=>{const v=row.months?.[i],ok=Number.isFinite(Number(v));return `<td class="${ok?"":"no-value"}">${ok?stationPrecipMonthlyFormat(v):"–"}</td>`;}).join("");
              const ok=Number.isFinite(Number(row.annual));
              return `<tr class="${row.current?"current-year":""}"><td class="year-cell">${row.year}</td>${cells}<td class="annual-cell ${ok?"":"no-value"}">${ok?stationPrecipMonthlyFormat(row.annual):"–"}</td></tr>`;
            }).join("");
            if(note) note.textContent="Nur vollständige Kalendermonate werden summiert; der 29. Februar zählt in Schaltjahren mit. Der laufende Monat bleibt bis zu seinem Abschluss „–“. Die Jahressumme erscheint nur bei zwölf vollständigen Monaten.";
          }
          '''
          if "function updateStationPrecipMonthlyTable(stationId)" not in text:
              text = once(text, "async function updateStationPrecipitation(){", js.rstrip()+"\nasync function updateStationPrecipitation(){", "station precip js")
          call = "    updateStationPrecipMonthlyTable(stationId);"
          if call not in text:
              anchor = "    stationPrecipProfile=await profileResponse.json();"
              text = once(text, anchor, anchor+"\n"+call, "station precip call")
          index.write_text(text, encoding="utf-8", newline="\n")

          script = Path("scripts/update_station_precip.py")
          text = script.read_text(encoding="utf-8")
          if "import calendar" not in text:
              text = once(text, "import argparse\n", "import argparse\nimport calendar\n", "calendar import")
          block = r'''
          def observations_to_monthly_history(observations, current_year: int) -> list[dict[str, Any]]:
              """Monatssummen je Jahr; nur vollständig vorliegende Kalendermonate erhalten einen Wert."""
              values_by_month: dict[tuple[int, int], dict[int, float]] = defaultdict(dict)
              for observation in observations:
                  day = observation.day
                  if day.year >= current_year:
                      continue
                  value = observation.values.get("rsk_high")
                  if value is not None:
                      values_by_month[(day.year, day.month)][day.day] = float(value)
              history: list[dict[str, Any]] = []
              for year in sorted({year for year, _ in values_by_month}):
                  months: list[float | None] = []
                  for month in range(1, 13):
                      vals = values_by_month.get((year, month), {})
                      days = calendar.monthrange(year, month)[1]
                      complete = len(vals) == days and all(d in vals for d in range(1, days + 1))
                      months.append(round(sum(vals[d] for d in range(1, days + 1)), 1) if complete else None)
                  if any(v is not None for v in months):
                      annual = round(sum(float(v) for v in months), 1) if all(v is not None for v in months) else None
                      history.append({"year": year, "months": months, "annual": annual})
              return history


          '''
          if "def observations_to_monthly_history(" not in text:
              text = once(text, "def build_profile_payload(\n", block+"def build_profile_payload(\n", "monthly history function")
          assignment = "    monthly_history = observations_to_monthly_history(observations, current_year)\n"
          if assignment not in text:
              anchor = "    curves = observations_to_complete_curves(observations, current_year)\n"
              text = once(text, anchor, anchor+assignment, "monthly history assignment")
          if '"monthly_history": monthly_history,' not in text:
              anchor = '        "reference_year_list": reference_years,\n'
              text = once(text, anchor, anchor+'        "monthly_history": monthly_history,\n', "monthly history payload")
          if "STATE_VERSION = 3" in text:
              text = text.replace("STATE_VERSION = 3", "STATE_VERSION = 4", 1)
          elif "STATE_VERSION = 4" not in text:
              raise RuntimeError("Unexpected STATE_VERSION")
          script.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Validate changes
        run: |
          python -m py_compile scripts/update_station_precip.py
          git diff --check
          grep -q 'id="stationPrecipMonthlyTable"' index.html
          grep -q '"monthly_history": monthly_history' scripts/update_station_precip.py
          grep -q 'STATE_VERSION = 4' scripts/update_station_precip.py

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-station-precip-monthly-lists.yml
          git add index.html scripts/update_station_precip.py
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Add monthly station precipitation lists"
          git push origin HEAD:main
