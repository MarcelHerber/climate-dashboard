name: Dekadenrekorde 4 Parameter Frontend

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dwd-decade-frontend
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Dekadenseite erweitern
        run: |
          set -euo pipefail
          python scripts/patch_dwd_decade_frontend_v2.py --file dekadenrekorde.html

      - name: Frontend prüfen
        run: |
          set -euo pipefail
          grep -q 'value="txk_high"' dekadenrekorde.html
          grep -q 'value="txk_low"' dekadenrekorde.html
          grep -q 'value="tnk_high"' dekadenrekorde.html
          grep -q 'value="tnk_low"' dekadenrekorde.html
          grep -q 'metric.endsWith("_high")' dekadenrekorde.html
          echo "Vier Temperaturparameter im Frontend vorhanden."

      - name: Änderung veröffentlichen
        run: |
          set -euo pipefail

          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dekadenrekorde.html

          if git diff --cached --quiet; then
            echo "Frontend bereits aktuell."
            exit 0
          fi

          git commit -m "Dekadenrekorde um Tmax-min und Tmin-max erweitern [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "Frontend nach main veröffentlicht."
          echo "Der schnelle Pages-Workflow startet durch den Push automatisch."
