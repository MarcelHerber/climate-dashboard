name: T850 Browser Smoke Test
# live ensemble parameter validation v7

on:
  push:
    branches: ["fix/t850-api-smoke"]
    paths:
      - ".github/workflows/t850-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Browser dependencies
        run: python -m pip install --quiet selenium
      - name: Open live dashboard and test ensemble parameters
        shell: bash
        run: |
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          opt=Options()
          opt.add_argument("--headless=new")
          opt.add_argument("--no-sandbox")
          opt.add_argument("--disable-dev-shm-usage")
          opt.add_argument("--window-size=1600,1200")
          opt.set_capability("goog:loggingPrefs", {"browser":"ALL"})
          d=webdriver.Chrome(options=opt)

          def wait_until(fn, timeout=35, label="condition"):
              end=time.time()+timeout
              last=None
              while time.time()<end:
                  try:
                      v=fn()
                      if v:return v
                  except Exception as e:last=e
                  time.sleep(.5)
              raise RuntimeError(f"Timeout {label}: {last}")

          def chart(canvas_id):
              return d.execute_script("""
                const cv=document.getElementById(arguments[0]);
                const ch=cv && window.Chart && Chart.getChart ? Chart.getChart(cv) : null;
                if(!ch)return null;
                return {
                  yTitle: ch.options.scales.y.title.text,
                  datasets: ch.data.datasets.map(ds=>({
                    label:ds.label,
                    n:Array.isArray(ds.data)?ds.data.length:0,
                    valid:Array.isArray(ds.data)?ds.data.filter(v=>v!==null && v!==undefined && Number.isFinite(Number(v))).length:0
                  }))
                };
              """,canvas_id)

          try:
              d.get("https://marcelherber.github.io/climate-dashboard/?ensemble-live-v7=1")
              wait_until(lambda:d.execute_script("return typeof switchTab==='function'"),label="dashboard")
              d.execute_script("switchTab('t850-ensembles')")
              wait_until(lambda:d.find_element(By.ID,"t850ParamSelect"),label="parameter selector")

              inp=d.find_element(By.ID,"t850LocationInput")
              inp.clear();inp.send_keys("Frankfurt")
              d.find_element(By.ID,"t850LoadButton").click()

              expected={
                "t850":"T850 [°C]",
                "t2m":"Temperatur 2 m [°C]",
                "precip6":"Niederschlag 6 h [mm]",
                "precipCum":"Niederschlag kumuliert [mm]",
              }
              for param,title in expected.items():
                  sel=d.find_element(By.ID,"t850ParamSelect")
                  d.execute_script("arguments[0].value=arguments[1];arguments[0].dispatchEvent(new Event('change',{bubbles:true}));",sel,param)
                  g=wait_until(lambda:(lambda x:x if x and x.get("yTitle")==title and max((q["valid"] for q in x["datasets"]),default=0)>0 else None)(chart("t850ChartGefs")),label=f"GEFS {param}")
                  print("PASS GEFS",param,title,"datasets",len(g["datasets"]))
                  if param!="t850":
                      i=wait_until(lambda:(lambda x:x if x and x.get("yTitle")==title and max((q["valid"] for q in x["datasets"]),default=0)>0 else None)(chart("t850ChartIcon")),label=f"ICON {param}")
                      print("PASS ICON",param,title,"datasets",len(i["datasets"]))
                      if any("EPS-T850" in q["label"] or "Fallback" in q["label"] for q in i["datasets"]):
                          raise RuntimeError("ICON surface parameter unexpectedly using T850 fallback")
              logs=d.get_log("browser")
              severe=[x for x in logs if x["level"]=="SEVERE" and "favicon.ico" not in x["message"]]
              print("SEVERE",json.dumps(severe,ensure_ascii=False))
              if severe:raise RuntimeError(str(severe))
          finally:
              d.quit()
          PY
