name: Ensemble Parameter Browser Smoke

on:
  push:
    branches: ["feat/ensemble-t2m-precip"]
    paths:
      - "t850_ensembles.js"
      - "t850_ensembles.css"
      - "index.html"
      - ".github/workflows/ensemble-parameter-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Run local dashboard smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8000 >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          opt=Options()
          opt.add_argument("--headless=new")
          opt.add_argument("--no-sandbox")
          opt.add_argument("--disable-dev-shm-usage")
          opt.add_argument("--window-size=1600,1200")
          opt.set_capability("goog:loggingPrefs", {"browser":"ALL"})
          d=webdriver.Chrome(options=opt)

          def wait_until(fn, timeout=25, label="condition"):
              end=time.time()+timeout
              last=None
              while time.time()<end:
                  try:
                      val=fn()
                      if val:return val
                  except Exception as e:
                      last=e
                  time.sleep(.5)
              raise RuntimeError(f"Timeout waiting for {label}: {last}")

          def chart_info(canvas_id):
              return d.execute_script("""
                const cv=document.getElementById(arguments[0]);
                const ch=cv && window.Chart && Chart.getChart ? Chart.getChart(cv) : null;
                if(!ch)return null;
                return {
                  labels: ch.data.labels.length,
                  yTitle: ch.options.scales.y.title.text,
                  datasets: ch.data.datasets.map(ds=>({
                    label:ds.label,
                    finite:Array.isArray(ds.data)?ds.data.filter(v=>Number.isFinite(Number(v))).length:0
                  }))
                };
              """,canvas_id)

          try:
              d.get("http://127.0.0.1:8000/")
              wait_until(lambda:d.execute_script("return typeof switchTab==='function'"),label="dashboard JS")
              d.execute_script("switchTab('t850-ensembles')")
              wait_until(lambda:d.find_element(By.ID,"t850Status").text,label="ensemble mount")

              inp=d.find_element(By.ID,"t850LocationInput")
              inp.send_keys("Frankfurt")
              d.find_element(By.ID,"t850LoadButton").click()

              for param in ["t850","t2m","precip6","precipCum"]:
                  sel=d.find_element(By.ID,"t850ParamSelect")
                  d.execute_script("""
                    arguments[0].value=arguments[1];
                    arguments[0].dispatchEvent(new Event('change',{bubbles:true}));
                  """,sel,param)

                  expected_title={
                    "t850":"T850 [°C]",
                    "t2m":"Temperatur 2 m [°C]",
                    "precip6":"Niederschlag 6 h [mm]",
                    "precipCum":"Niederschlag kumuliert [mm]",
                  }[param]
                  info=wait_until(
                    lambda: chart_info("t850ChartGefs") if (
                      chart_info("t850ChartGefs") and
                      chart_info("t850ChartGefs").get("yTitle")==expected_title and
                      max((x["finite"] for x in chart_info("t850ChartGefs")["datasets"]),default=0)>0
                    ) else None,
                    timeout=35,label=f"GEFS {param} {expected_title}"
                  )
                  print("PARAM",param,"GEFS",json.dumps(info,ensure_ascii=False)[:1000])

                  if param!="t850":
                      icon=wait_until(
                        lambda: chart_info("t850ChartIcon") if (
                          chart_info("t850ChartIcon") and
                          chart_info("t850ChartIcon").get("yTitle")==expected_title and
                          max((x["finite"] for x in chart_info("t850ChartIcon")["datasets"]),default=0)>0
                        ) else None,
                        timeout=35,label=f"ICON {param} {expected_title}"
                      )
                      print("PARAM",param,"ICON",json.dumps(icon,ensure_ascii=False)[:1000])
                      labels=[x["label"] for x in icon["datasets"]]
                      if any("Fallback" in x or "EPS-T850" in x for x in labels):
                          raise RuntimeError(f"Unexpected ICON fallback for {param}: {labels}")

                  status=d.find_element(By.ID,"t850Status").text
                  print("STATUS",param,status)

              logs=d.get_log("browser")
              severe=[x for x in logs if x["level"]=="SEVERE" and "favicon.ico" not in x["message"]]
              print("SEVERE",json.dumps(severe,ensure_ascii=False))
              if severe:
                  raise RuntimeError("Browser errors: "+json.dumps(severe,ensure_ascii=False))
          finally:
              d.quit()
          PY
