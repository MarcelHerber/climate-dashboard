name: Performance Step 5 - lokale Vendor-Bibliotheken im Browser pruefen

on:
  push:
    branches: [perf/local-vendor-step5-20261123]
    paths:
      - 'vendor/**'
      - 'index.html'
      - 'europe_station_basemap.js'
      - 'mosmix.js'
      - 'tools/version_assets.py'
      - 'scripts/build_pages_site.sh'
      - 'tests/test_asset_versioning.py'
      - 'tests/audit_local_vendor_browser.py'
      - '.github/workflows/performance-local-vendor-browser.yml'

permissions:
  contents: read

jobs:
  vendor-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Neue Asset- und CSS-Bildtests
        run: python -m unittest discover -s tests -p test_asset_versioning.py -v
      - name: Produktions-Artefakt ohne Live-Deployment bauen
        shell: bash
        run: |
          set -euo pipefail
          if ! bash scripts/build_pages_site.sh > pages-build.log 2>&1; then
            tail -n 120 pages-build.log
            exit 1
          fi
          tail -n 35 pages-build.log
      - name: Chromium installieren
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Lokale Bibliotheken, Kartensymbole und Exporte pruefen
        run: python -u tests/audit_local_vendor_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-vendor-step5-browser
          path: |
            reports/vendor-browser/
            pages-build.log
          retention-days: 60
