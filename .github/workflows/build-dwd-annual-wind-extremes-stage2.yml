name: DWD jährliche Extremwerte Wind Stufe 2

on:
  workflow_run:
    workflows:
      - "DWD jährliche Extremwerte Stufe 1"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dwd-annual-wind-extremes-stage2
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: python -m pip install requests

      - name: Jährliche Windextreme bauen
        run: |
          set -euo pipefail
          python scripts/build_dwd_annual_wind_extremes.py \
            --output data/dwd_annual_wind_extremes.json \
            --max-workers 10

      - name: Wind-Datenbasis prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/dwd_annual_wind_extremes.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          assert d["version"] == 1
          assert len(d["areas"]) == 17
          assert set(d["metrics"]) == {
              "fgx_ge_400",
              "fgx_lt_400",
          }
          assert d["list_min_year"] == 1881
          assert len(d["area_start_years"]) == 17
          assert d["stats"]["valid_gust_observations_ge_75_kmh"] > 100_000

          bw = d["records"]["Baden-Württemberg"]
          for year in ("2003", "2015", "2024"):
              assert bw[year]["fgx_ge_400"] is not None
              assert bw[year]["fgx_lt_400"] is not None

          print("Wind Stufe 2 · Prüfung OK")
          print("Daten:", d["data_start"], "bis", d["data_through"])

          for year in ("2003", "2015", "2024"):
              row = bw[year]
              print(
                  year,
                  {
                      key: (value[0] if value else None)
                      for key, value in row.items()
                  },
              )
          PY

      - name: Wind-Datenbasis veröffentlichen
        run: |
          set -euo pipefail

          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dwd_annual_wind_extremes.json

          if git diff --cached --quiet; then
            echo "Wind-Datenbasis unverändert."
            exit 0
          fi

          git commit -m "DWD jährliche Windextreme Stufe 2 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "Wind-Datenbasis veröffentlicht."
          echo "Zusammenführung mit der Hauptliste folgt separat."
