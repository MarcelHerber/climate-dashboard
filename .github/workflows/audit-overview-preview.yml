name: Overview preview · desktop and mobile visual QA

on:
  push:
    branches: ['qa/overview-visual-20261120']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.html
            /*.css
            /*.js
            /data.json
            /update_status.json
            /favicon.png
            /scripts/inject_mobile_navigation.py
            /tests/audit_overview_visual_preview.py
            /tests/test_overview_layout.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Run scale and markup regressions
        run: python -m unittest discover -s tests -p test_overview_layout.py -v
      - name: Actual browser checks and screenshots
        run: python -u tests/audit_overview_visual_preview.py
      - name: Preserve screenshots and console reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overview-visual-preview
          path: overview_visual_reports/
          retention-days: 7
          if-no-files-found: warn
