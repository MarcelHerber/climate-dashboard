name: Update satellite ECMWF isobars

on:
  workflow_dispatch:
  schedule:
    - cron: "50 0,7,12,19 * * *"
    - cron: "30 1,8,13,20 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_satellite_ecmwf_isobars.py"
      - "tests/test_satellite_ecmwf_isobars.py"
      - ".github/workflows/update-satellite-ecmwf-isobars.yml"

permissions:
  contents: write

concurrency:
  group: verified-satellite-ecmwf-mslp
  cancel-in-progress: false

jobs:
  vector-isobars:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Real ECMWF GRIB2 decoding and contours prerequisites
        run: python -m pip install "ecmwf-opendata>=0.3.21,<1" "numpy>=2,<3" "eccodes>=2.38,<3" "contourpy>=1.3,<2"
      - name: Verify contour vector calculations and UTC data contracts
        run: python -m unittest discover -s tests -p test_satellite_ecmwf_isobars.py -v
      - name: Download genuine ECMWF Open Data IFS sea-level pressure
        run: python scripts/build_satellite_ecmwf_isobars.py --out data/satellite_mslp/latest.json
      - name: Validate output and UTC provenance
        run: |
          python - <<'PY'
          import json,datetime as dt
          from pathlib import Path
          p=Path("data/satellite_mslp/latest.json")
          d=json.loads(p.read_text())
          assert d["schema_version"]==1 and d["model"]=="ECMWF IFS Open Data"
          assert d["interval_hpa"]==5 and d["resolution_degrees"]==0.25
          run=dt.datetime.fromisoformat(d["run_utc"].replace("Z","+00:00"))
          assert len(d["frames"])>=5
          for frame in d["frames"]:
              valid=dt.datetime.fromisoformat(frame["valid_utc"].replace("Z","+00:00"))
              assert valid==run+dt.timedelta(hours=frame["forecast_hour"])
              assert frame["contours"] and all(x["hpa"]%5==0 for x in frame["contours"])
              assert 880<=frame["min_hpa"]<=1080 and 940<=frame["max_hpa"]<=1130
          print("Confirmed real ECMWF IFS MSLP:", d["run_utc"], p.stat().st_size, "bytes")
          PY
      - name: Publish only validated ECMWF contour GeoJSON-like data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/satellite_mslp/latest.json
          if git diff --cached --quiet; then
            echo "No changes to verified MSLP contours"
            exit 0
          fi
          git commit -m "Update true ECMWF IFS MSLP vectors for satellite UTC overlay"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Explain model data and timestamps
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("data/satellite_mslp/latest.json"))
          print("## ECMWF IFS 5-hPa vectors (real GRIB2)")
          print("Run (UTC):",d["run_utc"])
          for f in d["frames"]:
              print("*",f["valid_utc"],"forecast +"+str(f["forecast_hour"])+"h",len(f["contours"]),"pressure levels")
          print("© ECMWF · CC BY 4.0 · forecast, not observation")
          PY
