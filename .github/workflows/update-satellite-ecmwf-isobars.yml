name: Update satellite ECMWF isobars

on:
  workflow_dispatch:
  schedule:
    - cron: "50 0,7,12,19 * * *"
    - cron: "30 1,8,13,20 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_satellite_ecmwf_isobars.py"
      - "scripts/satellite_mslp_grid_centers.py"
      - "tests/test_satellite_mslp_grid_centers.py"
      - "tests/test_satellite_ecmwf_isobars.py"
      - "scripts/build_satellite_mslp_10min.py"
      - "scripts/satellite_temperature_advection.py"
      - "scripts/satellite_disk_model.py"
      - "tests/test_satellite_temperature_advection.py"
      - "tests/test_satellite_disk_model.py"
      - "tests/test_satellite_mslp_10min.py"
      - ".github/workflows/update-satellite-ecmwf-isobars.yml"

permissions:
  contents: write

concurrency:
  group: verified-satellite-ecmwf-mslp
  cancel-in-progress: false

jobs:
  vector-isobars:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Real ECMWF GRIB2 decoding and contours prerequisites
        run: python -m pip install "ecmwf-opendata>=0.3.21,<1" "numpy>=2,<3" "scipy>=1.13,<2" "eccodes>=2.38,<3" "contourpy>=1.3,<2"
      - name: Verify contour vector calculations and UTC data contracts
        run: |
          python -m unittest discover -s tests -p test_satellite_ecmwf_isobars.py -v
          python -m unittest discover -s tests -p test_satellite_mslp_10min.py -v
          python -m unittest discover -s tests -p test_satellite_mslp_grid_centers.py -v
          python -m unittest discover -s tests -p test_satellite_temperature_advection.py -v
          python -m unittest discover -s tests -p test_satellite_disk_model.py -v
      - name: Download genuine ECMWF Open Data IFS sea-level pressure
        run: python scripts/build_satellite_ecmwf_isobars.py --out data/satellite_mslp/latest.json --ten-minute-dir data/satellite_mslp/ten_minute
      - name: Validate output and UTC provenance
        run: |
          python - <<'PY'
          import json,datetime as dt
          from pathlib import Path
          p=Path("data/satellite_mslp/latest.json")
          d=json.loads(p.read_text())
          assert d["schema_version"]==1 and d["model"]=="ECMWF IFS Open Data"
          assert d["interval_hpa"]==5 and d["resolution_degrees"]==0.25
          assert d["pressure_centers_algorithm"]=="ifs_mslp_grid_extrema_v4"
          run=dt.datetime.fromisoformat(d["run_utc"].replace("Z","+00:00"))
          assert len(d["frames"])>=7
          for frame in d["frames"]:
              valid=dt.datetime.fromisoformat(frame["valid_utc"].replace("Z","+00:00"))
              assert valid==run+dt.timedelta(hours=frame["forecast_hour"])
              assert frame["contours"] and all(x["hpa"]%5==0 for x in frame["contours"])
              assert 880<=frame["min_hpa"]<=1080 and 940<=frame["max_hpa"]<=1130
              assert frame["pressure_centers_method"]=="ifs_mslp_grid_extrema_v4"
              assert isinstance(frame["pressure_centers"],list) and len(frame["pressure_centers"])<=40
              for center in frame["pressure_centers"]:
                  assert center["type"] in ("H","T")
                  assert -75<=center["lon"]<=55 and 12<=center["lat"]<=80
                  assert 850<center["pressure_hpa"]<1100

          import pathlib
          base=pathlib.Path("data/satellite_mslp/ten_minute")
          index=json.loads((base/"index.json").read_text())
          assert index["schema_version"]==2
          assert index["pressure_centers_algorithm"]=="ifs_mslp_grid_extrema_v4"
          assert index["run_utc"]==d["run_utc"]
          assert index["time_resolution_minutes"]==10
          assert len(index["hours"])==19
          allframes=[]
          for hour,path in index["hours"].items():
              chunk=json.loads((base/path).read_text())
              assert chunk["run_utc"]==d["run_utc"]
              assert chunk["schema_version"]==2
              assert chunk["hour"]==int(hour[1:])
              allframes.extend(chunk["frames"])
          assert len(allframes)==109
          assert index.get("fine_interval_hpa")==2
          assert set(index.get("fine_regions",[]))=={"europe","southwest","central","germany"}
          assert len(index.get("fine_hours",{}))==19
          fineframes=[]
          for hour,path in index["fine_hours"].items():
              chunk=json.loads((base/path).read_text())
              assert chunk["schema_version"]==2 and chunk["run_utc"]==d["run_utc"]
              assert chunk["interval_hpa"]==2 and chunk["hour"]==int(hour[1:])
              assert set(chunk["regions"])==set(index["fine_regions"])
              fineframes.extend(chunk["frames"])
          assert len(fineframes)==109
          for i,frame in enumerate(fineframes):
              assert dt.datetime.fromisoformat(frame["valid_utc"].replace("Z","+00:00"))==run+dt.timedelta(minutes=i*10)
              assert frame["forecast_minute"]==i*10
              assert frame["interpolated"]==(i%18!=0)
              assert frame["contours"]
              assert all(level["hpa"]%2==0 and level["lines"] for level in frame["contours"])
          for coarse,fine in zip(allframes,fineframes):
              assert coarse["valid_utc"]==fine["valid_utc"]
              assert coarse["pressure_centers_method"]=="ifs_mslp_grid_extrema_v4"
              assert fine["pressure_centers_method"]=="ifs_mslp_grid_extrema_v4"
              assert coarse["pressure_centers"]==fine["pressure_centers"], "2/5 hPa H/T must be identical"
              assert len(coarse["pressure_centers"])<=40
              if index.get("advection_algorithm"):
                  assert coarse["advection_method"]==fine["advection_method"]=="ifs_temperature_advection_v1"
                  assert coarse["temperature_advection"]==fine["temperature_advection"]
                  assert set(coarse["temperature_advection"])=={"925","850","700"}
                  for markers in coarse["temperature_advection"].values():
                      assert len(markers)<=220
                      for m in markers:
                          assert -75<=m["lon"]<=55 and 12<=m["lat"]<=80
                          assert 2<=abs(m["advection"])<100
                          assert abs(m["u"])<=150 and abs(m["v"])<=150
          for i,frame in enumerate(allframes):
              assert dt.datetime.fromisoformat(frame["valid_utc"].replace("Z","+00:00"))==run+dt.timedelta(minutes=i*10)
              assert frame["forecast_minute"]==i*10
              assert frame["interpolated"]==(i%18!=0)
              assert frame["contours"]
              assert all(level["hpa"]%5==0 and level["lines"] for level in frame["contours"])
          assert index["disk_bbox"]==[-83.,-83.,83.,83.] and index["disk_interval_hpa"]==5
          assert set(index["disk_hours"])==set(index["hours"])
          diskframes=[]
          for hour,path in index["disk_hours"].items():
              assert path==f"r{run:%Y%m%d%H}/{hour}_disk.json"
              chunk=json.loads((base/path).read_text())
              assert chunk["schema_version"]==2 and chunk["run_utc"]==d["run_utc"]
              assert chunk["interval_hpa"]==5 and chunk["hour"]==int(hour[1:])
              diskframes.extend(chunk["frames"])
          assert len(diskframes)==109
          for coarse,disk in zip(allframes,diskframes):
              assert disk["valid_utc"]==coarse["valid_utc"]
              assert disk["forecast_minute"]==coarse["forecast_minute"]
              assert disk["interpolated"]==coarse["interpolated"]
              assert disk["contours"] and all(group["hpa"]%5==0 and group["lines"] for group in disk["contours"])
              assert any(pt[1]<-10 for group in disk["contours"] for line in group["lines"] for pt in line)
              assert disk["pressure_centers_method"]=="ifs_mslp_grid_extrema_v4"
              assert len(disk["pressure_centers"])<=40
              for c in disk["pressure_centers"]:
                  assert -83<=c["lon"]<=83 and -83<=c["lat"]<=83 and c["type"] in ("H","T")
                  assert 800<=c["pressure_hpa"]<=1120
              if index.get("disk_advection_algorithm"):
                  assert disk["advection_method"]==index["disk_advection_algorithm"]=="ifs_temperature_advection_v1"
                  assert set(disk["temperature_advection"])=={"925","850","700"}
                  for markers in disk["temperature_advection"].values():
                      assert len(markers)<=220
                      for marker in markers:
                          assert -83<=marker["lon"]<=83 and -83<=marker["lat"]<=83
                          assert 2<=abs(marker["advection"])<100
                          assert abs(marker["u"])<=150 and abs(marker["v"])<=150
          print("Confirmed 109 identical grid-derived H/T center lists for genuine 2- and 5-hPa contours")
          print("Confirmed 109 real 2-hPa European and 109 original 5-hPa forecast contours")
          print("Confirmed 109 independent full-disc 5-hPa ECMWF frames at identical valid UTC")
          print("Confirmed real ECMWF IFS MSLP:", d["run_utc"], p.stat().st_size,
                "bytes +", len(allframes), "verified 10-minute steps")
          PY
      - name: Publish only validated ECMWF contour GeoJSON-like data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/satellite_mslp/latest.json
          git add -A data/satellite_mslp/ten_minute/
          if git diff --cached --quiet; then
            echo "No changes to verified MSLP contours"
            exit 0
          fi
          git commit -m "Update true ECMWF IFS MSLP vectors for satellite UTC overlay"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Explain model data and timestamps
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("data/satellite_mslp/latest.json"))
          print("## ECMWF IFS 5-hPa vectors (real GRIB2)")
          print("Run (UTC):",d["run_utc"])
          for f in d["frames"]:
              print("*",f["valid_utc"],"forecast +"+str(f["forecast_hour"])+"h",len(f["contours"]),"pressure levels")
          print("Ten-minute pressure interpolation: +0 through +18 h, 109 frames each for regional 5 hPa, European 2 hPa and full-disc 5 hPa")
          index=json.load(open("data/satellite_mslp/ten_minute/index.json"))
          if index.get("advection_algorithm"):
              print("WLA/KLA: 925/850/700 hPa from same-run T/U/V and surface pressure, interpolated before diagnosis (K/6h)")
          else:
              print("WLA/KLA unavailable; pressure vectors remain available independently.")
          if index.get("disk_advection_algorithm"):
              print("Full-disc WLA/KLA: same-run T/U/V and surface pressure, spatially distributed significant markers.")
          else:
              print("Full-disc WLA/KLA unavailable; full-disc pressure vectors remain available independently.")
          print("© ECMWF · CC BY 4.0 · interpolated forecast, not observation")
          PY
