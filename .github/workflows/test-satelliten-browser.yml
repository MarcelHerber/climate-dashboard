name: Satellite browser desktop/mobile test
on:
  push:
    branches: [main]
    paths:
      - "satelliten.html"
      - "satelliten.js"
      - "satelliten.css"
      - "satellite_overlay.js"
      - "tests/test_satellite_overlay.cjs"
      - "data/blocking/borders_50m.json"
      - "mobile_navigation.js"
      - "mobile_navigation.css"
      - "scripts/test_satellite_ui_browser.py"
      - ".github/workflows/test-satelliten-browser.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mtg-browser-test
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install headless Chromium automation
        run: |
          python -m pip install playwright
          # Hosted Ubuntu runners already provide the usual headless browser libraries.
          # Avoid apt-get --with-deps: Ubuntu mirror DNS failures prevented the UI test.
          python -m playwright install chromium
      - name: Run real-data desktop and mobile acceptance tests
        id: test
        continue-on-error: true
        run: python scripts/test_satellite_ui_browser.py
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-browser-evidence
          path: |
            data/satellite_browser_check_latest.json
            _satellite_test_screenshots/*.png
          if-no-files-found: ignore
      - name: Save latest browser report (including failures)
        if: always()
        run: |
          if test -s data/satellite_browser_check_latest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/satellite_browser_check_latest.json
            if ! git diff --cached --quiet; then
              git commit -m "Update satellite browser test status"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Expose test failure
        if: steps.test.outcome == 'failure'
        run: exit 1
