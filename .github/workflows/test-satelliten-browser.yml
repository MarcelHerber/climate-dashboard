name: Satellite browser desktop/mobile test
on:
  pull_request:
    paths:
      - "satelliten.html"
      - "satelliten.js"
      - "satelliten.css"
      - "satellite_*.js"
      - "scripts/test_satellite_ui_browser.py"
      - ".github/workflows/test-satelliten-browser.yml"
  push:
    branches: [main]
    paths:
      - "satelliten.html"
      - "satelliten.js"
      - "satelliten.css"
      - "satellite_overlay.js"
      - "satellite_lightning.js"
      - "satellite_radar.js"
      - "satellite_view_options.js"
      - "satellite_isobars.js"
      - "satellite_isobar_geometry.js"
      - "tests/test_satellite_isobar_geometry.cjs"
      - "tests/test_satellite_isobars.cjs"
      - "satellite_film_export.js"
      - "satellite_map_export.js"
      - "tests/test_satellite_map_export.cjs"
      - "tests/test_satellite_film_export.cjs"
      - "tests/test_satellite_overlay.cjs"
      - "data/blocking/borders_50m.json"
      - "mobile_navigation.js"
      - "mobile_navigation.css"
      - "scripts/test_satellite_ui_browser.py"
      - ".github/workflows/test-satelliten-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtg-browser-test
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install headless Chromium automation
        run: |
          python -m pip install playwright
          # Hosted Ubuntu runners already provide the usual headless browser libraries.
          # Avoid apt-get --with-deps: Ubuntu mirror DNS failures prevented the UI test.
          python -m playwright install chromium
      - name: Run real-data desktop and mobile acceptance tests
        id: test
        continue-on-error: true
        run: python scripts/test_satellite_ui_browser.py
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtg-browser-evidence
          path: |
            data/satellite_browser_check_latest.json
            _satellite_test_screenshots/*.png
          if-no-files-found: ignore
      - name: Summarize browser checks without creating a Pages-triggering commit
        if: always()
        run: |
          if test -s data/satellite_browser_check_latest.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path("data/satellite_browser_check_latest.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          print("## MTG Desktop & Mobile")
          for kind in ("desktop","mobile"):
              result=d.get(kind,{})
              print(f"- {kind}: {'FEHLER: '+str(result['error']) if 'error' in result else 'Tests protokolliert'}")
              if "mocked_frame_unique_utc" in result:
                  print(f"  - Film-UTC-Zeitpunkte: {result['mocked_frame_unique_utc']}")
          print("Vollständige Browserbelege und Screenshots: Workflow-Artefakt.")
          PY
          fi
      - name: Expose test failure
        if: steps.test.outcome == 'failure'
        run: exit 1
