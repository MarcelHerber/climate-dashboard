name: MTG lightweight film regression
on:
  push:
    branches: [main]
    paths:
      - "satelliten.js"
      - "satelliten.html"
      - "satelliten.css"
      - "tests/test_satellite_film.cjs"
      - "satellite_overlay.js"
      - "satellite_isobars.js"
      - "scripts/build_satellite_isobar_preview.py"
      - "tests/test_satellite_isobar_preview.py"
      - "tests/test_satellite_isobars.cjs"
      - "satellite_film_export.js"
      - "satellite_map_export.js"
      - "tests/test_satellite_map_export.cjs"
      - "tests/test_satellite_film_export.cjs"
      - "tests/test_satellite_overlay.cjs"
      - "data/blocking/borders_50m.json"
      - "tests/test_satelliten_ui.cjs"
      - ".github/workflows/test-satellite-film.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtg-film-regression
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Check JavaScript and buffered playback controls
        id: checks
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p test_satellite_isobar_preview.py -v && node --check satelliten.js && node --check satellite_overlay.js && node --check satellite_isobars.js && node --check satellite_map_export.js && node --check satellite_film_export.js && node --test tests/test_satelliten_ui.cjs tests/test_satellite_film.cjs tests/test_satellite_film_export.cjs tests/test_satellite_map_export.cjs tests/test_satellite_isobars.cjs tests/test_satellite_overlay.cjs 2>&1 | tee /tmp/mtg-film-tests.log
      - name: Report regression result without a redundant data commit
        if: always()
        env:
          CHECK_RESULT: ${{ steps.checks.outcome }}
        run: |
          {
            echo "### MTG satellite film regression"
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo "Result: \`${CHECK_RESULT}\`"
            echo
            echo "\`\`\`text"
            tail -n 75 /tmp/mtg-film-tests.log 2>/dev/null || echo "No test log"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail for broken film playback
        if: steps.checks.outcome == 'failure'
        run: exit 1
