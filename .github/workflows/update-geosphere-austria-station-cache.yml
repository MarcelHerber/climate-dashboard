name: Update GeoSphere Austria station cache

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Historische Österreich-Baseline komplett neu aufbauen"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: geosphere-austria-stations
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Jahr bestimmen
        id: dates
        shell: bash
        run: |
          YEAR=$(date -u +%Y)
          BASE_YEAR=$((YEAR - 1))
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "base_year=$BASE_YEAR" >> "$GITHUB_OUTPUT"

      - name: GeoSphere-Austria-Cache laden
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: geosphere-austria-v1-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}
          restore-keys: |
            geosphere-austria-v1-${{ steps.dates.outputs.base_year }}-

      - name: Skript prüfen
        shell: bash
        run: |
          test -s scripts/update_europe_station_records.py
          test -s scripts/update_geosphere_austria_station_cache.py
          python scripts/update_geosphere_austria_station_cache.py --self-test
          echo "Vorhandene Österreich-Blockcaches:"
          find .cache/europe-stations -maxdepth 2 -type f -path '*geosphere_austria_blocks*/*.pkl.gz' 2>/dev/null | wc -l

      - name: Österreich-Historical aufbauen oder fortsetzen
        shell: bash
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          EXTRA_ARGS=""
          if [[ "$FORCE" == "true" ]]; then
            EXTRA_ARGS="--force"
          fi
          python scripts/update_geosphere_austria_station_cache.py \
            --year "${{ steps.dates.outputs.year }}" \
            --cache-dir .cache/europe-stations \
            $EXTRA_ARGS

      # Deliberately before the completeness check: even an incomplete first
      # pass must persist successful block shards for the next run.
      - name: Österreich-Cache sichern
        uses: actions/cache/save@v4
        with:
          path: .cache/europe-stations
          key: geosphere-austria-v1-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}

      - name: Österreich-Baseline prüfen
        shell: bash
        run: |
          python - <<'PY'
          import gzip, json, pickle
          from pathlib import Path
          import datetime as dt

          year=dt.datetime.now(dt.timezone.utc).year
          cutoff=year-1
          status=Path(f'.cache/europe-stations/geosphere_austria_status_through_{cutoff}.json')
          if not status.exists():
              raise SystemExit('GeoSphere-Austria-Statusdatei fehlt.')
          s=json.loads(status.read_text(encoding='utf-8'))
          print(json.dumps(s, ensure_ascii=False, indent=2))
          if not s.get('complete'):
              raise SystemExit('Österreich-Baseline noch unvollständig. Cache wurde gesichert; Workflow mit force=false erneut starten.')
          cache=Path(f'.cache/europe-stations/geosphere_austria_daily_baseline_through_{cutoff}_v1.pkl.gz')
          if not cache.exists():
              raise SystemExit(f'Österreich-Gesamtcache fehlt: {cache}')
          with gzip.open(cache,'rb') as h:
              p=pickle.load(h)
          states=p.get('states',{})
          stations=p.get('stations',{})
          print('Österreich Stationsreihen:', len(states))
          if not states or len(states) != len(stations):
              raise SystemExit('Österreich-Cache leer oder Stationsmetadaten unvollständig.')
          print('GeoSphere Austria Baseline-Prüfung OK.')
          PY
