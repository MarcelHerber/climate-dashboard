name: ERA5 Ranghistorie 1950-2025 veröffentlichen

on:
  push:
    paths:
      - "scripts/build_era5_temperature_rank_reference_shard.py"
      - "scripts/finalize_era5_temperature_rank_reference.py"
      - ".github/workflows/build-era5-temperature-rank-reference.yml"
  workflow_dispatch:
    inputs:
      month:
        description: "Referenzmonat 09-12"
        required: true
        type: choice
        default: "09"
        options: ["09","10","11","12"]

permissions:
  contents: write
  actions: write

concurrency:
  group: era5-temperature-rank-reference-build
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      month: ${{ steps.plan.outputs.month }}
      years: ${{ steps.plan.outputs.years }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - id: plan
        env:
          REQUESTED_MONTH: ${{ inputs.month || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          raw=(os.environ.get('REQUESTED_MONTH') or '').strip()
          month=int(raw) if raw else 9
          if month not in (9,10,11,12):
              raise SystemExit(f'Ungültiger Referenzmonat: {month}')
          years=list(range(1950,2026))
          with Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as fh:
              fh.write(f'month={month:02d}\n')
              fh.write('years='+json.dumps(years,separators=(',',':'))+'\n')
          print(f'Referenzmonat {month:02d}: 1950–2025 · {len(years)} Jahre')
          PY

  shards:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: ${{ fromJSON(needs.prepare.outputs.years) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cdsapi>=0.7.7" numpy xarray netCDF4 matplotlib cartopy

      - id: daily-cache
        name: Vorgewärmten Tagescache laden
        uses: actions/cache@v4
        with:
          path: .era5_running_rank_daily_cache
          key: era5-running-temperature-rank-daily-v1-${{ matrix.year }}-m${{ needs.prepare.outputs.month }}

      - name: Alten Tagescache als Fallback laden
        if: steps.daily-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .era5_running_rank_cache
          key: era5-running-temperature-rank-v2-${{ matrix.year }}-m${{ needs.prepare.outputs.month }}

      - name: Historische Monatsmittel laden
        uses: actions/cache@v4
        with:
          path: .era5_running_rank_monthly_cache
          key: era5-running-temperature-rank-monthly-v1-${{ matrix.year }}

      - name: CDS konfigurieren
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CDSAPI_KEY:-}"
          printf 'url: https://cds.climate.copernicus.eu/api\nkey: %s\n' "${CDSAPI_KEY}" > "$HOME/.cdsapirc"
          chmod 600 "$HOME/.cdsapirc"

      - name: Monatsreferenz des Historienjahres vorbereiten
        run: |
          python scripts/build_era5_temperature_rank_reference_shard.py             --year "${{ matrix.year }}"             --month "${{ needs.prepare.outputs.month }}"             --target-year 2026             --output-dir ".era5_rank_reference_shards/${{ matrix.year }}"

      - uses: actions/upload-artifact@v4
        with:
          name: era5-rank-reference-${{ needs.prepare.outputs.month }}-${{ matrix.year }}
          path: .era5_rank_reference_shards/${{ matrix.year }}/*.npz
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  publish:
    needs: [prepare, shards]
    if: needs.shards.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: Alle Jahresreferenzen laden
        uses: actions/download-artifact@v5
        with:
          pattern: era5-rank-reference-${{ needs.prepare.outputs.month }}-*
          path: .era5_rank_reference_shards
          merge-multiple: true

      - name: Tagesreferenzen 1950-2025 zusammenführen
        run: |
          python scripts/finalize_era5_temperature_rank_reference.py             --month "${{ needs.prepare.outputs.month }}"             --target-year 2026             --history-end 2025             --shard-dir .era5_rank_reference_shards             --output-dir .era5_rank_reference_publish

      - name: Tagesreferenzen vollständig prüfen
        env:
          MONTH: ${{ needs.prepare.outputs.month }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import calendar, json, os
          from pathlib import Path
          import numpy as np

          month=int(os.environ['MONTH'])
          expected=calendar.monthrange(2026,month)[1]
          root=Path('.era5_rank_reference_publish')
          files=sorted(root.glob('era5-rank-reference-1950-2025-*.npz'))
          assert len(files)==expected,(len(files),expected)
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['history_start']==1950
          assert manifest['history_end']==2025
          assert manifest['historical_years']==76
          assert manifest['month']==month
          for path in files:
              assert path.stat().st_size>0,path
              with np.load(path,allow_pickle=False) as data:
                  assert data['years'].astype(int).tolist()==list(range(1950,2026))
                  assert int(data['target_month'])==month
                  for product in ('day','month_to_date','season_to_date','year_to_date'):
                      arr=data[product]
                      assert arr.shape[0]==76,(path.name,product,arr.shape)
          print(f'Referenzmonat {month:02d} vollständig: {len(files)} Tagesdateien.')
          PY

      - name: Referenzen als dauerhafte Release-Assets veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ needs.prepare.outputs.month }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="era5-rank-reference-1950-2025-m${MONTH}-v1"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target main               --title "ERA5 Temperatur-Rangreferenz 1950–2025 · Monat ${MONTH}"               --notes "Statische 0,1°-ERA5-Land-Historienreferenzen 1950–2025 für tägliche Temperatur-Ränge. Diese Dateien vermeiden die erneute Berechnung von 76 Historienjahren bei jedem neuen 2026-Tag."
          fi
          for file in .era5_rank_reference_publish/*.npz; do
            echo "Veröffentliche $(basename "$file")"
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done
          gh release upload "$TAG" .era5_rank_reference_publish/manifest.json             --repo "$GITHUB_REPOSITORY" --clobber
          echo "Referenzmonat ${MONTH} dauerhaft veröffentlicht: $TAG"

      - name: Laufende Rangkarten nach Referenzbau anstoßen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run update-era5-running-temperature-ranks.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f force=false

  start-next:
    needs: [prepare, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Nächsten Referenzmonat anstoßen
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ needs.prepare.outputs.month }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MONTH" == "12" ]]; then
            echo "Referenzen September bis Dezember vollständig veröffentlicht."
            exit 0
          fi
          NEXT=$(printf "%02d" $((10#$MONTH + 1)))
          gh workflow run build-era5-temperature-rank-reference.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f month="$NEXT"
          echo "Referenzmonat $NEXT angestoßen."
