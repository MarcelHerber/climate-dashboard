name: Test DWD snow-height station data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Parser-Selbsttest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_dwd_snow_height.py --self-test

      - name: DWD Schneehöhen-Stationsdaten prüfen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_dwd_snow_height.py
