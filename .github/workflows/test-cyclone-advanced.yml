name: Zyklonen-Dashboard Diagnose-Checks
on:
  push:
    branches: [main, "feature/cyclone-advanced-diagnostics-20261012"]
    paths:
      - "tests/test_cyclone_dashboard_integrity.py"
      - "tests/test_north_atlantic_cps.py"
      - "tiefdruck_tracker.html"
      - "tiefdruck_tracker.js"
      - "tiefdruck_phase.js"
      - "tiefdruck_diagnostics.js"
      - "scripts/update_gefs_cps.py"
      - "scripts/update_north_atlantic_cps.py"
      - ".github/workflows/test-cyclone-advanced.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install numeric and GRIB libraries
        run: pip install "numpy>=2.0,<3" "scipy>=1.14,<2" "eccodes>=2.38,<3"
      - name: Syntax of real GFS and GEFS backend
        run: python -m compileall -q scripts/update_north_atlantic_cps.py scripts/update_gefs_cps.py
      - name: Test meteorological math and frontend integration
        run: python -m unittest discover -s tests -p "test_*cps.py" -v && python -m unittest discover -s tests -p test_cyclone_dashboard_integrity.py -v
