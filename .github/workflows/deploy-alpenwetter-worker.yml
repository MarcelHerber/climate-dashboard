name: Alpenwetter Worker veröffentlichen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "alpenwetter-worker/**"
      - ".github/workflows/deploy-alpenwetter-worker.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: alpenwetter-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALPENWETTER_PASSWORD: ${{ secrets.ALPENWETTER_PASSWORD }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Wrangler installieren
        run: npm install --no-save wrangler@4

      - name: Benötigte Secrets prüfen
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ALPENWETTER_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "FEHLER: GitHub Actions Secret $name fehlt."
              exit 1
            fi
          done

      - name: Cloudflare Account ID bereinigen
        shell: bash
        run: |
          set -euo pipefail
          clean_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [[ ! "$clean_id" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "FEHLER: CLOUDFLARE_ACCOUNT_ID enthält ungültige Zeichen."
            exit 1
          fi
          echo "::add-mask::$clean_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$clean_id" >> "$GITHUB_ENV"

      - name: Alpenwetter-Worker veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config alpenwetter-worker/wrangler.toml 2>&1 | tee /tmp/alpenwetter-wrangler.log

      - name: Alpenwetter-Kennwort als Cloudflare Secret setzen
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ALPENWETTER_PASSWORD" | npx wrangler secret put ALPENWETTER_PASSWORD --config alpenwetter-worker/wrangler.toml

      - name: Worker-Adresse für die Hauptseite speichern
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail

          endpoint="$(
            grep -Eo 'https://[^[:space:]]+\.workers\.dev[^[:space:]]*' /tmp/alpenwetter-wrangler.log               | tail -n 1               | sed -E 's/[),.;]+$//'
          )"

          if [[ -z "$endpoint" ]]; then
            echo "FEHLER: Die öffentliche workers.dev-Adresse konnte nicht aus dem Wrangler-Log gelesen werden."
            exit 1
          fi

          if [[ ! "$endpoint" =~ ^https://climate-dashboard-alpenwetter\.[A-Za-z0-9_-]+\.workers\.dev/?$ ]]; then
            echo "FEHLER: Unerwartete Worker-Adresse: $endpoint"
            exit 1
          fi

          mkdir -p data
          python - "$endpoint" <<'PY'
          import json
          import sys
          from pathlib import Path

          endpoint = sys.argv[1].rstrip("/")
          path = Path("data/alpenwetter_endpoint.json")
          payload = {
              "url": endpoint,
              "protected": True,
              "service": "Alpenwetter",
          }
          path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alpenwetter_endpoint.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Worker-Adresse ist bereits aktuell."
          else
            git commit -m "Alpenwetter-Endpunkt aktualisieren"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Worker-Adresse für die Hauptseite aktualisiert."
          fi

      - name: Hauptseite nach Endpunkt-Update neu veröffentlichen
        if: steps.endpoint.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-pages-only.yml --ref main
          echo "Pages-Deploy für den neuen Alpenwetter-Link gestartet."

      - name: Fertig
        run: echo "Alpenwetter-Worker, Kennwort und Hauptseiten-Link wurden aktualisiert."
