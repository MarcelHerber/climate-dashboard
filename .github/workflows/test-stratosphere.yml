name: Stratosphäre · Offline-Validierung

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_era5_stratosphere.py"
      - "scripts/update_era5_stratosphere_stage2.py"
      - "stratosphere_temperature.js"
      - "stratosphere_ensemble.js"
      - "tests/test_gefs_stratosphere.py"
      - "stratosphere_ssw_comparison.js"
      - "stratosphaere.html"
      - ".github/workflows/update-era5-stratosphere.yml"
      - ".github/workflows/test-stratosphere.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stratosphere-offline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile scripts/update_era5_stratosphere.py scripts/update_era5_stratosphere_stage2.py scripts/build_gefs_60n_10hpa_ensemble.py
      - name: Validate JavaScript syntax
        run: |
          node --check stratosphere_temperature.js
          node --check stratosphere_ensemble.js
          node --check stratosphere_ssw_comparison.js
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          page=Path("stratosphaere.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",page)
          for i,code in enumerate(scripts):
              if code.strip():
                  path=Path(f"/tmp/stratosphere-inline-{i}.js")
                  path.write_text(code,encoding="utf-8")
                  subprocess.run(["node","--check",str(path)],check=True)
          assert "stratosphere_temperature.js" in page
          assert "stratosphere_ensemble.js" in page
          assert 'id="stratoEnsembleCard"' in page
          assert 'id="windCustomDates"' in page
          assert "stratosphere_ssw_comparison.js" in page
          print("Stratosphere front end: JavaScript syntax OK")
          PY
      - name: Install offline scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy xarray pandas
      - name: Check ERA5 science, four temperature levels and SSW backfill scheduling
        run: |
          python scripts/update_era5_stratosphere.py --self-test
          python scripts/update_era5_stratosphere_stage2.py --self-test
