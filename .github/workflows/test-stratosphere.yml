name: Stratosphäre · Offline-Validierung

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_era5_stratosphere.py"
      - "scripts/update_era5_stratosphere_stage2.py"
      - "stratosphere_temperature.js"
      - "stratosphere_ensemble.js"
      - "stratosphere_ecmwf_runs.js"
      - "stratosphere_ecmwf_ens.js"
      - "stratosphere_run_trends.js"
      - "stratosphere_reversal_diagnostics.js"
      - "tests/test_stratosphere_reversal_diagnostics.cjs"
      - "tests/test_stratosphere_run_trends.cjs"
      - "scripts/build_ecmwf_ens_u60.py"
      - "tests/test_ecmwf_ens_u60.py"
      - "tests/test_stratosphere_eps_probability.cjs"
      - "stratosphere_winter_stats.js"
      - "stratosphere_gefs_probability.js"
      - "tests/test_stratosphere_rank_probability.cjs"
      - "scripts/build_ecmwf_ifs_u60_run_archive.py"
      - "tests/test_ecmwf_ifs_u60_run_archive.py"
      - "tests/test_stratosphere_ensemble_members.cjs"
      - "tests/test_stratosphere_forecast_focus.cjs"
      - "tests/test_gefs_stratosphere.py"
      - "stratosphere_ssw_comparison.js"
      - "stratosphaere.html"
      - ".github/workflows/update-era5-stratosphere.yml"
      - ".github/workflows/test-stratosphere.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stratosphere-offline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile scripts/update_era5_stratosphere.py scripts/update_era5_stratosphere_stage2.py scripts/build_gefs_60n_10hpa_ensemble.py scripts/build_ecmwf_ifs_u60_run_archive.py scripts/build_ecmwf_ens_u60.py
      - name: Validate JavaScript syntax
        run: |
          node --check stratosphere_temperature.js
          node --check stratosphere_ensemble.js
          node --check stratosphere_ecmwf_runs.js
          node --check stratosphere_ecmwf_ens.js
          node --check stratosphere_run_trends.js
          node --test tests/test_stratosphere_run_trends.cjs
          node --check stratosphere_reversal_diagnostics.js
          node --test tests/test_stratosphere_reversal_diagnostics.cjs
          node --check stratosphere_winter_stats.js
          node --check stratosphere_gefs_probability.js
          node --test tests/test_stratosphere_rank_probability.cjs
          node --test tests/test_stratosphere_eps_probability.cjs
          node --test tests/test_stratosphere_ensemble_members.cjs
          node --test tests/test_stratosphere_forecast_focus.cjs
          node --check stratosphere_ssw_comparison.js
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          page=Path("stratosphaere.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",page)
          for i,code in enumerate(scripts):
              if code.strip():
                  path=Path(f"/tmp/stratosphere-inline-{i}.js")
                  path.write_text(code,encoding="utf-8")
                  subprocess.run(["node","--check",str(path)],check=True)
          assert "stratosphere_ensemble.js" in page
          assert "stratosphere_ecmwf_runs.js" in page
          assert "stratosphere_ecmwf_ens.js" in page
          assert 'id="stratoEpsTab"' in page
          assert 'id="stratoCompareCanvas"' in page
          assert 'id="stratoGefsCycle"' in page
          assert 'id="stratoEpsCycle"' in page
          assert 'id="stratoCompareHour"' in page
          assert 'id="stratoTrendCanvas"' in page
          assert 'id="stratoTrendModel"' in page
          assert 'id="stratoTrendHour"' in page
          assert 'id="stratoTrendValid"' in page
          assert 'id="stratoTrendCsv"' in page
          assert 'id="stratoHeatmap"' in page
          assert 'id="stratoHeatTable"' in page
          assert 'id="stratoHeatPng"' in page
          assert 'id="stratoHeatCsv"' in page
          assert "stratosphere_reversal_diagnostics.js" in page
          assert 'id="stratoReversalDiagnostics"' in page
          assert 'id="stratoDiagOnset"' in page
          assert 'id="stratoDiagDuration"' in page
          assert 'id="stratoDiagCsv"' in page
          assert "stratosphere_run_trends.js" in page
          assert "stratosphere_winter_stats.js" in page
          assert "stratosphere_gefs_probability.js" in page
          assert 'id="stratoWinterStatsCard"' in page
          assert 'id="stratoProbCanvas"' in page
          assert 'id="stratoEcmwfView"' in page
          assert 'id="stratoEnsembleCard"' in page
          assert 'id="windCustomDates"' in page
          assert 'id="levelsCard"' in page
          assert 'id="windChart"' in page
          print("Stratosphere front end: ensemble, main chart and date-range JavaScript OK")
          PY
      - name: Install offline scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy xarray pandas
      - name: Check ERA5 science, four temperature levels and SSW backfill scheduling
        run: |
          python -m unittest discover -s tests -p test_ecmwf_ifs_u60_run_archive.py -v
          python -m unittest discover -s tests -p test_ecmwf_ens_u60.py -v
          python scripts/update_era5_stratosphere.py --self-test
          python scripts/update_era5_stratosphere_stage2.py --self-test
