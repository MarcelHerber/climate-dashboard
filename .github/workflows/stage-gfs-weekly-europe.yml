name: GFS Europa 7 Tage · geprüfte Pilotdaten übernehmen
on:
  push:
    branches: [feature/gfs-7day-europe-anomaly-20261114]
    paths: [".github/workflows/stage-gfs-weekly-europe.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  stage-verified:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            gfs_analysis_europe
          sparse-checkout-cone-mode: false
          fetch-depth: 0
      - name: Retrieve already tested NOAA GFS 28-field forecast, without re-downloading 168h archives
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43581986245
          name: gfs-weekly-europe-pilot-43581986245
          path: gfs_analysis_europe
      - name: Independently verify exact archived NOAA fields and all 1991–2020 reference metadata
        run: |
          python - <<'PY'
          import base64,json
          from pathlib import Path
          x=json.loads(Path("gfs_analysis_europe/weekly_f003.json").read_text())
          assert x["run_utc"]=="2026-11-14T00:00:00Z"
          assert x["type"]=="model_forecast_7day_not_observation"
          assert x["lead_hours"]==list(range(3,166,6))
          assert x["sample_count"]==28 and len(x["sources"])==28
          assert all(row["forecast_hour"]==lead and row["sha256"] and row["bytes"]>20000
                     for lead,row in zip(x["lead_hours"],x["sources"]))
          assert x["reference_metadata"]["source_months"]==360
          assert x["reference_metadata"]["years"]==30
          assert x["reference_metadata"]["forecast_hour"]==3
          for key in ("forecast_mean_q10_b64","anomaly_mean_q10_b64"):
              assert len(base64.b64decode(x[key],validate=True))==140*76*2
          print("GFS 7 day +3..165h NOAA original samples verified and ready for browser QA",flush=True)
          PY
      - name: Stage validated weekly anomaly data only on development branch
        run: |
          set -euo pipefail
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f gfs_analysis_europe/weekly_f003.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "GFS Europa: echte geprüfte Sieben-Tage-Anomalie 1991–2020"
          for TRY in 1 2 3; do
            git fetch origin feature/gfs-7day-europe-anomaly-20261114
            git rebase origin/feature/gfs-7day-europe-anomaly-20261114
            if git push origin HEAD:feature/gfs-7day-europe-anomaly-20261114; then exit 0; fi
            sleep $((TRY*5))
          done
          exit 1
