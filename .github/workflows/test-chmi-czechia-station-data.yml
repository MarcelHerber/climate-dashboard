name: Test CHMI Czechia station data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chmi-czechia-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: CHMI Czechia Offline-Selbsttest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_chmi_czechia_station_data.py --self-test

      - name: CHMI Czechia Live-Probe
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_chmi_czechia_station_data.py --workers 12
