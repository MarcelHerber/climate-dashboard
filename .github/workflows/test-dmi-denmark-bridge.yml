name: Test DMI Denmark 1984-2010 bridge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmi-denmark-bridge-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Offline-Selbsttest
        run: |
          set -euo pipefail
          python scripts/test_dmi_denmark_bridge.py --self-test

      - name: DMI Brücke 1984 bis 2010 testen
        run: |
          set -euo pipefail
          python scripts/test_dmi_denmark_bridge.py
