name: Schneehöhen · Stationswechsel und Jahreskurven

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "station_snow_years.js"
      - "station_snow_accumulation.js"
      - "station_snow_explorer.js"
      - "station_snow_explorer.css"
      - "tests/test_station_snow_explorer.cjs"
      - "tests/test_station_snow_coverage.cjs"
      - "tests/audit_station_snow_catalog.py"
      - "tests/audit_station_snow_explorer_live.py"
      - "tests/test_station_snow_accumulation.cjs"
      - "tests/test_station_snow_years.cjs"
      - "tests/audit_station_snow_years_live.py"
      - ".github/workflows/test-station-snow-years.yml"
  workflow_run:
    workflows: ["GitHub Pages schnell veröffentlichen"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snow-year-frontend-tests
  # Let a running real-browser audit finish even when Pages or source files
  # are updated again. GitHub retains at most one pending run in the group.
  cancel-in-progress: false

jobs:
  unit-tests:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v6
      - name: Schneestation-Suche, Karte und Messreihen prüfen
        run: |
          node --check station_snow_years.js
          node --check station_snow_accumulation.js
          node --check station_snow_explorer.js
          node --test tests/test_station_snow_years.cjs
          node --test tests/test_station_snow_accumulation.cjs
          node --test tests/test_station_snow_coverage.cjs
          node --test tests/test_station_snow_explorer.cjs
          python -m py_compile tests/audit_station_snow_explorer_live.py tests/audit_station_snow_years_live.py tests/audit_station_snow_catalog.py
          python tests/audit_station_snow_catalog.py

  live-browser:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Chromium Playwright
        run: |
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Historische Schneehöhenkurven mit echten DWD-Werten prüfen
        run: python -u tests/audit_station_snow_years_live.py
      - name: Interaktive Deutschlandkarte, Suche, Touch und Exporte prüfen
        run: python -u tests/audit_station_snow_explorer_live.py
      - name: Diagnose-Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-year-browser-audit
          path: |
            snow_year_browser_audit/
            snow_explorer_browser_audit/
          retention-days: 14
          if-no-files-found: warn
