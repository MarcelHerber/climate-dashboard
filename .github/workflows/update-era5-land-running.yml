name: ERA5-Land laufende T-P-Zeiträume

on:
  # Only the probe/workflow code can trigger a push run; generated data will not.
  # This also lets a targeted bugfix start one immediate recalculation.
  push:
    branches: [main]
    paths:
      - "scripts/update_era5_land_europe_running.py"
      - "scripts/era5_running_freshness_guard.py"
      - "scripts/build_era5_land_running_reference_shard.py"
      - "tests/test_era5_running_probe.py"
      - "tests/test_era5_running_freshness_guard.py"
      - ".github/workflows/update-era5-land-running.yml"
  schedule:
    - cron: "7 13 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      force:
        description: "Tagesdaten und Karten neu laden"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write  # Referenz-Workflow bei fehlendem Monatscache selbst starten

concurrency:
  group: era5-land-running
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  running-tp:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Cache-Monat bestimmen
        id: cache-month
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Vorhandenen ERA5-Land-Arbeitscache wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: |
            .era5_running_cache_0p1
            .era5_cache/cartopy
          key: era5-land-running-0p1-v1-${{ runner.os }}-${{ steps.cache-month.outputs.month }}-latest
          restore-keys: |
            era5-land-running-0p1-v1-${{ runner.os }}-${{ steps.cache-month.outputs.month }}-

      - name: Python-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cdsapi>=0.7.7" numpy xarray netCDF4 matplotlib cartopy pytest

      - name: Neueste vollständige UTC-Tage ohne starre Sechs-Tage-Verzögerung testen
        run: python -m pytest -q tests/test_era5_running_probe.py tests/test_era5_running_freshness_guard.py

      - name: CDS API konfigurieren
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CDSAPI_KEY:-}" ]]; then
            echo "FEHLER: GitHub Secret CDSAPI_KEY fehlt."
            exit 1
          fi
          cat > "$HOME/.cdsapirc" <<EOF
          url: https://cds.climate.copernicus.eu/api
          key: ${CDSAPI_KEY}
          EOF
          chmod 600 "$HOME/.cdsapirc"

      - name: Frischen gemeinsamen ERA5-Land-T/P-Tag bestimmen
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_era5_land_running_reference_shard.py \
            --probe \
            --github-output "$GITHUB_OUTPUT"

      # Monthly reference data may be evicted by the shared GitHub Actions cache quota.
      # First try the fast cache, then the durable workflow artifact backup.
      # Only if both are missing, start one reference rebuild and fail explicitly.
      - name: Vollständigen 1991-2020-Referenzcache laden
        id: reference-cache
        uses: actions/cache/restore@v4
        with:
          path: .era5_running_cache_0p1
          key: era5-land-running-0p1-reference-v1-${{ steps.probe.outputs.month_key }}

      - name: Fehlenden Referenzcache aus Workflow-Artefakt wiederherstellen
        if: steps.reference-cache.outputs.cache-hit != 'true'
        id: reference-recovery
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH_KEY: ${{ steps.probe.outputs.month_key }}
        shell: bash
        run: |
          set -euo pipefail
          echo "restored=false" >> "$GITHUB_OUTPUT"
          ARTIFACT="era5-land-running-reference-full-${MONTH_KEY}"
          mkdir -p .era5_running_cache_0p1
          while IFS= read -r RUN_ID; do
            [[ -n "$RUN_ID" ]] || continue
            rm -rf .era5_reference_backup
            if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --name "$ARTIFACT" --dir .era5_reference_backup; then
              continue
            fi
            cp -a .era5_reference_backup/. .era5_running_cache_0p1/
            if python - "${MONTH_KEY#*-}" <<'PY'
          from pathlib import Path
          import sys
          month = sys.argv[1]
          root = Path(".era5_running_cache_0p1")
          temp = list(root.glob(f"reference_temp_1991_2020_{month}_full_*.nc"))
          precip = list(root.glob(f"reference_precip_1991_2020_{month}_full_*.nc"))
          if len(temp) < 30 or len(precip) < 30 or not all(p.stat().st_size for p in temp + precip):
              raise SystemExit(f"Unvollständiger Referenzcache: T={len(temp)}, P={len(precip)}")
          print(f"Vollständiger ERA5-Land-Referenzcache für Monat {month} wiederhergestellt")
          PY
            then
              echo "restored=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow build-era5-land-running-reference-0p1.yml \
            --status success --limit 20 --json databaseId --jq '.[].databaseId' || true)
          echo "::warning::Kein gültiges Referenz-Artefakt für ${MONTH_KEY} gefunden."

      - name: Wiederhergestellten Referenzcache erneut speichern
        if: steps.reference-recovery.outputs.restored == 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .era5_running_cache_0p1
          key: era5-land-running-0p1-reference-v1-${{ steps.probe.outputs.month_key }}

      - name: Referenzcache bei Bedarf automatisch neu aufbauen
        if: steps.reference-cache.outputs.cache-hit != 'true' && steps.reference-recovery.outputs.restored != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH_KEY: ${{ steps.probe.outputs.month_key }}
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW="build-era5-land-running-reference-0p1.yml"
          ACTIVE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" \
            --status in_progress --limit 10 --json databaseId --jq 'length' || echo 0)"
          QUEUED="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" \
            --status queued --limit 10 --json databaseId --jq 'length' || echo 0)"
          if [[ "$ACTIVE" == "0" && "$QUEUED" == "0" ]]; then
            gh workflow run "$WORKFLOW" --ref main --repo "$GITHUB_REPOSITORY" \
              --field "month=${MONTH_KEY#*-}"
            echo "Referenz-Neuaufbau für ${MONTH_KEY} ausgelöst."
          else
            echo "Referenz-Neuaufbau ist bereits gestartet."
          fi
          echo "::error::Referenzcache ${MONTH_KEY} fehlt. Neuaufbau angefordert; bestehende Karten bleiben unverändert."
          exit 1

      - name: Laufende ERA5-Land-Zeiträume in 0,1 Grad berechnen
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            EXTRA_ARGS="--force"
          fi
          python scripts/update_era5_land_europe_running_0p1.py $EXTRA_ARGS

      - name: Ergebnis und Datenstand prüfen
        env:
          EXPECTED_DATA_THROUGH: ${{ steps.probe.outputs.data_through }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/era5_running_freshness_guard.py validate-index \
            --index era5_land_europe/running/index.json \
            --expected "$EXPECTED_DATA_THROUGH"
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('era5_land_europe/running/index.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('ready') is True
          assert data.get('periods', {}).get('running_month')
          assert data.get('grid', '').startswith('0,1°'), data.get('grid')
          assert 'diskrete -8 bis +8 K Skala' in data.get('rendering_note', '')
          print('Datenstand:', data.get('data_through'))
          print('Raster:', data.get('grid'))
          print('Perioden:', ', '.join(data.get('periods', {})))
          PY

      - name: Laufende ERA5-Land Daten versionieren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add era5_land_europe/running

          if git diff --cached --quiet; then
            echo "Keine neuen laufenden ERA5-Land Daten vorhanden."
            exit 0
          fi

          git commit -m "ERA5-Land laufende T-P-Zeiträume 0,1 Grad aktualisiert"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 5))
          done
          exit 1
