name: DWD Stations-Messwerte aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "35 9 * * *"
      timezone: "Europe/Berlin"

permissions:
  contents: write

concurrency:
  group: station-observations-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Parser-Selbsttest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_station_observations.py --self-test

      - name: DWD Stations-Messwerte aktualisieren
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_station_observations.py --workers 8

      - name: Änderungen versionieren
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            station_observations_index.json \
            station_observations_current

          if git diff --cached --quiet; then
            echo "Keine Änderungen bei den Stations-Messwerten."
            exit 0
          fi

          git commit -m "DWD Stations-Messwerte aktualisiert [skip ci]"

          for ATTEMPT in 1 2 3; do
            echo "Push-Versuch ${ATTEMPT}/3 ..."
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 3))
          done

          echo "FEHLER: Push nach drei Versuchen nicht möglich."
          exit 1
