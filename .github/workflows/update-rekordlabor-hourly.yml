name: Phase 3 · DWD-Stundenrekorde aus amtlichen Originalarchiven

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/build_rekordlabor_hourly.py
      - scripts/merge_rekordlabor_hourly.py
      - tests/test_rekordlabor_hourly.py
      - tests/test_rekordlabor_hourly_merge.py
      - .github/workflows/update-rekordlabor-hourly.yml
  push:
    branches: [main]
    paths:
      - scripts/build_rekordlabor_hourly.py
      - scripts/merge_rekordlabor_hourly.py
      - tests/test_rekordlabor_hourly.py
      - tests/test_rekordlabor_hourly_merge.py
      - .github/workflows/update-rekordlabor-hourly.yml
  schedule:
    - cron: "25 5 1 * *"

permissions:
  contents: read

concurrency:
  group: rekordlabor-hourly-all-eligible-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/build_rekordlabor_hourly.py
            scripts/merge_rekordlabor_hourly.py
            tests/test_rekordlabor_hourly.py
            tests/test_rekordlabor_hourly_merge.py
            data/rekordlabor/weather_turns
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Regression tests for DWD exact hourly records and shard integrity
        run: |
          python -m unittest discover -s tests -p test_rekordlabor_hourly.py -v
          python -m unittest discover -s tests -p test_rekordlabor_hourly_merge.py -v
      - name: Test official historical DWD archives with additional stations
        run: |
          python -u scripts/build_rekordlabor_hourly.py --out data/rekordlabor/weather_turns --target-stations 54 --min-stations 52 --workers 3

  shards:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/build_rekordlabor_hourly.py
            data/rekordlabor/weather_turns
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Retrieve and validate original DWD hourly records (all candidates)
        run: |
          python -u scripts/build_rekordlabor_hourly.py \
            --target-stations 0 --workers 2 \
            --out _hourly_shard \
            --cache-dir data/rekordlabor/weather_turns \
            --shard-index "${{ matrix.shard }}" --shard-count 8
      - name: Upload DWD hourly records and completeness manifest
        uses: actions/upload-artifact@v4
        with:
          name: hourly-shard-${{ matrix.shard }}
          path: _hourly_shard/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

  publish:
    if: github.event_name != 'pull_request'
    needs: [shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/merge_rekordlabor_hourly.py
            scripts/build_rekordlabor_hourly.py
            tests/test_rekordlabor_hourly.py
            tests/test_rekordlabor_hourly_merge.py
            data/rekordlabor/weather_turns
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Retrieve all successful DWD hourly station shards
        uses: actions/download-artifact@v4
        with:
          pattern: hourly-shard-*
          merge-multiple: false
          path: _hourly_parts
      - name: Validate all station shards and keep every previously verified station
        run: |
          python -m unittest discover -s tests -p test_rekordlabor_hourly_merge.py -v
          python -u scripts/merge_rekordlabor_hourly.py \
            --parts _hourly_parts --archive data/rekordlabor/weather_turns --expected-shards 8
      - name: Publish new validated station records to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rekordlabor/weather_turns
          if git diff --cached --quiet; then
            echo "No new original hourly station records."
            exit 0
          fi
          git commit -m "data: publish all validated DWD historical hourly station records"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          echo "Validated archives built but GitHub push failed." >&2
          exit 1
