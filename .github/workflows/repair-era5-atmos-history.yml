name: ERA5 Atmosphaere Historie 2010-2025 reparieren

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/repair-era5-atmos-history.yml"

permissions:
  contents: write

# On replacing this workflow, cancel the older, serial build so it cannot
# publish the same release assets concurrently with the new publisher.
concurrency:
  group: era5-atmos-repair-2010-2025
  cancel-in-progress: true

jobs:
  calculate:
    name: ERA5 ${{ matrix.year }} berechnen
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    steps:
      - name: ERA5-Skripte laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: scripts

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Kartografie-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy xarray matplotlib cartopy pillow cdsapi netCDF4

      - name: Fertigen Jahresrelease erkennen und Manifest wiederverwenden
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_YEAR: ${{ matrix.year }}
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=scripts
          python - <<'PY'
          import os
          from pathlib import Path
          from publish_era5_atmos_history_release import gh
          year = int(os.environ["TARGET_YEAR"])
          tag = f"era5-atmos-history-{year}-v1"
          try:
              assets = set(gh("release", "view", tag, "--json", "assets", "--jq", ".assets[].name").splitlines())
          except RuntimeError as exc:
              if "404" not in str(exc).lower() and "not found" not in str(exc).lower():
                  raise
              assets = set()
          complete = "manifest.json" in assets and len([asset for asset in assets if asset.endswith(".webp")]) == 48
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"ready={'true' if complete else 'false'}\n")
          if complete:
              target = Path(".era5-history-output") / str(year)
              target.mkdir(parents=True, exist_ok=True)
              gh("release", "download", tag, "--pattern", "manifest.json", "--dir", str(target))
              print(f"{year}: bereits vollständig, keine Neuberechnung.", flush=True)
          else:
              print(f"{year}: {len([x for x in assets if x.endswith('.webp')])}/48 Atlanten, Neuberechnung erforderlich.", flush=True)
          PY

      - name: Historische Referenzpakete herunterladen
        if: steps.existing.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .era5-atmos-history-refs
          export PYTHONPATH=scripts
          python - <<'PY'
          from pathlib import Path
          from publish_era5_atmos_history_release import gh
          gh("release", "download", "era5-atmos-history-reference-1940-2025-v1",
             "--pattern", "month_*.npz", "--dir", ".era5-atmos-history-refs")
          refs = list(Path(".era5-atmos-history-refs").glob("month_*.npz"))
          if len(refs) != 12:
              raise RuntimeError(f"Nur {len(refs)} von 12 Referenzmonaten")
          PY

      - name: Historische Karten erzeugen
        if: steps.existing.outputs.ready != 'true'
        env:
          TARGET_YEAR: ${{ matrix.year }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_era5_atmos_history.py render \
            --year "$TARGET_YEAR" \
            --reference-dir .era5-atmos-history-refs \
            --output ".era5-history-output/$TARGET_YEAR"
          test "$(find ".era5-history-output/$TARGET_YEAR" -maxdepth 1 -name '*.webp' | wc -l)" -eq 48

      - name: Jahr für die getrennte Upload-Warteschlange sichern
        uses: actions/upload-artifact@v4
        with:
          name: era5-atmos-calculated-${{ matrix.year }}
          path: .era5-history-output/${{ matrix.year }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  upload:
    name: ERA5 ${{ matrix.year }} seriell hochladen
    needs: calculate
    if: needs.calculate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
    steps:
      - name: Upload-Skript laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: scripts

      - name: Fertiges Jahresartefakt laden
        uses: actions/download-artifact@v4
        with:
          name: era5-atmos-calculated-${{ matrix.year }}
          path: .era5-year-to-publish

      - name: Jahresrelease prüfen oder vervollständigen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_YEAR: ${{ matrix.year }}
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH=scripts
          python - <<'PY'
          import os
          from pathlib import Path
          from publish_era5_atmos_history_release import gh, publish
          year = int(os.environ["TARGET_YEAR"])
          target = Path(".era5-year-to-publish")
          atlases = list(target.glob("*.webp"))
          if len(atlases) == 48:
              publish(year, target)
          elif len(atlases) == 0:
              tag = f"era5-atmos-history-{year}-v1"
              assets = set(gh("release", "view", tag, "--json", "assets", "--jq", ".assets[].name").splitlines())
              if "manifest.json" not in assets or sum(x.endswith(".webp") for x in assets) != 48:
                  raise RuntimeError(f"{year}: keine Bilder im Artefakt und Release unvollständig")
              print(f"{year}: vorhandener kompletter Release bestätigt.")
          else:
              raise RuntimeError(f"{year}: nur {len(atlases)} von 48 Atlanten im Artefakt")
          if not (target / "manifest.json").is_file():
              raise RuntimeError(f"{year}: Monatsmanifest fehlt")
          PY

      - name: Nur bestätigtes Manifest für Pages bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: era5-atmos-verified-${{ matrix.year }}
          path: .era5-year-to-publish/manifest.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Bestätigte Historienjahre auf GitHub Pages aktivieren
    needs: [calculate, upload]
    if: always() && needs.upload.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository und Finalisierungsskript laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            era5_europe

      - name: Bestätigte Jahresmanifeste sammeln
        uses: actions/download-artifact@v4
        with:
          pattern: era5-atmos-verified-*
          path: .era5-history-manifests
          merge-multiple: false

      - name: Archiv auf aktuellem main zusammenführen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/finalize_era5_atmos_history.py --artifacts .era5-history-manifests
            git add era5_europe/history era5_europe/index.json
            if git diff --cached --quiet; then
              echo "Historischer ERA5-Index bereits vollständig."
              exit 0
            fi
            git commit -m "ERA5 Atmosphäre historische Jahre 2010-2025 nachgetragen"
            if git push origin HEAD:main; then
              echo "Fertige ERA5-Historie auf main; Pages kann veröffentlichen."
              exit 0
            fi
            echo "Push-Konflikt, neuer Versuch $attempt/3"
          done
          exit 1
