name: Monatsausblick Tagesklima Sonnenschein PR-Tests

on:
  pull_request:
    paths:
      - "scripts/build_monthly_outlook_daily_sun_reference.py"
      - "scripts/probe_monthly_sun_historical.py"
      - "tests/test_monthly_outlook_daily_sun_reference.py"
      - "state_monthly_ensemble.js"
      - "scripts/patch_state_monthly_ensemble_frontend.py"
      - ".github/workflows/update-state-monthly-daily-sun-reference.yml"
      - ".github/workflows/test-state-monthly-daily-sun.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Python-Abhängigkeiten
        run: |
          python -m pip install -r requirements-hyras.txt
          python -m pip install shapely
      - name: Offline-Tests und Frontend integrieren
        run: |
          python -m py_compile scripts/build_monthly_outlook_daily_sun_reference.py scripts/probe_monthly_sun_historical.py
          python -m unittest discover -s tests -p test_monthly_outlook_daily_sun_reference.py -v
          node --check state_monthly_ensemble.js
          python scripts/patch_state_monthly_ensemble_frontend.py
          grep -q 'id="stateMonthlyParameter"' index.html
          grep -q 'state_monthly_ensemble.js?v=20261112-daily-sun-1' index.html

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Python-Abhängigkeiten
        run: |
          python -m pip install -r requirements-hyras.txt
          python -m pip install shapely
      - name: Echte DWD Stationshistorie, Metadaten und SDK aus ZIP prüfen
        run: python scripts/probe_monthly_sun_historical.py

  full-history:
    needs: [unit, live]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Abhängigkeiten
        run: |
          python -m pip install -r requirements-hyras.txt
          python -m pip install shapely
      - name: Stations-Tagesklimatologien cachen
        uses: actions/cache@v4
        with:
          path: /tmp/monthly-daily-sun-cache
          key: dwd-kl-sdk-daily-1991-2020-station-v1
      - name: Offizielle DWD 1991-2020 Monatsnormalwerte holen
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin state-monthly-reference --depth=1
          git show origin/state-monthly-reference:monthly_reference_1991_2020.json > /tmp/official_monthly_reference.json
      - name: Echte Sonnenscheindauer aller 366 Tage für 17 Gebiete rekonstruieren
        run: |
          python scripts/build_monthly_outlook_daily_sun_reference.py \
            --monthly /tmp/official_monthly_reference.json \
            --work /tmp/daily-sun-reference-work \
            --cache /tmp/monthly-daily-sun-cache \
            --output /tmp/daily_sun_reference_1991_2020.json \
            --workers 12
      - name: Stationen, Datumskurven und Monatsende prüfen
        run: |
          python - <<'PY'
          import json, calendar
          d=json.load(open('/tmp/daily_sun_reference_1991_2020.json'))
          assert d['daily_climatology_available'] is True
          assert len(d['regions_order'])==17 and len(d['months'])==12
          assert d['quality']['stations']>=60
          for m in range(1,13):
              obj=d['months'][f'{m:02d}']
              assert len(obj['dates'])==calendar.monthrange(2000,m)[1]
              for region in d['regions_order']:
                  values=obj['regions'][region]
                  assert len(values['daily_h'])==len(values['running_h'])==len(obj['dates'])
                  assert 0.60<=values['monthly_shape_adjustment_factor']<=1.40
          print('FULL DWD SDK 1991–2020 source validated',d['quality']['stations'],'stations',
                'November Germany',d['months']['11']['regions']['Deutschland']['running_h'][-1])
          PY
