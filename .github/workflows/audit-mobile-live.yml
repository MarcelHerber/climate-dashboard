name: Mobile Interaktion · Echtdaten und Touch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/audit_mobile_live_interactions.py"
      - "mobile_content.js"
      - "mobile_content.css"
      - "mobile_navigation.js"
      - "mobile_navigation.css"
      - "mosmix.js"
      - "t850_ensembles.js"
      - "stratosphere_reversal_diagnostics.js"
      - "isobaren_original.js"
      - ".github/workflows/audit-mobile-live.yml"

permissions:
  contents: read

concurrency:
  group: mobile-live-touch-audit
  cancel-in-progress: true

jobs:
  browser-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Playwright Chromium installieren
        run: |
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Live-Datenquellen und Touch-Interaktion bei 390 / 320 px prüfen
        run: python -u tests/audit_mobile_live_interactions.py --output mobile_live_reports
      - name: Testbericht zusammenfassen
        if: always()
        shell: bash
        run: |
          if [ -f mobile_live_reports/README.md ]; then
            cat mobile_live_reports/README.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Live-Test vor Berichtserstellung abgebrochen" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Screenshots und Request-Diagnosen sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-mobile-live-touch
          path: mobile_live_reports/
          if-no-files-found: warn
          retention-days: 14
