name: DWD Feiertags-Extremwerte · Ostern & Weihnachten

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dwd-holiday-extremes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: python -m pip install requests

      - name: Feiertags-Extremwerte bauen
        run: |
          set -euo pipefail
          python scripts/build_dwd_holiday_extremes.py \
            --output data/dwd_holiday_extremes.json \
            --max-workers 10

      - name: Datenbasis prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/dwd_holiday_extremes.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          assert d["version"] == 1
          assert len(d["areas"]) == 17
          assert set(d["holidays"]) == {"easter", "christmas"}
          assert set(d["metrics"]) == {"tnn", "txx"}
          assert d["start_year"] == 1881
          assert d["stats"]["holiday_observations"] > 0

          assert d["holiday_dates"]["2024"]["easter"]["easter_sunday"] == "2024-03-31"
          assert d["holiday_dates"]["2025"]["easter"]["easter_sunday"] == "2025-04-20"
          assert d["holiday_dates"]["2026"]["easter"]["easter_sunday"] == "2026-04-05"

          germany = d["records"]["Deutschland"]
          for holiday in ("easter", "christmas"):
              for year in ("2024", "2025"):
                  row = germany[holiday][year]
                  assert row["tnn"] is not None, (holiday, year, "tnn fehlt")
                  assert row["txx"] is not None, (holiday, year, "txx fehlt")

          print("DWD Feiertags-Extremwerte · Prüfung OK")
          print("Gebiete:", len(d["areas"]))
          print("Feiertage:", ", ".join(d["holidays"]))
          print("Beobachtungen:", f'{d["stats"]["holiday_observations"]:,}')
          print("Stationen:", f'{d["stats"]["referenced_stations"]:,}')

          for holiday in ("easter", "christmas"):
              print("Deutschland", holiday)
              for year in ("2024", "2025", "2026"):
                  row = germany[holiday][year]
                  print(
                      year,
                      {
                          key: (value[0] if value else None)
                          for key, value in row.items()
                      },
                  )
          PY

      - name: Datenbasis veröffentlichen
        run: |
          set -euo pipefail

          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dwd_holiday_extremes.json

          if git diff --cached --quiet; then
            echo "Feiertags-Extremwerte unverändert."
            exit 0
          fi

          git commit -m "DWD Feiertags-Extremwerte aktualisieren"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "Feiertags-Datenbasis veröffentlicht."
