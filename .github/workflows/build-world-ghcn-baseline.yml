name: Build world GHCN historical baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-ghcn-historical-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Parser-Selbsttest
        run: python scripts/build_world_ghcn_baseline.py --self-test

      - name: Kandidaten-QC-Selbsttest
        run: python scripts/verify_world_ghcn_candidates.py --self-test

      - name: Kandidaten-QC-Stufe-2-Selbsttest
        run: python scripts/verify_world_ghcn_candidates_stage2.py --self-test

      - name: Kandidaten-QC-Stufe-3-Selbsttest
        run: python scripts/verify_world_ghcn_candidates_stage3.py --self-test

      - name: Kandidaten-QC-Stufe-4-Selbsttest
        run: python scripts/verify_world_ghcn_candidates_stage4.py --self-test

      - name: Historischen Welt-GHCN-Cache wiederherstellen
        id: world-ghcn-cache
        uses: actions/cache@v5
        with:
          path: .cache/world-ghcn
          key: world-ghcn-baseline-v1-through-2025

      - name: Weltweiten GHCN-Baseline-Cache bauen oder aus Cache laden
        run: |
          python scripts/build_world_ghcn_baseline.py \
            --cutoff-year 2025 \
            --cache-dir .cache/world-ghcn \
            --output world_ghcn_baseline

      - name: Ergebnis und Rekordkandidaten kontrollieren
        run: |
          echo "=== CACHE STATUS ==="
          echo "Cache hit: ${{ steps.world-ghcn-cache.outputs.cache-hit }}"
          echo

          echo "=== WORLD GHCN BASELINE OUTPUT ==="
          du -h world_ghcn_baseline/* || true
          echo

          echo "=== SUMMARY ==="
          cat world_ghcn_baseline/summary.json
          echo

          echo "=== REPORT ==="
          cat world_ghcn_baseline/report.md
          echo

          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          path = Path("world_ghcn_baseline/world_country_extreme_candidates_top10.csv")
          with path.open("r", encoding="utf-8-sig", newline="") as handle:
              rows = list(csv.DictReader(handle, delimiter=";"))

          metrics = (
              ("tmax_highest", True, 25),
              ("tmin_lowest", False, 25),
              ("tmax_lowest", False, 20),
              ("tmin_highest", True, 20),
          )

          def value(row):
              try:
                  return float(row["value_c"])
              except (TypeError, ValueError):
                  return float("nan")

          countries = {r["country_code"] for r in rows if r.get("country_code")}
          metric_counts = Counter(r["metric"] for r in rows)
          rank1 = [r for r in rows if r.get("rank") == "1"]

          lines = []
          lines.append("WORLD GHCN BASELINE · QC OVERVIEW")
          lines.append("=" * 72)
          lines.append(f"Kandidatenzeilen gesamt: {len(rows):,}")
          lines.append(f"Laender/GHCN-Codes:      {len(countries):,}")
          lines.append(f"Rank-1-Zeilen:           {len(rank1):,}")
          lines.append("")
          lines.append("Kandidatenzeilen je Extremtyp:")
          for metric in sorted(metric_counts):
              lines.append(f"  {metric:14s}: {metric_counts[metric]:,}")

          for metric, descending, limit in metrics:
              subset = [r for r in rank1 if r.get("metric") == metric]
              subset.sort(key=value, reverse=descending)
              lines.append("")
              lines.append(f"=== GLOBALE RANK-1-SPITZE · {metric} ===")
              for r in subset[:limit]:
                  lines.append(
                      f"{r['country_code']:>2s} | {r['country'][:24]:24s} | "
                      f"{float(r['value_c']):6.1f} °C | {r['date']} | "
                      f"{r['station_id']} | {r['station_name'][:30]}"
                  )

          suspicious = []
          for r in rows:
              v = value(r)
              metric = r.get("metric", "")
              is_suspicious = (
                  (metric == "tmax_highest" and v >= 55.0)
                  or (metric == "tmin_highest" and v >= 45.0)
                  or (metric == "tmin_lowest" and v <= -90.0)
                  or (metric == "tmax_lowest" and v <= -90.0)
              )
              if is_suspicious:
                  suspicious.append(r)

          lines.append("")
          lines.append("=== EXTREME QC-FLAGS ===")
          lines.append(
              "Nur technische Auffaelligkeiten nahe den sehr weiten Parsing-Grenzen; "
              "keine fachliche Rekordverifikation."
          )
          if not suspicious:
              lines.append("Keine Kandidaten ober-/unterhalb der QC-Flag-Schwellen gefunden.")
          else:
              suspicious.sort(key=lambda r: (r["metric"], value(r), r["country_code"], int(r["rank"])))
              for r in suspicious[:200]:
                  lines.append(
                      f"{r['metric']:14s} | {r['country_code']} | rank {r['rank']:>2s} | "
                      f"{float(r['value_c']):6.1f} °C | {r['date']} | "
                      f"{r['station_id']} | {r['station_name'][:36]}"
                  )
              if len(suspicious) > 200:
                  lines.append(f"... weitere {len(suspicious) - 200:,} QC-Flag-Zeilen im CSV pruefen.")

          missing_coords = sum(
              not (r.get("latitude") or "").strip() or not (r.get("longitude") or "").strip()
              for r in rows
          )
          lines.append("")
          lines.append("=== METADATEN-CHECK ===")
          lines.append(f"Kandidaten ohne vollstaendige Koordinaten: {missing_coords:,}")
          lines.append("")
          lines.append(
              "Naechster fachlicher Schritt erst nach dieser Kontrolle: "
              "Abgleich der Rekordkandidaten gegen Maxcrc/WMO/nationale Wetterdienste."
          )

          text = "\n".join(lines) + "\n"
          qc_path = Path("world_ghcn_baseline/qc_overview.txt")
          qc_path.write_text(text, encoding="utf-8")
          print(text)
          PY

      - name: Fachliche Kandidaten-QC · Stufe 1
        run: |
          python scripts/verify_world_ghcn_candidates.py \
            --input world_ghcn_baseline/world_country_extreme_candidates_top10.csv \
            --output-dir world_ghcn_baseline/qc_stage1

          echo
          echo "=== WORLD GHCN QC STAGE 1 · SUMMARY ==="
          cat world_ghcn_baseline/qc_stage1/summary.json
          echo
          echo "=== WORLD GHCN QC STAGE 1 · REPORT ==="
          cat world_ghcn_baseline/qc_stage1/qc_report.md
          echo
          echo "=== CONFIRMED REJECTIONS ==="
          cat world_ghcn_baseline/qc_stage1/rejected_confirmed.csv


      - name: Fachliche Kandidaten-QC · Stufe 2
        run: |
          python scripts/verify_world_ghcn_candidates_stage2.py \
            --input world_ghcn_baseline/qc_stage1/world_country_extreme_candidates_stage1_clean.csv \
            --output-dir world_ghcn_baseline/qc_stage2

          echo
          echo "=== WORLD GHCN QC STAGE 2 · SUMMARY ==="
          cat world_ghcn_baseline/qc_stage2/summary.json
          echo
          echo "=== WORLD GHCN QC STAGE 2 · REPORT ==="
          cat world_ghcn_baseline/qc_stage2/qc_report.md
          echo
          echo "=== STAGE 2 CONFIRMED REJECTIONS ==="
          cat world_ghcn_baseline/qc_stage2/rejected_confirmed_stage2.csv
          echo
          echo "=== STAGE 2 REVIEW PRIORITY · HEAD ==="
          head -n 81 world_ghcn_baseline/qc_stage2/review_priority_stage2.csv || true

      - name: Fachliche Kandidaten-QC · Stufe 3
        run: |
          python scripts/verify_world_ghcn_candidates_stage3.py \
            --input world_ghcn_baseline/qc_stage2/world_country_extreme_candidates_stage2_clean.csv \
            --output-dir world_ghcn_baseline/qc_stage3

          echo
          echo "=== WORLD GHCN QC STAGE 3 · SUMMARY ==="
          cat world_ghcn_baseline/qc_stage3/summary.json
          echo
          echo "=== WORLD GHCN QC STAGE 3 · REPORT ==="
          cat world_ghcn_baseline/qc_stage3/qc_report.md
          echo
          echo "=== STAGE 3 CONFIRMED REJECTIONS ==="
          cat world_ghcn_baseline/qc_stage3/rejected_confirmed_stage3.csv
          echo
          echo "=== STAGE 3 SOURCE-BACKED ==="
          cat world_ghcn_baseline/qc_stage3/source_backed_stage3.csv
          echo
          echo "=== STAGE 3 COUNTRY-RANK-1 REVIEW PRIORITY · HEAD ==="
          head -n 101 world_ghcn_baseline/qc_stage3/review_priority_rank1_stage3.csv || true

      - name: Fachliche Kandidaten-QC · Stufe 4
        run: |
          python scripts/verify_world_ghcn_candidates_stage4.py \
            --input world_ghcn_baseline/qc_stage3/world_country_extreme_candidates_stage3_clean.csv \
            --output-dir world_ghcn_baseline/qc_stage4

          echo
          echo "=== WORLD GHCN QC STAGE 4 · SUMMARY ==="
          cat world_ghcn_baseline/qc_stage4/summary.json
          echo
          echo "=== WORLD GHCN QC STAGE 4 · REPORT ==="
          cat world_ghcn_baseline/qc_stage4/qc_report.md
          echo
          echo "=== STAGE 4 CONFIRMED REJECTIONS ==="
          cat world_ghcn_baseline/qc_stage4/rejected_confirmed_stage4.csv
          echo
          echo "=== STAGE 4 OFFICIAL COVERAGE GAPS ==="
          cat world_ghcn_baseline/qc_stage4/official_coverage_gaps_stage4.csv
          echo
          echo "=== STAGE 4 OFFICIAL ANCHOR CONFLICTS ==="
          cat world_ghcn_baseline/qc_stage4/official_anchor_conflicts_stage4.csv
          echo
          echo "=== STAGE 4 PACIFIC 39C CLUSTER ==="
          cat world_ghcn_baseline/qc_stage4/pacific_39c_cluster_stage4.csv
          echo
          echo "=== STAGE 4 COUNTRY-RANK-1 REVIEW PRIORITY · HEAD ==="
          head -n 101 world_ghcn_baseline/qc_stage4/review_priority_rank1_stage4.csv || true

      - name: Baseline als Artifact hochladen
        uses: actions/upload-artifact@v7
        with:
          name: world-ghcn-baseline-through-2025-v1
          path: world_ghcn_baseline/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
