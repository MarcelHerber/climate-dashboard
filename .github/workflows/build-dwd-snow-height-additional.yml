name: DWD snow-height · additional station coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_dwd_snow_height_additional.py"
      - ".github/workflows/build-dwd-snow-height-additional.yml"
  schedule:
    # Backup: continue/resume unfinished imports even after the push-triggered bulk run.
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  # Never let two jobs overwrite each other's incremental station catalogue.
  group: dwd-snow-additional-coverage
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Main auschecken
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: SH_TAG, Nullwerte und Hydrologie prüfen
        run: python scripts/build_dwd_snow_height_additional.py --self-test

      - name: Alle verbleibenden Stationskandidaten in abgesicherten Paketen prüfen
        shell: bash
        run: |
          set -euo pipefail
          # The importer already downloads 14 station ZIP sets in parallel.
          # Reuse the same safe 14-worker concurrency; avoid idle scheduled gaps.
          # Each 350-station batch has its OWN commit/checkpoint: if a later
          # batch fails, successfully processed data is never lost.
          # At most 18 batches; stops early once all official IDs were checked.
          # This file change also initiates a new push-triggered run immediately.
          for BATCH in $(seq 1 18); do
            echo "=== DWD Schnee · Importpaket $BATCH von maximal 18 ==="
            python -u scripts/build_dwd_snow_height_additional.py --batch-size 350
            python - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path("station_snow_height_index.json").read_text())
          extra=json.loads(Path("station_snow_height_additional_index.json").read_text())
          assert base["ready"] and extra["ready"]
          assert extra["station_count"]==len(extra["stations"])
          base_ids={s["id"] for s in base["stations"]}
          assert len(base_ids)==len(base["stations"])
          assert not any(s["id"] in base_ids for s in extra["stations"])
          for row in extra["stations"][-4:]:
              p=Path(row["file"]);y=Path(row["year_file"])
              assert p.exists() and y.exists(), (p,y)
              profile=json.loads(p.read_text())
              archive=json.loads(y.read_text())
              assert len(profile["daily"])==366
              assert len(archive["month_days"])==366
              assert archive["station_id"]==row["id"]
          print("Base:",len(base_ids),"Extra:",extra["station_count"],
                "Offen:",extra["pending_candidate_count"])
          PY
            git config user.name "climate-dashboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add               data/snow_additional_import_progress.json               station_snow_height_additional_index.json               station_snow_height_additional_profiles               station_snow_height_additional_years               station_snow_height_additional_current
            if git diff --cached --quiet; then
              echo "Keine neuen Stationsdaten: Import abgeschlossen oder Daten unverändert."
              break
            fi
            git commit -m "DWD Schnee: weiteres Messnetz Paket $BATCH [skip ci]"
            PUSH_OK=0
            for ATTEMPT in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                PUSH_OK=1
                break
              fi
              sleep $((ATTEMPT * 5))
            done
            if [ "$PUSH_OK" -ne 1 ]; then
              echo "FEHLER: Paket $BATCH konnte nicht veröffentlicht werden."
              exit 1
            fi
            echo "Paket $BATCH erfolgreich veröffentlicht."
            if python - <<'PY'
          import json,sys
          from pathlib import Path
          p=json.loads(Path("data/snow_additional_import_progress.json").read_text())
          sys.exit(0 if p.get("complete") else 1)
          PY
            then
              echo "Alle verzeichneten Kandidaten erfolgreich abgeschlossen."
              break
            fi
          done
