name: GFS Europa 7 Tage · schneller Desktop und Handytest
on:
  push:
    branches: [feature/gfs-7day-europe-anomaly-20261114]
    paths: [".github/workflows/gfs-weekly-browser-fast.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            gfs_weekly_europe.html
            gfs_weekly_europe.js
            gfs_weekly_europe.css
            gfs_analysis_europe/weekly_f003.json
            cpc_europe
            cpc_europe.css
            mobile_navigation.js
            mobile_navigation.css
            dashboard_theme.js
            dashboard_theme.css
            tests/test_gfs_weekly_europe_browser.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install chromium --with-deps
      - name: Verify polar stereographic raster, country boundaries and seven-day data on desktop and mobile
        run: |
          node --check gfs_weekly_europe.js
          python tests/test_gfs_weekly_europe_browser.py
      - name: Upload rendered seven-day map and exports for visual verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfs-weekly-browser-fast-${{ github.run_id }}
          path: gfs_weekly_europe_qa/
          retention-days: 10
          if-no-files-found: ignore
