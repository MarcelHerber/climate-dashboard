name: Diagnose CFSR GDEX missing-month field metadata

on:
  push:
    branches: [feature/gfs-cfsr-1991-2020-europe-20261113]
    paths:
      - "scripts/probe_cfsr_cfsv2_ncar_metadata.py"
      - ".github/workflows/probe-cfsr-gdex-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy requests eccodes
      - name: Read true original NCAR GRIB2 field metadata for missing historical months
        run: python -m scripts.probe_cfsr_cfsv2_ncar_metadata
