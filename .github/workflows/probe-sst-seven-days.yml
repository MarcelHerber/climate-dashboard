name: SST Europa 7-Tage-Probelauf

# Re-run the pilot after correcting Harmony's quoted temporal subset syntax.
on:
  workflow_dispatch:
  push:
    branches: ["feature/sst-europe-stage1"]
    paths:
      - ".github/workflows/probe-sst-seven-days.yml"

permissions:
  contents: read

concurrency:
  group: sst-seven-day-pilot
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}

    steps:
      - name: Feature-Branch auschecken
        uses: actions/checkout@v6
        with:
          ref: feature/sst-europe-stage1
          fetch-depth: 1

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-sst.txt

      - name: SST-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-sst.txt

      - name: Earthdata Secret prüfen
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EARTHDATA_TOKEN:-}" ]]; then
            echo "FEHLER: GitHub Actions Secret EARTHDATA_TOKEN fehlt."
            exit 1
          fi
          echo "EARTHDATA_TOKEN ist gesetzt."

      - name: SST Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .sst_cache
          key: sst-europe-pilot-v1-${{ runner.os }}-${{ hashFiles('requirements-sst.txt') }}
          restore-keys: |
            sst-europe-pilot-v1-${{ runner.os }}-

      - name: Sieben echte SST-Tage erzeugen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sst-pilot
          mkdir -p /tmp/sst-pilot
          python -m scripts.sst.backfill \
            --start 2026-09-01 \
            --end 2026-09-07 \
            --archive-root /tmp/sst-pilot \
            --cache-root .sst_cache

      - name: Ergebnis prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/sst-pilot/index.json
          test -f /tmp/sst-pilot/storage_report.json
          COUNT=$(find /tmp/sst-pilot -type f -name '*.webp' | wc -l)
          echo "Erzeugte WebP-Karten: $COUNT"
          test "$COUNT" -eq 70
          echo '### SST 7-Tage-Probelauf' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "- Zeitraum: 01.–07.09.2026" >> "$GITHUB_STEP_SUMMARY"
          echo "- Erwartete Karten: 70" >> "$GITHUB_STEP_SUMMARY"
          echo "- Erzeugte Karten: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/sst-pilot/storage_report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Vorschau als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: sst-europe-pilot-2026-09-01-to-07
          path: /tmp/sst-pilot
          if-no-files-found: error
          retention-days: 14
