name: DWD Gebietsmittel · Monatsabschluss automatisch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-regional-monthly.yml"
      - "scripts/update_monthly.py"
  schedule:
    # Daily check; another check during the first 8 days after a month ends.
    - cron: "20 7 * * *"
    - cron: "20 15 1-8 * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: dwd-regional-monthly
  cancel-in-progress: false

jobs:
  update-monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: DWD-Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Offizielle Monatsgebietsmittel unabhängig von anderen Modulen einlesen
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from update_monthly import update_monthly
          result = update_monthly(Path("."))
          print("DWD-Gebietsmittel:",result["latest_by_parameter"])
          assert result["area_count"] >= 16
          PY

      - name: Neue amtliche Monatswerte veröffentlichen
        id: changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Keine neuen DWD-Gebietsmittelwerte."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Aktualisiere amtliche DWD-Monatsgebietsmittel"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Pages mit den neuen DWD-Monatswerten aktualisieren
        if: steps.changed.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages-only.yml --ref main
