name: DWD Temperaturgegensätze · Originalmessungen
on:
  workflow_dispatch:
    inputs:
      first:
        description: Erstes Jahr (leer = nächste Archivlücke)
        required: false
        type: string
      last:
        description: Letztes Jahr (leer = bis zu 5 Jahre)
        required: false
        type: string
  pull_request:
    paths: [scripts/build_temperature_contrast.py, tests/test_temperature_contrast.py, tests/audit_temperature_contrast.py, stations_temperaturgegensatz.js, stations_temperaturgegensatz.html, .github/workflows/update-temperature-contrast.yml]
  push:
    branches: [main]
    paths: [scripts/build_temperature_contrast.py, .github/workflows/update-temperature-contrast.yml]
  schedule:
    - cron: '24 2 * * *'
permissions:
  contents: read
concurrency:
  group: temperature-contrast-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/build_temperature_contrast.py
            tests/test_temperature_contrast.py
            tests/audit_temperature_contrast.py
            stations_temperaturgegensatz.html
            stations_temperaturgegensatz.js
            stations_rekordlabor.css
            dashboard_theme.css
            dashboard_theme.js
            t850_vector_export.js
            data/rekordlabor/contrast/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install 'numpy<2.4' 'numba>=0.61,<0.65'
      - name: Exact pair selection tests
        run: |
          python -m unittest discover -s tests -p test_temperature_contrast.py -v
          node --check stations_temperaturgegensatz.js
      - name: Verify original archive ZIPs on PR
        if: github.event_name == 'pull_request'
        run: |
          for mode in hourly daily; do
            python -u scripts/build_temperature_contrast.py --mode "$mode" --first 2025 --last 2025 --limit 8 --out /tmp/contrast-pilot
          done
      - name: Verify desktop and mobile against original DWD pilot
        if: github.event_name == 'pull_request'
        run: |
          pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          python -u tests/audit_temperature_contrast.py
      - name: Compute full station coverage in annual batches
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          INPUT_FIRST: ${{ inputs.first }}
          INPUT_LAST: ${{ inputs.last }}
        run: |
          set -euo pipefail
          root=data/rekordlabor/contrast
          current=$(date -u +%Y)
          first=${INPUT_FIRST:-}
          last=${INPUT_LAST:-}
          if [ -z "$first" ]; then
            if [ ! -f "$root/hourly/$((current-1))/ready.json" ] || [ ! -f "$root/daily/$((current-1))/ready.json" ]; then
              first=$((current-1)); last=$current
            else
              if [ "$(date -u +%u)" = 1 ]; then first=$current; last=$current; fi
              for y in $(seq 1991 "$current"); do
                [ -z "$first" ] || break
                if [ ! -f "$root/hourly/$y/ready.json" ] || [ ! -f "$root/daily/$y/ready.json" ]; then first=$y; break; fi
              done
              first=${first:-$current}
            fi
          fi
          [[ "$first" =~ ^[0-9]{4}$ ]] && ((first>=1991 && first<=current))
          last=${last:-$((first+4))}
          [[ "$last" =~ ^[0-9]{4}$ ]] && ((last>=first))
          ((last<=current)) || last=$current
          for mode in hourly daily; do
            python -u scripts/build_temperature_contrast.py --mode "$mode" --first "$first" --last "$last" --out "$root"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/rekordlabor/contrast')
          result={m:[json.loads(p.read_text()) for p in sorted((root/m).glob('*/ready.json'))] for m in ('hourly','daily')}
          (root/'index.json').write_text(json.dumps(result,indent=2))
          PY
      - name: Commit complete annual batches
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rekordlabor/contrast/
          git diff --cached --quiet && exit 0
          git commit -m 'data: DWD spatial temperature contrast annual archives'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
