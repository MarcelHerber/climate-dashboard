name: DWD Temperaturgegensätze · Originalmessungen
on:
  workflow_dispatch:
    inputs:
      first:
        description: Erstes Jahr (leer = alle Archivlücken ab 1901; Stundenwerte ab 1951)
        required: false
        type: string
      last:
        description: Letztes Jahr (leer = automatisch bis heute; bei Startjahr maximal fünf Jahre)
        required: false
        type: string
  pull_request:
    paths: [scripts/build_temperature_contrast.py, tests/test_temperature_contrast.py, tests/test_temperature_contrast_quality.py, tests/test_temperature_contrast_combined.py, tests/audit_temperature_contrast.py, tests/test_temperature_contrast_backfill.py, stations_temperaturgegensatz.js, stations_temperaturgegensatz.html, .github/workflows/update-temperature-contrast.yml]
  push:
    branches: [main]
    paths: [scripts/build_temperature_contrast.py, .github/workflows/update-temperature-contrast.yml]
  schedule:
    - cron: '24 2 * * *'
    - cron: '24 5,8,11,14,17,20,23 * * *'
permissions:
  contents: read
concurrency:
  group: temperature-contrast-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/build_temperature_contrast.py
            tests/test_temperature_contrast.py
            tests/test_temperature_contrast_quality.py
            tests/test_temperature_contrast_combined.py
            tests/audit_temperature_contrast.py
            tests/test_temperature_contrast_backfill.py
            .github/workflows/update-temperature-contrast.yml
            stations_temperaturgegensatz.html
            stations_temperaturgegensatz.js
            stations_rekordlabor.css
            dashboard_theme.css
            dashboard_theme.js
            t850_vector_export.js
            data/rekordlabor/contrast/
            data/dwd_decade_records.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install 'numpy<2.4' 'numba>=0.61,<0.65' PyYAML
      - name: Exact pair selection tests
        run: |
          python -m unittest discover -s tests -p test_temperature_contrast.py -v
          python -m unittest discover -s tests -p test_temperature_contrast_quality.py -v
          python -m unittest discover -s tests -p test_temperature_contrast_combined.py -v
          node --check stations_temperaturgegensatz.js
          python -m unittest discover -s tests -p test_temperature_contrast_backfill.py -v
      - name: Verify original archive ZIPs on PR
        if: github.event_name == 'pull_request'
        run: |
          for mode in daily hourly; do
            python -u scripts/build_temperature_contrast.py --mode "$mode" --first 2025 --last 2025 --limit 8 --out /tmp/contrast-pilot --reference /tmp/contrast-pilot-ref.npz --decade-records data/dwd_decade_records.json
          done
      - name: Verify desktop and mobile against original DWD pilot
        if: github.event_name == 'pull_request'
        run: |
          pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          python -u tests/audit_temperature_contrast.py
      - name: Compute full station coverage in annual batches and publish checkpoints
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          INPUT_FIRST: ${{ inputs.first }}
          INPUT_LAST: ${{ inputs.last }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          root=data/rekordlabor/contrast
          current=$(date -u +%Y)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ready() {
            daily_ready "$1" || return 1
            (( $1 < 1951 )) && return 0
            local marker="$root/hourly/$1/ready.json"
            if [ ! -f "$marker" ] && (( $1 < 1991 )); then marker="$root/hourly/$1/unavailable.json"; fi
            [ -f "$marker" ] || return 1
            grep -Eq '"quality_version"[[:space:]]*:[[:space:]]*"contrast-qc-v2"' "$marker" || return 1
            if (( $1 <= 1991 )); then grep -Eq '"time_reference"[[:space:]]*:[[:space:]]*"utc-md-v2"' "$marker" || return 1; fi
            return 0
          }
          daily_ready() {
            local marker="$root/daily/$1/ready.json"
            [ -f "$marker" ] && grep -Eq '"quality_version"[[:space:]]*:[[:space:]]*"contrast-qc-v2"' "$marker"
          }
          current_stale() {
            local expected actual mode
            expected=$(date -u -d yesterday +%Y%m%d)
            for mode in hourly daily; do
              actual=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("end", ""))' "$root/$mode/$current/ready.json")
              if [[ -n "$actual" && "$actual" < "$expected" ]]; then return 0; fi
            done
            return 1
          }
          run_batch() {
            local first=$1 last=$2
            echo "::group::Archive $first–$last"
            local reference="${RUNNER_TEMP:-/tmp}/contrast-daily-reference.npz"
            python -u scripts/build_temperature_contrast.py --mode daily --first "$first" --last "$last" --out "$root" --reference "$reference" --decade-records data/dwd_decade_records.json
            if ((last>=1951)); then
              local hour_first=$first
              ((hour_first>=1951)) || hour_first=1951
              python -u scripts/build_temperature_contrast.py --mode hourly --first "$hour_first" --last "$last" --out "$root" --reference "$reference" --decade-records data/dwd_decade_records.json
            fi
            for y in $(seq "$first" "$last"); do ready "$y" || return 1; done
            python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/rekordlabor/contrast')
          result={m:[json.loads(p.read_text()) for p in sorted((root/m).glob('*/ready.json'))] for m in ('hourly','daily')}
          result['hourlyUnavailable']=[d for p in sorted((root/'hourly').glob('*/unavailable.json')) if not (p.parent/'ready.json').exists() for d in [json.loads(p.read_text())] if d.get('time_reference')=='utc-md-v2' and d.get('quality_version')=='contrast-qc-v2']
          (root/'index.json').write_text(json.dumps(result,indent=2))
          PY
            git add "$root"
            if ! git diff --cached --quiet; then
              git commit -m "data: DWD temperature contrasts $first-$last"
              for i in 1 2 3 4 5; do
                if git push origin HEAD:main; then
                  echo "::endgroup::"
                  return 0
                fi
                git pull --rebase origin main
              done
              return 1
            fi
            echo "::endgroup::"
          }
          first=${INPUT_FIRST:-}
          last=${INPUT_LAST:-}
          if [[ -n "$first" || -n "$last" ]]; then
            if [[ -z "$first" ]]; then
              for y in $(seq 1901 "$current"); do
                if ! ready "$y"; then first=$y; break; fi
              done
              first=${first:-$current}
            fi
            [[ "$first" =~ ^[0-9]{4}$ ]] && ((first>=1901 && first<=current)) || exit 1
            last=${last:-$((first+4))}
            [[ "$last" =~ ^[0-9]{4}$ ]] && ((last>=first)) || exit 1
            ((last<=current)) || last=$current
            while ((first<=last)); do
              end=$((first+4))
              ((end<=last)) || end=$last
              run_batch "$first" "$end"
              first=$((end+1))
            done
            exit 0
          fi
          # Historical work is checkpointed before moving to the next gap.
          # A failed or timed-out run resumes at the first unfinished year.
          if [[ -n "${EVENT_SCHEDULE:-}" && "$EVENT_SCHEDULE" != '24 2 * * *' ]]; then
            pending=0
            for y in $(seq 1901 "$current"); do if ! ready "$y"; then pending=1; break; fi; done
            ((pending)) || exit 0
          fi
          refreshed_current=0
          if ! ready "$((current-1))"; then
            run_batch "$((current-1))" "$current"
            refreshed_current=1
          elif ! ready "$current" || [ "$(date -u +%u)" = 1 ] || current_stale; then
            run_batch "$current" "$current"
            refreshed_current=1
          fi
          y=1901
          while ((y<current)); do
            if ready "$y"; then
              y=$((y+1))
              continue
            fi
            first=$y
            last=$y
            while ((last-first<4 && last+1<current)); do
              if ready "$((last+1))"; then break; fi
              last=$((last+1))
            done
            run_batch "$first" "$last"
            y=$((last+1))
          done
          if ((refreshed_current==0)); then run_batch "$current" "$current"; fi

