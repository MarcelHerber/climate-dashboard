name: CFSR/CFSv2 1991–2020 · uniform f003 original GRIB backfill
on:
  push:
    branches: [feature/gfs-cfsr-1991-2020-europe-20261113]
    paths:
      - "scripts/import_cfsr_cfsv2_f003_1991_2020.py"
      - "scripts/build_gfs_cfsr_f003_1991_2020.py"
      - "tests/test_cfsr_cfsv2_f003.py"
      - ".github/workflows/backfill-cfsr-cfsv2-f003-1991-2020.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfsr-cfsv2-f003-1991-2020
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy requests pytest
      - name: Reject mixed f000/f003, invalid CFSR/CFSv2 transition, missing years
        run: |
          python -m pytest -q tests/test_cfsr_cfsv2_f003.py
          python -m compileall -q scripts/import_cfsr_cfsv2_f003_1991_2020.py scripts/build_gfs_cfsr_f003_1991_2020.py

  historical-year:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'Start uniform CFSR/CFSv2 f003 climatology backfill')
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy requests eccodes
      - name: Import every source month using only actual 03/09/15/21 UTC f003 temperatures
        run: python scripts/import_cfsr_cfsv2_f003_1991_2020.py --year ${{ matrix.year }}
      - name: Preserve 365 days of four genuine +3h original 2m temperature fields
        uses: actions/upload-artifact@v4
        with:
          name: cfs-f003-year-${{ matrix.year }}
          path: gfs_analysis_europe/reference_sources_f003/t2m_6h_${{ matrix.year }}.npz
          retention-days: 7
          compression-level: 1
          if-no-files-found: error

  finalize:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'Start uniform CFSR/CFSv2 f003 climatology backfill')
    needs: historical-year
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: Restore all 30 homogeneous f003 annual original sources
        uses: actions/download-artifact@v4
        with:
          pattern: cfs-f003-year-*
          merge-multiple: true
          path: gfs_analysis_europe/reference_sources_f003
      - name: Verify 30 years, 360 original monthly checksums, identical +3h lead
        run: |
          python scripts/build_gfs_cfsr_f003_1991_2020.py
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from scripts import build_gfs_cfsr_f003_1991_2020 as builder
          years=[builder.check_source(y,builder.SOURCE / f"t2m_6h_{y}.npz")
                 for y in range(1991,2021)]
          assert len(years)==30
          assert sum(len(metadata["source_files"]) for sample,metadata in years)==360
          assert all(metadata["forecast_hour"]==3 for sample,metadata in years)
          assert all(metadata["hours_utc"]==[3,9,15,21] for sample,metadata in years)
          assert all(metadata["cycles_utc"]==[0,6,12,18] for sample,metadata in years)
          with np.load(builder.DEST,allow_pickle=False) as f:
              m=json.loads(str(f["metadata_json"]))
              assert m["reference_version"]=="cfsr-cfsv2-t2m-f003-v1"
              assert m["forecast_hour"]==3 and m["source_months"]==360
              assert f["normal_t2m_c"].shape==(365,76,140)
              assert np.all(f["year_count"]==30)
          print("VERIFIED: full 1991–2020 CFSR/CFSv2 f003 normal from 360 original GRIB archives")
          PY
      - name: Archive reference ready for separate GFS f003 anomaly comparison
        uses: actions/upload-artifact@v4
        with:
          name: cfsr-cfsv2-1991-2020-f003-reference-verified
          path: gfs_analysis_europe/climatology_1991_2020_f003.npz
          if-no-files-found: error
          retention-days: 30
      - name: Commit only proven reference to development branch
        if: github.ref == 'refs/heads/feature/gfs-cfsr-1991-2020-europe-20261113'
        run: |
          set -euo pipefail
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gfs_analysis_europe/climatology_1991_2020_f003.npz
          git commit -m "GFS Europa: echte homogene CFSR/CFSv2 f003-Normalwerte 1991–2020"
          for TRY in 1 2 3; do
            git fetch origin feature/gfs-cfsr-1991-2020-europe-20261113
            if ! git rebase origin/feature/gfs-cfsr-1991-2020-europe-20261113; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:feature/gfs-cfsr-1991-2020-europe-20261113; then
              exit 0
            fi
            sleep $((5*TRY))
          done
          exit 1
