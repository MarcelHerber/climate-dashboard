name: GFS Europa 7 Tage · aktuelle echte NOAA-Modellprognose
on:
  push:
    branches: [main, feature/gfs-7day-europe-anomaly-20261114]
    paths:
      - ".github/workflows/update-gfs-weekly-europe.yml"
      - "scripts/update_gfs_weekly_europe.py"
      - "tests/test_gfs_weekly_europe.py"
  workflow_dispatch:
  schedule:
    - cron: "43 5,11,17,23 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: gfs-weekly-europe-updates
  cancel-in-progress: false
jobs:
  verified-seven-day:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
            gfs_analysis_europe/climatology_1991_2020_f003.npz
            gfs_analysis_europe/weekly_f003.json
          sparse-checkout-cone-mode: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy requests eccodes pytest
      - name: Reject mismatched forecast hours and unverified reference series
        run: |
          python -m pytest -q tests/test_gfs_weekly_europe.py
          python -m compileall -q scripts/update_gfs_weekly_europe.py
      - name: Verify all 28 genuine original NOAA GFS 0.5 degree f003..f165 forecast fields
        run: python -m scripts.update_gfs_weekly_europe
      - name: Verify seven future days, original GRIB checksums and 30-year climate normal
        run: |
          python - <<'PY'
          import base64,json
          from pathlib import Path
          from datetime import datetime,timezone
          from array import array
          x=json.loads(Path("gfs_analysis_europe/weekly_f003.json").read_text())
          assert x["schema"]==1 and x["type"]=="model_forecast_7day_not_observation"
          assert x["sample_count"]==28 and x["period_days"]==7
          assert x["lead_hours"]==list(range(3,166,6))
          assert len(x["sources"])==28
          assert all(s["forecast_hour"]==h and len(s["sha256"])==64 and
                     "0p50" in s["source_url"] for s,h in zip(x["sources"],x["lead_hours"]))
          m=x["reference_metadata"]
          assert m["reference_version"]=="cfsr-cfsv2-t2m-f003-v1"
          assert m["forecast_hour"]==3 and m["years"]==30 and m["source_months"]==360
          now=datetime.now(timezone.utc)
          start=datetime.fromisoformat(x["run_utc"].replace("Z","+00:00"))
          assert 0 <= (now-start).total_seconds()/3600 < 30
          for name in ("forecast_mean_q10_b64","anomaly_mean_q10_b64"):
              raw=base64.b64decode(x[name],validate=True)
              assert len(raw)==140*76*2
              values=array("h");values.frombytes(raw)
              assert sum(v==-32768 for v in values)==0
          print("Verified 28 real NOAA GFS weekly fields against CFSR/CFSv2 1991–2020")
          PY
      - name: Publish only fully verified current 7-day index to main
        if: github.ref == 'refs/heads/main'
        id: publish
        run: |
          set -euo pipefail
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f gfs_analysis_europe/weekly_f003.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "GFS Europa: verifizierte 7-Tage-Temperaturanomalie aktualisiert"
          for TRY in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((5*TRY))
          done
          exit 1
      - name: Publish fresh forecast on GitHub Pages after bot commit
        if: github.ref == 'refs/heads/main' && steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages-only.yml --repo "$GITHUB_REPOSITORY" --ref main
