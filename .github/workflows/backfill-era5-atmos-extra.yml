name: ERA5 Erweiterungsarchiv 1940-2025 schrittweise

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-era5-atmos-extra.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# A single serial planner; at most two CDS / rendering jobs at once.
concurrency:
  group: era5-atmos-extra-1940-2025
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.next.outputs.has_work }}
      month: ${{ steps.next.outputs.month }}
      years: ${{ steps.next.outputs.years }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: |
            scripts
            era5_europe/extra
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Planungsbibliotheken bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 12 --timeout 90 --prefer-binary "cdsapi>=0.7.7" numpy xarray netCDF4 matplotlib cartopy pillow; then
              exit 0
            fi
            echo "::warning::Python Paketserver vorübergehend nicht erreichbar; Installationsversuch $attempt/3"
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Paketinstallation auch nach drei Versuchen fehlgeschlagen"
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
      - name: Nächsten noch nicht veröffentlichten Monatsblock wählen
        id: next
        shell: bash
        run: |
          set -euo pipefail
          source scripts/era5_gh_retry.sh
          python scripts/era5_atmos_extra.py plan \
            --index era5_europe/extra/index.json \
            --output "$GITHUB_OUTPUT" --batch-size 4

  prepare:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: scripts
      - name: Gemeinsamen historischen Referenz-Release bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source scripts/era5_gh_retry.sh
          TAG=era5-atmos-extra-reference-1940-2025-v1
          if ! gh_retry gh release view "$TAG" >/dev/null 2>&1; then
            gh_retry gh release create "$TAG" --target main \
              --title "ERA5 erweiterte Druckniveaus: Monatsreferenzen 1940-2025" \
              --notes "Echte ERA5-Monatsmittel, je Parameter und Kalendermonat; 0,25 Grad."
          fi

  references:
    needs: [plan, prepare]
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        parameter: [t925, t700, t500, rh700, omega500, u300]
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_MONTH: ${{ needs.plan.outputs.month }}
      PARAM: ${{ matrix.parameter }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: scripts
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: CDS-Pakete und Kartenbibliotheken einrichten
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 12 --timeout 90 --prefer-binary "cdsapi>=0.7.7" numpy xarray netCDF4 matplotlib cartopy pillow; then
              exit 0
            fi
            echo "::warning::Python Paketserver vorübergehend nicht erreichbar; Installationsversuch $attempt/3"
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Paketinstallation auch nach drei Versuchen fehlgeschlagen"
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
      - name: Vorhandene Referenz erkennen
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          source scripts/era5_gh_retry.sh
          FILE="month_${TARGET_MONTH}_${PARAM}.npz"
          ASSETS="$(gh_release_assets era5-atmos-extra-reference-1940-2025-v1)"
          if grep -Fxq "$FILE" <<< "$ASSETS"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "$FILE ist bereits veröffentlicht."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: CDS API einrichten
        if: steps.existing.outputs.ready != 'true'
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: |
          set -euo pipefail
          source scripts/era5_gh_retry.sh
          test -n "${CDSAPI_KEY:-}"
          printf 'url: https://cds.climate.copernicus.eu/api\nkey: %s\n' "$CDSAPI_KEY" > "$HOME/.cdsapirc"
          chmod 600 "$HOME/.cdsapirc"
      - name: Ein Parameter-Monatsarchiv 1940-2025 berechnen
        if: steps.existing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/era5_gh_retry.sh
          FILE="month_${TARGET_MONTH}_${PARAM}.npz"
          mkdir -p .era5-extra-refs
          python scripts/era5_atmos_extra.py reference \
            --month "$((10#$TARGET_MONTH))" --parameter "$PARAM" \
            --output ".era5-extra-refs/$FILE"
          gh_retry gh release upload era5-atmos-extra-reference-1940-2025-v1 \
            ".era5-extra-refs/$FILE" --clobber
      - name: Veröffentlichtes Referenzpaket verifizieren
        shell: bash
        run: |
          set -euo pipefail
          source scripts/era5_gh_retry.sh
          FILE="month_${TARGET_MONTH}_${PARAM}.npz"
          ASSETS="$(gh_release_assets era5-atmos-extra-reference-1940-2025-v1)"
          grep -Fxq "$FILE" <<< "$ASSETS"

  render:
    needs: [plan, references]
    if: needs.references.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: ${{ fromJSON(needs.plan.outputs.years) }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_MONTH: ${{ needs.plan.outputs.month }}
      TARGET_YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: scripts
      - name: Python und Kartografie installieren
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Python-Pakete mit Wiederholungen installieren
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 12 --timeout 90 --prefer-binary "cdsapi>=0.7.7" numpy xarray netCDF4 matplotlib cartopy pillow; then
              exit 0
            fi
            echo "::warning::Python Paketserver vorübergehend nicht erreichbar; Installationsversuch $attempt/3"
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Paketinstallation auch nach drei Versuchen fehlgeschlagen"
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
      - name: Fertigen Monatsrelease wiederverwenden
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          source scripts/era5_gh_retry.sh
          YEAR="$TARGET_YEAR"
          MONTH="$TARGET_MONTH"
          PERIOD="$YEAR-$MONTH"
          TAG="era5-atmos-extra-$YEAR-v1"
          OUT=".era5-extra-year/$YEAR"
          mkdir -p "$OUT"
          if gh_retry gh release view "$TAG" >/dev/null 2>&1; then
            ASSETS="$(gh_release_assets "$TAG")"
            READY=true
            for KEY in t925 t700 t500 rh700 omega500 u300; do
              if ! grep -Fxq "$PERIOD-$KEY.webp" <<< "$ASSETS"; then READY=false; fi
            done
            if ! grep -Fxq "$PERIOD-manifest.json" <<< "$ASSETS"; then READY=false; fi
            if [[ "$READY" == true ]]; then
              gh_retry gh release download "$TAG" --pattern "$PERIOD-manifest.json" --dir "$OUT"
              mv "$OUT/$PERIOD-manifest.json" "$OUT/manifest.json"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "$PERIOD bereits vollständig publiziert."
              exit 0
            fi
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
      - name: Sechs verifizierte Monatspakete laden
        if: steps.existing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/era5_gh_retry.sh
          mkdir -p .era5-extra-refs
          gh_retry gh release download era5-atmos-extra-reference-1940-2025-v1 \
            --pattern "month_${TARGET_MONTH}_*.npz" --dir .era5-extra-refs
          test "$(find .era5-extra-refs -maxdepth 1 -name '*.npz' | wc -l)" -eq 6
      - name: Sechs echte ERA5-Kartenatlanten pro Monat erzeugen
        if: steps.existing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/era5_gh_retry.sh
          YEAR="$TARGET_YEAR"
          python scripts/era5_atmos_extra.py render \
            --year "$YEAR" --month "$((10#$TARGET_MONTH))" \
            --references .era5-extra-refs --output ".era5-extra-year/$YEAR"
          test "$(find ".era5-extra-year/$YEAR" -maxdepth 1 -name '*.webp' | wc -l)" -eq 6
      - name: Separaten Jahresrelease sicher vervollständigen
        if: steps.existing.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/era5_gh_retry.sh
          YEAR="$TARGET_YEAR"
          PERIOD="$YEAR-$TARGET_MONTH"
          TAG="era5-atmos-extra-$YEAR-v1"
          OUT=".era5-extra-year/$YEAR"
          if ! gh_retry gh release view "$TAG" >/dev/null 2>&1; then
            gh_retry gh release create "$TAG" --target main \
              --title "ERA5 erweiterte atmosphärische Monatskarten $YEAR" \
              --notes "Nur validierte ERA5-Reanalysedaten, 1991-2020 Referenz, 1940-2025 Rang."
          fi
          gh_retry gh release upload "$TAG" "$OUT"/*.webp --clobber
          cp "$OUT/manifest.json" "$OUT/$PERIOD-manifest.json"
          gh_retry gh release upload "$TAG" "$OUT/$PERIOD-manifest.json" --clobber
      - name: Vollständigkeit des Releases prüfen
        shell: bash
        run: |
          set -euo pipefail
          source scripts/era5_gh_retry.sh
          PERIOD="$TARGET_YEAR-$TARGET_MONTH"
          TAG="era5-atmos-extra-$TARGET_YEAR-v1"
          ASSETS="$(gh_release_assets "$TAG")"
          for KEY in t925 t700 t500 rh700 omega500 u300; do
            grep -Fxq "$PERIOD-$KEY.webp" <<< "$ASSETS"
          done
          grep -Fxq "$PERIOD-manifest.json" <<< "$ASSETS"
          test -s ".era5-extra-year/$TARGET_YEAR/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: era5-atmos-extra-verified-${{ matrix.year }}
          path: .era5-extra-year/${{ matrix.year }}/manifest.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: render
    if: needs.render.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            era5_europe
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Python-Bibliotheken für Manifestprüfung bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --retries 12 --timeout 90 --prefer-binary "cdsapi>=0.7.7" numpy xarray netCDF4 matplotlib cartopy pillow; then
              exit 0
            fi
            echo "::warning::Python Paketserver vorübergehend nicht erreichbar; Installationsversuch $attempt/3"
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Paketinstallation auch nach drei Versuchen fehlgeschlagen"
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: era5-atmos-extra-verified-*
          path: .era5-extra-verified
          merge-multiple: false
      - name: Nur verifizierte Jahre/Monate im Pages-Index aktivieren
        shell: bash
        run: |
          set -euo pipefail
          source scripts/era5_gh_retry.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/era5_atmos_extra.py merge \
              --artifacts .era5-extra-verified --repo .
            git add era5_europe/extra
            if git diff --cached --quiet; then
              echo "Bereits veröffentlicht."
              exit 0
            fi
            git commit -m "Publish verified ERA5 expanded historical month batch"
            if git push origin HEAD:main; then
              echo "Verifizierter ERA5-Erweiterungsblock auf main."
              exit 0
            fi
            echo "Git-Konflikt; wiederhole auf neuem main ($attempt/3)."
          done
          exit 1
      - name: Nächsten Archivblock unmittelbar nach Veröffentlichung anstoßen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source scripts/era5_gh_retry.sh
          # Use the locally verified and pushed index. A dispatch caused by
          # GITHUB_TOKEN is explicitly allowed to trigger another workflow.
          REMAINING="$(python - <<'PY'
          import json
          from pathlib import Path
          idx = json.loads(Path("era5_europe/extra/index.json").read_text(encoding="utf-8"))
          done = int(idx["completed"])
          expected = int(idx["expected"])
          if not 0 <= done <= expected:
              raise SystemExit(f"Invalid archive progress: {done}/{expected}")
          print(expected - done)
          PY
          )"
          if [[ "$REMAINING" -eq 0 ]]; then
            echo "Alle historischen ERA5-Erweiterungsmonate veröffentlicht; Backfill beendet."
            exit 0
          fi
          echo "Noch $REMAINING Monatsblöcke offen. Nächsten Lauf sofort starten."
          gh workflow run backfill-era5-atmos-extra.yml --ref main
          echo "Nächster Backfill angefordert. Stündlicher Cron bleibt als Fehler-Fallback aktiv."
