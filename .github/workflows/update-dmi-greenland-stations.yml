name: DMI Grönland · Stationen und Tageswerte

on:
  workflow_dispatch:
  schedule:
    - cron: "43 8,20 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_dmi_greenland_stations.py"
      - ".github/workflows/update-dmi-greenland-stations.yml"

permissions:
  contents: write

concurrency:
  group: dmi-greenland-stations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Offizielle DMI API abrufen und validieren
        run: |
          python scripts/build_dmi_greenland_stations.py
          python scripts/build_dmi_greenland_stations.py --check
      - name: Nur geprüfte Originalwerte veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dmi_greenland_stations.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen im DMI-Stationscache"
            exit 0
          fi
          git commit -m "data: update verified DMI Greenland station observations"
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 5; continue; }
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
