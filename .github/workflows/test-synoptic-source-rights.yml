name: Synoptic source legal and meteorological QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "isobaren_quellenpruefung.html"
      - "weltweite_isobaren.html"
      - "isobaren_original.html"
      - "isobaren_original.js"
      - "data/synoptic_charts/isobaren_quality_rights_2026-10-26.json"
      - "tests/test_synoptic_quality_rights.py"
      - ".github/workflows/test-synoptic-source-rights.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            tests/test_synoptic_quality_rights.py
            data/synoptic_charts/isobaren_quality_rights_2026-10-26.json
            weltweite_isobaren.html
            isobaren_original.html
            isobaren_original.js
            isobaren_quellenpruefung.html
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate all provider policies, UTC examples, source URL coverage and JavaScript
        run: python tests/test_synoptic_quality_rights.py -v
