name: Extremseiten ins Dashboard einbinden

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/add_extreme_pages_navigation.py

permissions:
  contents: write

concurrency:
  group: extreme-pages-navigation
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Navigation ergänzen
        run: |
          set -euo pipefail
          python scripts/add_extreme_pages_navigation.py

      - name: Einbindung prüfen
        run: |
          set -euo pipefail
          grep -q "jahresextremwerte.html" index.html
          grep -q "feiertagsextremwerte.html" index.html
          grep -q "Jahresextreme" index.html
          grep -q "Feiertags-Extreme" index.html
          test -f jahresextremwerte.html
          test -f feiertagsextremwerte.html
          test -f data/dwd_annual_extremes.json
          test -f data/dwd_holiday_extremes.json
          echo "Extremseiten sind im Dashboard verlinkt."

      - name: Dashboard veröffentlichen
        run: |
          set -euo pipefail

          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "Navigation bereits aktuell."
            exit 0
          fi

          git commit -m "Jahres- und Feiertagsextreme ins Dashboard einbinden [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "Dashboard-Navigation veröffentlicht."
