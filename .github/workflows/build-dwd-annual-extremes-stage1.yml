name: DWD jährliche Extremwerte Stufe 1

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dwd-annual-extremes-stage1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: python -m pip install requests

      - name: Jährliche Extremwerte bauen
        run: |
          set -euo pipefail
          python scripts/build_dwd_annual_extremes.py \
            --output data/dwd_annual_extremes.json \
            --max-workers 10

      - name: Datenbasis prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/dwd_annual_extremes.json")
          d = json.loads(p.read_text(encoding="utf-8"))

          expected = {
              "tnn",
              "txx",
              "summer_days_max",
              "hot_days_max",
              "desert_days_max",
              "tropical_nights_max",
              "rr24x",
              "snox_ge_400",
              "snox_lt_400",
          }

          assert d["version"] == 1
          assert len(d["areas"]) == 17
          assert set(d["metrics"]) == expected
          assert d["start_year"] == 1861
          assert d["data_start"] and d["data_through"]
          assert d["stats"]["kl_observations"] > 1_000_000
          assert d["stats"]["rr_observations"] > 1_000_000

          assert d["metrics"]["summer_days_max"]["threshold"] == "TXK >= 25.0"
          assert d["metrics"]["hot_days_max"]["threshold"] == "TXK >= 30.0"
          assert d["metrics"]["desert_days_max"]["threshold"] == "TXK >= 35.0"

          bw = d["records"]["Baden-Württemberg"]
          assert "2003" in bw and "2015" in bw and "2024" in bw

          print("DWD jährliche Extremwerte · Prüfung OK")
          print("Daten:", d["data_start"], "bis", d["data_through"])
          print("Gebiete:", len(d["areas"]))
          print("Parameter:", len(d["metrics"]))
          print("KL:", f'{d["stats"]["kl_observations"]:,}')
          print("RR:", f'{d["stats"]["rr_observations"]:,}')
          print(
              "Stationsjahre:",
              f'{d["stats"]["station_year_count_series"]:,}',
          )

          for year in ("2003", "2015", "2024"):
              row = bw[year]
              print(
                  year,
                  {
                      key: (value[0] if value else None)
                      for key, value in row.items()
                  },
              )
          PY

      - name: Datenbasis veröffentlichen
        run: |
          set -euo pipefail

          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dwd_annual_extremes.json

          if git diff --cached --quiet; then
            echo "Jährliche Extremwerte unverändert."
            exit 0
          fi

          git commit -m "DWD jährliche Extremwerte Stufe 1"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "Datenbasis veröffentlicht."
          echo "Frontend und Wind folgen bewusst in getrennten Schritten."
