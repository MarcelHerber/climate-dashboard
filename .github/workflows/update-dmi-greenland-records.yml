name: DMI Grönland · Historische Rekordkarte

on:
  workflow_dispatch:
  schedule:
    - cron: "13 7 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_dmi_greenland_records.py"
      - ".github/workflows/update-dmi-greenland-records.yml"

permissions:
  contents: write

concurrency:
  group: dmi-greenland-records
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Offizielle DMI-Jahresrekorde abfragen
        run: |
          python scripts/build_dmi_greenland_stations.py --check
          python scripts/build_dmi_greenland_records.py
          python scripts/build_dmi_greenland_records.py --check
      - name: Verifizierte Rekordranglisten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dmi_greenland_records.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh authentic DMI Greenland yearly extreme rankings"
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 4; continue; }
            git push origin HEAD:main && exit 0
            sleep 4
          done
          exit 1
