name: Monatsausblick Niederschlags-Ensembles aktualisieren

on:
  schedule:
    - cron: "51 1,7,13,19 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["HYRAS Flächenkarten aktualisieren"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "scripts/build_state_monthly_precip_outlook.py"
      - "scripts/build_state_monthly_ensemble_outlook.py"
      - "tests/test_state_monthly_precip_outlook.py"
      - "tests/test_state_monthly_hydro_sum.py"
      - "tests/test_state_monthly_rollover.py"
      - ".github/workflows/update-state-monthly-precip.yml"

permissions:
  contents: write

concurrency:
  group: state-monthly-precip-data
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten installieren
        run: python -m pip install -q requests shapely

      - name: Offline-Regressionen prüfen
        run: |
          python -m py_compile scripts/build_state_monthly_ensemble_outlook.py scripts/build_state_monthly_precip_outlook.py
          python -m unittest discover -s tests -p test_state_monthly_hydro_sum.py -v
          python -m unittest discover -s tests -p test_state_monthly_precip_outlook.py -v
          python -m unittest discover -s tests -p test_state_monthly_rollover.py -v

      - name: Beobachtete HYRAS-Tagessummen holen
        id: observation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/hyras-data:refs/remotes/origin/hyras-data --depth=1
          mkdir -p /tmp/state-monthly-precip
          if git cat-file -e origin/hyras-data:monthly_outlook/observed_precip.json; then
            git show origin/hyras-data:monthly_outlook/observed_precip.json > /tmp/state-monthly-precip/observed_precip.json
          else
            echo "HYRAS-Monatsbeobachtungen noch nicht veröffentlicht; Prognose ohne Messwerte."
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Vorherige Prognosen und Tagesmember laden
        if: steps.observation.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin state-monthly-precip >/dev/null 2>&1; then
            git fetch origin +refs/heads/state-monthly-precip:refs/remotes/origin/state-monthly-precip --depth=1
            git show origin/state-monthly-precip:state_monthly_precip.json > /tmp/state-monthly-precip/previous.json
            if git cat-file -e origin/state-monthly-precip:member_cache.json 2>/dev/null; then
              git show origin/state-monthly-precip:member_cache.json > /tmp/state-monthly-precip/member_cache.json
            fi
          fi

      - name: Niederschlags-Ensembles berechnen
        if: steps.observation.outputs.ready == 'true'
        run: |
          python scripts/build_state_monthly_precip_outlook.py \
            --observed /tmp/state-monthly-precip/observed_precip.json \
            --previous /tmp/state-monthly-precip/previous.json \
            --cache /tmp/state-monthly-precip/member_cache.json \
            --output /tmp/state-monthly-precip/state_monthly_precip.json

      - name: Ausgabe prüfen
        if: steps.observation.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_state_monthly_ensemble_outlook import validate_monthly_document
          p=Path('/tmp/state-monthly-precip/state_monthly_precip.json')
          doc=json.loads(p.read_text())
          assert doc['schema_version']==1 and doc['parameter']=='precipitation'
          validate_monthly_document(doc)
          print('Niederschlagsprodukt bereit:',doc['year'],doc['month'],p.stat().st_size)
          PY

      - name: Separaten Niederschlags-Datenbranch veröffentlichen
        if: steps.observation.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/state-monthly-precip
          rm -f observed_precip.json previous.json
          git init
          git checkout -b state-monthly-precip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state_monthly_precip.json member_cache.json
          git commit -m "Monatsausblick HYRAS Niederschlags-Ensembles aktualisiert"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin state-monthly-precip

      - name: Vollständigkeit der Modellläufe prüfen
        if: steps.observation.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          doc=json.load(open('/tmp/state-monthly-precip/state_monthly_precip.json'))
          missing=set(('gefs','ifs','aifs','icon_eu'))-set(doc['models_order'])
          retained=doc.get('retained_models',[])
          if not doc.get('observation_complete') and (missing or retained):
              raise SystemExit(f'Nur Teilprodukt veröffentlicht: fehlend={sorted(missing)}, ältere Läufe={retained}')
          PY
