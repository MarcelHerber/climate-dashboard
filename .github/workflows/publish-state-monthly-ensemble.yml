name: Bundesland Monats-Ensembles veröffentlichen

on:
  push:
    branches: ["main"]
    paths:
      - "state_monthly_ensemble.js"
      - "state_monthly_ensemble.css"
      - "scripts/patch_state_monthly_ensemble_frontend.py"
      - "scripts/build_pages_site.sh"
      - ".github/workflows/publish-state-monthly-ensemble.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-fast-deploy
  cancel-in-progress: false

jobs:
  integrate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Monatsensemble-Frontend einbauen
        run: python scripts/patch_state_monthly_ensemble_frontend.py

      - name: Integration prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="state-monthly-ensemble" class="tab-content"' index.html
          grep -q "switchTab('state-monthly-ensemble')" index.html
          grep -q 'href="state_monthly_ensemble.css' index.html
          grep -q 'src="state_monthly_ensemble.js' index.html
          grep -q 'state_monthly_ensemble.js' scripts/build_pages_site.sh
          node --check state_monthly_ensemble.js
          python -m py_compile scripts/patch_state_monthly_ensemble_frontend.py

          cp index.html /tmp/state-monthly-index-once.html
          cp scripts/build_pages_site.sh /tmp/state-monthly-build-once.sh
          python scripts/patch_state_monthly_ensemble_frontend.py
          cmp -s /tmp/state-monthly-index-once.html index.html
          cmp -s /tmp/state-monthly-build-once.sh scripts/build_pages_site.sh

      - name: Integration dauerhaft versionieren
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html scripts/build_pages_site.sh; then
            echo "Frontend bereits integriert."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html scripts/build_pages_site.sh
            git commit -m "feat: Bundesland Monats-Ensembles aktivieren [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Pages-Artefakt bauen
        run: bash scripts/build_pages_site.sh

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
          name: "github-pages-${{ github.run_attempt }}"

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: "10000"
          artifact_name: "github-pages-${{ github.run_attempt }}"
