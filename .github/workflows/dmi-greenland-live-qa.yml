name: DMI Grönland · Live Desktop und Handy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/test_greenland_live_browser.cjs"
      - "tests/test_greenland_map_live_browser.cjs"
      - "groenland_stationen.js"
      - "groenland_climate.js"
      - "tests/test_dmi_greenland_climate.cjs"
      - "groenland_stationen.html"
      - "groenland_stationen.css"
      - ".github/workflows/dmi-greenland-live-qa.yml"
  workflow_run:
    workflows: ["GitHub Pages schnell veröffentlichen"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dmi-greenland-live-qa
  cancel-in-progress: false

jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Authentischen DMI-Stationscache und Parser testen
        run: |
          node --check groenland_stationen.js
          node --test tests/test_dmi_greenland_ui.cjs
          node --check groenland_climate.js
          node --test tests/test_dmi_greenland_climate.cjs
          python scripts/build_dmi_greenland_records.py --check
          python scripts/build_dmi_greenland_stations.py --check
      - name: Historische DMI-API-Stationswerte serverseitig prüfen
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          query={"stationId":"04250","parameterId":"mean_temp","timeResolution":"year",
                 "datetime":"1953-01-01T00:00:00Z/2026-12-31T23:59:59Z","limit":"500"}
          url="https://opendataapi.dmi.dk/v2/climateData/collections/stationValue/items?"+urllib.parse.urlencode(query)
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"ClimateDashboard-Greenland-QA"}),timeout=60) as r:
            doc=json.load(r)
          print("Real DMI Greenland 04250 yearly mean_temp:",len(doc["features"]),
                "status",doc.get("numberReturned"),"first",doc["features"][0].get("properties",{}).get("from") if doc["features"] else None)
          assert len(doc["features"])>=5
          PY
      - name: Headless Chromium installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Repository-Seite mit echter DMI-API auf Desktop und Handy testen
        env:
          GREENLAND_LIVE_URL: http://127.0.0.1:8765/groenland_stationen.html
        run: |
          python -m http.server 8765 --directory . > /tmp/dmi-greenland-http.log 2>&1 &
          node tests/test_greenland_live_browser.cjs
      - name: Veröffentlichte Grönland-Karte nach Pages-Deployment auf Desktop und Handy prüfen
        if: github.event_name == 'workflow_run'
        run: node tests/test_greenland_map_live_browser.cjs
      - name: Test-Screenshots als Nachweis speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenland-desktop-mobile
          path: artifacts/greenland-*.png
          if-no-files-found: ignore
