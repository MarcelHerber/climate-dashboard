name: Test ASTA Luxembourg station data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asta-luxembourg-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: ASTA Luxemburg Offline-Selbsttest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_asta_luxembourg_station_data.py --self-test

      - name: ASTA Luxemburg Live-Probe
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_asta_luxembourg_station_data.py
