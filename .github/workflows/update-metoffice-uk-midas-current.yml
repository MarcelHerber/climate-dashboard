name: Build UK 2026 current cache (GHCN bridge)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: UK-Caches wiederherstellen
        id: cache_restore
        uses: actions/cache/restore@v5
        with:
          path: .cache/europe-stations
          key: metoffice-uk-ghcn-current-2026-v2-${{ github.run_id }}
          restore-keys: |
            metoffice-uk-ghcn-current-2026-v2-
            metoffice-uk-midas-baseline-2025-v1-

      - name: Parser-Selbsttests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_metoffice_uk_midas_station_cache.py --self-test
          python scripts/update_metoffice_uk_midas_current.py --self-test

      - name: UK 2026 aus GHCN-Daily bauen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_metoffice_uk_midas_current.py

      - name: UK Current Status anzeigen
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "=== UK CURRENT 2026 CACHE DATEIEN ==="
          find .cache/europe-stations -maxdepth 1 -type f \
            -name 'metoffice_uk_ghcn_bridge_current_2026*' \
            -printf '%f | %s bytes\n' | sort || true

          STATUS=".cache/europe-stations/metoffice_uk_ghcn_bridge_current_2026_status.json"
          if [[ -f "$STATUS" ]]; then
            echo
            echo "=== UK CURRENT 2026 STATUS ==="
            cat "$STATUS"
          fi

      - name: UK Current Cache speichern
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache/europe-stations
          key: metoffice-uk-ghcn-current-2026-v2-${{ github.run_id }}
