name: Build Met Office UK 2026 cache

on:
  workflow_dispatch:
    inputs:
      force:
        description: "UK-2026-Cache neu aus aktueller MIDAS-Datei bauen"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: UK MIDAS Caches wiederherstellen
        id: cache_restore
        uses: actions/cache/restore@v5
        with:
          path: .cache/europe-stations
          key: metoffice-uk-midas-current-2026-v1-${{ github.run_id }}
          restore-keys: |
            metoffice-uk-midas-current-2026-v1-
            metoffice-uk-midas-baseline-2025-v1-

      - name: Parser-Selbsttests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_metoffice_uk_midas_station_cache.py --self-test
          python scripts/update_metoffice_uk_midas_current.py --self-test

      - name: UK Current 2026 bauen
        shell: bash
        env:
          CEDA_ACCESS_TOKEN: ${{ secrets.CEDA_ACCESS_TOKEN }}
          CEDA_USERNAME: ${{ secrets.CEDA_USERNAME }}
          CEDA_PASSWORD: ${{ secrets.CEDA_PASSWORD }}
        run: |
          set -euo pipefail

          EXTRA_ARGS=""
          if [[ "${{ inputs.force }}" == "true" ]]; then
            EXTRA_ARGS="--force"
          fi

          python scripts/update_metoffice_uk_midas_current.py $EXTRA_ARGS

      - name: UK Current Status anzeigen
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== UK MIDAS CURRENT CACHE DATEIEN ==="
          find .cache/europe-stations -maxdepth 1 -type f \
            -name 'metoffice_uk_midas_current_2026*' \
            -printf '%f | %s bytes\n' | sort || true

          if [[ -f ".cache/europe-stations/metoffice_uk_midas_current_2026_status.json" ]]; then
            echo
            echo "=== UK MIDAS CURRENT 2026 STATUS ==="
            cat ".cache/europe-stations/metoffice_uk_midas_current_2026_status.json"
          fi

      - name: UK Current Cache speichern
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache/europe-stations
          key: metoffice-uk-midas-current-2026-v1-${{ github.run_id }}
