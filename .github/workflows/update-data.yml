name: DWD-Daten aktualisieren und GitHub Pages veröffentlichen

on:
  schedule:
    - cron: "17 10 * * *"
      timezone: "Europe/Berlin"
    - cron: "17 11 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      station_records_full:
        description: "Stationsrekorde vollständig neu aufbauen"
        required: false
        type: boolean
        default: false
      station_precip_full:
        description: "Stations-Niederschlagskurven vollständig neu aufbauen"
        required: false
        type: boolean
        default: false
      station_climate_days_full:
        description: "Stations-Kenntage vollständig neu aufbauen"
        required: false
        type: boolean
        default: false
      station_heatwaves_full:
        description: "Stations-Hitzewellen vollständig neu aufbauen"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Python-Pakete installieren
        run: python -m pip install -r requirements.txt

      - name: DWD-Daten aktualisieren
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.station_records_full }}" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --station-records-full"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.station_precip_full }}" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --station-precip-full"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.station_climate_days_full }}" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --station-climate-days-full"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.station_heatwaves_full }}" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --station-heatwaves-full"
          fi
          python scripts/update_dashboard.py --workers 8 $EXTRA_ARGS

      - name: Dashboard-Performancepatch anwenden
        run: python scripts/patch_dashboard_lazy_loading.py

      - name: Änderungen versionieren
        id: versioning
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data.json \
            daily_tmax_1881_2026.json \
            station_records.json \
            station_record_state.json \
            station_records_years \
            station_precip_index.json \
            station_precip_state.json \
            station_precip_climate \
            station_precip_current \
            station_climate_days_index.json \
            station_climate_days_state.json \
            station_climate_days_profiles \
            station_climate_days_current \
            station_heatwaves_index.json \
            station_heatwaves_state.json \
            station_heatwaves_profiles \
            station_heatwaves_current.json \
            update_status.json \
            index.html

          REAL_CHANGES="$(git diff --cached --name-only | grep -v '^update_status\.json$' || true)"

          if [[ -z "$REAL_CHANGES" ]]; then
            echo "Keine neuen oder korrigierten DWD-/Frontend-Daten vorhanden."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git restore --staged update_status.json 2>/dev/null || true
            git restore update_status.json 2>/dev/null || true
            exit 0
          fi

          echo "Neue Änderungen erkannt:"
          printf '%s\n' "$REAL_CHANGES"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git commit -m "DWD-Daten automatisch aktualisiert [skip ci]"

          PUSH_OK=false
          for ATTEMPT in 1 2 3; do
            echo "Push-Versuch ${ATTEMPT}/3 ..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              PUSH_OK=true
              break
            fi
            sleep $((ATTEMPT * 5))
          done

          if [[ "$PUSH_OK" != "true" ]]; then
            exit 1
          fi

      - name: Schlanken Veröffentlichungsordner erstellen
        if: github.event_name != 'schedule' || steps.versioning.outputs.changed == 'true'
        run: bash scripts/build_pages_site.sh

      - name: GitHub Pages konfigurieren
        if: github.event_name != 'schedule' || steps.versioning.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Website-Artefakt hochladen
        if: github.event_name != 'schedule' || steps.versioning.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: GitHub Pages veröffentlichen
        if: github.event_name != 'schedule' || steps.versioning.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: "10000"

      - name: Keine neuen DWD-Daten – späterer Prüflauf übernimmt
        if: github.event_name == 'schedule' && steps.versioning.outputs.changed != 'true'
        run: |
          echo "Bei diesem Prüflauf lagen noch keine neuen DWD-Daten vor."
          echo "Der zweite tägliche Zeitplan prüft rund eine Stunde später automatisch erneut."
