name: DWD-Daten aktualisieren und GitHub Pages veröffentlichen

on:
  schedule:
    - cron: "17 10 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      station_records_full:
        description: "Stationsrekorde vollständig neu aufbauen"
        required: false
        type: boolean
        default: false
      station_precip_full:
        description: "Stations-Niederschlagskurven vollständig neu aufbauen"
        required: false
        type: boolean
        default: false
      station_climate_days_full:
        description: "Stations-Kenntage vollständig neu aufbauen"
        required: false
        type: boolean
        default: false
      station_heatwaves_full:
        description: "Stations-Hitzewellen vollständig neu aufbauen"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

# GitHub Pages erlaubt nur eine aktive Veröffentlichung gleichzeitig.
# Weitere Läufe warten deshalb, statt einen laufenden Pages-Deploy abzubrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Python-Pakete installieren
        run: python -m pip install -r requirements.txt

      - name: DWD-Daten aktualisieren
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.station_records_full }}" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --station-records-full"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.station_precip_full }}" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --station-precip-full"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.station_climate_days_full }}" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --station-climate-days-full"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.station_heatwaves_full }}" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --station-heatwaves-full"
          fi
          python scripts/update_dashboard.py --workers 8 $EXTRA_ARGS

      - name: Änderungen versionieren
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data.json \
            daily_tmax_1881_2026.json \
            station_records.json \
            station_record_state.json \
            station_records_years \
            station_precip_index.json \
            station_precip_state.json \
            station_precip_climate \
            station_precip_current \
            station_climate_days_index.json \
            station_climate_days_state.json \
            station_climate_days_profiles \
            station_climate_days_current \
            station_heatwaves_index.json \
            station_heatwaves_state.json \
            station_heatwaves_profiles \
            station_heatwaves_current.json \
            update_status.json

          if git diff --cached --quiet; then
            echo "Keine neuen oder korrigierten DWD-Daten vorhanden."
            exit 0
          fi

          git commit -m "DWD-Daten automatisch aktualisiert [skip ci]"

          # Während des langen DWD-Laufs kann auf GitHub ein neuer manueller
          # Commit eintreffen. Der Daten-Commit wird deshalb vor dem Push auf
          # den neuesten Stand von main gesetzt. Bei einem erneuten Rennen wird
          # der Vorgang bis zu dreimal wiederholt.
          PUSH_OK=false
          for ATTEMPT in 1 2 3; do
            echo "Push-Versuch ${ATTEMPT}/3 ..."
            git fetch origin main

            if ! git rebase origin/main; then
              echo "FEHLER: Die automatisch erzeugten Daten kollidieren mit einer neueren Änderung auf main."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              PUSH_OK=true
              break
            fi

            echo "Remote wurde während des Pushs erneut geändert; neuer Versuch folgt."
            sleep $((ATTEMPT * 5))
          done

          if [[ "$PUSH_OK" != "true" ]]; then
            echo "FEHLER: Push war nach drei Versuchen weiterhin nicht möglich."
            exit 1
          fi

      - name: Veröffentlichungsordner erstellen
        shell: bash
        run: |
          rm -rf _site
          mkdir -p \
            _site/station_records_years \
            _site/station_precip_climate \
            _site/station_precip_current \
            _site/station_climate_days_profiles \
            _site/station_climate_days_current \
            _site/station_heatwaves_profiles
          cp \
            index.html \
            data.json \
            daily_tmax_1881_2026.json \
            station_records.json \
            station_precip_index.json \
            station_climate_days_index.json \
            station_heatwaves_index.json \
            station_heatwaves_current.json \
            update_status.json \
            .nojekyll \
            _site/
          cp station_records_years/*.json _site/station_records_years/
          cp station_precip_climate/*.json _site/station_precip_climate/
          cp station_precip_current/*.json _site/station_precip_current/
          cp station_climate_days_profiles/*.json _site/station_climate_days_profiles/
          cp station_climate_days_current/*.json _site/station_climate_days_current/
          cp station_heatwaves_profiles/*.json _site/station_heatwaves_profiles/

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: "3600000"
          reporting_interval: "10000"
