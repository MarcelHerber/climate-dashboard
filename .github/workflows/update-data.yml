name: DWD-Daten aktualisieren und GitHub Pages veröffentlichen

on:
  schedule:
    - cron: "17 10 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      station_records_full:
        description: "Stationsrekorde vollständig neu aufbauen"
        required: false
        type: boolean
        default: false
      station_precip_full:
        description: "Stations-Niederschlagskurven vollständig neu aufbauen"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: climate-dashboard-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Python-Pakete installieren
        run: python -m pip install -r requirements.txt

      - name: DWD-Daten aktualisieren
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.station_records_full }}" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --station-records-full"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.station_precip_full }}" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --station-precip-full"
          fi
          python scripts/update_dashboard.py --workers 8 $EXTRA_ARGS

      - name: Änderungen versionieren
        shell: bash
        run: |
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data.json \
            daily_tmax_1881_2026.json \
            station_records.json \
            station_record_state.json \
            station_records_years \
            station_precip_index.json \
            station_precip_state.json \
            station_precip_climate \
            station_precip_current \
            update_status.json

          if git diff --cached --quiet; then
            echo "Keine neuen oder korrigierten DWD-Daten vorhanden."
          else
            git commit -m "DWD-Daten automatisch aktualisiert"
            git push
          fi

      - name: Veröffentlichungsordner erstellen
        shell: bash
        run: |
          rm -rf _site
          mkdir -p \
            _site/station_records_years \
            _site/station_precip_climate \
            _site/station_precip_current
          cp \
            index.html \
            data.json \
            daily_tmax_1881_2026.json \
            station_records.json \
            station_precip_index.json \
            update_status.json \
            .nojekyll \
            _site/
          cp station_records_years/*.json _site/station_records_years/
          cp station_precip_climate/*.json _site/station_precip_climate/
          cp station_precip_current/*.json _site/station_precip_current/

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
