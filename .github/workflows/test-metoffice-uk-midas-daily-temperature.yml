name: Test UK Met Office MIDAS daily temperature

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: UK MIDAS Open Daily Temperature testen
        shell: bash
        env:
          CEDA_ACCESS_TOKEN: ${{ secrets.CEDA_ACCESS_TOKEN }}
          CEDA_USERNAME: ${{ secrets.CEDA_USERNAME }}
          CEDA_PASSWORD: ${{ secrets.CEDA_PASSWORD }}
        run: |
          set -euo pipefail
          python scripts/test_metoffice_uk_midas_daily_temperature.py
