name: HYRAS Flächenkarten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "45 10 * * *"

permissions:
  contents: write

concurrency:
  group: hyras-data
  cancel-in-progress: false

jobs:
  hyras:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: HYRAS-Abhängigkeiten installieren
        run: pip install -r requirements-hyras.txt

      - name: Tagesreferenz 1991-2020 cachen
        uses: actions/cache@v4
        with:
          path: /tmp/hyras-reference-cache
          key: hyras-daily-reference-1991-2020-v6-web2-v1

      - name: Vorhandenes historisches HYRAS-Paket übernehmen
        run: |
          rm -rf /tmp/hyras-data /tmp/hyras-work /tmp/hyras-existing
          mkdir -p /tmp/hyras-data /tmp/hyras-reference-cache
          git fetch origin hyras-data --depth=1 || true
          if git rev-parse --verify origin/hyras-data >/dev/null 2>&1; then
            git worktree add --detach /tmp/hyras-existing origin/hyras-data
            if [ -d /tmp/hyras-existing/historical_1km ]; then
              cp -a /tmp/hyras-existing/historical_1km /tmp/hyras-data/
            fi
            if [ -f /tmp/hyras-existing/hyras_historical_manifest.json ]; then
              cp /tmp/hyras-existing/hyras_historical_manifest.json /tmp/hyras-data/
            fi
          fi

      - name: HYRAS aktuell, freie Zeiträume und Historie bauen
        run: |
          python scripts/update_hyras_maps.py \
            --output /tmp/hyras-data \
            --work /tmp/hyras-work \
            --reference-cache /tmp/hyras-reference-cache \
            --web-factor 2 \
            --historical-factor 1

      - name: hyras-data Branch veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/hyras-data
          rm -rf .git
          git init
          git checkout -b hyras-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "HYRAS Historie und Zeiträume aktualisieren (1-km-Historie)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin hyras-data
