name: HYRAS Flächenkarten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "45 10 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: hyras-data
  cancel-in-progress: false

jobs:
  hyras:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: HYRAS-Abhängigkeiten installieren
        run: pip install -r requirements-hyras.txt

      - name: HYRAS-Live-Tageslogik im Generator sicherstellen
        run: python scripts/patch_hyras_live_daily.py

      - name: Tagesreferenz 1991-2020 cachen
        uses: actions/cache@v4
        with:
          path: /tmp/hyras-reference-cache
          key: hyras-daily-reference-1991-2020-v6-web2-v1

      - name: Vorhandenen hyras-data Branch vollständig übernehmen
        run: |
          set -euo pipefail
          rm -rf /tmp/hyras-data /tmp/hyras-work /tmp/hyras-existing
          rm -rf /tmp/hyras-tmean-work /tmp/hyras-tmax-work /tmp/hyras-tmin-work
          mkdir -p /tmp/hyras-data /tmp/hyras-reference-cache

          git fetch origin hyras-data --depth=1 || true
          if git rev-parse --verify origin/hyras-data >/dev/null 2>&1; then
            git worktree add --detach /tmp/hyras-existing origin/hyras-data

            # Kompletten bestehenden Datenbranch übernehmen.
            # Historie und Klimareferenzen werden von den Temperatur-Buildern
            # wiederverwendet; nur der aktuelle Jahresstand wird neu berechnet.
            cp -a /tmp/hyras-existing/. /tmp/hyras-data/
            rm -rf /tmp/hyras-data/.git
          fi

      - name: HYRAS Niederschlag aktuell, Historie und Mouseover-Raster bauen
        run: |
          python scripts/update_hyras_maps.py \
            --output /tmp/hyras-data \
            --work /tmp/hyras-work \
            --reference-cache /tmp/hyras-reference-cache \
            --web-factor 2 \
            --historical-factor 1

      - name: HYRAS Klick-Zeitreihen seit 1931 bauen
        run: |
          python scripts/build_hyras_click_series.py \
            --data-root /tmp/hyras-data \
            --factor 5

      - name: HYRAS Tmean aktuell aktualisieren
        run: |
          set -euo pipefail
          mkdir -p /tmp/hyras-tmean-work

          # Ohne --force-history wird die vorhandene Historie wiederverwendet.
          python scripts/build_hyras_tmean.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmean-work \
            --history-factor 5

          # Aktuelle Gebietsmittel und Downloadkarten neu bauen; die vorhandene
          # Klimakurve 1991-2020 wird ohne --force-climate wiederverwendet.
          python scripts/build_hyras_tmean_regions.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmean-work

          # Ergänzt records_file wieder im Regionen-Index und verwendet den
          # vorhandenen Rekordbestand bis zum Vorjahr weiter.
          python scripts/build_hyras_tmean_daily_records.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmean-work

      - name: HYRAS Tmax aktuell aktualisieren
        run: |
          set -euo pipefail
          mkdir -p /tmp/hyras-tmax-work

          # Ohne --force-history-summary bleiben Klimakurve und Rekorde erhalten.
          python scripts/build_hyras_tmax_regions.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmax-work

          python scripts/build_hyras_tmax_maps.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmax-work

      - name: HYRAS Tmin aktuell aktualisieren
        run: |
          set -euo pipefail
          mkdir -p /tmp/hyras-tmin-work

          # Wie bei Tmax werden Historie, Klimakurve und Rekorde wiederverwendet.
          python scripts/build_hyras_tmin_regions.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmin-work

          python scripts/build_hyras_tmin_maps.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmin-work

      - name: HYRAS-Datenstände vor Veröffentlichung prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/hyras-data")

          precip = json.loads((root / "hyras_index.json").read_text())
          tmean = json.loads((root / "tmean/index.json").read_text())
          tmean_regions = json.loads((root / "tmean/regions/index.json").read_text())
          tmean_maps = json.loads((root / "tmean/regions/map_downloads.json").read_text())
          tmax = json.loads((root / "tmax/regions/index.json").read_text())
          tmax_maps = json.loads((root / "tmax/regions/map_downloads.json").read_text())
          tmin = json.loads((root / "tmin/regions/index.json").read_text())
          tmin_maps = json.loads((root / "tmin/regions/map_downloads.json").read_text())

          checks = {
              "Niederschlag": precip["data_through"],
              "Tmean": tmean["data_through"],
              "Tmean Gebiete": tmean_regions["data_through"],
              "Tmean Karten": tmean_maps["data_through"],
              "Tmax": tmax["data_through"],
              "Tmax Karten": tmax_maps["data_through"],
              "Tmin": tmin["data_through"],
              "Tmin Karten": tmin_maps["data_through"],
          }

          if tmean["data_through"] != tmean_regions["data_through"]:
              raise SystemExit("Tmean Raster- und Gebietsdatenstand weichen voneinander ab.")
          if tmean["data_through"] != tmean_maps["data_through"]:
              raise SystemExit("Tmean Raster- und Kartendatenstand weichen voneinander ab.")
          if tmax["data_through"] != tmax_maps["data_through"]:
              raise SystemExit("Tmax Gebietsdaten und Karten weichen im Datenstand voneinander ab.")
          if tmin["data_through"] != tmin_maps["data_through"]:
              raise SystemExit("Tmin Gebietsdaten und Karten weichen im Datenstand voneinander ab.")

          for parameter, index in (("tmean", tmean), ("tmax", tmax), ("tmin", tmin)):
              year = int(index["year"])
              required = root / parameter / "regions" / f"current_{year}.json"
              if not required.exists():
                  raise SystemExit(f"Aktuelle Temperaturdatei fehlt: {required}")

          print("HYRAS-Datenstände:")
          for name, value in checks.items():
              print(f"  {name}: {value}")
          print("Temperaturprüfung OK.")
          PY

      - name: hyras-data Branch veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/hyras-data
          rm -rf .git
          git init
          git checkout -b hyras-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "HYRAS Niederschlag und Temperatur aktuell halten"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin hyras-data

      - name: HYRAS-Live-Presets im Frontend sicherstellen
        run: |
          cd "$GITHUB_WORKSPACE"
          python scripts/patch_hyras_live_frontend.py

      - name: HYRAS Klick-Zeitreihe im Frontend sicherstellen
        run: |
          cd "$GITHUB_WORKSPACE"
          python scripts/patch_hyras_click_timeseries_frontend.py

      - name: HYRAS-Zeitreihenwerte auf eine Nachkommastelle formatieren
        run: |
          cd "$GITHUB_WORKSPACE"
          python scripts/fix_hyras_timeseries_rounding.py

      - name: Dauerhafte HYRAS-Quelländerungen auf main veröffentlichen
        id: publish-main
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_hyras_maps.py index.html
          if git diff --cached --quiet; then
            echo "HYRAS-Generator und Frontend sind bereits auf dem aktuellen Stand."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "HYRAS Klick-Zeitreihe seit 1931 ergänzen"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages nach Frontend-Änderung aktualisieren
        if: steps.publish-main.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update-data.yml --ref main
