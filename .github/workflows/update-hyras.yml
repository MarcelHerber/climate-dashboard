name: HYRAS Flächenkarten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "45 10 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: hyras-data
  cancel-in-progress: false

jobs:
  hyras:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: HYRAS-Abhängigkeiten installieren
        run: pip install -r requirements-hyras.txt

      - name: HYRAS-Live-Tageslogik im Generator sicherstellen
        run: python scripts/patch_hyras_live_daily.py

      - name: Niederschlags-Tagesreferenz 1991-2020 cachen
        uses: actions/cache@v4
        with:
          path: /tmp/hyras-reference-cache
          key: hyras-daily-reference-1991-2020-v6-web2-v1

      - name: Vorhandenen hyras-data Branch vollständig übernehmen
        run: |
          set -euo pipefail
          rm -rf /tmp/hyras-data /tmp/hyras-work /tmp/hyras-existing
          rm -rf /tmp/hyras-tmean-work /tmp/hyras-tmax-work /tmp/hyras-tmin-work
          mkdir -p /tmp/hyras-data /tmp/hyras-reference-cache

          git fetch origin hyras-data --depth=1 || true
          if git rev-parse --verify origin/hyras-data >/dev/null 2>&1; then
            git worktree add --detach /tmp/hyras-existing origin/hyras-data
            cp -a /tmp/hyras-existing/. /tmp/hyras-data/
            rm -rf /tmp/hyras-data/.git
          fi

      - name: Aktuellen Temperatur-Referenzmonat bestimmen
        id: tempref
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          idx=json.loads((Path('/tmp/hyras-data')/'tmean/index.json').read_text())
          print('month='+str(idx['data_through'])[:7])
          PY

      - name: Tmean Tagesreferenz-Cache laden
        id: cache-tmean
        uses: actions/cache@v4
        with:
          path: /tmp/hyras-temperature-reference-cache/tmean_month_*.npz
          key: hyras-temperature-live-reference-tmean-${{ steps.tempref.outputs.month }}-v1

      - name: Tmax Tagesreferenz-Cache laden
        id: cache-tmax
        uses: actions/cache@v4
        with:
          path: /tmp/hyras-temperature-reference-cache/tmax_month_*.npz
          key: hyras-temperature-live-reference-tmax-${{ steps.tempref.outputs.month }}-v1

      - name: Tmin Tagesreferenz-Cache laden
        id: cache-tmin
        uses: actions/cache@v4
        with:
          path: /tmp/hyras-temperature-reference-cache/tmin_month_*.npz
          key: hyras-temperature-live-reference-tmin-${{ steps.tempref.outputs.month }}-v1

      - name: HYRAS Niederschlag aktuell, Historie und Mouseover-Raster bauen
        run: |
          python scripts/update_hyras_maps.py \
            --output /tmp/hyras-data \
            --work /tmp/hyras-work \
            --reference-cache /tmp/hyras-reference-cache \
            --web-factor 2 \
            --historical-factor 1

      - name: HYRAS Klick-Zeitreihen seit 1931 bauen
        run: |
          python scripts/build_hyras_click_series.py \
            --data-root /tmp/hyras-data \
            --factor 5

      - name: HYRAS Tmean aktuell aktualisieren
        run: |
          set -euo pipefail
          mkdir -p /tmp/hyras-tmean-work
          python scripts/build_hyras_tmean.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmean-work \
            --history-factor 5
          python scripts/build_hyras_tmean_regions.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmean-work
          python scripts/build_hyras_tmean_daily_records.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmean-work

      - name: HYRAS Tmax aktuell aktualisieren
        run: |
          set -euo pipefail
          mkdir -p /tmp/hyras-tmax-work
          python scripts/build_hyras_tmax_regions.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmax-work
          python scripts/build_hyras_tmax_maps.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmax-work

      - name: HYRAS Tmin aktuell aktualisieren
        run: |
          set -euo pipefail
          mkdir -p /tmp/hyras-tmin-work
          python scripts/build_hyras_tmin_regions.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmin-work
          python scripts/build_hyras_tmin_maps.py \
            --data-root /tmp/hyras-data \
            --work /tmp/hyras-tmin-work

      - name: Temperatur-Tagesreferenzen prüfen
        run: |
          set -euo pipefail
          test "${{ steps.cache-tmean.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-tmax.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-tmin.outputs.cache-hit }}" = "true"
          ls -lh /tmp/hyras-temperature-reference-cache/

      - name: Tagesgenaue Temperatur-Live-Anomalien bauen
        run: |
          python scripts/build_hyras_temperature_live_reference.py \
            --data-root /tmp/hyras-data \
            --reference-cache /tmp/hyras-temperature-reference-cache \
            --parameter all

      - name: HYRAS-Datenstände und Live-Anomalien prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/hyras-data')
          precip=json.loads((root/'hyras_index.json').read_text())
          tmean=json.loads((root/'tmean/index.json').read_text())
          tmean_regions=json.loads((root/'tmean/regions/index.json').read_text())
          tmean_maps=json.loads((root/'tmean/regions/map_downloads.json').read_text())
          tmax=json.loads((root/'tmax/regions/index.json').read_text())
          tmax_maps=json.loads((root/'tmax/regions/map_downloads.json').read_text())
          tmin=json.loads((root/'tmin/regions/index.json').read_text())
          tmin_maps=json.loads((root/'tmin/regions/map_downloads.json').read_text())

          if tmean['data_through']!=tmean_regions['data_through'] or tmean['data_through']!=tmean_maps['data_through']:
              raise SystemExit('Tmean-Datenstände weichen voneinander ab.')
          if tmax['data_through']!=tmax_maps['data_through']:
              raise SystemExit('Tmax-Datenstände weichen voneinander ab.')
          if tmin['data_through']!=tmin_maps['data_through']:
              raise SystemExit('Tmin-Datenstände weichen voneinander ab.')

          through=tmean['data_through']
          for item in tmean['periods']:
              if item.get('live') and item.get('end_date')==through:
                  key=item['key']
                  if not item.get('anomaly') or not tmean_maps['periods'].get(key,{}).get('anomaly'):
                      raise SystemExit(f'Tmean Live-Anomalie fehlt: {key}')

          for parameter,idx,maps in (('tmax',tmax,tmax_maps),('tmin',tmin,tmin_maps)):
              through=idx['data_through']
              for period in idx['periods']:
                  if period.get('end_date')==through:
                      key=period['key']
                      if not maps['periods'].get(key,{}).get('anomaly'):
                          raise SystemExit(f'{parameter} Live-Anomalie fehlt: {key}')

          print('HYRAS-Datenstände:')
          print('  Niederschlag:',precip['data_through'])
          print('  Tmean:',tmean['data_through'])
          print('  Tmax:',tmax['data_through'])
          print('  Tmin:',tmin['data_through'])
          print('Live-Anomalieprüfung OK.')
          PY

      - name: hyras-data Branch veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/hyras-data
          rm -rf .git
          git init
          git checkout -b hyras-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "HYRAS Niederschlag und Temperatur aktuell halten"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin hyras-data

      - name: HYRAS-Live-Presets im Frontend sicherstellen
        run: |
          cd "$GITHUB_WORKSPACE"
          python scripts/patch_hyras_live_frontend.py

      - name: HYRAS Klick-Zeitreihe im Frontend sicherstellen
        run: |
          cd "$GITHUB_WORKSPACE"
          python scripts/patch_hyras_click_timeseries_frontend.py

      - name: HYRAS-Zeitreihenwerte auf eine Nachkommastelle formatieren
        run: |
          cd "$GITHUB_WORKSPACE"
          python scripts/fix_hyras_timeseries_rounding.py

      - name: Dauerhafte HYRAS-Quelländerungen auf main veröffentlichen
        id: publish-main
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_hyras_maps.py index.html
          if git diff --cached --quiet; then
            echo "HYRAS-Generator und Frontend sind bereits auf dem aktuellen Stand."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "HYRAS Klick-Zeitreihe seit 1931 ergänzen"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages nach Frontend-Änderung aktualisieren
        if: steps.publish-main.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update-data.yml --ref main
