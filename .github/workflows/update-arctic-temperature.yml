name: Arktis 80N · DMI Temperaturindex aktualisieren

on:
  workflow_dispatch:
  # Secondary runs cover GitHub Actions cron delays or skipped morning dispatches.
  schedule:
    - cron: "40 5 * * *"
    - cron: "40 13 * * *"
    - cron: "40 20 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-arctic-temperature.yml"
      - "scripts/update_arctic_temperature.py"
      - "tests/test_arctic_temperature.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: dmi-arctic80-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DMI-Parser und Zeitachse testen
        run: |
          python -m py_compile scripts/update_arctic_temperature.py
          python -m unittest discover -s tests -p test_arctic_temperature.py -v
      - name: Tagesreihen aus originalen DMI-Dateien aktualisieren
        run: python scripts/update_arctic_temperature.py --output data/arctic80_temperature.json
      - name: Datenintegrität prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/arctic80_temperature.json")
          doc=json.loads(p.read_text(encoding="utf-8"))
          assert doc["schema"]==1
          assert len(doc["days"])==366
          assert doc["days"][59]=="02-29" and doc["days"][60]=="03-01"
          assert "2026" in doc["years"]
          assert len(doc["years"])>=60
          assert all(len(curve)==366 for curve in doc["years"].values())
          assert len(doc["reference"]["temperatures"])==366
          assert doc["last_date"]==max(
              f"{year}-{day}" for year,curve in doc["years"].items()
              for day,value in zip(doc["days"],curve) if value is not None
          )
          print("DMI Arktisindex geprüft:",doc["last_date"],len(doc["years"]),"Jahre",p.stat().st_size,"Bytes")
          PY
      - name: Neue DMI-Analysewerte veröffentlichen
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          cp data/arctic80_temperature.json /tmp/dmi_arctic80_verified.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dmi_arctic80_verified.json data/arctic80_temperature.json
            git add data/arctic80_temperature.json
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "DMI-Tageswerte bereits aktuell."
              exit 0
            fi
            git commit -m "DMI Arktis 80N Temperaturindex aktualisiert [skip ci]"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Parallel-Commit erkannt; sichere Daten erneut auf aktuellem main (Versuch $attempt)."
            sleep "$((attempt * 3))"
          done
          echo "GitHub-Push nach 4 Versuchen nicht möglich."
          exit 1
      - name: Website mit neuer Temperaturreihe veröffentlichen
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages-only.yml --ref main
