name: Integrate Estonia into Europe

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-estonia-into-europe
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Integrationshelfer prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/integrate_estonia_into_europe.py
          test -s scripts/update_europe_station_records_all_sources.py
          test -s scripts/update_ilmateenistus_estonia_station_cache.py
          test -s scripts/update_ilmateenistus_estonia_current.py
          python scripts/integrate_estonia_into_europe.py --self-test

      - name: Nur Europa-Python-Updater patchen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import integrate_estonia_into_europe as patcher

          path = Path("scripts/update_europe_station_records_all_sources.py")
          before = path.read_text(encoding="utf-8")
          after = patcher.patch_main(before)

          if after == before:
              raise SystemExit("Der Europa-Updater wurde nicht verändert.")

          path.write_text(after, encoding="utf-8")
          print("Estland wurde ausschließlich in update_europe_station_records_all_sources.py integriert.")
          PY

      - name: Integration prüfen
        shell: bash
        run: |
          set -euo pipefail

          # Der reguläre Europa-Workflow darf in diesem Lauf ausdrücklich
          # NICHT verändert werden; genau das hatte zuvor den Push blockiert.
          if ! git diff --quiet -- .github/workflows/update-europe-stations.yml; then
            echo "FEHLER: update-europe-stations.yml wurde unerwartet verändert."
            git diff -- .github/workflows/update-europe-stations.yml
            exit 1
          fi

          python -m py_compile scripts/update_europe_station_records_all_sources.py
          python scripts/update_ilmateenistus_estonia_station_cache.py --self-test
          python scripts/update_ilmateenistus_estonia_current.py --self-test
          python scripts/update_europe_station_records_all_sources.py --self-test

          grep -q 'import update_ilmateenistus_estonia_station_cache as estonia_hist' \
            scripts/update_europe_station_records_all_sources.py
          grep -q '"Estland": estonia_hist.SOURCE' \
            scripts/update_europe_station_records_all_sources.py
          grep -q '"EN"}' \
            scripts/update_europe_station_records_all_sources.py
          grep -q 'prefix="ILMATEENISTUS"' \
            scripts/update_europe_station_records_all_sources.py

          git diff --check
          echo "Estland-Python-Integration geprüft."

      - name: Nur Europa-Updater committen und pushen
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Ganz bewusst nur diese eine Nicht-Workflow-Datei.
          git add scripts/update_europe_station_records_all_sources.py

          echo "=== GEÄNDERTE DATEIEN ==="
          git status --short
          echo "=== DIFF STAT ==="
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "Keine Änderungen zum Committen."
            exit 0
          fi

          git commit -m "Integrate Estonia station records into Europe [skip ci]"

          PUSH_OK=false
          for ATTEMPT in 1 2 3; do
            echo "Push-Versuch ${ATTEMPT}/3 ..."
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              PUSH_OK=true
              break
            fi
            sleep $((ATTEMPT * 5))
          done

          [[ "$PUSH_OK" == "true" ]]
