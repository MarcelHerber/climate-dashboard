name: Probe ARSO Slovenia station metadata v4

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arso-slovenia-station-metadata-v4
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache-Verzeichnis anlegen
        shell: bash
        run: mkdir -p .cache/europe-stations

      - name: ARSO-Metadaten-V4-Cache wiederherstellen
        uses: actions/cache/restore@v5
        with:
          path: .cache/europe-stations
          key: arso-slovenia-station-metadata-v4-${{ github.run_id }}
          restore-keys: |
            arso-slovenia-station-metadata-v4-

      - name: Offline-Selbsttest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_arso_slovenia_station_metadata.py --self-test

      - name: ARSO-Agromet-Stationsmetadaten abgleichen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_arso_slovenia_station_metadata.py

      - name: ARSO-Metadaten-V4-Cache sichern
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache/europe-stations
          key: arso-slovenia-station-metadata-v4-${{ github.run_id }}

      - name: Metadaten-V4-Probe prüfen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib

          status_path = pathlib.Path(
              ".cache/europe-stations/"
              "arso_slovenia_station_metadata_status_v4.json"
          )
          if not status_path.exists():
              raise SystemExit(f"Status fehlt: {status_path}")

          status = json.loads(status_path.read_text(encoding="utf-8"))

          print("=== ARSO SLOVENIA METADATA V4 STATUS ===")
          print(json.dumps(status, indent=2, ensure_ascii=False))

          if not status.get("complete_probe"):
              raise SystemExit("ARSO-Metadaten-V4-Probe nicht vollständig.")

          if int(status.get("inventory_count", 0)) != 74:
              raise SystemExit("ARSO-Agromet-Inventar ist nicht 74.")

          if int(status.get("known_station_checks_ok", 0)) != 3:
              raise SystemExit(
                  "Die drei bekannten ARSO-Stationschecks stimmen nicht."
              )

          if int(status.get("coordinate_id_count", 0)) != 74:
              raise SystemExit(
                  "ARSO-Metadaten V4 sind noch nicht 74/74."
              )

          metadata_file = pathlib.Path(status["metadata_file"])
          if not metadata_file.exists():
              raise SystemExit(f"Metadaten-Datei fehlt: {metadata_file}")

          if not status.get("integration_ready"):
              raise SystemExit(
                  "ARSO-Metadaten melden trotz 74 Koordinaten nicht integrationsreif."
              )

          print("ARSO Slovenia Metadaten: 74/74 – integrationsreif.")
          PY
