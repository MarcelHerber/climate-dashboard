name: GFS 7 Tage · echte erweiterte NOAA-Prognose und Handytest
on:
  push:
    branches: [feature/gfs-weekly-wide-forecast-map-20261114]
    paths: [".github/workflows/pilot-gfs-weekly-wide-real.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-originals-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
            gfs_weekly_europe.html
            gfs_weekly_europe.js
            gfs_weekly_europe.css
            gfs_analysis_europe/extended_geography.json
            gfs_analysis_europe/weekly_f003.json
            cpc_europe
            cpc_europe.css
            mobile_navigation.js
            mobile_navigation.css
            dashboard_theme.js
            dashboard_theme.css
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy requests eccodes pytest playwright
      - name: Retrieve the independently verified 30-year original CFSR/CFSv2 121×361 climate normal
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43597657625
          name: cfsr-cfsv2-f003-extended-1991-2020-verified
          path: gfs_analysis_europe
      - name: Test strict original NOAA f003–f165 wide-grid decoding and all 360 historic source months
        run: |
          python -m pytest -q tests/test_gfs_weekly_extended.py
          node --check gfs_weekly_europe.js
      - name: Download exactly 28 NOAA GFS original 0.5° 2-m fields and generate genuine 7-day wide anomalies
        run: python -m scripts.update_gfs_weekly_europe_extended
      - name: Independently verify all time steps, 121×361 grid, country mask and 30-year source metadata
        run: |
          python - <<'PY'
          import base64,json
          from pathlib import Path
          import numpy as np
          f=Path("gfs_analysis_europe")
          x=json.loads((f/"weekly_f003_extended.json").read_text(encoding="utf-8"))
          g=json.loads((f/"extended_geography.json").read_text(encoding="utf-8"))
          assert x["sample_count"]==28 and x["lead_hours"]==list(range(3,166,6))
          assert len(x["sources"])==28
          assert all(item["forecast_hour"]==step and len(item["sha256"])==64
                     for item,step in zip(x["sources"],x["lead_hours"]))
          assert (x["width"],x["height"])==(361,121)
          assert (g["width"],g["height"])==(361,121)
          assert x["reference_version"]=="cfsr-cfsv2-t2m-f003-extended-v1"
          m=x["reference_metadata"]
          assert m["source_months"]==360 and m["years"]==30
          assert m["forecast_hour"]==3 and m["old_core_max_difference_k"]<.001
          assert len(g["rings"])>100 and len(g["countries"])>60
          for k in ("anomaly_mean_q10_b64","forecast_mean_q10_b64"):
              vals=np.frombuffer(base64.b64decode(x[k],validate=True),dtype="<i2")
              assert vals.size==361*121
              assert np.all(vals!=-32768)
          print("PASS NOAA GFS 7-day original 121x361 field anomalies and 1991-2020 verified CFSR normal",flush=True)
          PY
      - run: python -m playwright install chromium --with-deps
      - name: Verify actual full GFS/CFSR 13-region weather maps, Greenland, Iceland, Ural, Desktop/Handy and exports
        run: python tests/test_gfs_weekly_extended_browser.py
      - name: Retain original NOAA forecast, visible screenshots, PNG/PDF/CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfs-wide-original-real-QA-${{ github.run_id }}
          path: |
            gfs_analysis_europe/weekly_f003_extended.json
            gfs_weekly_extended_browser_qa/
          retention-days: 10
          if-no-files-found: ignore
