name: NOAA NAO AO ENSO aktualisieren
# NOAA CPC ONI/RONI use different column counts; importer handles both.

on:
  schedule:
    - cron: "42 14 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-noaa-climate-indices.yml"

permissions:
  contents: write

concurrency:
  group: noaa-climate-indices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: NOAA-Auswertung testen
        run: |
          python -m unittest discover -s tests -p test_climate_indices.py -v
          python -m unittest discover -s tests -p test_climate_indices_extra.py -v
          node --check climate_indices.js
          node --check climate_advanced.js
      - name: NOAA/CPC-Tages- und ENSO-Archive abrufen
        run: python scripts/update_climate_indices.py
      - name: Ergebnisse versionieren und für Pages veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          test -s climate_indices/index.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add climate_indices/index.json
          if git diff --cached --quiet; then
            echo "NOAA-Daten unverändert."
            exit 0
          fi
          git commit -m "NOAA NAO AO und ENSO Indizes aktualisieren"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "NOAA-Indizes gespeichert; Pages-Deploy übernimmt die Daten."
              exit 0
            fi
            sleep $((attempt * 4))
          done
          exit 1

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-dashboard-v2
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aktuellen Datenstand auschecken
        uses: actions/checkout@v6
        with:
          ref: main
      - name: NOAA-Datenbestand vor Veröffentlichung prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("climate_indices/index.json").read_text())
          assert p["ready"]
          assert len(p["teleconnections"]["nao"]["daily"]) > 25000
          assert len(p["teleconnections"]["ao"]["daily"]) > 25000
          assert len(p["enso"]["oni"]["seasons"]) > 880
          assert len(p["enso"]["roni"]["seasons"]) > 880
          assert len(p["europe"]["scand"]["monthly"]) > 800
          assert len(p["europe"]["ea"]["monthly"]) > 800
          assert len(p["europe"]["eawr"]["monthly"]) > 800
          assert len(p["europe"]["gbi"]["monthly"]) > 750
          assert len(p["enso_extra"]["soi"]["monthly"]) > 780
          assert len(p["enso_extra"]["mei"]["monthly"]) > 500
          assert len(p["qbo"]["u30"]["monthly"]) > 500
          assert len(p["qbo"]["u50"]["monthly"]) > 500
          assert len(p["mjo"]["daily"]) > 17000
          print("NOAA/CPC-Daten geprüft, neues Pages-Artefakt wird gebaut.")
          PY
      - name: Schlankes Pages-Artefakt erzeugen
        run: bash scripts/build_pages_site.sh
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"
          name: "github-pages-noaa-${{ github.run_id }}"
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          reporting_interval: "10000"
          artifact_name: "github-pages-noaa-${{ github.run_id }}"
