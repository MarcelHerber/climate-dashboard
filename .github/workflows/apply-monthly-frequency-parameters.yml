name: Apply monthly frequency parameters

on:
  push:
    branches:
      - feature/monthly-frequency-rain-sun
    paths:
      - .github/workflows/apply-monthly-frequency-parameters.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/monthly-frequency-rain-sun
      - name: Extend frequency view
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path=Path('monthly_frequency.js')
          text=path.read_text(encoding='utf-8')
          text=text.replace('/* MONTHLY_FREQUENCY_DISTRIBUTION_V3 */','/* MONTHLY_FREQUENCY_DISTRIBUTION_V4 */',1)

          old='''  function average(values){return values.length?values.reduce((sum,value)=>sum+value,0)/values.length:null;}\n  function sampleStdDev(values){if(values.length<2)return null;const avg=average(values);return Math.sqrt(values.reduce((sum,value)=>sum+(value-avg)**2,0)/(values.length-1));}\n'''
          new='''  function average(values){return values.length?values.reduce((sum,value)=>sum+value,0)/values.length:null;}\n  function median(values){if(!values.length)return null;const sorted=[...values].filter(Number.isFinite).sort((a,b)=>a-b);if(!sorted.length)return null;const mid=Math.floor(sorted.length/2);return sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;}\n  function sampleStdDev(values){if(values.length<2)return null;const avg=average(values);return Math.sqrt(values.reduce((sum,value)=>sum+(value-avg)**2,0)/(values.length-1));}\n  function parameterConfig(param){\n    const configs={\n      temp:{param:"temp",label:"Temperatur",unit:"°C",decimals:2,showNormal:true,curveWidth:0.1},\n      rain:{param:"rain",label:"Niederschlag",unit:"mm",decimals:1,showNormal:false},\n      sun:{param:"sun",label:"Sonnenscheindauer",unit:"h",decimals:1,showNormal:false}\n    };\n    return configs[param]||configs.temp;\n  }\n  function classStep(param,values=[]){\n    if(param==="temp")return 0.5;const clean=values.filter(Number.isFinite);const span=clean.length?Math.max(...clean)-Math.min(...clean):0;\n    if(param==="rain"){if(span<=80)return 5;if(span<=180)return 10;if(span<=400)return 20;if(span<=700)return 25;return 50;}\n    if(span<=160)return 10;if(span<=350)return 20;if(span<=800)return 50;return 100;\n  }\n'''
          if old not in text: raise SystemExit('statistics anchor not found')
          text=text.replace(old,new,1)

          start=text.index('  function buildDistribution(')
          end=text.index('  function empiricalPercentile(',start)
          replacement=r'''  function buildDistribution(valuesA,valuesB,mode,options={}){
    const all=[...valuesA,...valuesB].filter(Number.isFinite);if(!all.length)return null;
    const step=Number(options.step)||BIN_STEP,showNormal=options.showNormal!==false;
    let start=Math.floor(Math.min(...all)/step)*step-step,end=Math.ceil(Math.max(...all)/step)*step+step;
    if(end-start<step*4){start-=step;end+=step;}
    const count=Math.round((end-start)/step)+1,centers=Array.from({length:count},(_,index)=>Number((start+index*step).toFixed(6)));
    const histogram=values=>{const bins=Array(centers.length).fill(0);values.forEach(value=>{const index=Math.max(0,Math.min(centers.length-1,Math.round((value-start)/step)));bins[index]+=1;});return mode==="percent"&&values.length?bins.map(value=>100*value/values.length):bins;};
    const histA=histogram(valuesA),histB=histogram(valuesB);
    return {centers,histA,histB,pointsA:centers.map((x,i)=>({x,y:histA[i]})),pointsB:centers.map((x,i)=>({x,y:histB[i]})),normalA:showNormal?normalPoints(valuesA,mode,step,start,end):[],normalB:showNormal?normalPoints(valuesB,mode,step,start,end):[],start,end,step};
  }
  function buildIndividualBars(rowsA,rowsB,mode,options={}){
    const cleanA=rowsA.filter(row=>Number.isFinite(row?.value)),cleanB=rowsB.filter(row=>Number.isFinite(row?.value)),combined=[];
    cleanA.forEach(row=>combined.push({period:"A",row}));cleanB.forEach(row=>combined.push({period:"B",row}));
    if(!combined.length)return {pointsA:[],pointsB:[],normalA:[],normalB:[],start:null,end:null};
    const step=Number(options.step)||BIN_STEP,showNormal=options.showNormal!==false,spread=Number(options.spread)||Math.min(step*0.16,step/3),padding=Number(options.padding)||step;
    const groups=new Map();combined.forEach(item=>{const key=Number(item.row.value).toFixed(6);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(item);});
    const weightA=mode==="percent"&&cleanA.length?100/cleanA.length:1,weightB=mode==="percent"&&cleanB.length?100/cleanB.length:1,pointsA=[],pointsB=[];
    groups.forEach(group=>{group.sort((a,b)=>a.period.localeCompare(b.period)||Number(a.row.year)-Number(b.row.year));const value=Number(group[0].row.value),n=group.length;group.forEach((item,index)=>{const offset=n===1?0:-spread/2+spread*index/(n-1),point={x:Number((value+offset).toFixed(6)),y:item.period==="A"?weightA:weightB,value,year:item.row.year};(item.period==="A"?pointsA:pointsB).push(point);});});
    pointsA.sort((a,b)=>a.x-b.x||a.year-b.year);pointsB.sort((a,b)=>a.x-b.x||a.year-b.year);
    const valuesA=cleanA.map(row=>row.value),valuesB=cleanB.map(row=>row.value),all=[...valuesA,...valuesB];let start=Math.floor((Math.min(...all)-padding)/step)*step,end=Math.ceil((Math.max(...all)+padding)/step)*step;if(end-start<step*4){start-=step;end+=step;}
    return {pointsA,pointsB,normalA:showNormal?normalPoints(valuesA,mode,options.curveWidth||INDIVIDUAL_CURVE_WIDTH,start,end):[],normalB:showNormal?normalPoints(valuesB,mode,options.curveWidth||INDIVIDUAL_CURVE_WIDTH,start,end):[],start,end,step};
  }
'''
          text=text[:start]+replacement+text[end:]

          old='''  function exportFilename(area,period,rangeA,rangeB,extension){const ext=String(extension||"png").replace(/^\\./,"").toLowerCase();return `haeufigkeitsverteilung_${exportSlug(area)}_${exportSlug(period)}_${rangeA.start}-${rangeA.end}_vs_${rangeB.start}-${rangeB.end}.${ext}`;}\n\n  globalThis.__monthlyFrequencyTestApi={buildDistribution,buildIndividualBars,empiricalPercentile,average,sampleStdDev,exportFilename};'''
          new='''  function exportFilename(area,period,rangeA,rangeB,extension,param="temp"){const ext=String(extension||"png").replace(/^\\./,"").toLowerCase(),config=parameterConfig(param);return `haeufigkeitsverteilung_${exportSlug(config.label)}_${exportSlug(area)}_${exportSlug(period)}_${rangeA.start}-${rangeA.end}_vs_${rangeB.start}-${rangeB.end}.${ext}`;}\n\n  globalThis.__monthlyFrequencyTestApi={buildDistribution,buildIndividualBars,empiricalPercentile,average,median,sampleStdDev,parameterConfig,classStep,exportFilename};'''
          if old not in text: raise SystemExit('export api anchor not found')
          text=text.replace(old,new,1)

          text=text.replace('grid-template-columns:repeat(2,minmax(240px,1fr)) repeat(2,minmax(170px,.55fr))','grid-template-columns:repeat(2,minmax(220px,1fr)) repeat(3,minmax(155px,.55fr))',1)
          text=text.replace('<div class="monthly-frequency-head"><div><h2>Häufigkeitsverteilung der Temperatur</h2><p id="monthlyFrequencySubtitle">Zwei historische Zeiträume direkt miteinander vergleichen.</p></div><span class="monthly-frequency-badge">Temperatur · DWD-Gebietsmittel</span></div>', '<div class="monthly-frequency-head"><div><h2 id="monthlyFrequencyTitle">Häufigkeitsverteilung der Temperatur</h2><p id="monthlyFrequencySubtitle">Zwei historische Zeiträume direkt miteinander vergleichen.</p></div><span id="monthlyFrequencyBadge" class="monthly-frequency-badge">Temperatur · DWD-Gebietsmittel</span></div>',1)
          needle='''        <div class="monthly-frequency-scale"><label for="monthlyFrequencyDisplay">Darstellung</label><select id="monthlyFrequencyDisplay"><option value="individual" selected>Einzelwerte</option><option value="bins">0,5-°C-Klassen</option></select><div class="control-hint">Einzelwerte zeigt jedes Jahr als eigenen schmalen Balken.</div></div>'''
          repl='''        <div class="monthly-frequency-scale"><label for="monthlyFrequencyParam">Parameter</label><select id="monthlyFrequencyParam"><option value="temp" selected>Temperatur</option><option value="rain">Niederschlag</option><option value="sun">Sonnenscheindauer</option></select><div class="control-hint">Niederschlag in mm, Sonnenschein in Stunden.</div></div>\n        <div class="monthly-frequency-scale"><label for="monthlyFrequencyDisplay">Darstellung</label><select id="monthlyFrequencyDisplay"><option value="individual" selected>Einzelwerte</option><option id="monthlyFrequencyBinsOption" value="bins">Klassen</option></select><div class="control-hint">Einzelwerte zeigt jedes Jahr als eigenen schmalen Balken.</div></div>'''
          if needle not in text: raise SystemExit('parameter UI anchor not found')
          text=text.replace(needle,repl,1)
          text=text.replace('<div class="monthly-frequency-stat"><div class="label">Streuung σ</div><div id="monthlyFrequencySpread" class="value">–</div><div id="monthlyFrequencySpreadDetail" class="detail">Standardabweichung A / B</div></div>','<div class="monthly-frequency-stat"><div id="monthlyFrequencySpreadLabel" class="label">Streuung σ</div><div id="monthlyFrequencySpread" class="value">–</div><div id="monthlyFrequencySpreadDetail" class="detail">Standardabweichung A / B</div></div>',1)

          old='''  function formatTemp(value,decimals=2,sign=false){if(!Number.isFinite(value))return "–";return `${sign&&value>0?"+":""}${value.toLocaleString("de-DE",{minimumFractionDigits:decimals,maximumFractionDigits:decimals})} °C`;}'''
          new='''  function formatValue(value,param="temp",decimals=null,sign=false){if(!Number.isFinite(value))return "–";const config=parameterConfig(param),places=decimals===null?config.decimals:decimals;return `${sign&&value>0?"+":""}${value.toLocaleString("de-DE",{minimumFractionDigits:places,maximumFractionDigits:places})} ${config.unit}`;}\n  function formatTemp(value,decimals=2,sign=false){return formatValue(value,"temp",decimals,sign);}'''
          if old not in text: raise SystemExit('formatter anchor not found')
          text=text.replace(old,new,1)

          text=text.replace('const meanLinesPlugin={id:"monthlyFrequencyMeanLinesV3"','const meanLinesPlugin={id:"monthlyFrequencyMeanLinesV4"',1)
          old_plugin='''meta.means.forEach((item,index)=>{if(!Number.isFinite(item.value))return;const pixel=x.getPixelForValue(item.value);if(pixel<chartArea.left||pixel>chartArea.right)return;ctx.strokeStyle=item.color;ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(pixel,chartArea.top);ctx.lineTo(pixel,chartArea.bottom);ctx.stroke();ctx.setLineDash([]);ctx.font="700 11px Arial";ctx.textBaseline="top";ctx.textAlign=index===0?"right":"left";ctx.fillStyle=item.color;ctx.fillText(`Ø ${item.label}`,pixel+(index===0?-5:5),chartArea.top+5+index*14);});'''
          new_plugin='''meta.lines.forEach((item,index)=>{if(!Number.isFinite(item.value))return;const pixel=x.getPixelForValue(item.value);if(pixel<chartArea.left||pixel>chartArea.right)return;ctx.strokeStyle=item.color;ctx.lineWidth=item.width||1.5;ctx.setLineDash(item.dash||[5,4]);ctx.beginPath();ctx.moveTo(pixel,chartArea.top);ctx.lineTo(pixel,chartArea.bottom);ctx.stroke();ctx.setLineDash([]);ctx.font="700 11px Arial";ctx.textBaseline="top";ctx.textAlign=index%2===0?"right":"left";ctx.fillStyle=item.color;ctx.fillText(`${item.prefix||"Ø"} ${item.label}`,pixel+(index%2===0?-5:5),chartArea.top+5+index*14);});'''
          if old_plugin not in text: raise SystemExit('plugin line anchor not found')
          text=text.replace(old_plugin,new_plugin,1)

          old='''  function exportContext(){const area=document.getElementById("monthlyAreaSelect")?.value||"Deutschland",selection=document.getElementById("monthSelect")?.value||"Jahr";return {area,period:typeof periodLabel==="function"?periodLabel(selection):selection,rangeA:range("A"),rangeB:range("B")};}'''
          new='''  function exportContext(){const area=document.getElementById("monthlyAreaSelect")?.value||"Deutschland",selection=document.getElementById("monthSelect")?.value||"Jahr",param=document.getElementById("monthlyFrequencyParam")?.value||"temp";return {area,period:typeof periodLabel==="function"?periodLabel(selection):selection,param,rangeA:range("A"),rangeB:range("B")};}'''
          if old not in text: raise SystemExit('export context anchor not found')
          text=text.replace(old,new,1)
          text=text.replace('exportFilename(context.area,context.period,context.rangeA,context.rangeB,"png")','exportFilename(context.area,context.period,context.rangeA,context.rangeB,"png",context.param)',1)
          text=text.replace('exportFilename(context.area,context.period,context.rangeA,context.rangeB,"pdf")','exportFilename(context.area,context.period,context.rangeA,context.rangeB,"pdf",context.param)',1)

          render_start=text.index('  function render(){')
          render_end=text.index('\n  function setMode(',render_start)
          render=r'''  function render(){
    if(mode!=="frequency")return;const monthly=document.getElementById("monthly");if(!monthly?.classList.contains("active"))return;
    if(!dataReady()){setText("monthlyFrequencySummary","Monatsdaten werden noch geladen …");clearTimeout(dataWaitTimer);dataWaitTimer=setTimeout(render,500);return;}
    const area=document.getElementById("monthlyAreaSelect")?.value||"Deutschland",selection=document.getElementById("monthSelect")?.value||"07",param=document.getElementById("monthlyFrequencyParam")?.value||"temp",config=parameterConfig(param),series=seriesFor(area,selection,param);
    updateBounds(series);syncPreset("A");syncPreset("B");const rangeA=range("A"),rangeB=range("B");
    if(!Number.isFinite(rangeA.start)||!Number.isFinite(rangeA.end)||rangeA.start>rangeA.end||!Number.isFinite(rangeB.start)||!Number.isFinite(rangeB.end)||rangeB.start>rangeB.end){setText("monthlyFrequencySummary","Bitte für beide Vergleichszeiträume ein gültiges Start- und Endjahr wählen.");if(chart){chart.destroy();chart=null;}return;}
    const rowsA=filterRange(series,rangeA),rowsB=filterRange(series,rangeB),valuesA=rowsA.map(item=>item.value),valuesB=rowsB.map(item=>item.value),allValues=[...valuesA,...valuesB],step=classStep(param,allValues),requested=document.getElementById("monthlyFrequencyScale")?.value||"auto",yMode=requested==="auto"?(valuesA.length===valuesB.length?"count":"percent"):requested,display=document.getElementById("monthlyFrequencyDisplay")?.value||"individual",options={step,showNormal:config.showNormal,curveWidth:config.curveWidth,spread:param==="temp"?0.08:Math.min(step*.16,step/3),padding:step},prepared=display==="individual"?buildIndividualBars(rowsA,rowsB,yMode,options):buildDistribution(valuesA,valuesB,yMode,options);
    const meanA=average(valuesA),meanB=average(valuesB),medianA=median(valuesA),medianB=median(valuesB),sdA=sampleStdDev(valuesA),sdB=sampleStdDev(valuesB),shift=Number.isFinite(meanA)&&Number.isFinite(meanB)?meanB-meanA:null,latest=series.at(-1)||null,pctl=latest?empiricalPercentile(valuesA,latest.value):null,minA=valuesA.length?Math.min(...valuesA):null,maxA=valuesA.length?Math.max(...valuesA):null,minB=valuesB.length?Math.min(...valuesB):null,maxB=valuesB.length?Math.max(...valuesB):null;
    setText("monthlyFrequencyTitle",`Häufigkeitsverteilung ${config.label}`);setText("monthlyFrequencyBadge",`${config.label} · DWD-Gebietsmittel`);setText("monthlyFrequencySubtitle",`${area} · ${periodLabel(selection)} · ${config.label}`);setText("monthlyFrequencyLabelA",`Zeitraum A · ${rangeA.label}`);setText("monthlyFrequencyLabelB",`Zeitraum B · ${rangeB.label}`);setText("monthlyFrequencyMeanA",formatValue(meanA,param));setText("monthlyFrequencyMeanB",formatValue(meanB,param));
    const detailA=config.showNormal?`${valuesA.length} auswertbare Jahre · σ ${formatValue(sdA,param)}`:`${valuesA.length} Jahre · Median ${formatValue(medianA,param)} · Min/Max ${formatValue(minA,param)} / ${formatValue(maxA,param)}`,detailB=config.showNormal?`${valuesB.length} auswertbare Jahre · σ ${formatValue(sdB,param)}`:`${valuesB.length} Jahre · Median ${formatValue(medianB,param)} · Min/Max ${formatValue(minB,param)} / ${formatValue(maxB,param)}`;
    setText("monthlyFrequencyDetailA",detailA);setText("monthlyFrequencyDetailB",detailB);setText("monthlyFrequencyShift",formatValue(shift,param,config.decimals,true));setText("monthlyFrequencyShiftDetail",Number.isFinite(shift)?`${rangeB.label} minus ${rangeA.label}`:"nicht berechenbar");
    if(config.showNormal){setText("monthlyFrequencySpreadLabel","Streuung σ");setText("monthlyFrequencySpread",Number.isFinite(sdA)&&Number.isFinite(sdB)?`${formatValue(sdA,param)} / ${formatValue(sdB,param)}`:"–");setText("monthlyFrequencySpreadDetail",`${rangeA.label} / ${rangeB.label}`);}else{setText("monthlyFrequencySpreadLabel","Median A / B");setText("monthlyFrequencySpread",Number.isFinite(medianA)&&Number.isFinite(medianB)?`${formatValue(medianA,param)} / ${formatValue(medianB,param)}`:"–");setText("monthlyFrequencySpreadDetail",`${rangeA.label} / ${rangeB.label}`);}
    setText("monthlyFrequencyLatestLabel",latest?`Aktuellster vollständiger Wert · ${latest.year}`:"Aktuellster vollständiger Wert");setText("monthlyFrequencyLatest",latest?formatValue(latest.value,param):"–");setText("monthlyFrequencyLatestDetail",latest&&Number.isFinite(pctl)?`Perzentil ${pctl.toFixed(1).replace(".",",")} gegenüber ${rangeA.label}`:"Perzentil nicht berechenbar");
    const warning=[valuesA.length<10?`Zeitraum A enthält nur ${valuesA.length} Werte.`:"",valuesB.length<10?`Zeitraum B enthält nur ${valuesB.length} Werte.`:""].filter(Boolean).join(" "),axis=yMode==="percent"?"relative Häufigkeit in %":"Anzahl der Jahre",classText=param==="temp"?"0,5-°C-Klassen":`${step.toLocaleString("de-DE")} ${config.unit}-Klassen`,displayLabel=display==="individual"?"Einzelwerte":classText,binsOption=document.getElementById("monthlyFrequencyBinsOption");if(binsOption)binsOption.textContent=classText;
    setText("monthlyFrequencySummary",`${area} · ${periodLabel(selection)} · ${config.label}: ${rangeA.label} (${valuesA.length} Werte) gegen ${rangeB.label} (${valuesB.length} Werte). Darstellung: ${displayLabel}, ${axis}.${Number.isFinite(shift)?` Mittelwertverschiebung B − A: ${formatValue(shift,param,config.decimals,true)}.`:""}${warning?` ${warning}`:""}`);
    setText("monthlyFrequencyNote",config.showNormal?(display==="individual"?"Jedes Jahr wird als eigener schmaler Balken dargestellt. Gleiche Temperaturwerte werden minimal auseinandergezogen, damit einzelne Jahre sichtbar bleiben; im Tooltip steht der unveränderte Originalwert. Die glatten Linien zeigen angepasste Normalverteilungen. Nur vollständige Monate, Jahreszeiten oder Jahre werden berücksichtigt.":"Klassenbreite: 0,5 °C. Die glatten Linien zeigen an Mittelwert und Standardabweichung angepasste Normalverteilungen. Nur vollständige Monate, Jahreszeiten oder Jahre werden berücksichtigt."):(display==="individual"?`Jedes Jahr wird als eigener schmaler Balken dargestellt. Identische Werte werden nur minimal auseinandergezogen; im Tooltip steht der unveränderte Originalwert. Wegen der häufig schiefen ${config.label}-Verteilung wird keine Normalverteilung eingezeichnet; Mittelwert und Median werden separat markiert. Nur vollständige Zeiträume werden berücksichtigt.`:`Klassenbreite: ${step.toLocaleString("de-DE")} ${config.unit}. Wegen der häufig schiefen Verteilung wird keine Normalverteilung eingezeichnet; Mittelwert und Median werden separat markiert. Nur vollständige Zeiträume werden berücksichtigt.`));
    if(!prepared||!valuesA.length||!valuesB.length){if(chart){chart.destroy();chart=null;}return;}if(chart)chart.destroy();
    const barA={type:"bar",label:rangeA.label,data:prepared.pointsA,parsing:false,backgroundColor:"rgba(43,111,142,.45)",borderColor:BLUE,borderWidth:1,barThickness:display==="individual"?5:20,order:3},barB={type:"bar",label:rangeB.label,data:prepared.pointsB,parsing:false,backgroundColor:"rgba(196,59,47,.38)",borderColor:RED,borderWidth:1,barThickness:display==="individual"?5:20,order:3},datasets=[barA,barB];
    if(config.showNormal){datasets.push({type:"line",label:`Normalverteilung ${rangeA.label}`,data:prepared.normalA,parsing:false,borderColor:BLUE,borderWidth:2.4,pointRadius:0,tension:.28,order:1},{type:"line",label:`Normalverteilung ${rangeB.label}`,data:prepared.normalB,parsing:false,borderColor:RED,borderWidth:2.4,pointRadius:0,tension:.28,order:1});}
    const valueText=value=>`${Number(value).toLocaleString("de-DE",{minimumFractionDigits:config.decimals,maximumFractionDigits:config.decimals})} ${config.unit}`;
    chart=new Chart(document.getElementById("monthlyFrequencyChart"),{type:"bar",data:{datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"nearest",intersect:true},plugins:{title:{display:true,text:`${area}: ${periodLabel(selection)} – ${config.label}`,font:{size:19}},subtitle:{display:true,text:`${rangeA.label} vs. ${rangeB.label} · ${displayLabel}`,font:{size:12}},legend:{position:"bottom",labels:{usePointStyle:true,boxWidth:10}},datalabels:{display:false},tooltip:{callbacks:{title:items=>{const raw=items[0]?.raw;if(display==="individual"&&raw?.year)return valueText(raw.value);return valueText(items[0]?.parsed?.x);},label:context=>{const raw=context.raw;if(display==="individual"&&raw?.year)return `${context.dataset.label} · ${raw.year}: ${valueText(raw.value)}`;return `${context.dataset.label}: ${Number(context.parsed.y).toLocaleString("de-DE",{minimumFractionDigits:yMode==="percent"?1:0,maximumFractionDigits:yMode==="percent"?1:2})}${yMode==="percent"?" %":""}`;}}}},scales:{x:{type:"linear",min:prepared.start,max:prepared.end,title:{display:true,text:`${config.label} in ${config.unit}`},grid:{display:false},ticks:{maxTicksLimit:18,callback:value=>Number(value).toLocaleString("de-DE",{maximumFractionDigits:config.decimals})}},y:{beginAtZero:true,title:{display:true,text:yMode==="percent"?"Häufigkeit (%)":"Anzahl"},ticks:{precision:yMode==="count"?0:1}}}}});
    const lines=[{value:meanA,color:BLUE,label:formatValue(meanA,param).replace(` ${config.unit}`,""),prefix:"Ø"},{value:meanB,color:RED,label:formatValue(meanB,param).replace(` ${config.unit}`,""),prefix:"Ø"}];if(!config.showNormal){lines.push({value:medianA,color:BLUE,label:formatValue(medianA,param).replace(` ${config.unit}`,""),prefix:"Med",dash:[2,3],width:1.2},{value:medianB,color:RED,label:formatValue(medianB,param).replace(` ${config.unit}`,""),prefix:"Med",dash:[2,3],width:1.2});}chart.$frequencyMeta={lines};chart.update();
  }
'''
          text=text[:render_start]+render+text[render_end:]

          setmode_start=text.index('  function setMode(')
          setmode_end=text.index('\n  function init()',setmode_start)
          setmode=r'''  function setMode(next,{persist=true}={}){mode=next==="frequency"?"frequency":"classic";const monthly=document.getElementById("monthly");monthly?.classList.toggle("monthly-frequency-active",mode==="frequency");document.getElementById("monthlyFrequencyView").hidden=mode!=="frequency";document.getElementById("monthlyFrequencyClassicButton").classList.toggle("active",mode==="classic");document.getElementById("monthlyFrequencyButton").classList.toggle("active",mode==="frequency");if(mode==="frequency"){const classic=document.getElementById("paramSelect")?.value,param=document.getElementById("monthlyFrequencyParam");if(param&&["temp","rain","sun"].includes(classic))param.value=classic;render();}else if(chart)setTimeout(()=>chart.resize(),0);if(persist&&typeof persistDashboardState==="function")persistDashboardState("monthlyViewMode",mode);}
'''
          text=text[:setmode_start]+setmode+text[setmode_end:]

          old_events='''    document.getElementById("monthlyFrequencyScale").addEventListener("change",render);document.getElementById("monthlyFrequencyDisplay").addEventListener("change",render);document.getElementById("monthlyFrequencyPngButton")?.addEventListener("click",event=>runExport(event.currentTarget,"PNG"));document.getElementById("monthlyFrequencyPdfButton")?.addEventListener("click",event=>runExport(event.currentTarget,"PDF"));document.getElementById("monthlyAreaSelect")?.addEventListener("change",()=>{if(mode==="frequency")render();});document.getElementById("monthSelect")?.addEventListener("change",()=>{if(mode==="frequency")render();});'''
          new_events='''    document.getElementById("monthlyFrequencyScale").addEventListener("change",render);document.getElementById("monthlyFrequencyDisplay").addEventListener("change",render);document.getElementById("monthlyFrequencyParam").addEventListener("change",event=>{if(event.target.value==="sun"&&range("A").end<1951){document.getElementById("monthlyFrequencyPresetA").value="1961-1990";syncPreset("A");}render();});document.getElementById("monthlyFrequencyPngButton")?.addEventListener("click",event=>runExport(event.currentTarget,"PNG"));document.getElementById("monthlyFrequencyPdfButton")?.addEventListener("click",event=>runExport(event.currentTarget,"PDF"));document.getElementById("monthlyAreaSelect")?.addEventListener("change",()=>{if(mode==="frequency")render();});document.getElementById("monthSelect")?.addEventListener("change",()=>{if(mode==="frequency")render();});'''
          if old_events not in text: raise SystemExit('events anchor not found')
          text=text.replace(old_events,new_events,1)

          path.write_text(text,encoding='utf-8')
          idx=Path('index.html');html=idx.read_text(encoding='utf-8');html,count=re.subn(r'monthly_frequency\.js\?v=\d+','monthly_frequency.js?v=4',html,count=1);assert count==1;idx.write_text(html,encoding='utf-8')
          PY
      - name: Verify syntax
        run: node --check monthly_frequency.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly_frequency.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Niederschlag und Sonnenschein in Häufigkeitsverteilung ergänzen"
          git push
