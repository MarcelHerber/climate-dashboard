          new = '        "historical_max_year": historical_max_year,\n        "historical_periods": historical_periods,\n'
          if old not in generator:
              raise SystemExit("Payload-Einfügemarke fehlt")
          generator = generator.replace(old, new, 1)
          generator_path.write_text(generator, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")

          old = '<div class="stat-card"><h4>Historischer Spannbereich (ab 01.01.)</h4><div id="stationPrecipRangeStat">–</div></div>'
          new = '<div class="stat-card"><h4>Historischer Spannbereich</h4><div id="stationPrecipRangeStat">–</div></div>'
          if old not in index:
              raise SystemExit("Überschrift des historischen Spannbereichs nicht gefunden")
          index = index.replace(old, new, 1)

          old = '''    let historicalMin=[],historicalMax=[],minValue=null,maxValue=null,minYear=null,maxYear=null;
    const ytdCompatible=range.startIndex===0;
    if(ytdCompatible){
      historicalMin=(stationPrecipProfile.historical_min_cumulative||[]).slice(range.startIndex,range.endIndex+1);
