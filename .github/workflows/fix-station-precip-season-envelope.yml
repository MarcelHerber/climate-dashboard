name: Fix Stationsniederschlag Saison-Huellkurven

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-station-precip-season-envelope.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-station-precip-season-envelope
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Python-Pakete installieren
        run: python -m pip install -r requirements.txt

      - name: Saison-Huellkurven in Generator und Frontend einbauen
        run: python scripts/fix_station_precip_season_envelope.py

      - name: Änderungen syntaktisch prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_station_precip.py
          grep -q 'historical_periods' index.html
          grep -q 'historicalCompatible' index.html

      - name: Historische Niederschlagsprofile mit Saison-Huellkurven neu aufbauen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_station_precip.py --workers 8 --full

      - name: Änderungen versionieren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            scripts/update_station_precip.py \
            station_precip_index.json \
            station_precip_state.json \
            station_precip_climate \
            station_precip_current

          if git diff --cached --quiet; then
            echo "Keine Änderungen erkannt."
            exit 0
          fi

          git commit -m "Stationsniederschlag: Saison-Huellkurven korrigiert"

          for ATTEMPT in 1 2 3; do
            echo "Push-Versuch ${ATTEMPT}/3 ..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 5))
          done

          echo "FEHLER: Push nach drei Versuchen nicht möglich."
          exit 1

