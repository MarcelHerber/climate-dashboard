      historicalMax=(stationPrecipProfile.historical_max_cumulative||[]).slice(range.startIndex,range.endIndex+1);
      minValue=historicalMin.length?historicalMin[historicalMin.length-1]:null;
      maxValue=historicalMax.length?historicalMax[historicalMax.length-1]:null;
      minYear=(stationPrecipProfile.historical_min_year||[])[range.endIndex]??null;
      maxYear=(stationPrecipProfile.historical_max_year||[])[range.endIndex]??null;
    }else if(periodCompatible){
      const endOffset=range.endIndex-range.startIndex;
      historicalMin=(periodHistory.historical_min_cumulative||[]).slice(0,endOffset+1);
      historicalMax=(periodHistory.historical_max_cumulative||[]).slice(0,endOffset+1);
      minValue=historicalMin.length?historicalMin[historicalMin.length-1]:null;
      maxValue=historicalMax.length?historicalMax[historicalMax.length-1]:null;
      minYear=(periodHistory.historical_min_year||[])[endOffset]??null;
      maxYear=(periodHistory.historical_max_year||[])[endOffset]??null;
    }'''
          if old not in index:
              raise SystemExit("Frontend-Block ytdCompatible nicht gefunden")
          index = index.replace(old, new, 1)

          old = '''    document.getElementById("stationPrecipRangeStat").textContent=ytdCompatible&&minValue!==null
      ?`${stationPrecipFormat(minValue)} mm (${minYear}) bis ${stationPrecipFormat(maxValue)} mm (${maxYear})`
      :"Für Zeiträume mit Start nach dem 01.01. nicht vorab berechnet";'''
          new = '''    document.getElementById("stationPrecipRangeStat").textContent=historicalCompatible&&minValue!==null
      ?`${stationPrecipFormat(minValue)} mm (${minYear}) bis ${stationPrecipFormat(maxValue)} mm (${maxYear})`
      :"Für diesen Zeitraum nicht vorab berechnet";'''
          if old not in index:
              raise SystemExit("RangeStat-Block nicht gefunden")
          index = index.replace(old, new, 1)

          old = '    if(!ytdCompatible) gapText+=" Der historische Min-Max-Spannbereich wird bei frei beginnenden Zeiträumen bewusst nicht angezeigt, weil die bisher gespeicherten historischen Hüllkurven auf den 1. Januar bezogen sind.";'
          new = '    if(!historicalCompatible) gapText+=" Der historische Min-Max-Spannbereich ist derzeit für Seit Jahresbeginn sowie Frühling, Sommer und Herbst verfügbar.";'
          if old not in index:
              raise SystemExit("Hinweistext zur Hüllkurve nicht gefunden")
          index = index.replace(old, new, 1)

          old = '    if(ytdCompatible){\n      datasets.push('
          new = '    if(historicalCompatible){\n      datasets.push('
          if old not in index:
              raise SystemExit("Dataset-Bedingung nicht gefunden")
          index = index.replace(old, new, 1)

          index_path.write_text(index, encoding="utf-8")
          PY

      - name: Änderungen syntaktisch prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/update_station_precip.py
          grep -q 'historical_periods' index.html
          grep -q 'historicalCompatible' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          for index, block in enumerate(blocks):
              if block.strip():
                  Path(f"/tmp/dashboard-inline-{index}.js").write_text(block, encoding="utf-8")
          PY
          for file in /tmp/dashboard-inline-*.js; do
            node --check "$file"
          done

      - name: Historische Niederschlagsprofile mit Saison-Huellkurven neu aufbauen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_station_precip.py --workers 8 --full

      - name: Änderungen versionieren
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            scripts/update_station_precip.py \
            station_precip_index.json \
            station_precip_state.json \
            station_precip_climate \
            station_precip_current

          if git diff --cached --quiet; then
            echo "Keine Änderungen erkannt."
            exit 0
          fi

          git commit -m "Stationsniederschlag: Saison-Huellkurven korrigiert"

          for ATTEMPT in 1 2 3; do
            echo "Push-Versuch ${ATTEMPT}/3 ..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((ATTEMPT * 5))
          done

          echo "FEHLER: Push nach drei Versuchen nicht möglich."
          exit 1
