name: Fix Stationsniederschlag Saison-Huellkurven

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-station-precip-season-envelope.yml"

permissions:
  contents: write

concurrency:
  group: fix-station-precip-season-envelope
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Python-Pakete installieren
        run: python -m pip install -r requirements.txt

      - name: Saison-Huellkurven in Generator und Frontend einbauen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          generator_path = Path("scripts/update_station_precip.py")
          generator = generator_path.read_text(encoding="utf-8")

          old = "STATE_VERSION = 2"
          new = "STATE_VERSION = 3"
          if old not in generator:
              raise SystemExit("STATE_VERSION=2 nicht gefunden")
          generator = generator.replace(old, new, 1)

          marker = "    return curves\n\n\ndef build_profile_payload("
          if marker not in generator:
              raise SystemExit("Einfügemarke nach observations_to_complete_curves fehlt")

          helper = '''    return curves


HISTORICAL_PERIOD_RANGES = {
    "spring": ("03-01", "05-31"),
    "summer": ("06-01", "08-31"),
    "autumn": ("09-01", "11-30"),
}


def build_historical_period_envelopes(curves: dict[int, list[float]]) -> dict[str, dict[str, Any]]:
    """Baut korrekte historische Hüllkurven, die am Beginn der Jahreszeit neu bei 0 starten."""
    labels = labels_non_leap()
    label_index = {label: index for index, label in enumerate(labels)}
    result: dict[str, dict[str, Any]] = {}

    for period, (start_label, end_label) in HISTORICAL_PERIOD_RANGES.items():
        start_index = label_index[start_label]
        end_index = label_index[end_label]
        period_curves: dict[int, list[float]] = {}

        for year, curve in curves.items():
            if len(curve) <= end_index:
                continue
            base = curve[start_index - 1] if start_index > 0 else 0.0
            period_curves[year] = [
                round(curve[index] - base, 1)
                for index in range(start_index, end_index + 1)
            ]

        if not period_curves:
            continue

        historical_min: list[float] = []
        historical_max: list[float] = []
        historical_min_year: list[int] = []
        historical_max_year: list[int] = []
        length = end_index - start_index + 1

        for offset in range(length):
            candidates = [(curve[offset], year) for year, curve in period_curves.items()]
            minimum = min(candidates, key=lambda item: (item[0], item[1]))
            maximum = max(candidates, key=lambda item: (item[0], -item[1]))
            historical_min.append(round(minimum[0], 1))
            historical_max.append(round(maximum[0], 1))
            historical_min_year.append(minimum[1])
            historical_max_year.append(maximum[1])

        result[period] = {
            "start_index": start_index,
            "end_index": end_index,
            "historical_min_cumulative": historical_min,
            "historical_max_cumulative": historical_max,
            "historical_min_year": historical_min_year,
            "historical_max_year": historical_max_year,
        }

    return result


def build_profile_payload('''
          generator = generator.replace(marker, helper, 1)

          old = "        historical_max_year.append(maximum[1])\n\n    segment = current_segment(metadata, station_id)"
          new = "        historical_max_year.append(maximum[1])\n\n    historical_periods = build_historical_period_envelopes(curves)\n\n    segment = current_segment(metadata, station_id)"
