name: Test monthly frequency export

on:
  push:
    branches:
      - feature/monthly-frequency-export
    paths:
      - monthly_frequency.js
      - index.html
      - .github/workflows/test-monthly-frequency-export.yml
  pull_request:
    branches:
      - main
    paths:
      - monthly_frequency.js
      - index.html
      - .github/workflows/test-monthly-frequency-export.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check monthly_frequency.js
      - name: Test export filename helper
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const code=fs.readFileSync('monthly_frequency.js','utf8');
          const context={globalThis:{}};
          vm.createContext(context);
          vm.runInContext(code,context);
          const api=context.globalThis.__monthlyFrequencyTestApi;
          if(typeof api?.exportFilename!=='function') throw new Error('exportFilename missing');
          const filename=api.exportFilename('Baden-Württemberg','Sommer',{start:1881,end:1910},{start:1991,end:2020},'png');
          if(filename!=='haeufigkeitsverteilung_baden-wurttemberg_sommer_1881-1910_vs_1991-2020.png') throw new Error(`unexpected filename: ${filename}`);
          const pdf=api.exportFilename('Deutschland','Jahr',{start:1961,end:1990},{start:1991,end:2020},'pdf');
          if(!pdf.endsWith('.pdf')) throw new Error('pdf extension missing');
          console.log('export filename tests passed');
          NODE
      - name: Check export UI hooks
        run: |
          grep -q 'id="monthlyFrequencyPngButton"' monthly_frequency.js
          grep -q 'id="monthlyFrequencyPdfButton"' monthly_frequency.js
          grep -q 'downloadMonthlyFrequencyPng' monthly_frequency.js
          grep -q 'downloadMonthlyFrequencyPdf' monthly_frequency.js
          grep -q 'html2canvas@1.4.1' index.html
          grep -q 'jspdf@4.2.1' index.html
