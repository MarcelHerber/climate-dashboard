name: DWD Schnee-Jahresextreme Hamburg 2026 korrigieren
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recompute-annual-snow-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: dwd-annual-snow-2026-correction
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install requests
      - name: Korrekturregeln und Syntax prüfen
        run: |
          python -m py_compile scripts/annual_snow_corrections.py scripts/recompute_annual_snow_2026.py scripts/build_dwd_annual_extremes.py scripts/build_annual_extremes_extra.py
          PYTHONPATH=scripts python - <<'PY'
          from annual_snow_corrections import *
          assert [corrected_snow("01975",date(2026,1,n),v) for n,v in [(10,53),(11,49),(12,47)]] == [25,25,25]
          assert corrected_snow("01975",date(2026,1,13),30) == 30
          assert corrected_snow("01981",date(2026,1,10),53) == 53
          PY
      - name: Betroffene Jahresrekorde aus DWD Originalmessungen neu berechnen
        run: python scripts/recompute_annual_snow_2026.py
      - name: Korrigierte Jahresarchive veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name climate-dashboard-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dwd_annual_extremes.json data/dwd_annual_extremes_stage1.json
          if [[ -f data/dwd_annual_extra_kl.json ]]; then git add data/dwd_annual_extra_kl.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Hamburg Fuhlsbüttel 10–12.01.2026: dokumentierte Schneekorrektur"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          gh workflow run deploy-pages-only.yml --ref main
