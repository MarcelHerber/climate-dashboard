name: GFS Europa · f000-Analyse mit CFSR-Referenz
on:
  push:
    branches: [main, feature/gfs-cfsr-1991-2020-europe-20261113]
    paths:
      - "scripts/update_gfs_analysis_europe.py"
      - "scripts/build_gfs_cfsr_1991_2020.py"
      - "gfs_analysis_europe.html"
      - "gfs_analysis_europe.js"
      - "gfs_analysis_europe.css"
      - "tests/test_gfs_analysis_europe.py"
      - "tests/test_gfs_analysis_europe_browser.py"
      - "scripts/build_pages_site.sh"
      - "mobile_navigation.js"
      - ".github/workflows/update-gfs-analysis-europe.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 20 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: gfs-analysis-europe-daily
  cancel-in-progress: false

jobs:
  analysis-real-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependencies for official GRIB2 0.5 degree analyses
        run: |
          python -m pip install numpy requests eccodes pytest

      - name: Reject fabricated normals and invalid GFS lead times
        run: |
          python -m pytest -q tests/test_gfs_analysis_europe.py
          python -m compileall -q scripts/update_gfs_analysis_europe.py scripts/build_gfs_cfsr_1991_2020.py
          node --check gfs_analysis_europe.js
          bash -n scripts/build_pages_site.sh

      - name: Download and verify four real f000 NOAA analyses for each complete day
        run: |
          python scripts/update_gfs_analysis_europe.py --days-back 3
          python - <<'PY'
          import json,base64
          from datetime import date
          from pathlib import Path
          import numpy as np
          p=Path("gfs_analysis_europe")
          x=json.loads((p/"index.json").read_text(encoding="utf-8"))
          assert x["schema"]==1 and x["type"]=="model_analysis_not_observation"
          assert x["provider"]=="NOAA NCEP GFS 0.5° analysis f000"
          assert x["grid_degrees"]==0.5 and x["width"]==140 and x["height"]==76
          assert x["dates"] and x["data_through"]==x["dates"][-1]
          assert (date.today()-date.fromisoformat(x["data_through"])).days<=5
          raw=np.frombuffer(base64.b64decode(x["temperature_q10_b64"]),dtype="<i2")
          assert raw.size==x["width"]*x["height"]*len(x["dates"])
          assert int(np.count_nonzero(raw==-32768)) < raw.size//100
          assert bool(x.get("anomaly_q10_b64"))==bool(x["reference_ready"])
          for d in x["dates"][-3:]:
              source=json.loads((p/"daily"/(d+".json")).read_text(encoding="utf-8"))
              assert source["kind"]=="GFS analysis f000"
              assert source["cycles_utc"]==[0,6,12,18]
              assert len(source["sources"])==4
              assert all(run["forecast_hour"]==0 for run in source["sources"])
          print("GFS real-data QA:",len(x["dates"]),"complete days, newest",x["data_through"],
                "CFSR/CFSv2 reference validated:",x["reference_ready"])
          PY

      - name: Browser and mobile verification using genuine GFS fields
        if: github.event_name != 'schedule'
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
          python tests/test_gfs_analysis_europe_browser.py

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfs-analysis-europe-qa-${{ github.run_id }}
          path: |
            gfs_analysis_europe_qa/
            gfs_analysis_europe/index.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish only authenticated analysis snapshots to main
        if: github.ref == 'refs/heads/main'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfs_analysis_europe/index.json gfs_analysis_europe/daily/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "GFS Europa: verifizierte f000-Temperaturanalysen aktualisiert"
          for TRY in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((TRY*5))
          done
          exit 1

      - name: Refresh site with validated analysis data
        if: github.ref == 'refs/heads/main' && steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages-only.yml --repo "$GITHUB_REPOSITORY" --ref main
