name: Test ARSO Slovenia agromet month table

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Parser-Selbsttest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_arso_slovenia_agromet_month_table.py --self-test

      - name: ARSO Monats-Tagesdaten-Endpunkt prüfen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_arso_slovenia_agromet_month_table.py
