name: Saharastaub ICON-ART-EU aktualisieren
on:
  schedule:
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-saharastaub.yml"
      - "scripts/update_saharastaub.py"
      - "tests/test_saharastaub.py"
      - "tests/test_saharastaub_ui.cjs"
      - "saharastaub.js"
permissions:
  contents: write
concurrency:
  group: saharastaub-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Dashboard-Dateien laden
        uses: actions/checkout@v6
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: GRIB2-Bibliothek installieren
        run: pip install "numpy>=1.26,<3" "eccodes>=2.38,<3"
      - name: Kartenklassen und Programmcode prüfen
        run: |
          python -m py_compile scripts/update_saharastaub.py
          python -m unittest discover -s tests -p test_saharastaub.py -v
          node --check saharastaub.js
          node --check saharastaub_extended.js
          node --test tests/test_saharastaub_ui.cjs
      - name: Neue ICON-ART-EU-Prognosen abrufen
        run: python scripts/update_saharastaub.py --output /tmp/saharastaub-current.json
      - name: Kartensatz vor Veröffentlichung validieren
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0,"scripts")
          import update_saharastaub as mod
          with open("/tmp/saharastaub-current.json",encoding="utf-8") as f:
              doc=json.load(f)
          assert doc["schema"]==1
          assert doc["palettes"]==mod.PALETTES
          assert doc["grid"]==mod.GRID
          assert len(doc["frames"])>=13 and doc["frames"][0]["hour"]==0
          assert doc["frames"][-1]["hour"]>=72
          for frame in doc["frames"]:
              for param in ("taod","column"):
                  pixels=mod.rle_decode(frame[param],mod.GRID["rows"]*mod.GRID["cols"])
                  assert ((pixels<=9)|(pixels==255)).all()
                  assert (pixels!=255).sum()>=30000
          print("Alle Staubkarten, Gültigkeiten und Festlegenden geprüft.")
          PY
      - name: Nur verifizierte Daten in Datenbranch schreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          TARGET="/tmp/saharastaub-public"
          if git ls-remote --exit-code origin refs/heads/saharastaub-data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --single-branch --branch saharastaub-data "$REMOTE" "$TARGET"
          else
            mkdir -p "$TARGET"
            git -C "$TARGET" init -q -b saharastaub-data
            git -C "$TARGET" remote add origin "$REMOTE"
          fi
          mkdir -p "$TARGET/data/saharastaub"
          cp /tmp/saharastaub-current.json "$TARGET/data/saharastaub/current.json"
          touch "$TARGET/.nojekyll"
          cd "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Staubdaten sind unverändert."
            exit 0
          fi
          git commit -m "Update DWD ICON-ART-EU Saharan dust forecast"
          git push origin HEAD:saharastaub-data
