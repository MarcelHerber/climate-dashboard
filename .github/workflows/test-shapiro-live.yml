name: Shapiro-Keyser · Live Desktop & Handy

on:
  workflow_run:
    workflows:
      - "Shapiro-Keyser · ECMWF Echt-Daten & Querschnitte"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALPENWETTER_PASSWORD: ${{ secrets.ALPENWETTER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Playwright Chromium installieren
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Echtes Passwort, ECMWF-Karten, Druckprofile und Mobilansicht prüfen
        run: node tests/test_shapiro_live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shapiro-live-screenshots
          path: /tmp/shapiro-live-*.png
          if-no-files-found: ignore
