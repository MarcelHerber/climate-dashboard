name: ERA5 März-Backfill nach Ranglauf starten

on:
  workflow_run:
    workflows:
      - "ERA5-Land laufende Temperatur-Rangkarten"
    types:
      - completed

permissions:
  contents: read
  actions: write

jobs:
  start-march-backfill:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Prüfen, ob März 2026 noch fehlt
        id: check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import date
          from pathlib import Path

          source = date.fromisoformat(
              json.loads(Path("era5_land_europe/running/index.json").read_text(encoding="utf-8"))["data_through"]
          )
          rank_path = Path("era5_land_europe/running/temperature_ranks/index.json")
          rank = json.loads(rank_path.read_text(encoding="utf-8")) if rank_path.exists() else {}
          available = set(rank.get("available_dates", []))

          expected = [date(2026, 3, day).isoformat() for day in range(1, 32)]
          source_ready = source >= date(2026, 3, 31)
          missing = [d for d in expected if d not in available]
          needed = source_ready and bool(missing)

          print(f"needed={str(needed).lower()}")
          print(f"Quelle bis {source}; März fehlend: {len(missing)}")
          PY

      - name: März-Backfill direkt anstoßen
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/backfill-era5-running-temperature-ranks.yml/dispatches" \
            -f ref=main \
            -f inputs[month]=03
          echo "März-Backfill wurde direkt nach dem erfolgreichen ERA5-Ranglauf angestoßen."
