name: ERA5 Rangcache Sep-Dez prüfen

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-era5-temperature-rank-cache.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: era5-temperature-rank-cache-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Cache-Liste von GitHub abrufen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate             -H "Accept: application/vnd.github+json"             "/repos/$GITHUB_REPOSITORY/actions/caches?per_page=100"             --jq '.actions_caches[] | [.key,.last_accessed_at,.created_at,.size_in_bytes] | @tsv'             > "$RUNNER_TEMP/cache-list.tsv"

          echo "Gefundene GitHub-Actions-Caches insgesamt: $(wc -l < "$RUNNER_TEMP/cache-list.tsv")"

      - name: Sep-Dez Warmup-Caches auswerten
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          src = Path(__import__("os").environ["RUNNER_TEMP"]) / "cache-list.tsv"
          rows = {}
          if src.exists():
              for line in src.read_text(encoding="utf-8").splitlines():
                  parts = line.split("\t")
                  if len(parts) < 4:
                      continue
                  key, last_accessed, created, size = parts[:4]
                  rows[key] = {
                      "last_accessed_at": last_accessed,
                      "created_at": created,
                      "size_in_bytes": int(size or 0),
                  }

          now = datetime.now(timezone.utc)
          report = {"generated_at": now.isoformat(), "months": {}}

          def age_days(ts):
              if not ts:
                  return None
              try:
                  dt = datetime.fromisoformat(ts.replace("Z", "+00:00"))
                  return (now - dt).total_seconds() / 86400
              except Exception:
                  return None

          for month in range(9, 13):
              hits = []
              misses = []
              for year in range(1950, 2026):
                  key = f"era5-running-temperature-rank-daily-v1-{year}-m{month:02d}"
                  meta = rows.get(key)
                  if meta:
                      hits.append({
                          "year": year,
                          **meta,
                          "age_days": age_days(meta.get("last_accessed_at")),
                      })
                  else:
                      misses.append(year)

              ages = [x["age_days"] for x in hits if x["age_days"] is not None]
              report["months"][f"{month:02d}"] = {
                  "present": len(hits),
                  "expected": 76,
                  "missing": misses,
                  "oldest_last_access_days": max(ages) if ages else None,
                  "newest_last_access_days": min(ages) if ages else None,
                  "present_entries": hits,
              }

          out = Path("era5-cache-report-sep-dec.json")
          out.write_text(json.dumps(report, indent=2), encoding="utf-8")

          summary = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as fh:
              fh.write("# ERA5 Rangcache Sep–Dez\n\n")
              fh.write("| Monat | vorhanden | fehlt | ältester Zugriff | jüngster Zugriff |\n")
              fh.write("|---|---:|---:|---:|---:|\n")
              for month, data in report["months"].items():
                  oldest = data["oldest_last_access_days"]
                  newest = data["newest_last_access_days"]
                  oldest_s = f"{oldest:.1f} Tage" if oldest is not None else "–"
                  newest_s = f"{newest:.1f} Tage" if newest is not None else "–"
                  fh.write(f"| {month} | {data['present']}/76 | {len(data['missing'])} | {oldest_s} | {newest_s} |\n")
              fh.write("\n")
              for month, data in report["months"].items():
                  missing = data["missing"]
                  fh.write(f"**{month}:** ")
                  fh.write("vollständig vorhanden" if not missing else "fehlende Jahre: " + ", ".join(map(str, missing)))
                  fh.write("\n\n")

          print(json.dumps({
              month: {
                  "present": data["present"],
                  "missing": data["missing"],
                  "oldest_last_access_days": data["oldest_last_access_days"],
                  "newest_last_access_days": data["newest_last_access_days"],
              }
              for month, data in report["months"].items()
          }, indent=2))
          PY

      - name: Bericht hochladen
        uses: actions/upload-artifact@v4
        with:
          name: era5-cache-report-sep-dec
          path: era5-cache-report-sep-dec.json
          if-no-files-found: error
          retention-days: 7
