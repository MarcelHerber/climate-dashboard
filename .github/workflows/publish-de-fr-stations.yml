name: Publish Europe station records

on:
  workflow_dispatch:
    inputs:
      include_current_year:
        description: "Laufendes Jahr für GHCN + DWD + Météo-France vor Veröffentlichung aktualisieren"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-europe-stations
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Jahr bestimmen
        id: dates
        shell: bash
        run: |
          YEAR=$(date -u +%Y)
          BASE_YEAR=$((YEAR - 1))
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "base_year=$BASE_YEAR" >> "$GITHUB_OUTPUT"

      # Restore GHCN first. National-source caches are restored afterwards so
      # the newest DWD/Météo-France files win if older cache archives overlap.
      - name: GHCN-Europa-Historical-Cache laden
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: publish-ghcn-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}
          restore-keys: |
            ghcn-europe-baseline-v2-${{ steps.dates.outputs.base_year }}-
            europe-stations-v5r1-${{ steps.dates.outputs.base_year }}-

      - name: DWD-Historical-Cache laden
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: publish-dwd-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}
          restore-keys: |
            dwd-stations-v1-${{ steps.dates.outputs.base_year }}-
            europe-stations-v5r1-${{ steps.dates.outputs.base_year }}-

      - name: Météo-France-Zwischencache laden
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: publish-mf-${{ steps.dates.outputs.base_year }}-${{ github.run_id }}
          restore-keys: |
            meteofrance-repair-v4-${{ steps.dates.outputs.base_year }}-
            meteofrance-stations-v4-${{ steps.dates.outputs.base_year }}-
            meteofrance-stations-v3-${{ steps.dates.outputs.base_year }}-
            meteofrance-stations-v2-${{ steps.dates.outputs.base_year }}-
            europe-stations-v5r1-${{ steps.dates.outputs.base_year }}-

      - name: Caches und Skripte prüfen
        shell: bash
        run: |
          test -s scripts/update_europe_station_records.py
          test -s scripts/publish_europe_station_records.py
          echo "Gefundene GHCN-Caches:"
          find .cache/europe-stations -maxdepth 1 -type f -name 'ghcn_europe_baseline_*.pkl.gz' -print || true
          echo "Gefundene DWD-Caches:"
          find .cache/europe-stations -maxdepth 1 -type f -name 'dwd_germany_kl_baseline_*.pkl.gz' -print || true
          echo "Gefundene Frankreich-Shards:"
          find .cache/europe-stations -maxdepth 2 -type f -path '*meteofrance_resources*/*.pkl.gz' | wc -l
          python scripts/publish_europe_station_records.py --self-test

      - name: Vollständige Europa-Frontend-Daten erzeugen
        shell: bash
        env:
          INCLUDE_CURRENT: ${{ github.event.inputs.include_current_year || 'true' }}
        run: |
          EXTRA_ARGS=""
          if [[ "$INCLUDE_CURRENT" != "true" ]]; then
            EXTRA_ARGS="--no-current"
          fi
          python scripts/publish_europe_station_records.py \
            --year "${{ steps.dates.outputs.year }}" \
            --cache-dir .cache/europe-stations \
            --output europe_stations \
            --workers 8 \
            $EXTRA_ARGS

      - name: Europa-Veröffentlichung prüfen
        shell: bash
        run: |
          test -s europe_stations/index.json
          test -s europe_stations/calendar/01-01.json.gz
          test -s europe_stations/calendar/12-31.json.gz
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path('europe_stations/index.json').read_text(encoding='utf-8'))
          rows=p.get('stations',[])
          de=[x for x in rows if x.get('country')=='Deutschland']
          fr=[x for x in rows if x.get('country')=='Frankreich']
          es=[x for x in rows if x.get('country')=='Spanien']
          ghcn=[x for x in rows if x.get('source')=='GHCN-Daily']
          countries={x.get('country') for x in rows}
          print('Payload:', p.get('payload_version'))
          print('Gesamt:', len(rows), 'Stationen in', len(countries), 'Ländern')
          print('Deutschland/DWD:', len(de))
          print('Frankreich/Météo-France:', len(fr))
          print('Spanien/GHCN:', len(es))
          print('GHCN Rest-Europa gesamt:', len(ghcn))
          if not de or not fr or not es or not ghcn:
              raise SystemExit('Europa-Publish unvollständig: DE/FR/ES/GHCN darf nicht fehlen.')
          if not all(x.get('source')=='DWD CDC' for x in de):
              raise SystemExit('Deutschland enthält eine Nicht-DWD-Quelle.')
          if not all(x.get('source')=='Météo-France' for x in fr):
              raise SystemExit('Frankreich enthält eine Nicht-Météo-France-Quelle.')
          if not all(x.get('source')=='GHCN-Daily' for x in es):
              raise SystemExit('Spanien muss bis AEMET über GHCN enthalten bleiben.')
          if len(countries) < 10:
              raise SystemExit(f'Zu wenige Länder im Europa-Publish: {len(countries)}')
          print('Europa Publish-Prüfung OK.')
          PY

      - name: Europa-Stationsdaten committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add europe_stations
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Europa-Stationsdaten."
            exit 0
          fi
          git commit -m "Publish Europe station records"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
