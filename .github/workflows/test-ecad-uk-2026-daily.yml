name: Test ECA&D UK 2026 daily values

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Historischen UK-MIDAS-Cache wiederherstellen
        uses: actions/cache/restore@v5
        with:
          path: .cache/europe-stations
          key: ecad-uk-daily-probe-${{ github.run_id }}
          restore-keys: |
            metoffice-uk-midas-baseline-2025-v1-

      - name: Selbsttests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_ecad_uk_2026.py --self-test
          python scripts/test_ecad_uk_2026_daily.py --self-test

      - name: ECA&D UK 2026 echte Tageswerte prüfen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_ecad_uk_2026_daily.py
