name: DWD MOSMIX-L Deutschland und Sonnenschein aktualisieren

on:
  schedule:
    - cron: "40 4,10,16,22 * * *"
  push:
    paths:
      - ".github/workflows/update-mosmix.yml"
      - "scripts/update_mosmix.py"
      - "scripts/merge_mosmix_previous.py"
      - "scripts/build_mosmix_chunks.py"
      - "tests/test_mosmix_tx_tn.py"
      - "tests/test_mosmix_world.mjs"
      - "tests/test_mosmix_sun_daily.mjs"
      - "tests/test_mosmix_loader.mjs"
      - "tests/test_mosmix_chunks.py"
      - "tests/test_mosmix_run_compare.py"
      - "mosmix.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mosmix-data-publish
  cancel-in-progress: true

jobs:
  update-mosmix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository laden
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: MOSMIX Parameter und 12-h-Zeitbezug testen
        run: python -m unittest discover -s tests -p test_mosmix_tx_tn.py -v

      - name: MOSMIX-Tagespakete und Zeitumstellung testen
        run: |
          python -m unittest discover -s tests -p test_mosmix_chunks.py -v
          python -m unittest discover -s tests -p test_mosmix_run_compare.py -v

      - name: MOSMIX-Oberfläche auf Syntax prüfen
        run: |
          node --check mosmix.js
          node tests/test_mosmix_world.mjs
          node tests/test_mosmix_sun_daily.mjs
          node tests/test_mosmix_loader.mjs

      - name: MOSMIX-L laden und Deutschlanddatei bauen
        run: |
          rm -rf /tmp/mosmix-public
          mkdir -p /tmp/mosmix-public/data/mosmix
          python scripts/update_mosmix.py --output /tmp/mosmix-public/data/mosmix/mosmix_ttt.json

      - name: Geteilte Kartenpakete für schnelles Online-MOSMIX erzeugen
        run: |
          python scripts/build_mosmix_chunks.py /tmp/mosmix-public/data/mosmix/mosmix_ttt.json /tmp/mosmix-public/data/mosmix
          python - <<'PY'
          import json,pathlib
          d=pathlib.Path("/tmp/mosmix-public/data/mosmix")
          manifest=json.loads((d/"manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("schema")==2
          assert len(manifest["modes"]["hourly"])>40
          assert len(manifest["modes"]["sun"])>=2
          assert len(manifest["modes"]["tmax"])>=2
          assert len(manifest["modes"]["tmin"])>=2
          for mode,frames in manifest["modes"].items():
            for frame in frames:
              assert (d/frame["path"]).is_file(),(mode,frame["path"])
          print("MOSMIX-Kartenpakete vollständig:",len(manifest["modes"]))
          PY

      - name: Vorherigen echten MOSMIX-Lauf für Meteogrammvergleich sichern
        shell: bash
        run: |
          if git fetch --quiet --no-tags --depth=1 origin refs/heads/mosmix-data:refs/remotes/origin/mosmix-data; then
            if git show refs/remotes/origin/mosmix-data:data/mosmix/mosmix_ttt.json > /tmp/mosmix-previous.json; then
              python scripts/merge_mosmix_previous.py /tmp/mosmix-previous.json /tmp/mosmix-public/data/mosmix/mosmix_ttt.json
            else
              echo "MOSMIX-Laufvergleich noch ohne gespeicherten Vorlauf."
            fi
          else
            echo "Noch kein alter MOSMIX-Datenbranch verfügbar."
          fi

      - name: Originale TX und TN auf dem Datenbranch prüfen
        run: |
          python - <<'PY'
          import datetime, json, pathlib
          p=pathlib.Path("/tmp/mosmix-public/data/mosmix/mosmix_ttt.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j.get("product")=="DWD MOSMIX-L"
          assert j.get("extrema_reference",{}).get("TX",{}).get("valid_hour_utc")==18
          assert j.get("extrema_reference",{}).get("TN",{}).get("valid_hour_utc")==6
          stations=j.get("stations",[])
          assert len(stations)>100, "Unplausibel wenige MOSMIX-Stationen"
          tx=sum(1 for s in stations if s.get("tx12"))
          tn=sum(1 for s in stations if s.get("tn12"))
          assert tx>100 and tn>100, "TX/TN Originalwerte fehlen weitgehend"
          # No global catalogue or shards are published.
          assert "world_index" not in j and "world_station_count" not in j
          assert not (p.parent/"world_stations.json").exists()
          assert not (p.parent/"world").exists()
          sun=sum(1 for st in stations if any(
              isinstance(v,(int,float)) and 0<=v<=60
              for v in st.get("sun1",[]) ))
          assert sun>100, "Sonnenschein ist nicht flächig vorhanden"
          assert sum(1 for p in (p.parent/"stations").glob("*.json"))==len(stations)
          print("DWD MOSMIX-L Deutschland:",len(stations),"Stationen | SunD1:",sun,"| TX:",tx,
                "| TN:",tn,"| Lauf:",j.get("issue_time"))
          PY

      - name: MOSMIX-Datenbranch veröffentlichen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan mosmix-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/mosmix-public/. .
          touch .nojekyll
          git add -A
          git commit -m "DWD MOSMIX-L nur Deutschland, Sonnenschein aktualisiert"
          git branch -M mosmix-data
          git push --force origin mosmix-data

          echo "MOSMIX-Daten veröffentlicht."
