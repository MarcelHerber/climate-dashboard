name: DWD MOSMIX-L Deutschland, Weltstationen und Sonnenschein aktualisieren

on:
  schedule:
    - cron: "40 4,10,16,22 * * *"
  push:
    paths:
      - ".github/workflows/update-mosmix.yml"
      - "scripts/update_mosmix.py"
      - "tests/test_mosmix_tx_tn.py"
      - "tests/test_mosmix_world.mjs"
      - "mosmix.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mosmix-data-publish
  cancel-in-progress: true

jobs:
  update-mosmix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository laden
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: MOSMIX Parameter und 12-h-Zeitbezug testen
        run: python -m unittest discover -s tests -p test_mosmix_tx_tn.py -v

      - name: MOSMIX-Oberfläche auf Syntax prüfen
        run: |
          node --check mosmix.js
          node tests/test_mosmix_world.mjs

      - name: MOSMIX-L laden und Deutschlanddatei bauen
        run: |
          rm -rf /tmp/mosmix-public
          mkdir -p /tmp/mosmix-public/data/mosmix
          python scripts/update_mosmix.py --output /tmp/mosmix-public/data/mosmix/mosmix_ttt.json

      - name: Originale TX und TN auf dem Datenbranch prüfen
        run: |
          python - <<'PY'
          import datetime, json, pathlib
          p=pathlib.Path("/tmp/mosmix-public/data/mosmix/mosmix_ttt.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j.get("product")=="DWD MOSMIX-L"
          assert j.get("extrema_reference",{}).get("TX",{}).get("valid_hour_utc")==18
          assert j.get("extrema_reference",{}).get("TN",{}).get("valid_hour_utc")==6
          stations=j.get("stations",[])
          assert len(stations)>100, "Unplausibel wenige MOSMIX-Stationen"
          tx=sum(1 for s in stations if s.get("tx12"))
          tn=sum(1 for s in stations if s.get("tn12"))
          assert tx>100 and tn>100, "TX/TN Originalwerte fehlen weitgehend"
          index=json.loads((p.parent/"world_stations.json").read_text(encoding="utf-8"))
          assert index["schema"]==1
          assert index["issue_time"]==j["issue_time"]
          assert index["station_count"]==j["world_station_count"]>=3000
          assert len({(x["key"],x["shard"]) for x in index["stations"]})==index["station_count"]
          assert all(x["key"].startswith(x["shard"]) for x in index["stations"])
          assert any(x["lon"]>100 for x in index["stations"]), "Asien/Pazifik fehlt"
          assert any(x["lon"]< -50 for x in index["stations"]), "Amerika fehlt"
          assert any(x["lat"]< -20 for x in index["stations"]), "Südhalbkugel fehlt"
          sun=0
          total=0
          for shard in set(x["shard"] for x in index["stations"]):
            f=p.parent/"world"/(shard+".json")
            assert f.is_file()
            group=json.loads(f.read_text(encoding="utf-8"))
            assert group["issue_time"]==j["issue_time"]
            for row in group["stations"].values():
              total+=1
              v=row["parameters"].get("SunD1",[])
              if any(isinstance(n,(int,float)) and 0<=n<=60 for n in v):
                sun+=1
          assert total==index["station_count"] and sun>1000, "Sonnenschein nicht flächig verfügbar"
          assert sum(1 for p in (p.parent/"stations").glob("*.json"))==len(stations)
          print("Weltweite Stationen:",total,"| mit SunD1:",sun)
          print("DWD MOSMIX-L:",len(stations),"Stationen | TX:",tx,
                "| TN:",tn,"| Lauf:",j.get("issue_time"))
          PY

      - name: MOSMIX-Datenbranch veröffentlichen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan mosmix-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/mosmix-public/. .
          touch .nojekyll
          git add -A
          git commit -m "DWD MOSMIX-L Deutschland, Weltstationen, Sonnenschein aktualisiert"
          git branch -M mosmix-data
          git push --force origin mosmix-data

          echo "MOSMIX-Daten veröffentlicht."
