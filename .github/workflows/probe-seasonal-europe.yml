name: Saisonal Europa Datenprobe
on:
  workflow_dispatch:
  push:
    branches: [feature/seasonal-europe-fixed-maps-20261015]
    paths:
      - scripts/probe_seasonal_europe.py
      - .github/workflows/probe-seasonal-europe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/probe_seasonal_europe.py
