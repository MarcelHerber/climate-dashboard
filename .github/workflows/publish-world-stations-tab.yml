name: Publish world stations tab

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-world-stations-tab.yml'
      - 'scripts/publish_world_stations_tab.py'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current dashboard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download latest successful world baseline artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --workflow build-world-ghcn-baseline.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "Using baseline run $RUN_ID"
          rm -rf _world_artifact
          mkdir -p _world_artifact
          gh run download "$RUN_ID" --name world-ghcn-baseline-through-2025-v1 --dir _world_artifact
          test -f _world_artifact/world_ghcn_baseline_through_2025_v1.pkl.gz

      - name: Build full world station data and add tab
        run: |
          set -euo pipefail
          python scripts/publish_world_stations_tab.py \
            --index index.html \
            --baseline-pickle _world_artifact/world_ghcn_baseline_through_2025_v1.pkl.gz \
            --output-json data/world_stations_stage9.json

      - name: Validate publication payload
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/world_stations_stage9.json').read_text(encoding='utf-8'))
          html=Path('index.html').read_text(encoding='utf-8')
          assert d['station_count'] == 40695, d['station_count']
          assert d['with_tmax'] == 40548, d['with_tmax']
          assert d['with_tmin'] == 40442, d['with_tmin']
          assert d['with_both'] == 40295, d['with_both']
          assert d['country_codes'] == 216, d['country_codes']
          assert html.count('id="worldStations"') == 1
          assert html.count("switchTab('worldStations')") >= 1
          assert 'niedrigstes TMAX' not in html[html.find('id="worldStations"'):html.find('id="compare"')]
          assert 'höchstes TMIN' not in html[html.find('id="worldStations"'):html.find('id="compare"')]
          print('VALIDATION OK', d['station_count'], d['with_tmax'], d['with_tmin'], d['with_both'])
          PY

      - name: Commit published world stations tab
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/world_stations_stage9.json
          if git diff --cached --quiet; then
            echo 'No publication changes to commit.'
            exit 0
          fi
          git commit -m 'Publish full world GHCN station map'
          git push
