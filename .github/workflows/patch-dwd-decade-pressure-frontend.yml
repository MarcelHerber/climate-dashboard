name: Luftdruck NN in Dekadenrekorde einbauen

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dwd-decade-pressure-frontend
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Luftdruck-Datenbasis prüfen
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/dwd_decade_pressure_records.json").read_text())
          assert d["version"] == 5
          assert set(d["metrics"]) == {"p_high","p_low"}
          assert len(d["areas"]) == 17 and len(d["periods"]) == 36
          assert int(d["data_start"][:4]) <= 1950
          assert d["valid_observations"] >= 60_000_000
          print("Luftdruckdaten OK:", d["data_start"], "bis", d["data_through"])
          PY

      - name: Frontend erweitern
        run: |
          set -euo pipefail
          python scripts/patch_dwd_decade_pressure_frontend.py --file dekadenrekorde.html

      - name: Prüfen
        run: |
          set -euo pipefail
          grep -q 'value="p_high"' dekadenrekorde.html
          grep -q 'value="p_low"' dekadenrekorde.html
          grep -q 'dwd_decade_pressure_records.json' dekadenrekorde.html
          grep -q 'dwd_decade_pressure_records.json' scripts/build_pages_site.sh

      - name: Veröffentlichen
        run: |
          set -euo pipefail
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dekadenrekorde.html
          if git diff --cached --quiet; then
            echo "Frontend bereits aktuell."
          else
            git commit -m "Luftdruck NN in Dekadenrekorde einbauen"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Pages neu bauen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run deploy-pages-only.yml --ref main
          echo "Pages-only-Workflow gestartet."
