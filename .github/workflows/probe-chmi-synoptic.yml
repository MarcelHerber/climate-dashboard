name: ČHMÚ synoptic browser source verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_chmi_browser.py"
      - ".github/workflows/probe-chmi-synoptic.yml"

permissions:
  contents: write

concurrency:
  group: chmi-synoptic-browser-inspection
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts/probe_chmi_browser.py
            data/synoptic_charts/chmi_browser_probe.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Browser support
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect official CHMI dynamic chart metadata
        run: python scripts/probe_chmi_browser.py
      - name: Publish non-sensitive provider metadata only
        shell: bash
        run: |
          set -euo pipefail
          cp data/synoptic_charts/chmi_browser_probe.json /tmp/chmi_browser_probe.json
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/synoptic_charts
            cp /tmp/chmi_browser_probe.json data/synoptic_charts/chmi_browser_probe.json
            git add data/synoptic_charts/chmi_browser_probe.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record safe ČHMÚ synoptic source inspection"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
