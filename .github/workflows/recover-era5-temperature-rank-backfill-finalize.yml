name: ERA5 Temperatur-Rangarchive Monats-Backfill reparieren

on:
  push:
    paths:
      - ".github/workflows/recover-era5-temperature-rank-backfill-finalize.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Ursprungsrun mit den bereits fertigen Monats-Artefakten"
        required: true
        default: "34768984167"
      target_year:
        description: "Zieljahr"
        required: true
        default: "2026"
      target_month:
        description: "Zielmonat (zweistellig)"
        required: true
        default: "05"
      repair_year:
        description: "Fehlendes historisches Jahr, das gezielt neu gebaut wird"
        required: true
        default: "1980"
      cancel_run_id:
        description: "Hängenden Backfill-Run vor der Reparatur abbrechen"
        required: false
        default: "34768984167"
      next_month:
        description: "Nach erfolgreicher Reparatur diesen Folgemonat anstoßen"
        required: false
        default: "06"

permissions:
  actions: write
  contents: write

# Absichtlich getrennt von Live-Rangkarten und normalem Monats-Backfill.
concurrency:
  group: era5-running-temperature-ranks-repair
  cancel-in-progress: false

jobs:
  repair-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '34768984167' }}
      TARGET_YEAR: ${{ inputs.target_year || '2026' }}
      TARGET_MONTH: ${{ inputs.target_month || '05' }}
      REPAIR_YEAR: ${{ inputs.repair_year || '1980' }}
      CANCEL_RUN_ID: ${{ inputs.cancel_run_id || '34768984167' }}
      NEXT_MONTH: ${{ inputs.next_month || '06' }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Hängenden Backfill-Versuch abbrechen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CANCEL_RUN_ID:-}" ]]; then
            echo "Kein Run zum Abbrechen angegeben."
            exit 0
          fi
          echo "Versuche Run ${CANCEL_RUN_ID} abzubrechen ..."
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANCEL_RUN_ID}/cancel" \
            || echo "Run war bereits beendet oder ließ sich nicht mehr abbrechen; Reparatur läuft trotzdem weiter."

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cdsapi>=0.7.7" numpy xarray netCDF4 matplotlib cartopy pillow

      - name: Aktuellen Monatsstack aus Ursprungsrun laden
        uses: actions/download-artifact@v4
        with:
          name: era5-rank-backfill-current-${{ env.TARGET_YEAR }}-${{ env.TARGET_MONTH }}
          path: .era5_running_rank_backfill_current
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bereits fertige historische Monatsbeiträge laden
        uses: actions/download-artifact@v4
        with:
          pattern: era5-rank-backfill-${{ env.TARGET_YEAR }}-${{ env.TARGET_MONTH }}-*
          path: .era5_running_rank_backfill_shards
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: daily-cache
        name: Tagescache des Reparaturjahres laden
        uses: actions/cache@v4
        with:
          path: .era5_running_rank_daily_cache
          key: era5-running-temperature-rank-daily-v1-${{ env.REPAIR_YEAR }}-m${{ env.TARGET_MONTH }}

      - name: Alten Tagescache als Fallback laden
        if: steps.daily-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .era5_running_rank_cache
          key: era5-running-temperature-rank-v2-${{ env.REPAIR_YEAR }}-m${{ env.TARGET_MONTH }}

      - name: Historische Monatsmittel des Reparaturjahres laden
        uses: actions/cache@v4
        with:
          path: .era5_running_rank_monthly_cache
          key: era5-running-temperature-rank-monthly-v1-${{ env.REPAIR_YEAR }}

      - name: CDS konfigurieren
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CDSAPI_KEY:-}"
          printf 'url: https://cds.climate.copernicus.eu/api\nkey: %s\n' "${CDSAPI_KEY}" > "$HOME/.cdsapirc"
          chmod 600 "$HOME/.cdsapirc"

      - name: Nur fehlenden historischen Shard neu bauen
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_FILE=$(find .era5_running_rank_backfill_current -name 'current_*.npz' -type f | head -n 1)
          test -n "$CURRENT_FILE"
          mkdir -p .era5_running_rank_backfill_shards
          rm -f ".era5_running_rank_backfill_shards/contrib_${REPAIR_YEAR}.npz"
          python scripts/build_era5_temperature_rank_backfill_shard.py \
            --year "${REPAIR_YEAR}" \
            --current-file "$CURRENT_FILE" \
            --output ".era5_running_rank_backfill_shards/contrib_${REPAIR_YEAR}.npz"
          test -s ".era5_running_rank_backfill_shards/contrib_${REPAIR_YEAR}.npz"

      - name: Historische Shards vollständig prüfen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          years=set(range(1950, int(os.environ["TARGET_YEAR"])))
          root=Path(".era5_running_rank_backfill_shards")
          found={
              int(path.stem.split("_")[-1])
              for path in root.glob("contrib_*.npz")
          }
          missing=sorted(years-found)
          extra=sorted(found-years)
          assert not missing, f"Historische Shards fehlen: {missing}"
          assert not extra, f"Unerwartete Shards: {extra}"
          print(f"Historische Shards vollständig: {len(found)} Jahre (1950–{max(found)})")
          PY

      - name: Vor dem Finalisieren neuesten main-Stand holen
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Monatsarchiv rendern
        run: |
          python scripts/finalize_era5_temperature_rank_backfill.py \
            --current-dir .era5_running_rank_backfill_current \
            --shard-dir .era5_running_rank_backfill_shards \
            --data-root .

      - name: Monatsarchiv vollständig prüfen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import calendar, json, os
          from datetime import date
          from pathlib import Path
          import numpy as np

          year=int(os.environ["TARGET_YEAR"])
          month=int(os.environ["TARGET_MONTH"])
          end=calendar.monthrange(year, month)[1]
          root=Path("era5_land_europe/running/temperature_ranks")
          manifest=json.loads((root/"index.json").read_text(encoding="utf-8"))
          expected=[date(year,month,d).isoformat() for d in range(1,end+1)]
          available=set(manifest.get("available_dates", []))
          assert all(d in available for d in expected)

          month_key=f"{year}-{month:02d}"
          data_path=root/"data_archive"/f"{month_key}.npz"
          assert data_path.exists() and data_path.stat().st_size>0, data_path
          with np.load(data_path, allow_pickle=False) as data:
              assert data["target_dates"].astype(str).tolist()==expected
              assert data["lat"].ndim==1 and data["lon"].ndim==1
              assert int(data["year"])==year
              assert int(data["month"])==month
              assert int(data["missing_value"])==0
              for product in ("day","month_to_date","season_to_date","year_to_date"):
                  arr=data[product]
                  assert arr.shape[0]==end
                  assert arr.dtype==np.uint8
                  assert int(arr.max())<=77

          meta=(manifest.get("data_archives") or {}).get(month_key)
          assert meta and int(meta["days"])==end
          for day_index,d in enumerate(expected):
              archive=root/"archive"/d
              payload=json.loads((archive/"index.json").read_text(encoding="utf-8"))
              assert int(payload["data_archive"]["day_index"])==day_index
              for product in ("day","month_to_date","season_to_date","year_to_date"):
                  image=archive/f"temperature_{product}_rank.webp"
                  assert image.exists() and image.stat().st_size>0, image

          print(f"Monatsarchiv vollständig: {month_key} · {len(expected)} Tage")
          PY

      - name: Monatsarchiv veröffentlichen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add era5_land_europe/running/temperature_ranks
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu veröffentlichen."
          else
            git commit -m "ERA5 Temperatur-Rangarchiv ${TARGET_YEAR}-${TARGET_MONTH} repariert"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Folgemonat anstoßen
        if: env.NEXT_MONTH != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Starte Monats-Backfill ${TARGET_YEAR}-${NEXT_MONTH}."
          gh workflow run backfill-era5-running-temperature-ranks.yml \
            --ref main \
            -f month="${NEXT_MONTH}"
