name: Phase 3 · Historische DWD-Tagesrekorde Niederschlag & Sonnenschein

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_rekordlabor_daily_rain_sun.py
      - .github/workflows/update-rekordlabor-daily-kl.yml
  schedule:
    - cron: "15 6 2 * *"

permissions:
  contents: write

concurrency:
  group: rekordlabor-dwd-kl-daily
  cancel-in-progress: false

jobs:
  DWD-KL-record-calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch and decode only genuine DWD CDC historical daily KL archives
        run: python -u scripts/build_rekordlabor_daily_rain_sun.py --out data/rekordlabor/calendar
      - name: Validate original rain/sun provenance, years and packed data
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,json,struct,zlib,datetime as dt
          root=Path("data/rekordlabor/calendar")
          idx=json.loads((root/"index.json").read_text(encoding="utf8"))
          assert idx["ready"] and idx["stations"]
          for st in idx["stations"]:
              doc=json.loads((root/(st["id"]+".json")).read_text(encoding="utf8"))
              assert doc["station_id"]==st["id"] and doc["source_url"].startswith("https://opendata.dwd.de/")
              assert all(a<b for a,b in zip(doc["years"],doc["years"][1:]))
              for k,m in doc["metrics"].items():
                  assert k in ("rain","sun")
                  raw=zlib.decompress(base64.b64decode(m["data"]))
                  assert len(raw)==len(doc["years"])*366*2
                  vals=struct.unpack("<"+"h"*(len(raw)//2),raw)
                  assert sum(v!=-32768 for v in vals)==m["measured_days"]
                  assert any(v!=-32768 for v in vals)
          print("Verified DWD KL daily sunshine & rain:",len(idx["stations"]))
          PY
      - name: Commit only verified historical daily DWD data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rekordlabor/calendar
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: historical genuine DWD KL corrected rain and sunshine records [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-dwd-kl-daily-observations
          path: data/rekordlabor/calendar/
          retention-days: 14
          if-no-files-found: warn
