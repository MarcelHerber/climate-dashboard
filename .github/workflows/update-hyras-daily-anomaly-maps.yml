name: HYRAS tägliche Temperaturabweichungen

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["HYRAS Flächenkarten aktualisieren"]
    types: [completed]
  push:
    paths:
      - "scripts/build_hyras_full_year_anomaly_reference.py"
      - "tests/test_hyras_full_year_anomaly_reference.py"
      - "scripts/build_hyras_daily_anomaly_maps.py"
      - "scripts/hyras_anomaly_schedule.py"
      - "tests/test_hyras_anomaly_schedule.py"
      - ".github/workflows/update-hyras-daily-anomaly-maps.yml"

permissions:
  contents: write

concurrency:
  group: hyras-data
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.target.outputs.target_date }}
      needed: ${{ steps.target.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: HYRAS-Anomalie-Zeitfenster testen
        run: |
          python -m unittest discover -s tests -p 'test_hyras_anomaly_schedule.py'
          python -m unittest discover -s tests -p 'test_hyras_full_year_anomaly_reference.py'

      - name: Gemeinsamen HYRAS-Datenstand bestimmen
        id: target
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hyras-daily-anomaly-meta
          git fetch origin hyras-data --depth=1
          git worktree add --detach /tmp/hyras-daily-anomaly-meta origin/hyras-data
          python scripts/hyras_anomaly_schedule.py --data-root /tmp/hyras-daily-anomaly-meta >> "$GITHUB_OUTPUT"

  reference:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        parameter: [tmean, tmax, tmin]
        shard:
          - "1961-1965"
          - "1966-1970"
          - "1971-1975"
          - "1976-1980"
          - "1981-1985"
          - "1986-1990"
          - "1991-1995"
          - "1996-2000"
          - "2001-2005"
          - "2006-2010"
          - "2011-2015"
          - "2016-2020"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: HYRAS-Abhängigkeiten installieren
        run: pip install -r requirements-hyras.txt

      - name: Kalenderjährliche Referenzshards cachen
        id: ref-cache
        uses: actions/cache@v4
        with:
          path: /tmp/hyras-daily-anomaly-reference/daily_anomaly_ref_${{ matrix.parameter }}_*.npz
          key: hyras-daily-anomaly-full-year-v2-factor5-${{ matrix.parameter }}-${{ matrix.shard }}

      - name: Referenzbeitrag berechnen
        if: steps.ref-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          IFS=- read -r START END <<< "${{ matrix.shard }}"
          mkdir -p /tmp/hyras-daily-anomaly-reference
          python scripts/build_hyras_full_year_anomaly_reference.py \
            --parameter "${{ matrix.parameter }}" \
            --start-year "$START" \
            --end-year "$END" \
            --display-factor 5 \
            --cache-root /tmp/hyras-full-year-cache \
            --work /tmp/hyras-full-year-work \
            --output "/tmp/hyras-daily-anomaly-reference/daily_anomaly_ref_${{ matrix.parameter }}_${START}_${END}.npz"

      - uses: actions/upload-artifact@v4
        with:
          name: hyras-daily-anomaly-ref-${{ matrix.parameter }}-${{ matrix.shard }}
          path: /tmp/hyras-daily-anomaly-reference/*.npz
          if-no-files-found: error
          compression-level: 6
          retention-days: 2

  render:
    needs: [prepare, reference]
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        parameter: [tmean, tmax, tmin]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: HYRAS-Abhängigkeiten installieren
        run: pip install -r requirements-hyras.txt

      - name: Referenzshards herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: hyras-daily-anomaly-ref-${{ matrix.parameter }}-*
          path: /tmp/hyras-daily-anomaly-reference
          merge-multiple: true

      - name: hyras-data Stand übernehmen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hyras-daily-anomaly-data
          git fetch origin hyras-data --depth=1
          git worktree add --detach /tmp/hyras-daily-anomaly-data origin/hyras-data

      - name: Tagesanomaliekarten rendern
        run: |
          python scripts/build_hyras_daily_anomaly_maps.py \
            --parameter "${{ matrix.parameter }}" \
            --data-root /tmp/hyras-daily-anomaly-data \
            --shard-dir /tmp/hyras-daily-anomaly-reference \
            --target-date "${{ needs.prepare.outputs.target_date }}" \
            --work /tmp/hyras-daily-anomaly-current

      - name: Parameter-Ausgabe sammeln
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "/tmp/hyras-daily-anomaly-output/${{ matrix.parameter }}/regions"
          cp -a "/tmp/hyras-daily-anomaly-data/${{ matrix.parameter }}/regions/daily_anomalies" "/tmp/hyras-daily-anomaly-output/${{ matrix.parameter }}/regions/"
          cp "/tmp/hyras-daily-anomaly-data/${{ matrix.parameter }}/regions/daily_anomaly_maps.json" "/tmp/hyras-daily-anomaly-output/${{ matrix.parameter }}/regions/"

      - uses: actions/upload-artifact@v4
        with:
          name: hyras-daily-anomaly-maps-${{ matrix.parameter }}
          path: /tmp/hyras-daily-anomaly-output
          if-no-files-found: error
          compression-level: 6
          retention-days: 2

  publish:
    needs: [prepare, render]
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Kartenartefakte herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: hyras-daily-anomaly-maps-*
          path: /tmp/hyras-daily-anomaly-output
          merge-multiple: true

      - name: hyras-data laden
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hyras-daily-anomaly-publish
          git fetch origin hyras-data --depth=1
          git worktree add -b hyras-daily-anomaly-publish /tmp/hyras-daily-anomaly-publish origin/hyras-data

      - name: Tagesanomaliekarten einbauen und prüfen
        shell: bash
        env:
          TARGET_DATE: ${{ needs.prepare.outputs.target_date }}
        run: |
          set -euo pipefail
          cp -a /tmp/hyras-daily-anomaly-output/. /tmp/hyras-daily-anomaly-publish/
          python - <<'PY'
          import json, os
          from datetime import date
          from pathlib import Path
          root=Path("/tmp/hyras-daily-anomaly-publish")
          target=date.fromisoformat(os.environ["TARGET_DATE"])
          for parameter in ("tmean","tmax","tmin"):
              manifest=json.loads((root/parameter/"regions"/"daily_anomaly_maps.json").read_text(encoding="utf-8"))
              assert manifest["data_through"] == target.isoformat()
              assert manifest["calendar_version"] == 2
              assert manifest["scale"]["min"] == -18
              assert manifest["scale"]["max"] == 18
              assert manifest["references"] == ["1991-2020","1961-1990"]
              assert manifest["available_dates"][0] == f"{target.year}-01-01"
              assert manifest["available_dates"][-1] == target.isoformat()
              from datetime import timedelta
              expected_days=(target-date(target.year,1,1)).days+1
              expected=[(date(target.year,1,1)+timedelta(days=i)).isoformat() for i in range(expected_days)]
              assert manifest["available_dates"] == expected
              for day in expected:
                  for ref in manifest["references"]:
                      rel=manifest["dates"][day][ref]
                      assert (root/parameter/"regions"/rel).exists(), (parameter,day,ref,rel)
          print("Tagesanomaliekarten vollständig geprüft.")
          PY

      - name: HYRAS-Tageskarten monatsweise veröffentlichen
        shell: bash
        env:
          TARGET_DATE: ${{ needs.prepare.outputs.target_date }}
        run: |
          set -euo pipefail
          cd /tmp/hyras-daily-anomaly-publish
          git config user.name "climate-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          year="$(echo "$TARGET_DATE" | cut -c1-4)"
          # Per-month commits keep backfills manageable.
          for month in $(seq -w 1 12); do
            for parameter in tmean tmax tmin; do
              for reference in 1991-2020 1961-1990; do
                directory="$parameter/regions/daily_anomalies/$reference"
                find "$directory" -maxdepth 1 -type f -name "${year}-${month}-*.png" -print0 |
                  xargs -0 -r git add --
              done
            done
            if ! git diff --cached --quiet; then
              git commit -m "HYRAS daily anomalies ${year}-${month}"
              git fetch origin hyras-data
              git rebase origin/hyras-data
              git push origin HEAD:hyras-data
            fi
          done
          git add tmean/regions/daily_anomaly_maps.json
          git add tmax/regions/daily_anomaly_maps.json
          git add tmin/regions/daily_anomaly_maps.json
          if git diff --cached --quiet; then
            echo "Tageskartenindex bereits aktuell."
          else
            git commit -m "HYRAS year-round daily anomaly manifests updated"
            git fetch origin hyras-data
            git rebase origin/hyras-data
            git push origin HEAD:hyras-data
          fi
