name: Diagnose SST NOAA ERDDAP

on:
  workflow_dispatch:
  push:
    branches: ["feature/sst-europe-stage1"]
    paths:
      - ".github/workflows/diagnose-sst-noaa.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: NOAA ERDDAP Problemblock testen
        shell: bash
        run: |
          set -u
          BASE='https://comet.nefsc.noaa.gov/erddap/griddap/noaa_psl_4e02_3713_6583.nc?sst'
          test_query() {
            label="$1"
            spec="$2"
            out="/tmp/${label}.nc"
            started=$(date +%s)
            code=$(curl -L -sS --max-time 120 -o "$out" -w '%{http_code}' "${BASE}${spec}" || true)
            elapsed=$(( $(date +%s) - started ))
            bytes=$(wc -c < "$out" 2>/dev/null || echo 0)
            echo "${label}: HTTP ${code}, ${bytes} bytes, ${elapsed}s"
            if [[ -s "$out" && "$code" != "200" ]]; then
              head -c 400 "$out" | strings | head -n 8 || true
            fi
            echo
          }

          # Der Live-Smoke-Test scheiterte exakt an 300:359 / 434:699 / 1174:1439.
          test_query fail60 '%5B300:1:359%5D%5B434:1:699%5D%5B1174:1:1439%5D'
          test_query first30 '%5B300:1:329%5D%5B434:1:699%5D%5B1174:1:1439%5D'
          test_query second30 '%5B330:1:359%5D%5B434:1:699%5D%5B1174:1:1439%5D'
          test_query first15 '%5B300:1:314%5D%5B434:1:699%5D%5B1174:1:1439%5D'
          test_query second15 '%5B315:1:329%5D%5B434:1:699%5D%5B1174:1:1439%5D'
