name: Diagnose SST NOAA ERDDAP

on:
  workflow_dispatch:
  push:
    branches: ["feature/sst-europe-stage1"]
    paths:
      - ".github/workflows/diagnose-sst-noaa.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: NOAA ERDDAP Subset-Größen testen
        shell: bash
        run: |
          set -u
          BASE='https://comet.nefsc.noaa.gov/erddap/griddap/noaa_psl_4e02_3713_6583.nc?sst'
          test_query() {
            label="$1"
            spec="$2"
            out="/tmp/${label}.nc"
            code=$(curl -L -sS --max-time 120 -o "$out" -w '%{http_code}' "${BASE}${spec}" || true)
            bytes=$(wc -c < "$out" 2>/dev/null || echo 0)
            echo "${label}: HTTP ${code}, ${bytes} bytes"
            if [[ -s "$out" ]]; then
              head -c 300 "$out" | strings | head -n 5 || true
            fi
            echo
          }

          # Exakt dieselbe Kodierung wie requests im Pilot; nur die Zeitlänge variiert.
          test_query t60 '%5B0:1:59%5D%5B434:1:699%5D%5B0:1:205%5D'
          test_query t30 '%5B0:1:29%5D%5B434:1:699%5D%5B0:1:205%5D'
          test_query t07 '%5B0:1:6%5D%5B434:1:699%5D%5B0:1:205%5D'
          test_query t01 '%5B0:1:0%5D%5B434:1:699%5D%5B0:1:205%5D'
