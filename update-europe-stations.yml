name: Update Europe station records

on:
  workflow_dispatch:
    inputs:
      force_baseline:
        description: "GHCN + DWD historische Baselines trotz Cache neu aufbauen"
        required: false
        default: false
        type: boolean
      force_dwd_baseline:
        description: "Nur DWD-Deutschland-Baseline neu aufbauen"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "25 5 * * *"

permissions:
  contents: write

concurrency:
  group: update-europe-stations
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache-Schlüssel bestimmen
        id: dates
        shell: bash
        run: |
          YEAR=$(date -u +%Y)
          BASE_YEAR=$((YEAR - 1))
          YEAR_MONTH=$(date -u +%Y-%m)
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "base_year=$BASE_YEAR" >> "$GITHUB_OUTPUT"
          echo "year_month=$YEAR_MONTH" >> "$GITHUB_OUTPUT"

      - name: Stations-Cache laden
        id: station-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/europe-stations
          key: europe-stations-v3-${{ steps.dates.outputs.base_year }}-${{ steps.dates.outputs.year_month }}
          restore-keys: |
            ghcn-europe-baseline-v2-${{ steps.dates.outputs.base_year }}-${{ steps.dates.outputs.year_month }}
            ghcn-europe-baseline-v2-${{ steps.dates.outputs.base_year }}-

      - name: Europa-Stationsrekorde berechnen
        shell: bash
        env:
          FORCE_BASELINE: ${{ github.event.inputs.force_baseline || 'false' }}
          FORCE_DWD_BASELINE: ${{ github.event.inputs.force_dwd_baseline || 'false' }}
        run: |
          EXTRA_ARGS=""
          if [[ "$FORCE_BASELINE" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-baseline"
          fi
          if [[ "$FORCE_DWD_BASELINE" == "true" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-dwd-baseline"
          fi
          python scripts/update_europe_station_records.py \
            --year "${{ steps.dates.outputs.year }}" \
            --output europe_stations \
            --cache-dir .cache/europe-stations \
            --dwd-workers 6 \
            $EXTRA_ARGS

      - name: Stations-Cache sichern
        if: steps.station-cache.outputs.cache-hit != 'true' && github.event.inputs.force_baseline != 'true' && github.event.inputs.force_dwd_baseline != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/europe-stations
          key: europe-stations-v3-${{ steps.dates.outputs.base_year }}-${{ steps.dates.outputs.year_month }}

      - name: Ergebnis prüfen
        shell: bash
        run: |
          test -s europe_stations/index.json
          test -s europe_stations/calendar/01-01.json.gz
          test -s europe_stations/calendar/12-31.json.gz
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('europe_stations/index.json').read_text(encoding='utf-8'))
          assert p.get('payload_version') == 3
          assert p.get('station_count',0) > 0
          sources={x.get('name'):x.get('stations',0) for x in p.get('sources',[])}
          assert sources.get('DWD CDC',0) > 0, sources
          assert sources.get('GHCN-Daily',0) > 0, sources
          german=[s for s in p.get('stations',[]) if s.get('country')=='Deutschland']
          assert german and all(s.get('source')=='DWD CDC' for s in german)
          print('Stations-V3 OK:', p['station_count'], 'Stationen in', p['country_count'], 'Ländern', sources)
          PY

      - name: Daten committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add europe_stations
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Europa-Stationsdaten."
            exit 0
          fi
          git commit -m "Update Europe station records V3"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
