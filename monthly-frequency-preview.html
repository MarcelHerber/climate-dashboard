<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vorschau · Häufigkeitsverteilung Gebietsmittel</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:Arial,sans-serif;background:#eef2f5;color:#17202a;overflow:hidden}
  .preview-bar{height:58px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 16px;background:#17253a;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);position:relative;z-index:2}
  .preview-title{font-weight:700;font-size:14px}
  .preview-title span{font-weight:400;color:#cbd5e1;margin-left:8px}
  .preview-badge{padding:5px 9px;border-radius:999px;background:#27415f;font-size:11px;font-weight:700;white-space:nowrap}
  #previewFrame{display:block;width:100%;height:calc(100% - 58px);border:0;background:#f4f6f8}
  .preview-error{position:fixed;inset:58px 0 0;display:none;place-items:center;padding:30px;background:#f4f6f8;z-index:3}
  .preview-error div{max-width:620px;padding:22px;border:1px solid #e0a3a3;border-radius:10px;background:#fff4f4;color:#7a1010;line-height:1.5}
  @media(max-width:680px){.preview-bar{height:68px;align-items:flex-start;flex-direction:column;justify-content:center}.preview-title span{display:block;margin:2px 0 0}.preview-badge{position:absolute;right:10px;top:10px}#previewFrame{height:calc(100% - 68px)}}
</style>
</head>
<body>
  <div class="preview-bar">
    <div class="preview-title">Vorschau · Häufigkeitsverteilung <span>Gebietsmittel · noch nicht in main</span></div>
    <div class="preview-badge">PR #3</div>
  </div>
  <iframe id="previewFrame" title="Climate Dashboard Vorschau" src="./?tab=monthly"></iframe>
  <div id="previewError" class="preview-error"><div><strong>Vorschau konnte nicht geladen werden.</strong><br>Bitte die Seite neu laden. Falls der Fehler bleibt, prüfe ich die Pages-Bereitstellung.</div></div>
<script>
(function(){
  const FEATURE_SCRIPT="https://cdn.jsdelivr.net/gh/MarcelHerber/climate-dashboard@57d0fc8f1b50ad983ad9b4f8e5c879b41cb630f0/monthly_frequency.js";
  const frame=document.getElementById("previewFrame");
  const errorBox=document.getElementById("previewError");

  function showError(error){
    console.error("Vorschau:",error);
    errorBox.style.display="grid";
  }

  frame.addEventListener("load",()=>{
    try{
      const win=frame.contentWindow;
      const doc=frame.contentDocument;
      if(!win||!doc||!doc.body) throw new Error("Dashboard-Iframe ist nicht zugreifbar.");

      const script=doc.createElement("script");
      script.src=FEATURE_SCRIPT;
      script.async=true;
      script.onload=()=>{
        let attempts=0;
        const openFrequency=()=>{
          const button=doc.getElementById("monthlyFrequencyButton");
          if(button){
            const originalPersist=win.persistDashboardState;
            try{
              if(typeof originalPersist==="function") win.persistDashboardState=()=>{};
              button.click();
            }finally{
              if(typeof originalPersist==="function") win.persistDashboardState=originalPersist;
            }
            return;
          }
          attempts+=1;
          if(attempts<50) window.setTimeout(openFrequency,100);
          else showError(new Error("Häufigkeitsmodul wurde nicht initialisiert."));
        };
        openFrequency();
      };
      script.onerror=()=>showError(new Error("Feature-Skript konnte nicht geladen werden."));
      doc.body.appendChild(script);
    }catch(error){
      showError(error);
    }
  });
})();
</script>
</body>
</html>
